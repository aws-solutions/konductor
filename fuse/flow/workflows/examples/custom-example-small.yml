# $schema: ./schemas/workflow.schema.json
# yaml-language-server: $schema=./schemas/workflow.schema.json
# SPDX-License-Identifier: Apache-2.0
# Demo workflow, small: a bug fix or a one-file change.
# Three steps, one mechanical gate, no documents beyond a short note.
version: 1
name: custom-example-small
description: Lightweight loop for a small, well-understood change.
steps:
  - id: implementation
    title: Implement
    instruction: >
      Make the smallest change that fixes the request, with a test that fails before it and passes
      after. Record the command and its output.
    produces:
      - artifact: implementation-report
        path: .konductor/implementation/implementation-report.md
    updates:
      - artifact: code
        path: .
    gates:
      - check: default
  - id: code-review
    title: Self review
    instruction: Review your own diff, fix CRITICAL findings, commit.
    produces:
      - artifact: code-review
        path: .konductor/review/code-review.md
    updates:
      - artifact: code
        path: .
  - id: final-summary
    title: Summary
    instruction: One paragraph for the owner, what changed, how it was verified.
    produces:
      - artifact: sdlc-summary
        path: .konductor/sdlc-summary.md
    consumes:
      - implementation-report
      - code-review
    gates:
      - owner-action: approve the summary
