# $schema: ../schemas/workflow.schema.json
# yaml-language-server: $schema=../schemas/workflow.schema.json
# SPDX-License-Identifier: Apache-2.0
# Demo workflow, large: a multi-feature project with review at every stage.
# Everything in k-full-sdlc, plus a threat model, a design review that does not
# depend on it, independent security and UI testing, and a release readiness
# gate. Several steps share a dependency and join again later; fuse-flow hands
# them out one at a time.
version: 1
name: custom-example-large
description: Multi-feature project, heavy review, security and release gates.
steps:
  - id: elicitation
    title: Intake elicitation
    produces:
      - artifact: requirements-summary
        path: .konductor/requirements/requirements-summary.md
    instruction: Resolve the request into a requirements summary.
    gates:
      - owner-action: approve the requirements summary
  - id: codebase-analysis
    title: Codebase analysis
    instruction: Map architecture, conventions, build and test commands.
    produces:
      - artifact: codebase-analysis
        path: .konductor/analysis/codebase-analysis.md
    consumes:
      - requirements-summary
  - id: requirements
    title: Requirements
    produces:
      - artifact: user-stories
        path: .konductor/requirements/user-stories.md
    instruction: Write user stories and acceptance criteria from the requirements summary.
    consumes:
      - requirements-summary
    gates:
      - owner-action: approve the user stories
  - id: design
    title: System design
    produces:
      - artifact: design
        path: .konductor/design/design.md
    instruction: Write the system design by following system-design-patterns/SKILL.md.
    consumes:
      - codebase-analysis
      - user-stories
  - id: threat-model
    title: Threat model
    instruction: STRIDE threat model for the design, with a mitigation per threat.
    produces:
      - artifact: threat-model
        path: .konductor/design/threat-model.md
    consumes:
      - design
  - id: design-review
    title: Principal engineer design review
    instruction: |
      First design-quality-check/SKILL.md, then design-evaluation/SKILL.md, then adversarial-design-review/SKILL.md.
    produces:
      - artifact: design-review
        path: .konductor/design/design-review.md
    consumes:
      - design
    updates:
      - artifact: design
        path: .konductor/design/design.md
  - id: design-signoff
    title: Design sign-off
    instruction: Present the reviewed design and threat model together.
    produces:
      - artifact: design-signoff
        path: .konductor/design/signoff.md
    consumes:
      - threat-model
      - design-review
    gates:
      - owner-action: approve the reviewed design and threat model
  - id: feature-splitting
    title: Feature splitting
    produces:
      - artifact: feature-split
        path: .konductor/features/feature-split.md
    instruction: Split the signed-off design into independently buildable features.
    consumes:
      - design-signoff
    gates:
      - owner-action: approve the feature split
  - id: specs
    title: Specs per feature
    instruction: >
      Per feature: requirements.md (kiro-requirements-generation/SKILL.md), design.md
      (kiro-design-generation/SKILL.md), tasks.md (kiro-task-generation/SKILL.md) under
      .kiro/specs/<feature>/.
    produces:
      - artifact: spec-index
        path: .konductor/specs/index.md
    consumes:
      - feature-split
    gates:
      - owner-action: approve the feature specifications
  - id: implementation
    title: Implementation per feature
    produces:
      - artifact: implementation-report
        path: .konductor/implementation/implementation-report.md
    instruction: Implement each approved feature, verify it, and record the commands and results.
    consumes:
      - spec-index
    updates:
      - artifact: code
        path: .
    gates:
      - check: default
  - id: code-review
    title: Code review and pull requests
    produces:
      - artifact: code-review
        path: .konductor/review/code-review.md
    instruction: Review the implementation and pull requests, fix critical findings, and record the review.
    consumes:
      - implementation-report
    updates:
      - artifact: code
        path: .
  - id: coverage-testing
    title: Coverage testing
    produces:
      - artifact: test-coverage
        path: .konductor/testing/test-coverage.md
    instruction: Find test coverage gaps, add missing tests where required, and record the remaining gaps.
    consumes:
      - implementation-report
    updates:
      - artifact: code
        path: .
  - id: security-testing
    title: Security testing
    instruction: Test every mitigation in the threat model; record gaps.
    produces:
      - artifact: security-tests
        path: .konductor/testing/security-tests.md
    consumes:
      - implementation-report
      - threat-model
  - id: ui-testing
    title: UI testing
    instruction: One end-to-end pass against the deployed URL.
    consumes:
      - implementation-report
    produces:
      - artifact: ui-tests
        path: .konductor/testing/ui-tests.md
  - id: documentation
    title: Documentation
    produces:
      - artifact: doc-accuracy
        path: .konductor/docs/doc-accuracy.md
    instruction: Check the documentation against the implementation and record every correction.
    consumes:
      - code-review
  - id: release-readiness
    title: Release readiness
    instruction: |
      Collect review, all three test reports and the docs into one go/no-go recommendation.
    produces:
      - artifact: release-readiness
        path: .konductor/release/readiness.md
    consumes:
      - code-review
      - test-coverage
      - security-tests
      - ui-tests
      - doc-accuracy
    gates:
      - owner-action: approve release readiness
  - id: final-summary
    title: Final summary
    produces:
      - artifact: sdlc-summary
        path: .konductor/sdlc-summary.md
    instruction: Deliverables, verification, open items, for a reader who was not there.
    consumes:
      - release-readiness
