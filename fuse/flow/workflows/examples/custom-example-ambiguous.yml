# $schema: ../schemas/workflow.schema.json
# yaml-language-server: $schema=../schemas/workflow.schema.json
# SPDX-License-Identifier: Apache-2.0
# Demo workflow, ambiguous: the request is unclear, so the weight sits up front.
# Heavy discovery (elicitation, then research and analysis, which do not depend
# on each other), two competing
# options and a spike before the owner picks a direction; the build after that
# is kept light.
version: 1
name: custom-example-ambiguous
description: Unclear request; discover and decide first, then build lean.
steps:
  - id: elicitation
    title: Intake elicitation
    instruction: Surface goals, assumptions and the questions only the owner can answer.
    produces:
      - artifact: requirements-summary
        path: .konductor/{slug}/requirements-summary.md
    gates:
      - owner-action: approve the requirements summary
  - id: prior-art
    title: Prior art research
    instruction: How others solved this, inside and outside the team.
    produces:
      - artifact: prior-art
        path: .konductor/{slug}/prior-art.md
    consumes:
      - requirements-summary
  - id: codebase-analysis
    title: Codebase analysis
    instruction: What the code already offers that the answer could reuse.
    produces:
      - artifact: codebase-analysis
        path: .konductor/{slug}/codebase-analysis.md
    consumes:
      - requirements-summary
  - id: option-a
    title: Option A sketch
    instruction: A one-page sketch of the simplest direction.
    produces:
      - artifact: option-a
        path: .konductor/{slug}/option-a.md
    consumes:
      - prior-art
      - codebase-analysis
  - id: option-b
    title: Option B sketch
    instruction: A one-page sketch of the most complete direction.
    produces:
      - artifact: option-b
        path: .konductor/{slug}/option-b.md
    consumes:
      - prior-art
      - codebase-analysis
  - id: spike
    title: Spike
    instruction: >
      Throwaway prototype of the riskiest assumption shared by both options. Build it in a
      git-ignored scratch folder, record what it proved, then delete it, so no prototype code
      reaches the implementation.
    produces:
      - artifact: spike-findings
        path: .konductor/{slug}/spike-findings.md
    consumes:
      - codebase-analysis
      - option-a
      - option-b
  - id: decision
    title: Decision
    instruction: Compare A and B with the spike findings; recommend one.
    produces:
      - artifact: decision
        path: .konductor/{slug}/decision.md
    consumes:
      - option-a
      - option-b
      - spike-findings
    gates:
      - owner-action: approve the decision
        route_back_to: option-a
  - id: requirements
    title: Requirements
    produces:
      - artifact: user-stories
        path: .konductor/{slug}/user-stories.md
    instruction: Write user stories and acceptance criteria for the chosen option.
    consumes:
      - decision
    gates:
      - owner-action: approve the user stories
  - id: implementation
    title: Implementation
    produces:
      - artifact: implementation-report
        path: .konductor/{slug}/implementation-report.md
    instruction: Implement the approved requirements, verify the change, and record the commands and results.
    consumes:
      - decision
      - user-stories
      - codebase-analysis
    updates:
      - artifact: code
        path: .
    gates:
      - check: default
  - id: code-review
    title: Code review
    produces:
      - artifact: code-review
        path: .konductor/{slug}/code-review.md
    instruction: Review the implementation, fix critical findings, and record the review.
    consumes:
      - implementation-report
      - user-stories
    updates:
      - artifact: code
        path: .
    gates:
      - check: default
  - id: final-summary
    title: Summary
    instruction: Which option was chosen and why, what shipped, what is open.
    produces:
      - artifact: sdlc-summary
        path: .konductor/{slug}/sdlc-summary.md
    consumes:
      - decision
      - implementation-report
      - code-review
