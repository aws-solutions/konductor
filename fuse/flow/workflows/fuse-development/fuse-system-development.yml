# $schema: ../schemas/workflow.schema.json
# yaml-language-server: $schema=../schemas/workflow.schema.json
#
# A new system, or a change large enough to need its own requirements and design, such as a
# migration. In the spirit of decently-capable-powers and decently-coordinated-loops: the owner
# approves what to build and how, the agent builds it feature by feature, and independent agent
# review raises the bar before each owner decision. The steps say what to achieve and leave the
# how to the agent and its harness. Step and artifact names follow _k-phase-chain and
# _k-full-sdlc where they fit; review.md next to this file is the review guide for every agent gate.
#
# Start a workstream with:  fuse-flow start <slug> --workflow fuse-system-development
version: 1
name: fuse-system-development
description: >
  A new system or a large change such as a migration: requirements and a design approved by the
  owner, a build feature by feature, end-to-end testing against the requirements, and independent
  agent review before each owner decision.
steps:
  - id: requirements
    title: Requirements
    phase: Design
    instruction: >
      Agree with the owner what the system must do: who uses it, what they can do with it, what is
      out of scope, and how the owner will judge it done. For a migration, say what must behave
      exactly as before. Read what already exists before you ask anything. Ask only the questions
      whose answers change the requirements, give your recommended answer with each, and record
      the rest as assumptions. Write each requirement so that a test can check it.
    produces:
      - artifact: requirements
        path: docs/specs/{slug}/requirements.md
    gates:
      - agent: review the requirements against the owner's request and what already exists
        guide: review.md
        max_rounds: 2
      - owner-action: approve the requirements

  - id: design
    title: Design
    phase: Design
    instruction: >
      Design how the system meets the approved requirements: its parts and the interfaces
      between them, the data it keeps, how it fails, and how it is tested, including whether to
      build it test-first. Choose the simplest
      design that meets them. Where there is a real choice, give the options and the reason for
      yours. Check every claim about existing code or services against the source.
    consumes: [requirements]
    produces:
      - artifact: design
        path: docs/specs/{slug}/design.md
    gates:
      - agent: review the design against the approved requirements
        guide: review.md
        max_rounds: 2
        route_back_to: requirements

  - id: feature-splitting
    title: Feature splitting
    phase: Design
    instruction: >
      Split the design into features to build one after another, in an order where each feature
      leaves the system working and testable end to end. Give each feature a slug and list the
      requirements it covers; every requirement belongs to a feature.
    consumes: [requirements, design]
    produces:
      - artifact: feature-split
        path: docs/specs/{slug}/feature-split.md
    gates:
      - owner-action: approve the design and the feature split
        route_back_to: [requirements, design]

  - id: implementation
    title: Implementation
    phase: Build
    instruction: >
      Build the features in the order of the split, one at a time. If this checkout is on the
      integration branch, first create a feature branch named after the workstream. Unless the
      design rules it out, work test-first: write a test, watch it fail for the expected reason,
      then make it pass. Commit
      each feature when its tests pass. When something fails unexpectedly, find the root cause
      before you change code. Decide ambiguities yourself, with the design as the authority, and
      list each decision in the hand-over. Stop and ask only before an irreversible action or one
      that reaches outside this checkout.
    consumes: [requirements, design, feature-split]
    updates:
      - artifact: code
        path: .
    gates:
      - check: default

  - id: testing
    title: Testing
    phase: Build
    instruction: >
      Use the system end to end as its users would, against every requirement, including the
      failure cases. For a migration, compare its behavior with the old system's. Fix what fails
      and add the test that would have caught it. In the hand-over, say which requirements you
      exercised and how.
    consumes: [requirements]
    updates:
      - artifact: code
        path: .
    gates:
      - check: default

  - id: code-review
    title: Code review
    phase: Review
    instruction: >
      Make the branch ready for the owner to land: bring it up to date with its base if the base
      has moved, and get it through review. Do not merge it into the integration branch or push
      it to a shared branch; the owner lands it.
    consumes: [requirements, design]
    updates:
      - artifact: code
        path: .
    gates:
      - check: default
      - agent: review the whole branch, from the commit it started at to HEAD, against the approved requirements and design
        guide: review.md
        max_rounds: 3
        route_back_to: implementation
      - owner-action: land the branch, or send it back
        route_back_to: [requirements, design, implementation]
