# $schema: ../schemas/workflow.schema.json
# yaml-language-server: $schema=../schemas/workflow.schema.json
#
# One feature in an existing codebase, in the spirit of decently-capable-powers: agree a spec
# with the owner, build it against acceptance tests taken from the spec, and let independent agent
# review raise the bar before the owner looks. The steps say what to achieve and leave the how to
# the agent and its harness.
# Step and artifact names follow _k-phase-chain where they fit; review.md next to this file is
# the review guide for both agent gates.
#
# Start a workstream with:  fuse-flow start <slug> --workflow fuse-feature-development
version: 1
name: fuse-feature-development
description: >
  One feature in an existing codebase: a spec agreed with the owner, a build on a branch against
  acceptance tests taken from the spec, and independent agent review of both, before the owner
  approves the spec and lands the branch.
steps:
  - id: intake
    title: Intake
    phase: Design
    instruction: >
      If this checkout is on the integration branch, first create a feature branch named after the
      workstream. Find out what the owner wants to build: get them to share their vision, however
      rough or detailed it is, and what problem it solves for whom. Read the code before you ask
      anything. While the purpose and rough scope are still unclear, ask rather than propose, one
      or a few questions at a time. If the request names one or more features from a system's
      build order, build them as one feature: take the scope from their briefs, read the system's
      requirements and design, and do not reopen decisions they already settle. As soon as the
      purpose and rough scope are settled, write a first draft of the spec, marked as a draft,
      with the questions still open; from then on, record each decision in the draft when it is
      made. When the request already settles the purpose and scope, write the draft straight away
      and say so. Do not order the draft for review yet, and do not change code.
    produces:
      - artifact: feature-spec
        path: docs/specs/{slug}.md

  - id: design
    title: Design
    phase: Design
    instruction: >
      Turn the draft into the agreed spec: what the feature does and for whom, how it fits the
      existing code, and the acceptance tests that will show it works, one for each behavior it
      must have. Where there are genuinely different approaches, propose them with your
      recommendation. Ask every remaining question whose answer changes the design, give your
      recommended answer with each, and decide the rest yourself as recorded assumptions, labeled
      as your decisions so the owner can object. Record what is deferred. Keep the spec as short
      as the feature allows. When nothing material is open, order the spec for review: the
      decisions the owner must make or check, and your own decisions and assumptions, come first,
      most important first. Do not change code until the owner approves the spec. Commit the spec
      on the branch.
    updates:
      - artifact: feature-spec
        path: docs/specs/{slug}.md
    gates:
      - agent: review the spec against the owner's request, the code, and the system's requirements and design when the feature is part of a system
        guide: review.md
        max_rounds: 2
      - owner-action: approve the spec

  - id: implementation
    title: Implementation
    phase: Build
    instruction: >
      Build the approved spec. Write the spec's acceptance tests from the spec's wording, not from
      your code, and see each one fail before the code makes it pass, or break the code briefly
      and see it go red. Start every bug fix with a test that reproduces the bug and fails. How
      you test the rest is your call. Never weaken a test to get to green. If the feature is part
      of a system, also use the system end to end, with the features landed so far, for the
      requirements this feature covers. Commit as you go. When something fails unexpectedly, find
      the root cause before you change code. Decide ambiguities yourself, with the spec as the
      authority, and list each decision in the hand-over. Stop and ask only before an
      irreversible action or one that reaches outside this checkout.
    consumes: [feature-spec]
    updates:
      - artifact: code
        path: .
    gates:
      - check: default

  - id: code-review
    title: Code review
    phase: Review
    instruction: >
      Make the branch ready for the owner to land. If the integration branch has moved, rebase the
      branch onto it first. Get the branch through review. Before the last round, fold fixups and
      review fixes into the commits it should land as, normally one commit for the feature, with a
      subject that stands on its own. Do not merge it into the integration branch or push it to a
      shared branch; the owner lands it.
    consumes: [feature-spec]
    updates:
      - artifact: code
        path: .
    gates:
      - check: default
      - agent: review the branch's diff from its merge-base with the integration branch to HEAD, against the approved spec
        guide: review.md
        max_rounds: 3
        route_back_to: implementation
      - owner-action: land the branch, or send it back
        route_back_to: [design, implementation]
