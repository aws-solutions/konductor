# $schema: ./schemas/workflow.schema.json
# yaml-language-server: $schema=./schemas/workflow.schema.json
# above comments enable live schema validation in WebStorm and vscode

# SPDX-License-Identifier: Apache-2.0
version: 1
name: k-full-sdlc
description: Port of the former k-full-sdlc SOP, requirements through documentation for one feature
  or project, with its steps 0 to 11 in the same order.
steps:
  - id: elicitation
    title: 0. Intake elicitation
    instruction: >
      Resolve the request into a requirements summary: goals, non-goals, constraints, open decisions
      with your recommendation. Skip the questioning when the request already answers them and say
      so in the summary.
    produces:
      - artifact: requirements-summary
        path: .konductor/requirements/requirements-summary.md
  - id: codebase-analysis
    title: 1. Codebase analysis
    instruction: >
      Read the existing code before designing against it. Record architecture, the patterns and
      vocabulary the code already uses, build and test commands, and the places the request will
      touch, each with file and line. For a greenfield project write one line saying there is no
      code yet.
    produces:
      - artifact: codebase-analysis
        path: .konductor/analysis/codebase-analysis.md
  - id: requirements
    title: 2. Requirements
    instruction: >
      Write the user stories and acceptance criteria from the requirements summary and the codebase
      analysis, in the code's vocabulary. List every element the request did not literally ask for
      as an owner decision.
    produces:
      - artifact: user-stories
        path: .konductor/requirements/user-stories.md
    consumes:
      - requirements-summary
      - codebase-analysis
    gates:
      - owner-action: approve the user stories
  - id: design
    title: 3. Design
    instruction: >
      Write the design document. For system architecture, data models and infrastructure also read
      system-design-patterns/SKILL.md. Cite code for every claim about current behaviour; mark what
      could not be verified.
    produces:
      - artifact: design
        path: .konductor/design/design.md
    consumes:
      - user-stories
      - codebase-analysis
  - id: design-review
    title: 4. Principal engineer design review
    instruction: >
      Review .konductor/design/design.md independently of the author: first
      design-quality-check/SKILL.md, then design-evaluation/SKILL.md, then
      adversarial-design-review/SKILL.md. Fix every CRITICAL finding in design.md itself, never by
      deferring it to implementation, and record the findings and their resolution.
    produces:
      - artifact: design-review
        path: .konductor/design/design-review.md
    consumes:
      - design
    updates:
      - artifact: design
        path: .konductor/design/design.md
    gates:
      - owner-action: approve the reviewed design
        route_back_to: design
  - id: feature-splitting
    title: 5. Feature splitting
    instruction: >
      Split the design into features that can be built independently, give each a unique slug, and
      record the split. The owner approves it.
    produces:
      - artifact: feature-split
        path: .konductor/features/feature-split.md
    consumes:
      - design
    gates:
      - owner-action: approve the feature split
  - id: specs
    title: 6. Specs (per feature)
    instruction: >
      For each feature in feature-split.md write .kiro/specs/<feature>/requirements.md
      (kiro-requirements-generation/SKILL.md), design.md (kiro-design-generation/SKILL.md) and
      tasks.md (kiro-task-generation/SKILL.md), then list the spec directories in the index
      artifact. The owner approves the specs for all features at once.
    produces:
      - artifact: spec-index
        path: .konductor/specs/index.md
    consumes:
      - feature-split
    gates:
      - owner-action: approve the feature specifications
  - id: implementation
    title: 7. Implementation (per feature)
    instruction: >
      Implement each feature from its tasks.md on its own branch, with unit and integration tests.
      On a greenfield project build the scaffold first. Run the project's build and tests after each
      feature; record the commands and their terminal output in the implementation report.
    produces:
      - artifact: implementation-report
        path: .konductor/implementation/implementation-report.md
    consumes:
      - spec-index
    updates:
      - artifact: code
        path: .
  - id: code-review
    title: 8. Code review and pull request (per feature)
    instruction: >
      Commit each feature (git-workflow/SKILL.md), open one pull request per feature, and review the
      diff. Fix CRITICAL findings on the feature branch, re-run the build and tests, and record the
      review. Never merge.
    produces:
      - artifact: code-review
        path: .konductor/review/code-review.md
    updates:
      - artifact: code
        path: .
    gates:
      - owner-action: approve the pull requests for all features at once
        route_back_to: implementation
  - id: testing
    title: 9. Testing (per feature)
    instruction: >
      Find the coverage gaps for what was implemented, write the missing tests on the feature branch
      and update its pull request. Mark a feature NEEDS_REVALIDATION in code-review.md when this
      step changes a pull request that was already reviewed. Record the remaining gaps with a reason
      each.
    produces:
      - artifact: test-coverage
        path: .konductor/testing/test-coverage.md
    consumes:
      - code-review
    updates:
      - artifact: code
        path: .
    gates:
      - owner-action: accept the coverage gaps that stay open
        route_back_to: implementation
  - id: documentation
    title: 10. Documentation
    instruction: >
      Write or update the README and developer guide for what shipped, write AGENTS.md if it is
      missing or update it where commands or structure changed (agents-md-authoring/SKILL.md), apply
      humanize-writing/SKILL.md, then check every claim in them against the implementation. Fix
      every inaccuracy before marking the step done, and record the result.
    produces:
      - artifact: doc-accuracy
        path: .konductor/docs/doc-accuracy.md
  - id: final-summary
    title: 11. Final summary
    instruction: >
      Write the summary for a reader who did not watch the work: what was delivered (artifact paths,
      branches, pull requests), what was verified and how, which features need revalidation, and
      what is left for the owner.
    produces:
      - artifact: sdlc-summary
        path: .konductor/sdlc-summary.md
    consumes:
      - implementation-report
      - code-review
      - test-coverage
      - doc-accuracy
