<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fuse-flow</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Same rule as src/model/theme.ts, run before first paint so a dark page never flashes light. -->
    <script>
      var t = null;
      try {
        t = localStorage.getItem("komposer-theme");
      } catch (e) {}
      if (t !== "light" && t !== "dark") {
        try {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (e) {
          t = "light";
        }
      }
      document.documentElement.dataset.theme = t;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
