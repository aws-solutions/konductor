<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The brand disc from Komposer's header: --brand-gradient, 135deg, #2bb8ea to #0c5398. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bb8ea" />
      <stop offset="1" stop-color="#0c5398" />
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#brand)" />
</svg>
