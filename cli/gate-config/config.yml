# SPDX-License-Identifier: Apache-2.0
#
# config.yml — the PRESET DEFAULT configuration shipped with the Konductor
# CLI. This is the "preset defaults" the config loader (cli/konductor-rs/
# src/cli/config.rs) merges a project's own `.konductor/config.yml`
# against: any field the project omits falls back to the value here.
#
# `konductor init` copies this file verbatim into a project's starter
# `.konductor/config.yml` (see the `init` command in cli.rs).
#
# ── Field reference ─────────────────────────────────────────────────────────
#   version              Config schema version. Loader rejects a config
#                        whose `version` it does not recognize (usage
#                        error, exit 64 -- see cli.rs's exit-code
#                        contract).
#   telemetry.enabled    Whether this project reports anonymous usage
#                        telemetry (see telemetry/report.rs). Set to
#                        `false` to opt this project out.
#
# `telemetry.endpoint` is intentionally not shipped here: an absent key
# falls back to the compile-time default endpoint, while an empty string
# would not. Set it explicitly in a project's own `.konductor/config.yml`
# only if you need to redirect telemetry to a different collector.
version: 1

telemetry:
  enabled: true
