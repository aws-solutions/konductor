# SPDX-License-Identifier: Apache-2.0
#
# severity-schema.yml — the set of gate severities Konductor gates may
# report, and their semantics.
#
# ── Scope ───────────────────────────────────────────────────────────────────
# This file is pure DATA. The CLI embeds it at build time and parses the
# ids, ranks, aliases and the `critical_gate` marker (cli/konductor-rs/src/
# cli/gate_config.rs); a parity test in `cargo test` fails when the CLI's own
# severity ids or ranks differ from this file or the marker is not on
# CRITICAL alone. The config loader's `severities_source` still names this
# file, and its severity fields accept gate ids only.
#
# `aliases` (optional) lists the words a checker may write for a severity
# in its report, for example IMPORTANT for HIGH. An alias is one word of
# ASCII letters and maps to the gate id. Matching ignores case and reads
# only the leading letters of a label, so "Warning Gap" and "🚨 Critical Gap"
# match WARNING and CRITICAL. A word that is neither an id nor an alias
# ranks as CRITICAL. An alias appears under one id only (ignoring case) and
# is never itself an id.
#
# This table is a severity vocabulary only. The input is a finding's
# severity label as the checker writes it. Headings, counters, status words
# and checkbox lines are out of contract and may rank either way. Risk,
# priority and confidence scales reuse High, Medium and Low but are not
# severities: a label whose second word is RISK, PRIORITY or CONFIDENCE
# (or a plural) ranks as CRITICAL, and a caller that holds such a field
# applies the checker's own mapping first.
#
# ── Exit-code note ────────────────────────────────────────────────────────
# `exit_code_signal: critical_gate` below is a SEMANTIC label. Exit code 2
# means an unresolved finding at or above the effective threshold. The
# effective threshold is the configured one (CRITICAL by preset), except that
# phase-gated SOPs never go laxer than HIGH, so an open HIGH finding (or its
# aliases IMPORTANT and WARNING) also exits 2 there. Only the gate evaluator
# emits it. Argument and usage errors use exit code 64 (EX_USAGE). A session
# file that is corrupt, invalid or inconsistent exits 65. Exit 3 is a
# fix-cycle budget overrun. The contract lives in cli/konductor-rs/src/cli.rs.
#
# When several causes apply the evaluator reports all of them in `reasons` but
# exits with the code of the first check that fires. Checks run as: 65 (session
# and record integrity), 1 (halted), 3 (budget), 2 (unresolved finding), then 6
# (skipped gate). A bad `max_fix_cycles` is found by the budget check, so after
# a halt it is listed but the exit stays 1. An earlier cause hides a later
# code, so fix the earlier one to see the next.
#
# A word that is neither an id nor an alias ranks as CRITICAL, except `none`:
# the exact lowercase word `none` (after trimming) records a gate with no
# findings. It is case-sensitive like the ids and aliases, so `None` is
# unknown and ranks CRITICAL.
severities:
  - id: CRITICAL
    rank: 4
    description: >-
      A finding that must block the pipeline. An unresolved CRITICAL finding
      exits 2 under every threshold.
    exit_code_signal: critical_gate
  - id: HIGH
    rank: 3
    aliases: [IMPORTANT, WARNING, WARNINGS]
    description: >-
      A finding that blocks phase-gated SOPs, whose strict floor makes an
      unresolved HIGH finding exit 2 even when the threshold is CRITICAL.
      Elsewhere it blocks only when the threshold is HIGH or lower.
    exit_code_signal: null
  - id: MEDIUM
    rank: 2
    description: >-
      A finding worth surfacing to reviewers but that does not block the
      pipeline by default.
    exit_code_signal: null
  - id: LOW
    rank: 1
    aliases: [SUGGESTION, MINOR]
    description: >-
      A minor finding, informational for most workflows.
    exit_code_signal: null
  - id: INFO
    rank: 0
    description: >-
      Purely informational output with no pass/fail implication.
    exit_code_signal: null
