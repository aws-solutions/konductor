# SPDX-License-Identifier: Apache-2.0
#
# sop-orchestration.yml classifies every agent-sops/*.sop.md as gated or
# not_gated. scripts/check-sop-orchestration.py (make sop-orchestration-check)
# fails when this file, the marker lines and agent-sops/ disagree.
#
# A SOP is gated when its steps form ordered phases, a later phase uses an
# earlier one's output, and a MUST-level rule stops the next phase until that
# output passes one of these gates:
#   approval         the user approves or confirms the artifact
#   check-threshold  a check or review result on the artifact meets a stated
#                    threshold (severity count, score). The gate also clears
#                    when the engineer overrides the remaining findings or a
#                    documented round cap ends the review. That clearance is
#                    recorded as the gate fact gate_<phase>_override, a short
#                    note naming the finding ids and who approved, and the
#                    result is then the highest severity among findings still
#                    open and not overridden. A re-run that changes the result
#                    needs no override fact.
#   loop-exit        a review loop on the artifact reaches its exit condition
#                    or its round cap where the SOP says to proceed at the
#                    cap
# A gate judges the content of an artifact. A confirmation that authorizes
# effort on discovered or generated scope, one a caller flag such as
# scope_confirmed can pre-authorize, is not a gate. Also not gates: parameter
# or path preconditions, build/test/lint prerequisites, a self-check, joining
# parallel passes, and a final verdict.
#
# A check is a gate only when a reviewer's verdict or a stated severity or
# score threshold decides whether the next phase starts. A checklist the
# orchestrator runs on its own step's deliverable, with no reviewer and no
# threshold, is a self-check. Example: k-full-sdlc Step 2 is a self-check;
# its Step 4 stops on a stated severity count from a review, so it is a gate.
#
# Each gated SOP has the marker line below as its own paragraph right after
# its title, above ## Overview, so installed skill descriptions are
# unchanged. The `meaning` line below is the sentence that follows the marker
# in each gated SOP; the lint checks it. A second paragraph, the `gate_note`
# line below, says where gate facts are recorded. No not_gated SOP contains the marker.
#
# "strict" tells the orchestrator to stop at each recorded gate, record the
# gate facts, and not proceed past an unmet gate unless the engineer overrides
# it, or the SOP's own round-cap rule says to proceed, recording which.
#
# A basis cites steps by their exact heading text in backticks, without the
# step or phase number, and cites at least one. The lint fails when a cited
# heading is not in the SOP, so renaming a step surfaces here. Update the
# basis when a step's gate changes.
#
# A gated entry may also list, both optional (any other key is an error):
#   phases      the SOP's phase ids in order. It must equal the ids in the
#               SOP's Progress Tracking "Phase list" bullet.
#   boundaries  the phases where a gate applies, each {phase, kind, scope}.
#               It is the machine-readable list a consumer enforces; edit it
#               and basis together. Omit it when a SOP has no boundaries yet;
#               an empty list is an error. phase is one of phases, kind is
#               one of the entry's gates, and a phase appears in at most one
#               boundary. boundaries needs phases.
#
# scope says how often the engineer's decision, and so its gate fact, is
# recorded. It does not count pauses:
#   run      one decision covers the whole run. code-review is run: the
#            engineer confirms the consolidated verdicts once.
#   feature  one decision per feature, recorded separately even when the SOP
#            asks for them in a single pause. specs is feature: every
#            feature's specs are approved at the end of the phase, and each
#            feature is approved or blocked on its own.
#
# gate_facts names the session `data` keys a gated SOP records at each
# boundary and `konductor verify-run` reads. `{phase}` is the boundary's
# phase id. A run-scope boundary's facts go in `run.data`, a feature-scope
# boundary's in `features.<slug>.data`:
#   result    a check-threshold boundary records the highest severity word
#             still open and not overridden, or `none`; an approval boundary
#             records `approved`
#   evidence  the file the gate judged, relative to the project root
#   checker   who decided: the reviewing agent, or `user` for an approval
#   override  check-threshold only: the engineer's override note, when one
#             was given
# fix_cycle_cap is the `run.data` key holding the run's fix-cycle budget. A
# gated SOP with boundaries must name each of its boundaries' keys, and a SOP
# that mentions fix_cycle_cap must say it records `run.data.<fix_cycle_cap>`;
# the lint checks both.
version: 1
gate_facts:
  result: 'gate_{phase}_result'
  evidence: 'gate_{phase}_evidence'
  checker: 'gate_{phase}_checker'
  override: 'gate_{phase}_override'
  fix_cycle_cap: max_fix_cycles
marker: 'Orchestration: strict (phase-gated SOP)'
meaning: 'Strict means: stop at each recorded gate, record the gate facts, and do not proceed past an unmet gate unless the engineer overrides it, or the SOP''s own round-cap rule says to proceed; record which.'
gate_note: 'Recorded gates are the stops this SOP names; where the run keeps a session file, record their gate facts there.'
gated:
  k-full-sdlc:
    gates: [check-threshold, approval]
    basis: '`Principal Engineer Design Review` stops on CRITICAL findings until resolved or overridden; `Feature Splitting` needs approval before `Specs (Per Feature)`; `Specs (Per Feature)` need approval for every feature; `Code Review and Pull Request` consolidated review verdicts need confirmation before `Testing`; `Testing` stops on CRITICAL test gaps until the engineer picks a resolution. The boundaries are design-review, a check-threshold once per run where the engineer can override remaining CRITICAL findings; feature-splitting, an approval once per run; specs, an approval decided per feature; code-review, an approval once per run over the consolidated verdicts; and testing, a check-threshold decided per feature where accepting a remaining gap is the override.'
    phases: [elicitation, codebase-analysis, requirements, design, design-review, feature-splitting, specs, implementation, code-review, testing, documentation, final-summary]
    boundaries:
      - {phase: design-review, kind: check-threshold, scope: run}
      - {phase: feature-splitting, kind: approval, scope: run}
      - {phase: specs, kind: approval, scope: feature}
      - {phase: code-review, kind: approval, scope: run}
      - {phase: testing, kind: check-threshold, scope: feature}
  k-design-doc-creation:
    gates: [approval, check-threshold, loop-exit]
    basis: '`Requirements Elicitation` summary confirmed before `Draft Generation`; `Draft Generation` needs zero CRITICAL before `Quality Gates`; `Adversarial Review Loop` exits, or at its 5-round cap the engineer resolves the remaining issues.'
  k-principal-engineer-design-review:
    gates: [check-threshold, loop-exit]
    basis: '`Quality Gate (design-quality-check)` score of 3 or more before `Architecture Principles Gate (design-evaluation)`; `Adversarial Review Loop (max 5 rounds)`.'
  kiro-spec-workflow:
    gates: [approval]
    basis: '`Generate Requirements (EARS Format)` and `Generate Design (Per-Feature)` outputs approved before the next step; `Generate Tasks (Kiro Format)` output presented for approval.'
not_gated:
  about-konductor: Four orientation steps, no stop rule.
  k-adversarial-pull-request-review: Parallel passes, a join, a checker filter and a final verdict; no stop on a produced artifact.
  k-code-cleanup: No stop rule between steps.
  k-code-review-workflow: Review pipeline ending in a report; no approval or threshold between steps.
  k-codebase-analysis: Path precondition only.
  k-comprehensive-search: Search and synthesis; waiting for delegates is a join.
  k-context-gathering: Open questions and pending escalation block Step 5; that is a self-check, not approval of a deliverable.
  k-delegate: Delegation template; re-delegation cap only.
  k-e2e-test-generation: Step 3 confirms the discovered page scope; the compile check is a prerequisite.
  k-existing-design-review: Step 2 confirms the review scope before evaluation.
  k-light-ui-testing: Steps 3 and 5 confirm the scope and the prompt list to run.
  k-plan: Self-checked success criteria; no stop between steps.
  k-pre-cr-critique: Read-only critique, no stop rule.
  k-test-coverage-review: Step 3 confirms whether to plan E2E tests for the found gaps.
  k-verify: Build, test and lint exits are prerequisites.
