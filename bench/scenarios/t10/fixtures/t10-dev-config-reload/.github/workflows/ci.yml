name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: node --test
      - name: Check metric catalogue
        run: node scripts/check-metrics.js
      - name: Check config files
        run: node scripts/check-config.js
