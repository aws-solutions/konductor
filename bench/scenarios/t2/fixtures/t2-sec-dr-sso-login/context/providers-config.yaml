# Identity Provider Configuration Template
# This file is used by the deployment pipeline to generate provider configurations
# DO NOT edit manually - changes should be made through the admin UI

configuration_template:
  required_fields:
    - client_id
    - issuer
    - authorization_endpoint
    - token_endpoint
    - jwks_uri
    
  optional_fields:
    - userinfo_endpoint
    - revocation_endpoint
    - end_session_endpoint
    - scopes_supported
    - claims_supported
    
  validation_rules:
    issuer:
      pattern: "^https://[a-zA-Z0-9.-]+(/.*)?$"
      required: true
      
    redirect_uris:
      max_count: 5
      pattern: "^https://[a-zA-Z0-9.-]+/auth/callback$"
      disallowed_patterns:
        - ".*\\.\\.\\..*"  # No consecutive dots
        - "^http://"       # No HTTP
        - ".*/callback/.*" # No paths after callback
      
    jwks_refresh:
      default_interval: 86400  # 24 hours in seconds
      min_interval: 3600       # 1 hour minimum
      max_retries: 3
      retry_delay: 300

  security_constraints:
    token_validation:
      max_clock_skew: 300
      require_email_verified: true
      require_audience_match: true
      
    session_management:
      max_session_age_without_revalidation: 604800  # 7 days
      require_backchannel_logout: false  # Optional per provider support
      
    secrets:
      client_secret_rotation_days: 90
      jwks_cache_max_age: 86400

