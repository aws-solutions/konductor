name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests
        run: node --test test/*.test.js
      - name: Check generated data is current
        run: |
          cp data/orders.js /tmp/orders.before.js
          node tools/generate-orders.js
          diff -q /tmp/orders.before.js data/orders.js
