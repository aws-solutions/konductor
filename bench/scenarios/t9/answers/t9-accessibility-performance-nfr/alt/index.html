<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order history · Tidewell Supply</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/orders.css">
</head>
<body>
  <header class="top">
    <h1>Order history</h1>
    <p class="lede">Every order placed through the Tidewell Supply shop, newest first.</p>
  </header>

  <main>
    <section class="controls">
      <div class="field">
        <label for="search">Search orders</label>
        <input id="search" type="search" placeholder="Name, order number, city or item" autocomplete="off">
      </div>

      <div class="field status-group" id="status-group" role="radiogroup" aria-labelledby="status-heading">
        <span class="field-title" id="status-heading">Status</span>
        <div class="chips">
          <input class="pick" type="radio" name="status" id="st-all" value="all" checked>
          <label class="chip" for="st-all">All</label>
          <input class="pick" type="radio" name="status" id="st-processing" value="processing">
          <label class="chip" for="st-processing">Processing</label>
          <input class="pick" type="radio" name="status" id="st-shipped" value="shipped">
          <label class="chip" for="st-shipped">Shipped</label>
          <input class="pick" type="radio" name="status" id="st-delivered" value="delivered">
          <label class="chip" for="st-delivered">Delivered</label>
        </div>
      </div>

      <form id="date-form" class="dates" novalidate>
        <div class="field">
          <label for="date-from">From</label>
          <input id="date-from" name="from" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" autocomplete="off" aria-describedby="from-note">
          <p id="from-note" class="error" hidden></p>
        </div>
        <div class="field">
          <label for="date-to">To</label>
          <input id="date-to" name="to" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" autocomplete="off" aria-describedby="to-note">
          <p id="to-note" class="error" hidden></p>
        </div>
        <button type="submit">Apply</button>
      </form>
    </section>

    <p class="summary" aria-hidden="true">Orders matching the controls above.</p>
    <div id="count-live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

    <table class="orders">
      <thead>
        <tr>
          <th>Order</th>
          <th>Placed</th>
          <th>Customer</th>
          <th>Items</th>
          <th class="num">Total</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="order-rows"></tbody>
    </table>
    <div class="more-wrap"><button type="button" id="more-rows" hidden>Show more</button></div>
  </main>

  <footer class="foot">Tidewell Supply · orders are kept for three years.</footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
