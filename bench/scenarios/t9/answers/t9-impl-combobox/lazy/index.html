<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Harbor Days registration</title><link rel="stylesheet" href="src/styles.css"></head>
<body><header class="site-header"><a class="brand" href="./">Harbor Days</a><span class="edition">Port Alder · 18–20 July</span></header><main><section class="intro"><p class="eyebrow">Community event</p><h1>Save your place at Harbor Days</h1><p>Tell us where you are joining from. We will send the weekend guide after registration.</p></section><form id="registration-form" class="card"><div class="field"><label for="country">Country</label><input id="country" name="country_display" type="text" list="country-names" role="combobox" aria-expanded="false" autocomplete="off"><datalist id="country-names"><option value="Canada"></option><option value="France"></option><option value="Germany"></option><option value="Japan"></option><option value="United States"></option></datalist><input name="country_code" type="hidden" value=""></div><div class="field"><label for="attendee-name">Your name</label><input id="attendee-name" name="attendee_name" required></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required></div><button type="submit">Register</button></form></main><footer><small>Harbor Days is organized by the Port Alder neighborhood council.</small></footer><script type="module" src="src/main.js"></script></body></html>
