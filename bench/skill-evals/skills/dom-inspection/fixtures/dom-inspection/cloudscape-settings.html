<!doctype html>
<html><head><meta charset="utf-8"><title>Settings</title></head>
<body>
<form id="settings" data-testid="settings-form">
  <div class="awsui_form-field_abc12">
    <label class="awsui_label_abc12" for="input-name">Project name</label>
    <div class="awsui_input-container_xyz9">
      <span class="awsui_root_input_xyz9" data-testid="project-name">
        <input id="input-name" class="awsui_input_xyz9" type="text" required minlength="3" maxlength="40">
      </span>
    </div>
    <div class="awsui_error-text_abc12" data-testid="project-name-error">Project name must be 3 to 40 characters.</div>
  </div>
  <div class="awsui_form-field_abc12">
    <label class="awsui_label_abc12" for="input-retention">Log retention (days)</label>
    <div class="awsui_input-container_xyz9">
      <span class="awsui_root_input_xyz9" data-testid="retention-days">
        <input id="input-retention" class="awsui_input_xyz9" type="number" min="1" max="3653" required>
      </span>
    </div>
    <div class="awsui_error-text_abc12" data-testid="retention-days-error">Enter a value from 1 to 3653.</div>
  </div>
  <div class="awsui_form-field_abc12">
    <label class="awsui_label_abc12" for="input-email">Alert email</label>
    <div class="awsui_input-container_xyz9">
      <span class="awsui_root_input_xyz9" data-testid="alert-email">
        <input id="input-email" class="awsui_input_xyz9" type="email">
      </span>
    </div>
    <div class="awsui_error-text_abc12" data-testid="alert-email-error">Enter a valid email address.</div>
  </div>
</form>
</body></html>
