# SPDX-License-Identifier: Apache-2.0
[package]
name = "workflow-adapters"
version = "0.1.0"
description = "The parts of the workflow engine that touch the world: files, run state, the lock, the clock and the fake harness."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "workflow_adapters"

[lints]
workspace = true

[dependencies]
workflow-core = { path = "../core" }
# The advisory lock on the trust record. The same version as the CLI's lock file.
fs2 = "=0.4.3"

# The flags that keep an open from blocking on a pipe or following a link. The same version as the CLI's lock file.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
