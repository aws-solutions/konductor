# SPDX-License-Identifier: Apache-2.0
[package]
name = "workflow-adapters"
version = "0.1.0"
description = "The parts of the workflow engine that touch the world: files, run state, the lock, the clock and the fake harness."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "workflow_adapters"

[lints]
workspace = true

[dependencies]
workflow-core = { path = "../core" }

# The flags that keep an open from blocking on a pipe or following a link. The same version as the CLI's lock file.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

# The test oracle that reads agent front matter as YAML 1.2 with anchors and aliases resolved. The same version as the
# core crate's, so the lock file gains no package.
[dev-dependencies]
saphyr-parser = "=0.3.3"
