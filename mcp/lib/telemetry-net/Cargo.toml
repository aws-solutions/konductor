[package]
name = "telemetry-net"
version = "0.1.0"
edition = "2021"
description = "Host-allowlist DNS classification, DNS-rebinding pin construction, and the timeout-vs-failure resolution decision shared by cli/konductor-rs's and mcp/lib/skill-lookup-core's telemetry transport"
# Lives under mcp/lib/ (matching that workspace's own "lib/*" member
# glob) rather than a directory sibling to both cli/ and mcp/: Cargo
# requires every workspace member to be hierarchically BELOW its
# workspace root, so a "shared/telemetry-net" sibling directory cannot
# be a member of mcp/'s workspace at all ("workspace member ... is not
# hierarchically below the workspace root", confirmed directly against
# this exact layout). cli/konductor-rs -- which has no `[workspace]` of
# its own -- still depends on this crate the same way either placement
# would require: a plain path dependency, not shared workspace
# membership. See that crate's own Cargo.toml for the dependency entry.
license.workspace = true

[lints]
workspace = true

[lib]
name = "telemetry_net"
path = "src/lib.rs"

[features]
# Enables the tokio-based bounded-async resolution path
# (`resolve_host_addrs_bounded_async`), used by an async caller
# (mcp/lib/skill-lookup-core) that already has a tokio runtime and
# therefore bounds the blocking DNS call via `tokio::time::timeout` +
# `tokio::task::spawn_blocking` rather than the thread+channel
# `run_with_timeout` primitive a synchronous caller (cli/konductor-rs,
# which has no async runtime at all) uses instead. Off by default so a
# synchronous consumer never pulls tokio into its dependency graph.
async = ["tokio"]

[dependencies]
# Optional, feature-gated (see `[features] async` above). Exact-pinned
# to match mcp/lib/skill-lookup-core's own tokio dependency exactly, so
# the two resolve to one shared version rather than two, within any
# single build graph that pulls in both (e.g. `cargo test --workspace`
# from mcp/, which builds this crate's own test target alongside
# skill-lookup-core's).
tokio = { version = "=1.44.2", features = ["rt", "time"], optional = true }

[dev-dependencies]
# Only used to exercise the `async` feature's own tests
# (`#[tokio::test]`) when this crate is tested as part of a build graph
# that enables that feature (see `[features]` above) -- never on its
# own turns on `async` by default.
tokio = { version = "=1.44.2", features = ["macros", "rt-multi-thread"] }
