version: 1
marker: 'Orchestration: strict (phase-gated SOP)'
meaning: 'Strict means: stop at each recorded gate, record the gate facts, and do not proceed past an unmet gate unless the engineer overrides it or the SOP''s own round cap applies; record which.'
gated:
  alpha-gated:
    gates: [approval]
    basis: Step 1 output needs approval before Step 2.
not_gated:
  beta-plain: No stop rule between steps.
