# SPDX-License-Identifier: Apache-2.0
name: Release

# Publishes a GitHub Release on every merge to main. Runs entirely on
# GitHub-hosted infrastructure -- unlike the Pipeline Workflow (see
# pipeline-dispatch.yml), this workflow never leaves GitHub, so it needs no
# AWS credentials, no OIDC role, and no Secrets Manager-backed token: the
# built-in GITHUB_TOKEN with `contents: write` (below) is sufficient to
# create a release in this same repo.

on:
  push:
    branches: [main]

permissions:
  contents: write

# Serializes releases per ref so two pushes to main can't both observe a 404
# on the release-exists check below and both attempt `gh release create` for
# the same tag -- the losing run would fail red, exactly what that idempotency
# check exists to avoid. Never cancel a run already publishing a release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Synthesize and Publish Release
    # Mirrors the same repository guard the Pipeline Workflow uses
    # (pipeline-dispatch.yml) -- a fork of this repo must not attempt to
    # publish a release under its own push-to-main events.
    if: github.repository == 'aws-solutions/konductor'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Set up Rust toolchain
        # No existing Rust-toolchain-setup convention exists elsewhere in
        # this repo's workflows to match -- cli/konductor-rs pins no MSRV
        # (Cargo.toml sets only `edition = "2021"`), so `stable` is used.
        # Pinned to a commit SHA on the `stable` branch (rather than the
        # mutable branch ref) since this is a release-publishing workflow
        # with `contents: write` -- an unpinned third-party action here is a
        # supply-chain risk to what the workflow publishes.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build konductor and run synth (produces dist/)
        run: make synth

      - name: Verify synth produced output for all harnesses
        # Enumerate every harness dist/ subdirectory here explicitly (kept in
        # sync with cli/konductor-rs/src/cli/synth/registry.rs's TRANSFORMERS
        # table) rather than hardcoding a count in the step name -- a 4th
        # harness must be added to this list, not just registered in Rust.
        run: |
          set -e
          for d in "dist/kiro-cli-v2/agents" "dist/kiro-cli-v3/agents" "dist/claude/agents"; do
            if [ -z "$(ls -A "$d" 2>/dev/null)" ]; then
              echo "FATAL: $d is empty or missing after konductor synth. Failing closed." >&2
              exit 1
            fi
          done

      - name: Assemble release staging directory (allowlist copy)
        # Mandatory, fail-closed: dist/ and the packaged release artifact
        # (target/konductor-artifacts/*.tar.gz + its .sha256 sidecar, written
        # by `konductor synth` -- see artifact_output_dir's own doc comment in
        # cli/konductor-rs/src/cli/synth/mod.rs) are the entire point of the
        # release. Everything else copied here is best-effort only.
        # Everything NOT named below (docs/design/, aim.json, Config,
        # build-tools/, cli/, mcp/, .kiro/, .github/, scripts/, .git/) is
        # excluded structurally by simply never being copied.
        run: |
          set -e
          STAGING_DIR="$RUNNER_TEMP/konductor-release-staging"
          mkdir -p "$STAGING_DIR"

          cp -r dist "$STAGING_DIR/dist"
          if [ -z "$(ls -A "$STAGING_DIR/dist" 2>/dev/null)" ]; then
            echo "FATAL: dist/ copied empty. Failing closed." >&2
            exit 1
          fi

          cp -r target/konductor-artifacts "$STAGING_DIR/konductor-artifacts"
          if [ -z "$(ls -A "$STAGING_DIR/konductor-artifacts" 2>/dev/null)" ]; then
            echo "FATAL: konductor-artifacts/ copied empty. Failing closed." >&2
            exit 1
          fi

          for f in LICENSE README.md CHANGELOG.md; do
            [ -f "$f" ] && cp "$f" "$STAGING_DIR/" || true
          done
          if [ -d docs/guides ]; then
            mkdir -p "$STAGING_DIR/docs"
            cp -r docs/guides "$STAGING_DIR/docs/guides"
          fi

          echo "STAGING_DIR=$STAGING_DIR" >> "$GITHUB_ENV"

      - name: Package and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -f VERSION ]; then
            echo "FATAL: VERSION file not found at repo root. Failing closed -- a released build must bump VERSION." >&2
            exit 1
          fi
          RELEASE_VERSION="v$(cat VERSION)"

          # Idempotency: this workflow runs on every push to main, but not
          # every push bumps VERSION (docs-only changes, refactors, etc.). A
          # push that doesn't change VERSION would otherwise run the full
          # build pipeline and only then fail at `gh release create`
          # with a "release already exists" error -- red on the common case,
          # not just on an actual re-run of the same version. Detection reads
          # the GitHub REST API's documented, versioned HTTP status line
          # (200 found / 404 not found) rather than `gh release view`'s
          # free-text CLI error string, which is not part of any documented
          # contract and can change on a future `gh` release -- same
          # mechanism this repo's internal release pipeline used for the
          # equivalent check.
          RELEASE_LOOKUP_STDERR="$(mktemp)"
          # GitHub Actions runs this step with `bash -eo pipefail`, so a
          # non-2xx `gh api` exit (expected on 404) would otherwise abort
          # the pipeline before the status line is ever inspected --
          # defeating the 404 branch below, which is the primary path for
          # every release that hasn't been published yet. Suspend pipefail
          # only for this lookup; `head`'s own exit status (0) then governs
          # the assignment, and the explicit 200/404/else branching still
          # handles detection and fails closed on anything unexpected.
          set +o pipefail
          RELEASE_LOOKUP_STATUS_LINE="$(gh api -i "repos/${{ github.repository }}/releases/tags/${RELEASE_VERSION}" 2>"$RELEASE_LOOKUP_STDERR" | head -n 1)"
          set -o pipefail
          if printf '%s' "$RELEASE_LOOKUP_STATUS_LINE" | grep -qE '^HTTP/[0-9.]+ 200 '; then
            echo "Release ${RELEASE_VERSION} already exists; nothing to publish for this push."
            rm -f "$RELEASE_LOOKUP_STDERR"
            exit 0
          elif printf '%s' "$RELEASE_LOOKUP_STATUS_LINE" | grep -qE '^HTTP/[0-9.]+ 404 '; then
            echo "Release ${RELEASE_VERSION} does not exist yet; proceeding to create it."
          else
            echo "FATAL: release lookup returned an unexpected HTTP status. Failing closed." >&2
            echo "Status line: ${RELEASE_LOOKUP_STATUS_LINE}" >&2
            cat "$RELEASE_LOOKUP_STDERR" >&2
            rm -f "$RELEASE_LOOKUP_STDERR"
            exit 1
          fi
          rm -f "$RELEASE_LOOKUP_STDERR"

          RELEASE_ZIP="$RUNNER_TEMP/konductor-release.zip"
          (cd "$STAGING_DIR" && zip -r "$RELEASE_ZIP" .)

          KONDUCTOR_VERSION="$(build/cli/konductor --version)"
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # --target pins the new tag to the exact commit this run checked
          # out and built. Without it, `gh release create` on a not-yet-
          # existing tag creates the tag against the default branch's
          # current tip -- and since `cancel-in-progress: false` above lets
          # runs queue, main can advance past ${{ github.sha }} before this
          # step executes, leaving the tag on a different commit than the
          # artifact and notes describe.
          gh release create "$RELEASE_VERSION" "$RELEASE_ZIP" \
            --target "${{ github.sha }}" \
            --title "konductor $RELEASE_VERSION" \
            --notes "Synthesized by konductor ${KONDUCTOR_VERSION} from ${{ github.sha }} at ${BUILD_TIMESTAMP}."
