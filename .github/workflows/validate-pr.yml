# SPDX-License-Identifier: Apache-2.0
#
# PR-time validation: runs `konductor synth` directly on a GitHub-hosted
# runner and rejects any PR that hand-modifies dist/. dist/ is gitignored and
# never committed -- the release workflow (release.yml) regenerates it fresh
# on every run and only ever publishes it as a release asset, so any dist/
# content reaching a PR diff can only be a stray, hand-committed copy.
#
# Triggers on `pull_request`, NOT `pull_request_target`: this job checks out and builds
# PR-head content (`make synth` compiles and runs contributor code), so it must run with
# a read-only, secret-free token even for fork PRs -- the standard mitigation for the
# "pwn request" pattern GitHub's docs warn against for `pull_request_target` jobs that
# execute PR content. `pull_request` gives exactly that: GITHUB_TOKEN is read-only and no
# repo secrets are exposed, regardless of the PR's origin.
name: Validate PR

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pull-request-job:
    name: Status Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Reject PRs that modify dist/
        # dist/ is gitignored and populated only by the release process --
        # contributor PRs must never touch it directly.
        #
        # Three-dot diff against the merge-base (fetch-depth: 0 above makes it available),
        # not a direct two-ref (two-dot) comparison: base.sha is the tip of the base branch
        # at event time, not the merge-base with the PR, so a two-dot diff can pick up
        # unrelated dist/ changes that landed on the base branch after this PR's branch
        # point (e.g. the release process regenerating dist/ elsewhere) and fail closed on
        # a PR that never touched dist/ itself.
        run: |
          set -e
          CHANGED_DIST_FILES="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" -- dist/)"
          if [ -n "$CHANGED_DIST_FILES" ]; then
            echo "FATAL: this PR modifies dist/, which is generated only by the release process. Revert these changes and let the release pipeline regenerate dist/ instead:" >&2
            echo "$CHANGED_DIST_FILES" >&2
            exit 1
          fi

      - name: Require a CHANGELOG.md entry alongside any VERSION bump
        # CHANGELOG.md's own convention (entries consolidated per release,
        # not per commit) is otherwise unenforced -- a PR could bump VERSION
        # with no corresponding CHANGELOG.md entry, or vice versa. Same
        # three-dot diff mechanism as the dist/ check above; checks presence
        # of a change on each side, plus VERSION's content format via the
        # shared scripts/validate-version-semver.sh (also invoked by
        # release.yml's own check-version job), so a malformed bump fails
        # here instead of at merge time.
        run: |
          set -e
          DIFF_RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          VERSION_CHANGED="$(git diff --name-only "$DIFF_RANGE" -- VERSION)"
          CHANGELOG_CHANGED="$(git diff --name-only "$DIFF_RANGE" -- CHANGELOG.md)"
          if [ -n "$VERSION_CHANGED" ] && [ ! -f VERSION ]; then
            echo "FATAL: VERSION was deleted. release.yml's check-version job requires it to exist at repo root and fails closed at merge time if it's missing. Restore it or this PR will break the next release." >&2
            exit 1
          fi
          if [ -n "$VERSION_CHANGED" ] && [ -z "$CHANGELOG_CHANGED" ]; then
            echo "FATAL: this PR bumps VERSION but does not update CHANGELOG.md. Add an entry for this release." >&2
            exit 1
          fi
          if [ -n "$VERSION_CHANGED" ] && [ -f VERSION ]; then
            RAW_VERSION="$(cat VERSION)"
            scripts/validate-version-semver.sh "$RAW_VERSION"
          fi

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build konductor and run synth (produces dist/)
        run: make synth

      - name: Verify synth produced output for all harnesses
        # Enumerate every harness dist/ subdirectory here explicitly (kept in sync with
        # cli/konductor-rs/src/cli/synth/registry.rs's TRANSFORMERS table), mirroring the
        # equivalent check in .github/workflows/release.yml.
        run: |
          set -e
          for d in "dist/kiro-cli-v2/agents" "dist/kiro-v3/agents" "dist/claude/agents"; do
            if [ -z "$(ls -A "$d" 2>/dev/null)" ]; then
              echo "FATAL: $d is empty or missing after konductor synth. Failing closed." >&2
              exit 1
            fi
          done

      - name: Verify packaged tarball asset count and version
        # PR-time analog of two release.yml checks that otherwise only run
        # after merge: check-version's TARBALL_MATCH_COUNT/
        # TARBALL_SIDECAR_MATCH_COUNT (its idempotency re-check), and the
        # build job's "Stage the shared release assets" step, which fails
        # closed on the same count and on a Cargo.toml/VERSION version
        # mismatch. Only this narrow slice is reproducible here: `konductor
        # synth` writes the tarball and its sidecar directly into dist/'s
        # top level (see synth::artifact_filename), so no additional build
        # step is needed beyond the synth step above. The rest of
        # release.yml's asset-completeness checks (EXPECTED_ASSET_COUNT and
        # the per-arch/per-tool name list) also cover the konductor and
        # skill-lookup-mcp binaries for both x86_64 and aarch64, which this
        # workflow does not build -- porting those would require adding an
        # mcp/ build and a second (aarch64) job here, so they still run only
        # in release.yml, post-merge.
        run: |
          set -e
          TARBALL_MATCHES="$(find dist -maxdepth 1 -name 'konductor-v*.tar.gz')"
          TARBALL_COUNT="$(printf '%s\n' "$TARBALL_MATCHES" | grep -c . || true)"
          if [ "$TARBALL_COUNT" -eq 0 ]; then
            echo "FATAL: no packaged .tar.gz artifact found at dist/'s top level after synth. release.yml's build job requires exactly one. Failing closed." >&2
            exit 1
          elif [ "$TARBALL_COUNT" -gt 1 ]; then
            echo "FATAL: expected exactly one packaged .tar.gz artifact at dist/'s top level, found ${TARBALL_COUNT}. Failing closed." >&2
            printf '%s\n' "$TARBALL_MATCHES" >&2
            exit 1
          fi
          TARBALL_PATH="$TARBALL_MATCHES"
          TARBALL_SIDECAR_PATH="${TARBALL_PATH}.sha256"
          if [ ! -f "$TARBALL_SIDECAR_PATH" ]; then
            echo "FATAL: expected sidecar $TARBALL_SIDECAR_PATH not found alongside $TARBALL_PATH. Failing closed." >&2
            exit 1
          fi

          # The tarball's version segment comes from Cargo.toml
          # (CARGO_PKG_VERSION), not the root VERSION file -- see
          # artifact_filename()'s own doc comment. release.yml's build job
          # fails closed on a mismatch between the two at merge time; check
          # it here too so the PR that introduces the drift is the one that
          # fails, not the next merge to main.
          if [ ! -f VERSION ]; then
            echo "FATAL: VERSION file not found at repo root. release.yml's check-version job requires it and fails closed at merge time. Failing closed." >&2
            exit 1
          fi
          RAW_VERSION="$(cat VERSION)"
          scripts/validate-version-semver.sh "$RAW_VERSION"
          EXPECTED_TARBALL_VERSION="v${RAW_VERSION}"
          TARBALL_VERSION="$(basename "$TARBALL_PATH" | sed -nE 's/^konductor-(v[0-9]+\.[0-9]+\.[0-9]+)\.tar\.gz$/\1/p')"
          if [ -z "$TARBALL_VERSION" ]; then
            echo "FATAL: could not parse a version segment from tarball filename $(basename "$TARBALL_PATH"). Failing closed." >&2
            exit 1
          fi
          if [ "$TARBALL_VERSION" != "$EXPECTED_TARBALL_VERSION" ]; then
            echo "FATAL: packaged tarball's version segment ($TARBALL_VERSION, from Cargo.toml) does not match the root VERSION file ($EXPECTED_TARBALL_VERSION). This will fail release.yml's build job after merge. Bump Cargo.toml's version to match VERSION before merging. Failing closed." >&2
            exit 1
          fi
