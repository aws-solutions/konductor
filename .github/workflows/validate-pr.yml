# SPDX-License-Identifier: Apache-2.0
#
# PR-time validation: runs every test suite (make test), requires a
# CHANGELOG.md entry alongside any VERSION bump, and checks the VERSION format.
#
# Triggers on `pull_request`, NOT `pull_request_target`, so the job runs with a
# read-only, secret-free token even for fork PRs.
name: Validate PR

on:
  pull_request:
    branches: [main, fuse]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pull-request-job:
    name: Status Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Require a CHANGELOG.md entry alongside any VERSION bump
        # CHANGELOG.md's own convention (entries consolidated per release,
        # not per commit) is otherwise unenforced -- a PR could bump VERSION
        # with no corresponding CHANGELOG.md entry, or vice versa. Same
        # three-dot diff three-dot diff against the merge-base; checks presence
        # of a change on each side, plus VERSION's content format via the
        # shared scripts/validate-version-semver.sh, so a malformed bump fails
        # here instead of after merge.
        run: |
          set -e
          DIFF_RANGE="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          VERSION_CHANGED="$(git diff --name-only "$DIFF_RANGE" -- VERSION)"
          CHANGELOG_CHANGED="$(git diff --name-only "$DIFF_RANGE" -- CHANGELOG.md)"
          if [ -n "$VERSION_CHANGED" ] && [ ! -f VERSION ]; then
            echo "FATAL: VERSION was deleted. Restore it." >&2
            exit 1
          fi
          if [ -n "$VERSION_CHANGED" ] && [ -z "$CHANGELOG_CHANGED" ]; then
            echo "FATAL: this PR bumps VERSION but does not update CHANGELOG.md. Add an entry for this release." >&2
            exit 1
          fi
          if [ -n "$VERSION_CHANGED" ] && [ -f VERSION ]; then
            RAW_VERSION="$(cat VERSION)"
            scripts/validate-version-semver.sh "$RAW_VERSION"
          fi

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Run every test suite
        run: make test
