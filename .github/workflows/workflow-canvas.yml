# SPDX-License-Identifier: Apache-2.0
#
# Lint, typecheck, test and build for workflow-canvas/. Runs only when that
# folder (or this workflow) changes. The integration/** and wc/** targets
# cover stacked PRs, where a PR's base is another feature branch rather than
# main.
#
# The root .prettierrc is a trigger because `prettier --check` resolves it.
# Install scripts are skipped: no dependency needs one to lint, test or build.
#
# Triggers on `pull_request`, NOT `pull_request_target`, so PR-head code runs
# with a read-only, secret-free token even for fork PRs.
name: Workflow canvas

on:
  pull_request:
    branches: [main, 'integration/**', 'wc/**']
    paths:
      - 'workflow-canvas/**'
      - '.prettierrc'
      - '.github/workflows/workflow-canvas.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-canvas:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workflow-canvas
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: workflow-canvas/.nvmrc
          cache: npm
          cache-dependency-path: workflow-canvas/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
