# SPDX-License-Identifier: Apache-2.0
#
# Lint, typecheck, test, build and end-to-end tests for workflow-canvas/. Runs
# only when that folder (or this workflow) changes. The integration/** and wc/** targets
# cover stacked PRs, where a PR's base is another feature branch rather than
# main.
#
# The root .prettierrc is a trigger because `prettier --check` resolves it.
# Install scripts are skipped: no dependency needs one to lint, test or build.
#
# The matrix covers the Node versions `engines` allows. .nvmrc stays on 24
# until 26 becomes LTS on 2026-10-28.
#
# The e2e job runs the Playwright tests in Chromium on Node 24 only (the
# browser, not Node, is what they exercise), starts the stub API beside the
# app (its config is in playwright.shared.ts) and also regenerates the
# screenshots, which must match the committed files. Both the HTML report and
# the screenshots are uploaded whether the tests pass or fail.
#
# Triggers on `pull_request`, NOT `pull_request_target`, so PR-head code runs
# with a read-only, secret-free token even for fork PRs.
name: Workflow canvas

on:
  pull_request:
    branches: [main, 'integration/**', 'wc/**']
    paths:
      - 'workflow-canvas/**'
      - '.prettierrc'
      - '.github/workflows/workflow-canvas.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-canvas:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    defaults:
      run:
        working-directory: workflow-canvas
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: workflow-canvas/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: API contract (also part of Test, run alone for a clear label)
        run: npm run api:lint

      - name: Stub API (also part of Test, run alone for a clear label)
        run: npm run test:stub

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workflow-canvas
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workflow-canvas/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Capture screenshots
        if: ${{ !cancelled() }}
        run: npm run screenshots

      - name: Check committed screenshots are current
        run: |
          git add --intent-to-add e2e/screenshots
          git diff --exit-code -- e2e/screenshots || {
            echo '::error::Screenshots are out of date. Run `npm run screenshots` and commit the result.'
            exit 1
          }

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: workflow-canvas/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: workflow-canvas/e2e/screenshots/
          if-no-files-found: error
          retention-days: 14
