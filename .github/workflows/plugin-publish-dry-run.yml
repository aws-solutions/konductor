# SPDX-License-Identifier: Apache-2.0
name: Dry run - Claude Code plugin candidate publish

# Manually-triggered rehearsal of release.yml's publish-claude-plugin job,
# without a real release. It builds and validates the plugin tree, pushes a
# throwaway candidate branch, and opens a draft PR into release/plugins --
# exactly what a real release does, so the rehearsal exercises the real
# push/PR path instead of a simulation of it. It is structurally incapable
# of creating a GitHub Release, a product release asset, or the
# claude-plugin-vX.Y.Z tag: this workflow has no dependency on release.yml's
# check-version/build/publish jobs and never runs `gh release create` or
# `git tag`. It cannot merge the PR it opens (opened as draft; merging
# requires two human approvals under the org-wide ruleset) and cannot write
# to release/plugins directly (the plugins ruleset blocks that regardless
# of what this workflow does).
#
# The candidate branch uses the "plugin-candidate-dryrun" prefix, not
# "plugin-candidate" -- tag-claude-plugin-release.yml's
# compute-plugin-release-tag.sh guard only tags a merge whose head branch
# starts with "plugin-candidate/", so even an accidental merge of this PR
# can never produce a real tag.
#
# Requires typing the literal confirmation phrase as a dispatch input (hard
# dry-run guard): a workflow_dispatch run with no input value, or the wrong
# one, fails before any branch is pushed or any PR is opened.

on:
  workflow_dispatch:
    inputs:
      confirm_dry_run:
        description: >-
          Type DRY_RUN_CONFIRMED to proceed. This still pushes a real
          (throwaway) candidate branch and opens a real draft PR into
          release/plugins for cleanup afterward -- it does not simulate
          those two actions, only the release/tag/asset actions a real
          publish would also take.
        required: true
        type: string

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry-run plugin candidate publish
    if: github.repository == 'aws-solutions/konductor'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: release/plugins
      # No job-wide GH_TOKEN. Only the two steps that actually call `gh`
      # or need GitHub API auth (precondition validation, draft PR
      # creation) bind it in their own `env:` -- see those steps below.
      # Checkout, toolchain setup, the build, npm install, and tree
      # assembly have no reason to see this token at all.
    steps:
      - name: Enforce the hard dry-run confirmation guard
        # Bound through `env`, not interpolated into the script body.
        # confirm_dry_run is a workflow_dispatch string input -- free text
        # a user can set to anything. GitHub Actions expression syntax
        # inside a `run:` block is substituted into the script source
        # before the shell runs it, so a value containing shell
        # metacharacters would execute as code rather than compare as a
        # string. Passing it through the process environment means the
        # shell only ever sees it as $CONFIRM_DRY_RUN's value.
        env:
          CONFIRM_DRY_RUN: ${{ inputs.confirm_dry_run }}
        run: |
          set -e
          if [ "$CONFIRM_DRY_RUN" != "DRY_RUN_CONFIRMED" ]; then
            echo "FATAL: confirm_dry_run must be exactly 'DRY_RUN_CONFIRMED'. Got a different value (not echoed here in case it was meant as a secret). Failing closed before touching anything." >&2
            exit 1
          fi

      - name: Refuse to target main/mainline
        run: |
          set -e
          case "$BASE_BRANCH" in
            main|mainline)
              echo "FATAL: refusing to target '$BASE_BRANCH' -- generated plugin output must never land on main/mainline." >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Derive the dry-run candidate branch name
        id: candidate
        run: |
          set -e
          RAW_VERSION="$(cat VERSION)"
          scripts/validate-version-semver.sh "$RAW_VERSION"
          CANDIDATE_BRANCH="$(scripts/derive-plugin-candidate-branch.sh \
            --version "v${RAW_VERSION}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --prefix "plugin-candidate-dryrun")"
          echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
          # Not a real release tag and never created -- a collision-check
          # label only, so validate-plugin-publish-preconditions.sh has
          # something to look up. tag-claude-plugin-release.yml never sees
          # this value; it reads the real tag name itself from VERSION.
          echo "tag_label=claude-plugin-dryrun-v${RAW_VERSION}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Validate publish preconditions (source ref, candidate collision)
        # Needs GH_TOKEN: validate-plugin-publish-preconditions.sh requires
        # it in its own environment and fails closed if absent (used only
        # by `gh`, never printed -- see the script's own header comment).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          scripts/validate-plugin-publish-preconditions.sh \
            --repo "${{ github.repository }}" \
            --expected-ref "${{ github.sha }}" \
            --candidate-branch "${{ steps.candidate.outputs.candidate_branch }}" \
            --tag "${{ steps.candidate.outputs.tag_label }}"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build the konductor CLI
        run: make -C cli build

      - name: Assemble the flat Claude Code plugin tree
        run: |
          set -e
          ASSEMBLE_DIR="$RUNNER_TEMP/claude-plugin-dryrun"
          rm -rf "$ASSEMBLE_DIR"
          scripts/assemble-claude-plugin-branch.sh --out "$ASSEMBLE_DIR"
          echo "ASSEMBLE_DIR=$ASSEMBLE_DIR" >> "$GITHUB_ENV"

      - name: Install claude CLI for validation
        run: npm install --global @anthropic-ai/claude-code@2.1.284

      - name: Validate the assembled plugin tree (strict manifest validation)
        run: claude plugin validate "$ASSEMBLE_DIR" --strict

      - name: Build the candidate commit on top of release/plugins' tip
        # Same history-safe construction release.yml's publish-claude-plugin
        # job uses -- see scripts/build-plugin-candidate-commit.sh's own
        # header comment. Both workflows calling the same script is what
        # keeps them from drifting apart on this again.
        run: |
          set -e
          scripts/build-plugin-candidate-commit.sh \
            --base-branch "$BASE_BRANCH" \
            --candidate-branch "${{ steps.candidate.outputs.candidate_branch }}" \
            --assemble-dir "$ASSEMBLE_DIR" \
            --commit-message "[DRY RUN] Claude Code plugin candidate rehearsal (run ${{ github.run_id }})"

      - name: Push the throwaway candidate branch
        # No manual auth header: the checkout step above already persisted
        # write-scoped credentials into this working copy (actions/
        # checkout's default persist-credentials behavior, since this
        # job's `permissions:` block grants contents: write).
        run: |
          set -e
          git push origin \
            "${{ steps.candidate.outputs.candidate_branch }}:refs/heads/${{ steps.candidate.outputs.candidate_branch }}"
          echo "Pushed dry-run candidate branch ${{ steps.candidate.outputs.candidate_branch }} at $(git rev-parse "${{ steps.candidate.outputs.candidate_branch }}")"

      - name: Open a draft pull request into release/plugins
        id: pr
        # Needs GH_TOKEN: `gh pr create` below authenticates with it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PR_BODY="[DRY RUN] Rehearsal of the plugin candidate publish path. Not a real release.

          - Candidate branch: ${{ steps.candidate.outputs.candidate_branch }}
          - Triggered manually (run ${{ github.run_id }}/${{ github.run_attempt }}) from ${{ github.sha }}.
          - No tag, release, or merge is created by this run.
          - Close this PR and delete the branch after reviewing it -- see this workflow's job summary for the exact cleanup commands."
          PR_URL="$(gh pr create \
            --repo "${{ github.repository }}" \
            --base "$BASE_BRANCH" \
            --head "${{ steps.candidate.outputs.candidate_branch }}" \
            --title "[DRY RUN] Plugin candidate rehearsal (run ${{ github.run_id }})" \
            --body "$PR_BODY" \
            --draft)"
          PR_NUMBER="$(printf '%s' "$PR_URL" | grep -oE '[0-9]+$')"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Opened draft PR: $PR_URL"

      - name: Report deterministic cleanup identifiers
        # if: always() -- a reviewer needs these identifiers even when a
        # later step failed partway through (e.g. the candidate branch
        # pushed but PR creation didn't). Without it, a step after any
        # earlier failure is skipped by default and the pushed branch
        # would have to be found by hand in the job logs.
        #
        # The candidate branch is printed whenever that step itself ran;
        # PR identifiers are printed only when PR creation actually
        # produced them, since the branch can exist with no PR on top of
        # it. No GH_TOKEN here -- this step only echoes instructions, it
        # never calls `gh` itself.
        if: always()
        env:
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.candidate_branch }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          REPO: ${{ github.repository }}
        run: |
          echo "=== Dry-run cleanup identifiers ==="
          if [ -n "$CANDIDATE_BRANCH" ]; then
            echo "CANDIDATE_BRANCH=$CANDIDATE_BRANCH"
          else
            echo "CANDIDATE_BRANCH=<not derived -- this run failed before the candidate branch name was computed>"
          fi
          if [ -n "$PR_NUMBER" ]; then
            echo "PR_NUMBER=$PR_NUMBER"
            echo "PR_URL=$PR_URL"
          else
            echo "PR_NUMBER=<no PR was created -- check this run's logs for where it stopped>"
          fi
          echo "To clean up:"
          if [ -n "$PR_NUMBER" ]; then
            echo "  gh pr close $PR_NUMBER --repo $REPO --delete-branch"
          elif [ -n "$CANDIDATE_BRANCH" ]; then
            echo "  gh api --method DELETE repos/$REPO/git/refs/heads/$CANDIDATE_BRANCH"
          else
            echo "  (nothing to clean up -- no candidate branch was pushed)"
          fi
