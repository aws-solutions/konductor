# SPDX-License-Identifier: Apache-2.0
name: Dry run - Claude Code plugin candidate publish (pre-merge rehearsal)

# Lets the plugin candidate publish path (push a throwaway branch, open a
# draft PR into release/plugins) be rehearsed from main before the pull
# request that introduces it merges. The real dry-run workflow
# (plugin-publish-dry-run.yml) only exists on that pull request's own
# branch, so GitHub cannot dispatch it until the branch merges -- this
# workflow is registered on main instead, specifically to break that
# chicken-and-egg problem.
#
# It is pinned to one fixed, immutable commit (FIXED_SOURCE_REF below) --
# the exact commit that introduced the real dry-run path -- never to a
# user-supplied ref, branch name, or tag. There is no ref/branch input on
# this workflow's `workflow_dispatch` trigger, so there is nothing for a
# caller to override.
#
# Reuses that commit's own scripts (derive-plugin-candidate-branch.sh,
# validate-plugin-publish-preconditions.sh, build-plugin-candidate-commit.sh,
# assemble-claude-plugin-branch.sh) rather than reimplementing their logic
# inline, so this rehearsal exercises the exact same code the real publish
# path runs. The only genuinely new logic here is the few lines that pin
# and re-verify the fixed source commit after checkout -- see the
# "Verify the checked-out commit matches the pinned source ref" step.
#
# Like the real dry-run workflow, this cannot create a GitHub Release, a
# release asset, or the claude-plugin-vX.Y.Z tag (no dependency on
# release.yml, never runs `gh release create` or `git tag`), cannot merge
# the PR it opens (opened as draft), and cannot write to release/plugins
# directly (blocked by that branch's ruleset regardless of what this
# workflow does). The candidate branch uses the "plugin-candidate-dryrun"
# prefix, not "plugin-candidate", so even an accidental merge of this PR
# can never produce a real tag (see compute-plugin-release-tag.sh's
# candidate-prefix guard).
#
# Requires typing the literal confirmation phrase as a dispatch input (hard
# dry-run guard): a run with no input value, or the wrong one, fails before
# any branch is pushed or any PR is opened. The confirmation value is bound
# through a step-level env: mapping and read back as a quoted shell
# variable, not interpolated directly into the script -- a raw `${{ }}`
# substitution inside a run: body is text-substituted before the shell ever
# parses it, so a value containing a `"` or `$(...)` could otherwise break
# out of the comparison and execute as shell.
#
# Before checking out the pinned commit, a live `gh pr view 28` call
# re-verifies that PR #28's actual current head still matches
# FIXED_SOURCE_REF below. The pin is a point-in-time snapshot taken when
# this workflow was last reviewed; if PR #28 gains new commits afterward,
# rehearsing the stale pinned commit would silently validate behavior that
# no longer matches what will actually merge. This check fails closed on
# any drift, before touching the repository.
#
# GH_TOKEN is granted only on the three steps that call `gh` (the live
# PR #28 head check, precondition validation, and draft-PR creation) --
# never at job or workflow level, so checkout, the Rust build, npm install,
# and plugin assembly never see it.

on:
  workflow_dispatch:
    inputs:
      confirm_dry_run:
        description: >-
          Type DRY_RUN_CONFIRMED to proceed. This still pushes a real
          (throwaway) candidate branch and opens a real draft PR into
          release/plugins for cleanup afterward -- it does not simulate
          those two actions, only the release/tag/asset actions a real
          publish would also take.
        required: true
        type: string

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry-run plugin candidate publish (from main)
    # Restricts this to the copy of the workflow registered on main --
    # dispatching an edited copy from any other branch must not run with
    # this job's elevated permissions.
    if: github.repository == 'aws-solutions/konductor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_BRANCH: release/plugins
      # The exact commit that introduced the real plugin-publish-dry-run.yml
      # path on its own feature branch. Pinned as a full commit SHA, not a
      # branch name -- a branch can move after this workflow is reviewed and
      # merged to main; a commit SHA cannot. Update this value (via a
      # reviewed PR to main, same as any other change here) if the source
      # branch gains fixes that should be rehearsed too -- the live drift
      # check below fails closed if this value falls behind PR #28's
      # actual head, so a stale pin is caught rather than silently rehearsed.
      FIXED_SOURCE_REF: 84404aff69e7a1a8915297d9531438a6b41c631e
    steps:
      - name: Enforce the hard dry-run confirmation guard
        env:
          # Bound once here so the shell reads it as data through a quoted
          # variable, never as text spliced into the script source.
          CONFIRM_DRY_RUN: ${{ inputs.confirm_dry_run }}
        run: |
          set -e
          if [ "$CONFIRM_DRY_RUN" != "DRY_RUN_CONFIRMED" ]; then
            echo "FATAL: confirm_dry_run must be exactly 'DRY_RUN_CONFIRMED'. Got a different value (not echoed here in case it was meant as a secret). Failing closed before touching anything." >&2
            exit 1
          fi

      - name: Refuse to target main/mainline
        run: |
          set -e
          case "$BASE_BRANCH" in
            main|mainline)
              echo "FATAL: refusing to target '$BASE_BRANCH' -- generated plugin output must never land on main/mainline." >&2
              exit 1
              ;;
          esac

      - name: "Check PR #28 for live source-head drift"
        # Catches the case where PR #28 gained commits after this workflow's
        # FIXED_SOURCE_REF was last reviewed and pinned. Runs before
        # checkout -- a stale pin must stop the run before anything is
        # fetched, built, or pushed, not after.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          LIVE_HEAD_SHA="$(gh pr view 28 --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')"
          if [ "$LIVE_HEAD_SHA" != "$FIXED_SOURCE_REF" ]; then
            echo "FATAL: PR #28's live head ($LIVE_HEAD_SHA) no longer matches the pinned FIXED_SOURCE_REF ($FIXED_SOURCE_REF). The pin is stale -- resolve PR #28's current head and update FIXED_SOURCE_REF via a reviewed PR to main before re-running. Failing closed." >&2
            exit 1
          fi

      - name: Checkout the pinned source commit
        # `ref:` is the fixed, hardcoded commit above -- never an input,
        # never derived from a branch name supplied at dispatch time. This
        # workflow takes no ref/branch input at all, so there is nothing
        # here for a caller to redirect.
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ env.FIXED_SOURCE_REF }}
          fetch-depth: 0

      - name: Verify the checked-out commit matches the pinned source ref
        # actions/checkout's `ref:` input should already guarantee this, but
        # this workflow runs from main specifically to rehearse behavior
        # before merge, where an unnoticed drift between FIXED_SOURCE_REF
        # and the real pre-merge commit would be easy to miss. Cheap
        # insurance, not a substitute for validate-plugin-publish-
        # preconditions.sh's own equivalent check below (which this step
        # runs ahead of, since that script needs the repository's scripts/
        # directory already checked out to be invoked at all).
        run: |
          set -e
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$FIXED_SOURCE_REF" ]; then
            echo "FATAL: checked-out commit '$ACTUAL_SHA' does not match the pinned FIXED_SOURCE_REF '$FIXED_SOURCE_REF'. Failing closed." >&2
            exit 1
          fi

      - name: Derive the dry-run candidate branch name
        id: candidate
        run: |
          set -e
          RAW_VERSION="$(cat VERSION)"
          scripts/validate-version-semver.sh "$RAW_VERSION"
          CANDIDATE_BRANCH="$(scripts/derive-plugin-candidate-branch.sh \
            --version "v${RAW_VERSION}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --prefix "plugin-candidate-dryrun")"
          echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
          # Not a real release tag and never created -- a collision-check
          # label only, so validate-plugin-publish-preconditions.sh has
          # something to look up. tag-claude-plugin-release.yml never sees
          # this value; it reads the real tag name itself from VERSION.
          echo "tag_label=claude-plugin-dryrun-v${RAW_VERSION}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Validate publish preconditions (source ref, candidate collision)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          scripts/validate-plugin-publish-preconditions.sh \
            --repo "${{ github.repository }}" \
            --expected-ref "$FIXED_SOURCE_REF" \
            --candidate-branch "${{ steps.candidate.outputs.candidate_branch }}" \
            --tag "${{ steps.candidate.outputs.tag_label }}"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Build the konductor CLI
        run: make -C cli build

      - name: Assemble the flat Claude Code plugin tree
        run: |
          set -e
          ASSEMBLE_DIR="$RUNNER_TEMP/claude-plugin-rehearsal"
          rm -rf "$ASSEMBLE_DIR"
          scripts/assemble-claude-plugin-branch.sh --out "$ASSEMBLE_DIR"
          echo "ASSEMBLE_DIR=$ASSEMBLE_DIR" >> "$GITHUB_ENV"

      - name: Install claude CLI for validation
        run: npm install --global @anthropic-ai/claude-code@2.1.284

      - name: Validate the assembled plugin tree (strict manifest validation)
        run: claude plugin validate "$ASSEMBLE_DIR" --strict

      - name: Build the candidate commit on top of release/plugins' tip
        # Same history-safe construction the real publish path uses -- see
        # scripts/build-plugin-candidate-commit.sh's own header comment.
        run: |
          set -e
          scripts/build-plugin-candidate-commit.sh \
            --base-branch "$BASE_BRANCH" \
            --candidate-branch "${{ steps.candidate.outputs.candidate_branch }}" \
            --assemble-dir "$ASSEMBLE_DIR" \
            --commit-message "[DRY RUN] Pre-merge rehearsal of plugin candidate publish from main (source ${{ env.FIXED_SOURCE_REF }}, run ${{ github.run_id }})"

      - name: Push the throwaway candidate branch
        # No manual auth header: the checkout step above already persisted
        # write-scoped credentials into this working copy (actions/
        # checkout's default persist-credentials behavior, since this
        # job's `permissions:` block grants contents: write).
        run: |
          set -e
          git push origin \
            "${{ steps.candidate.outputs.candidate_branch }}:refs/heads/${{ steps.candidate.outputs.candidate_branch }}"
          echo "Pushed dry-run candidate branch ${{ steps.candidate.outputs.candidate_branch }} at $(git rev-parse "${{ steps.candidate.outputs.candidate_branch }}")"

      - name: Open a draft pull request into release/plugins
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PR_BODY="[DRY RUN] Pre-merge rehearsal of the plugin candidate publish path, run from main. Not a real release.

          - Candidate branch: ${{ steps.candidate.outputs.candidate_branch }}
          - Source commit rehearsed: ${{ env.FIXED_SOURCE_REF }}
          - Triggered manually (run ${{ github.run_id }}/${{ github.run_attempt }}).
          - No tag, release, or merge is created by this run.
          - Close this PR and delete the branch after reviewing it -- see this workflow's job summary for the exact cleanup commands."
          PR_URL="$(gh pr create \
            --repo "${{ github.repository }}" \
            --base "$BASE_BRANCH" \
            --head "${{ steps.candidate.outputs.candidate_branch }}" \
            --title "[DRY RUN] Plugin candidate rehearsal from main (run ${{ github.run_id }})" \
            --body "$PR_BODY" \
            --draft)"
          PR_NUMBER="$(printf '%s' "$PR_URL" | grep -oE '[0-9]+$')"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Opened draft PR: $PR_URL"

      - name: Report deterministic cleanup identifiers
        # Runs on every outcome (if: always()) -- a run that fails after
        # pushing the candidate branch but before opening the PR, or after
        # opening the PR but before this step, must still surface whatever
        # remote state it left behind. Without `always()`, a mid-pipeline
        # failure would leave an orphaned branch (or branch+PR) with no
        # printed identifier anywhere, so a reviewer couldn't find it to
        # clean it up.
        #
        # The candidate branch is always reported if it was derived at all
        # (even a push failure still leaves the identifier printed, which
        # is useful since the push step itself logs the same name). The PR
        # identifiers are reported only when the PR step actually produced
        # them -- printing an empty PR_NUMBER/PR_URL would make the
        # `gh pr close` cleanup command silently malformed. Two cleanup
        # commands are offered depending on how far the run got, and
        # neither one embeds a token: `gh pr close`/`git push` both read
        # credentials from the invoking user's own `gh`/git auth, not from
        # anything this workflow printed.
        if: always()
        run: |
          echo "=== Dry-run cleanup identifiers ==="
          CANDIDATE_BRANCH="${{ steps.candidate.outputs.candidate_branch }}"
          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          PR_URL="${{ steps.pr.outputs.pr_url }}"
          if [ -n "$CANDIDATE_BRANCH" ]; then
            echo "CANDIDATE_BRANCH=$CANDIDATE_BRANCH"
          else
            echo "CANDIDATE_BRANCH=(not derived -- failed before that step ran)"
          fi
          if [ -n "$PR_NUMBER" ]; then
            echo "PR_NUMBER=$PR_NUMBER"
            echo "PR_URL=$PR_URL"
            echo "To clean up (branch + draft PR):"
            echo "  gh pr close $PR_NUMBER --repo ${{ github.repository }} --delete-branch"
          elif [ -n "$CANDIDATE_BRANCH" ]; then
            echo "PR_NUMBER=(not created -- run failed or stopped before the PR step)"
            echo "To clean up (branch only, no PR was opened):"
            echo "  git push origin --delete $CANDIDATE_BRANCH"
          else
            echo "Nothing was pushed or opened -- no cleanup needed."
          fi
