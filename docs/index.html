document, apply the <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">design-doc-guidelines<\u002Fspan> criteria. Findings are presented ordered <strong style=\"color:var(--tx);font-weight:600\">CRITICAL → IMPORTANT → SUGGESTION<\u002Fstrong>, followed by:<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n              <span style=\"border:1px solid rgba(255,107,107,.5);border-radius:8px;background:rgba(255,107,107,.08);padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#FF8B8B\">CRITICAL<\u002Fspan>\n              <span style=\"font-size:16px;color:var(--mu2)\">→<\u002Fspan>\n              <span style=\"border:1px solid rgba(124,92,255,.5);border-radius:8px;background:rgba(124,92,255,.1);padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">IMPORTANT<\u002Fspan>\n              <span style=\"font-size:16px;color:var(--mu2)\">→<\u002Fspan>\n              <span style=\"border:1px dashed var(--bd2);border-radius:8px;padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mu2)\">SUGGESTION<\u002Fspan>\n              <span style=\"margin-left:6px;border:1px solid var(--bd2);border-radius:8px;background:var(--code);padding:8px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#E8E4F5\">Fix these issues? [y/n]<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"c-cli\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 14px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Konductor CLI<\u002Fh2>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">The <strong style=\"color:var(--tx);font-weight:600\">Konductor CLI<\u002Fstrong> is a separate command-line program named <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">konductor<\u002Fspan>. It handles setup, content build, lifecycle, and diagnostics for a Konductor-managed repository: <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">install<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">update<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">uninstall<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">doctor<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">init<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">config<\u002Fspan>, and <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">synth<\u002Fspan>.<\u002Fp>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">It does <strong style=\"color:var(--tx);font-weight:600\">not<\u002Fstrong> run SDLC workflows. Running a workflow means talking to an agent, not typing a <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">konductor<\u002Fspan> subcommand. Full detail in the <a href=\"#/reference\">CLI reference<\u002Fa>.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"c-fits\" style=\"border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 14px;font-size:30px;letter-spacing:-.025em;font-weight:600\">How it all fits together<\u002Fh2>\n            <p style=\"margin:0 0 26px;font-size:16px;line-height:1.75;color:var(--mu)\">Hub-and-spoke: you talk only to the orchestrator; routing rules are always active; skills and SOPs load on demand.<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:18px;background:radial-gradient(120% 140% at 20% 0%,rgba(124,92,255,.12),transparent 60%),var(--bg2);padding:32px 30px;margin-bottom:26px\">\n              <div style=\"display:flex;flex-direction:column;gap:0;align-items:stretch\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:center\">\n                  <div style=\"border:1px solid var(--bd2);border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600\">You<\u002Fdiv>\n                  <div style=\"flex:0 0 70px;height:1px;background:var(--bd2);position:relative\"><span style=\"position:absolute;left:0;top:-20px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:var(--mu2);white-space:nowrap\">conversation<\u002Fspan><\u002Fdiv>\n                  <div style=\"flex:1;min-width:260px;border:1px solid var(--vi);border-radius:12px;background:rgba(124,92,255,.1);box-shadow:inset 0 0 60px -20px var(--vi);padding:14px 18px\">\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx);font-weight:500\">asdlc-orchestrator<\u002Fdiv>\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--lav);margin-top:5px\">HUB — READ-ONLY<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"flex:0 0 auto;border:1px dashed rgba(61,220,151,.5);border-radius:12px;background:rgba(61,220,151,.06);padding:12px 16px\">\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--sig);margin-bottom:5px\">ALWAYS ACTIVE<\u002Fdiv>\n                    <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx)\">context/ routing rules<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:26px;padding:22px 0 0\">\n                  <div style=\"flex:0 0 2px;background:linear-gradient(180deg,var(--vi),transparent);margin-left:96px\"><\u002Fdiv>\n                  <div style=\"flex:1;display:flex;flex-direction:column;gap:14px\">\n                    <div style=\"display:flex;align-items:baseline;gap:12px\">\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--vi)\">7-SECTION DELEGATION ↓<\u002Fspan>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--sig)\">↑ VERIFIED RESULT<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:16px 18px\">\n                      <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--mu2);margin-bottom:12px\">8 SPECIALIST AGENTS<\u002Fdiv>\n                      <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                        <span style=\"border:1px solid var(--bd2);border-radius:8px;padding:7px 11px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--tx)\">asdlc-developer<\u002Fspan>\n                        <span style=\"border:1px solid var(--bd2);border-radius:8px;padding:7px 11px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--tx)\">asdlc-architect<\u002Fspan>\n                        <span style=\"border:1px solid var(--bd2);border-radius:8px;padding:7px 11px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--tx)\">asdlc-quality-assurance<\u002Fspan>\n                        <span style=\"border:1px dashed var(--bd2);border-radius:8px;padding:7px 11px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mu2)\">+ 5 more<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"border:1px dashed var(--bd2);border-radius:12px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:18px;align-items:center\">\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mu)\">skills/ — 75 modules<\u002Fspan>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mu)\">agent-sops/ — 13 procedures<\u002Fspan>\n                      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--mu2)\">LOADED ON DEMAND<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ fitsSteps }}\" as=\"s\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;gap:14px;align-items:baseline\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--vi);flex:0 0 22px\">{{ s.n }}<\u002Fspan>\n                  <span style=\"font-size:16px;line-height:1.7;color:var(--mu)\">{{ s.text }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n            <button sc-camel-on-click=\"{{ goHome }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Guide index<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goPrereq }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: Prerequisites →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <div style=\"width:196px;flex:0 0 196px;padding-top:72px\">\n          <div style=\"position:sticky;top:24px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--bd);padding-left:18px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;color:var(--mu2)\">ON THIS PAGE<\u002Fdiv>\n            <a href=\"#c-runtime\" style=\"font-size:13px;color:var(--mu)\">Runtime<\u002Fa>\n            <a href=\"#c-agent\" style=\"font-size:13px;color:var(--mu)\">Agent<\u002Fa>\n            <a href=\"#c-spec\" style=\"font-size:13px;color:var(--mu)\">Agent spec<\u002Fa>\n            <a href=\"#c-skill\" style=\"font-size:13px;color:var(--mu)\">Skill<\u002Fa>\n            <a href=\"#c-sop\" style=\"font-size:13px;color:var(--mu)\">SOP<\u002Fa>\n            <a href=\"#c-context\" style=\"font-size:13px;color:var(--mu)\">Context file<\u002Fa>\n            <a href=\"#c-delegation\" style=\"font-size:13px;color:var(--mu)\">Orchestrator and delegation<\u002Fa>\n            <a href=\"#c-maker\" style=\"font-size:13px;color:var(--mu)\">Maker-checker<\u002Fa>\n            <a href=\"#c-cli\" style=\"font-size:13px;color:var(--mu)\">Konductor CLI<\u002Fa>\n            <a href=\"#c-fits\" style=\"font-size:13px;color:var(--mu)\">How it all fits together<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.prerequisites }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:0 56px 96px;gap:48px\">\n        <article style=\"flex:1 1 520px;min-width:0;padding-top:64px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">GUIDE / PREREQUISITES<\u002Fdiv>\n          <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Prerequisites<\u002Fh1>\n          <p style=\"margin:0 0 40px;font-size:19px;line-height:1.5;color:var(--mu)\">What you need before you start. It is a short list — Konductor is configuration plus a single binary, with no servers, services, or cloud resources.<\u002Fp>\n\n          <section id=\"p-essentials\" style=\"padding-bottom:44px\">\n            <h2 style=\"margin:0 0 20px;font-size:30px;letter-spacing:-.025em;font-weight:600\">The essentials<\u002Fh2>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:24px\">\n              <div style=\"display:grid;grid-template-columns:1.2fr 1.7fr 1.1fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\">\n                <div style=\"padding:11px 16px\">REQUIREMENT<\u002Fdiv><div style=\"padding:11px 16px\">WHY<\u002Fdiv><div style=\"padding:11px 16px\">CHECK IT WITH<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1.2fr 1.7fr 1.1fr;border-bottom:1px solid var(--bd)\">\n                <div style=\"padding:13px 16px;font-size:14.5px;font-weight:600\">One AI runtime — Kiro CLI <em style=\"color:var(--mu);font-weight:400\">or<\u002Fem> Claude Code<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Konductor supplies no model of its own; it configures a runtime you already have<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">kiro-cli --version<br>claude --version<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1.2fr 1.7fr 1.1fr;border-bottom:1px solid var(--bd)\">\n                <div style=\"padding:13px 16px;font-size:14.5px;font-weight:600\">Git<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Agents run git operations on your behalf during review and cleanup workflows<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">git --version<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1.2fr 1.7fr 1.1fr\">\n                <div style=\"padding:13px 16px;font-size:14.5px;font-weight:600\">A terminal<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Everything here is command-line<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mu2)\">—<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 24px;font-size:16px;line-height:1.75;color:var(--mu)\">That is all that is required. Pick your runtime:<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px\">\n              <div style=\"border:1px solid var(--bd);border-radius:14px;background:var(--surf);padding:22px 24px\">\n                <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600;letter-spacing:-.02em\">Kiro CLI<\u002Fh3>\n                <pre style=\"margin:0 0 14px;border-radius:10px;background:var(--code);padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#E8E4F5;overflow-x:auto\">kiro-cli --version<\u002Fpre>\n                <p style=\"margin:0;font-size:14.5px;line-height:1.65;color:var(--mu)\">Nothing else to configure — <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">konductor install<\u002Fspan> handles the rest. See <a href=\"#/install-kiro\">Install for Kiro CLI<\u002Fa>.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--bd);border-radius:14px;background:var(--surf);padding:22px 24px\">\n                <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600;letter-spacing:-.02em\">Claude Code<\u002Fh3>\n                <pre style=\"margin:0 0 14px;border-radius:10px;background:var(--code);padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#E8E4F5;overflow-x:auto\">claude --version<\u002Fpre>\n                <p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">Version 2.1.178 or later<\u002Fstrong> is required for the agent-teams runtime, which is what lets the orchestrator spawn specialists.<\u002Fp>\n                <p style=\"margin:0;font-size:14.5px;line-height:1.65;color:var(--mu)\">Claude Code also needs two settings configured before a team of agents can do anything — an experimental environment variable and a tool-permissions allowlist. Skipping either makes the agents fail <em>silently<\u002Fem> rather than with an error, so it is worth doing up front. Both are covered in <a href=\"#/install-claude\">Install for Claude Code<\u002Fa>.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"p-platforms\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 20px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Supported platforms<\u002Fh2>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px\">\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px\">\n                <span style=\"font-size:16px;font-weight:600\">macOS<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sig)\">Intel · Apple silicon<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px\">\n                <span style=\"font-size:16px;font-weight:600\">Linux<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sig)\">x86_64 · arm64<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"p-accounts\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 20px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Accounts and permissions<\u002Fh2>\n            <div style=\"display:flex;flex-direction:column;gap:14px\">\n              <div style=\"display:flex;gap:14px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:9px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.7;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">No Konductor account.<\u002Fstrong> There is nothing to sign up for and no licence key.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:14px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:9px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.7;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">Your runtime needs its own authentication.<\u002Fstrong> Claude Code requires you to be signed in; Kiro CLI requires whatever your organisation configures.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:14px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:9px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.7;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">No administrator privileges.<\u002Fstrong> The CLI writes only to your project directory (<span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">.konductor/<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">dist/<\u002Fspan>), your home directory (<span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">~/.konductor/<\u002Fspan>), and your runtime's own configuration directory.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:14px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:9px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.7;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">AWS credentials are optional<\u002Fstrong> — needed only for the AWS documentation integration below.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"p-integrations\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Optional integrations<\u002Fh2>\n            <p style=\"margin:0 0 22px;font-size:16px;line-height:1.75;color:var(--mu)\">Four agents can use external tool servers. Two are pre-configured and need only a local dependency; two are opt-in and need an account.<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:22px\">\n              <div style=\"display:grid;grid-template-columns:1.1fr 1fr .7fr 1.6fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\">\n                <div style=\"padding:11px 16px\">AGENT<\u002Fdiv><div style=\"padding:11px 16px\">INTEGRATION<\u002Fdiv><div style=\"padding:11px 16px\">PRE-CONFIGURED<\u002Fdiv><div style=\"padding:11px 16px\">WHAT YOU NEED<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1.1fr 1fr .7fr 1.6fr;border-bottom:1px solid var(--bd)\">\n                <div style=\"padding:13px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">asdlc-architect<br>asdlc-developer<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-size:14px;line-height:1.5;color:var(--mu)\">AWS documentation and region/service lookups<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--sig)\">YES<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-size:14px;line-height:1.5;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">uvx<\u002Fspan> installed, plus AWS credentials in <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">~/.aws/credentials<\u002Fspan> or environment variables. Both agents work without credentials, just without AWS lookups.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1.1fr 1fr .7fr 1.6fr;border-bottom:1px solid var(--bd)\">\n                <div style=\"padding:13px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">asdlc-browser<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-size:14px;line-height:1.5;color:var(--mu)\">Playwright browser automation<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--sig)\">YES<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-size:14px;line-height:1.5;color:var(--mu)\">The Chromium binary<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1.1fr 1fr .7fr 1.6fr;border-bottom:1px solid var(--bd)\">\n                <div style=\"padding:13px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">asdlc-researcher<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-size:14px;line-height:1.5;color:var(--mu)\">Slack search<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mu2)\">OPT-IN<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-size:14px;line-height:1.5;color:var(--mu)\">Your own Slack app. See the Slack integration guide.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1.1fr 1fr .7fr 1.6fr\">\n                <div style=\"padding:13px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">asdlc-product-manager<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-size:14px;line-height:1.5;color:var(--mu)\">Asana sprint planning<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mu2)\">OPT-IN<\u002Fdiv>\n                <div style=\"padding:13px 16px;font-size:14px;line-height:1.5;color:var(--mu)\">An Asana OAuth2 app. See the Asana integration guide.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Install the Chromium binary if you plan to use <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-browser<\u002Fspan>:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:20px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">npx playwright install chromium<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">For Claude Code specifically, the AWS and Playwright integrations need an MCP server configured on your side — the agents request the tools but do not launch the servers. Detail in <a href=\"#/install-claude\">Install for Claude Code<\u002Fa>.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"p-not\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\">What you do <em>not<\u002Fem> need<\u002Fh2>\n            <p style=\"margin:0 0 22px;font-size:16px;line-height:1.75;color:var(--mu)\">Worth stating, because it is unusual:<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px\">\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\">\n                <div style=\"font-size:15.5px;font-weight:600;margin-bottom:7px\">No servers or infrastructure<\u002Fdiv>\n                <div style=\"font-size:14px;line-height:1.6;color:var(--mu)\">Agents are configuration files your runtime executes.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\">\n                <div style=\"font-size:15.5px;font-weight:600;margin-bottom:7px\">No database<\u002Fdiv>\n                <div style=\"font-size:14px;line-height:1.6;color:var(--mu)\">Nothing persists except plain files you can read.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\">\n                <div style=\"font-size:15.5px;font-weight:600;margin-bottom:7px\">No build toolchain<\u002Fdiv>\n                <div style=\"font-size:14px;line-height:1.6;color:var(--mu)\">You download the CLI as a binary. Rust is needed only if you want to build it yourself.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\">\n                <div style=\"font-size:15.5px;font-weight:600;margin-bottom:7px\">No network access at run time for the CLI<\u002Fdiv>\n                <div style=\"font-size:14px;line-height:1.6;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">init<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">config<\u002Fspan>, and <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">synth<\u002Fspan> touch only the local filesystem. <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">install<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">update<\u002Fspan>, and <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">doctor<\u002Fspan> reach the release endpoint.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"p-checkpoint\" style=\"border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Checkpoint<\u002Fh2>\n            <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:20px 22px\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--sig);margin-bottom:12px\">AT LEAST ONE SHOULD PRINT A VERSION<\u002Fdiv>\n              <pre style=\"margin:0 0 8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\">kiro-cli --version<\u002Fpre>\n              <pre style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\">claude --version<\u002Fpre>\n              <p style=\"margin:14px 0 0;font-size:14.5px;line-height:1.6;color:var(--mu)\">If neither works, install a runtime first — nothing else in this guide will succeed without one.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n            <button sc-camel-on-click=\"{{ goConcepts }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Core concepts<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goQuick }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: Quick Start →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <div style=\"width:196px;flex:0 0 196px;padding-top:72px\">\n          <div style=\"position:sticky;top:24px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--bd);padding-left:18px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;color:var(--mu2)\">ON THIS PAGE<\u002Fdiv>\n            <a href=\"#p-essentials\" style=\"font-size:13px;color:var(--mu)\">The essentials<\u002Fa>\n            <a href=\"#p-platforms\" style=\"font-size:13px;color:var(--mu)\">Supported platforms<\u002Fa>\n            <a href=\"#p-accounts\" style=\"font-size:13px;color:var(--mu)\">Accounts and permissions<\u002Fa>\n            <a href=\"#p-integrations\" style=\"font-size:13px;color:var(--mu)\">Optional integrations<\u002Fa>\n            <a href=\"#p-not\" style=\"font-size:13px;color:var(--mu)\">What you do not need<\u002Fa>\n            <a href=\"#p-checkpoint\" style=\"font-size:13px;color:var(--mu)\">Checkpoint<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.tasks }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:1000px;margin:0 auto;padding:64px 56px 96px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">GUIDE / TASK GUIDES<\u002Fdiv>\n        <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Task guides<\u002Fh1>\n        <p style=\"margin:0 0 36px;font-size:19px;line-height:1.5;color:var(--mu);max-width:64ch\">One page per real task. Each gives numbered steps, the expected output after each command, and a checkpoint so you know whether it worked. Where behaviour differs between a fresh install and an existing one, the page says so.<\u002Fp>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:48px\">\n          <sc-for list=\"{{ taskCards }}\" as=\"t\" hint-placeholder-count=\"7\">\n            <button sc-camel-on-click=\"{{ t.go }}\" style=\"all:unset;cursor:pointer;border:1px solid var(--bd);border-radius:14px;background:var(--surf);padding:20px 22px;display:flex;flex-direction:column;gap:9px\" style-hover=\"border-color:var(--vi);background:rgba(124,92,255,.08)\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--vi)\">{{ t.n }}<\u002Fspan>\n              <span style=\"font-size:17px;font-weight:600;letter-spacing:-.015em\">{{ t.title }}<\u002Fspan>\n              <span style=\"font-size:14px;line-height:1.6;color:var(--mu)\">{{ t.what }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"border-top:1px solid var(--bd);padding-top:36px\">\n          <h2 style=\"margin:0 0 8px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Which task do I want?<\u002Fh2>\n          <p style=\"margin:0 0 28px;font-size:16px;line-height:1.75;color:var(--mu)\">Routing to the right task guide.<\u002Fp>\n          <div style=\"border:1px solid var(--bd);border-radius:18px;background:radial-gradient(120% 140% at 15% 0%,rgba(124,92,255,.1),transparent 60%),var(--bg2);padding:32px 30px;display:flex;flex-direction:column;gap:0\">\n            <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n              <span style=\"border:1px solid var(--bd2);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600\">What are you trying to do?<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu2)\">first time?<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;padding-top:22px\">\n              <div style=\"border:1px solid rgba(124,92,255,.4);border-radius:14px;background:rgba(124,92,255,.06);padding:20px 22px;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--lav)\">YES — FIRST TIME<\u002Fdiv>\n                <div style=\"font-size:14px;color:var(--mu)\">Which runtime?<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <button sc-camel-on-click=\"{{ goInstallKiro }}\" style=\"all:unset;cursor:pointer;border:1px solid var(--bd2);border-radius:9px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx)\" style-hover=\"border-color:var(--vi);color:var(--vi)\">Kiro CLI → install-kiro-cli<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ goInstallClaude }}\" style=\"all:unset;cursor:pointer;border:1px solid var(--bd2);border-radius:9px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx)\" style-hover=\"border-color:var(--vi);color:var(--vi)\">Claude Code → install-claude-code<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu2)\"><span>↓ then<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <button sc-camel-on-click=\"{{ goInit }}\" style=\"all:unset;cursor:pointer;border:1px solid var(--bd2);border-radius:9px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx)\" style-hover=\"border-color:var(--vi);color:var(--vi)\">initialize-a-project<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ goConfig }}\" style=\"all:unset;cursor:pointer;border:1px solid var(--bd2);border-radius:9px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx)\" style-hover=\"border-color:var(--vi);color:var(--vi)\">manage-configuration<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid rgba(255,107,107,.35);border-radius:14px;background:rgba(255,107,107,.05);padding:20px 22px;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:#FF8B8B\">NO — SOMETHING IS BROKEN<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <button sc-camel-on-click=\"{{ goDiagnose }}\" style=\"all:unset;cursor:pointer;border:1px solid var(--bd2);border-radius:9px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx)\" style-hover=\"border-color:var(--vi);color:var(--vi)\">diagnose-problems<\u002Fbutton>\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu2);padding-left:4px\">↓<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ goTrouble }}\" style=\"all:unset;cursor:pointer;border:1px solid var(--bd2);border-radius:9px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx)\" style-hover=\"border-color:var(--vi);color:var(--vi)\">troubleshooting<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--bd2);border-radius:14px;background:var(--surf);padding:20px 22px;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--mu2)\">NO — MANAGING AN INSTALL<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <button sc-camel-on-click=\"{{ goUpdate }}\" style=\"all:unset;cursor:pointer;border:1px solid var(--bd2);border-radius:9px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx)\" style-hover=\"border-color:var(--vi);color:var(--vi)\">Update → update<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ goUninstall }}\" style=\"all:unset;cursor:pointer;border:1px solid var(--bd2);border-radius:9px;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx)\" style-hover=\"border-color:var(--vi);color:var(--vi)\">Remove → uninstall<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:26px 0 0;font-size:16px;line-height:1.75;color:var(--mu)\">Looking to change how the agents behave, or build the CLI yourself? That is <a href=\"#/contributing\">Contributing and customizing<\u002Fa>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.installKiro }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:0 56px 96px;gap:48px\">\n        <article style=\"flex:1 1 520px;min-width:0;padding-top:64px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">TASK GUIDES / INSTALL FOR KIRO CLI<\u002Fdiv>\n          <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Install for Kiro CLI<\u002Fh1>\n          <p style=\"margin:0 0 24px;font-size:19px;line-height:1.5;color:var(--mu)\">Registers the 11 agents, 75 skills, 13 SOPs, and the orchestrator routing rules with <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--tx)\">kiro-cli<\u002Fspan>.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:40px\">\n            <div style=\"padding:12px 18px;border-right:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu)\">TIME · <span style=\"color:var(--tx)\">~2 min<\u002Fspan><\u002Fdiv>\n            <div style=\"padding:12px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu)\">RUNTIME · <span style=\"color:var(--tx)\">Kiro CLI<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n\n          <section id=\"ik-prereq\" style=\"padding-bottom:44px\">\n            <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Prerequisites<\u002Fh2>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden\">\n              <div style=\"display:grid;grid-template-columns:1.4fr 1fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">REQUIREMENT<\u002Fdiv><div style=\"padding:11px 16px\">VERIFY WITH<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1.4fr 1fr;border-bottom:1px solid var(--bd);font-size:14.5px\"><div style=\"padding:12px 16px\">Kiro CLI installed<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--lav)\">kiro-cli --version<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1.4fr 1fr;border-bottom:1px solid var(--bd);font-size:14.5px\"><div style=\"padding:12px 16px\">Git on your PATH<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--lav)\">git --version<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1.4fr 1fr;font-size:14.5px\"><div style=\"padding:12px 16px\">The Konductor CLI — see <a href=\"#/quick\">Quick Start step 1<\u002Fa><\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--lav)\">konductor --version<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"ik-steps\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 26px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Steps<\u002Fh2>\n\n            <h3 style=\"margin:0 0 14px;font-size:22px;font-weight:600;letter-spacing:-.02em\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--vi);margin-right:10px\">01<\u002Fspan>Install<\u002Fh3>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor install<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:18px\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">OUTPUT<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:var(--mu);overflow-x:auto\">Detected runtime: Kiro CLI\n\nInstalling Konductor 0.1.0\n  agents          11 registered\n  skills          75 registered\n  SOPs            13 registered\n  context files    1 registered\n\nInstalled. Start a session with:\n  kiro-cli chat --agent asdlc-orchestrator<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">install<\u002Fspan> detects the runtime for you. To install into a specific repository rather than the current directory:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:34px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor install --local /path/to/your-project<\u002Fpre>\n            <\u002Fdiv>\n\n            <h3 style=\"margin:0 0 14px;font-size:22px;font-weight:600;letter-spacing:-.02em\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--vi);margin-right:10px\">02<\u002Fspan>Verify<\u002Fh3>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor doctor<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:14px\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">OUTPUT<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.75;color:var(--mu);overflow-x:auto\">Runtime\n  Kiro CLI                     detected (0.4.2)              ok\nContent\n  agents                       11 registered                 ok\n  skills                       75 registered                 ok\n  SOPs                         13 registered                 ok\n  context files                 1 registered                 ok\nUpdates\n  installed 0.1.0, latest 0.1.0                              ok\n\nAll checks passed.<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 34px;font-size:16px;line-height:1.75;color:var(--mu)\">Exit code <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">0<\u002Fspan>.<\u002Fp>\n\n            <h3 style=\"margin:0 0 14px;font-size:22px;font-weight:600;letter-spacing:-.02em\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--vi);margin-right:10px\">03<\u002Fspan>Start a session<\u002Fh3>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">kiro-cli chat --agent asdlc-orchestrator<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 34px;font-size:16px;line-height:1.75;color:var(--mu)\">Agent names have <strong style=\"color:var(--tx);font-weight:600\">no prefix<\u002Fstrong> in Kiro CLI — it is exactly <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-orchestrator<\u002Fspan>. (Claude Code differs; see <a href=\"#/install-claude\">Install for Claude Code<\u002Fa>.)<\u002Fp>\n\n            <h3 style=\"margin:0 0 14px;font-size:22px;font-weight:600;letter-spacing:-.02em\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--vi);margin-right:10px\">04<\u002Fspan>Confirm the agent is really the orchestrator<\u002Fh3>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\">Ask a question about orchestration itself. Those are answered directly rather than delegated:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--bg2);margin-bottom:16px;padding:15px 17px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> What agents do you have available?<\u002Fdiv>\n            <p style=\"margin:0 0 34px;font-size:16px;line-height:1.75;color:var(--mu)\">You should get a list of <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-*<\u002Fspan> specialists: developer, architect, quality-assurance, researcher, tpm, product-manager, browser, media-analyzer.<\u002Fp>\n\n            <h3 style=\"margin:0 0 14px;font-size:22px;font-weight:600;letter-spacing:-.02em\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--vi);margin-right:10px\">05<\u002Fspan>Give it a real task<\u002Fh3>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--bg2);margin-bottom:16px;padding:15px 17px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> Run the k-code-review-workflow SOP against my current branch.<\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">The orchestrator routes this to <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-developer<\u002Fspan>, which is the agent that declares that SOP.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"ik-success\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600\">What success looks like<\u002Fh2>\n            <div style=\"display:flex;flex-direction:column;gap:11px;margin-bottom:20px\">\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">konductor doctor<\u002Fspan> reports all checks ok and exits <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">0<\u002Fspan>.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">kiro-cli chat --agent asdlc-orchestrator<\u002Fspan> starts a session without an \"agent not found\" error.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\">Asking \"what agents do you have available?\" lists <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-*<\u002Fspan> specialists.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\">Giving it implementation work produces a <strong style=\"color:var(--tx);font-weight:600\">delegation<\u002Fstrong> to a specialist, not the orchestrator doing the work itself.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px solid rgba(167,139,250,.35);border-radius:12px;background:rgba(124,92,255,.07);padding:18px 20px;font-size:15px;line-height:1.65;color:var(--mu)\">That last point is the real signal. The orchestrator is read-only by design: it cannot write files or run shell commands in either runtime. If it starts editing files directly, its routing rules did not load — see <a href=\"#/troubleshooting\">Troubleshooting<\u002Fa>.<\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"ik-state\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Behaviour differs by state<\u002Fh2>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden\">\n              <div style=\"display:grid;grid-template-columns:1fr 1.9fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">STATE<\u002Fdiv><div style=\"padding:11px 16px\">WHAT HAPPENS<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1.9fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-size:14.5px;font-weight:600\">Fresh install<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Registers all 11 agents and their dependencies, and reports the counts.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1.9fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-size:14.5px;font-weight:600\">Already installed, same version<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Reports that the installed version is current and makes no changes.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1.9fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-size:14.5px;font-weight:600\">Already installed, older version<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Tells you a newer release is available and to run <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">konductor update<\u002Fspan>.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1.9fr\"><div style=\"padding:12px 16px;font-size:14.5px;font-weight:600\">Locally modified content<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Left untouched by <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">install<\u002Fspan>. <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">update<\u002Fspan> preserves local modifications and names the files it skipped.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"ik-which\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Which agent to invoke<\u002Fh2>\n            <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">Start with the orchestrator and let it route. Invoke a specialist directly only when you know exactly which workflow you want — see <a href=\"#/sops\">which agent owns which SOP<\u002Fa>.<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:24px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">kiro-cli chat --agent asdlc-architect<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">Choosing among the three orchestrators:<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px\">\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav);margin-bottom:9px\">asdlc-orchestrator<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;color:var(--mu)\">Default. Specialists run as background subagents in your session.<\u002Fdiv><\u002Fdiv>\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav);margin-bottom:9px\">asdlc-mux-orchestrator<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;color:var(--mu)\">You want each specialist in its own visible terminal pane, and you use tmux or zellij. It auto-detects which is active.<\u002Fdiv><\u002Fdiv>\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav);margin-bottom:9px\">asdlc-cmux-orchestrator<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;color:var(--mu)\">You use cmux and want specialists in parallel cmux surfaces.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"ik-integrations\" style=\"border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Optional integrations<\u002Fh2>\n            <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">Two are pre-configured in the agent specs and need only their local dependency.<\u002Fp>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">AWS documentation lookups<\u002Fstrong> — <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-architect<\u002Fspan> and <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-developer<\u002Fspan>. Install <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">uvx<\u002Fspan> and configure AWS credentials in <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">~/.aws/credentials<\u002Fspan> or environment variables. Both agents work without credentials, just without AWS lookups.<\u002Fp>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">Browser automation<\u002Fstrong> — <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-browser<\u002Fspan>. Install the browser binary:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:18px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">npx playwright install chromium<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">Two more are opt-in: Slack search for <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-researcher<\u002Fspan>, and Asana sprint planning for <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-product-manager<\u002Fspan>.<\u002Fp>\n          <\u002Fsection>\n\n          <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n            <button sc-camel-on-click=\"{{ goTasksIndex }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Task guides<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goInstallClaude }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: Install for Claude Code →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <div style=\"width:196px;flex:0 0 196px;padding-top:72px\">\n          <div style=\"position:sticky;top:24px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--bd);padding-left:18px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;color:var(--mu2)\">ON THIS PAGE<\u002Fdiv>\n            <a href=\"#ik-prereq\" style=\"font-size:13px;color:var(--mu)\">Prerequisites<\u002Fa>\n            <a href=\"#ik-steps\" style=\"font-size:13px;color:var(--mu)\">Steps<\u002Fa>\n            <a href=\"#ik-success\" style=\"font-size:13px;color:var(--mu)\">What success looks like<\u002Fa>\n            <a href=\"#ik-state\" style=\"font-size:13px;color:var(--mu)\">Behaviour by state<\u002Fa>\n            <a href=\"#ik-which\" style=\"font-size:13px;color:var(--mu)\">Which agent to invoke<\u002Fa>\n            <a href=\"#ik-integrations\" style=\"font-size:13px;color:var(--mu)\">Optional integrations<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.installClaude }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:0 56px 96px;gap:48px\">\n        <article style=\"flex:1 1 520px;min-width:0;padding-top:64px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">TASK GUIDES / INSTALL FOR CLAUDE CODE<\u002Fdiv>\n          <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Install for Claude Code<\u002Fh1>\n          <p style=\"margin:0 0 24px;font-size:19px;line-height:1.5;color:var(--mu)\">Registers the agent team with <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--tx)\">claude<\u002Fspan>, and configures the two settings Claude Code requires before a team of agents can actually do anything.<\u002Fp>\n          <div style=\"border:1px solid rgba(167,139,250,.35);border-radius:12px;background:rgba(124,92,255,.07);padding:16px 18px;margin-bottom:40px;font-size:15px;line-height:1.65;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--lav);display:block;margin-bottom:8px\">TIME · ~5 MIN<\u002Fspan>Longer than Kiro CLI, because agent teams are an experimental Claude Code feature that has to be switched on and given tool permissions.<\u002Fdiv>\n\n          <section id=\"ic-prereq\" style=\"padding-bottom:44px\">\n            <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Prerequisites<\u002Fh2>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden\">\n              <div style=\"display:grid;grid-template-columns:1.3fr .9fr 1.1fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">REQUIREMENT<\u002Fdiv><div style=\"padding:11px 16px\">VERIFY WITH<\u002Fdiv><div style=\"padding:11px 16px\">NOTES<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1.3fr .9fr 1.1fr;border-bottom:1px solid var(--bd);font-size:14.5px\"><div style=\"padding:12px 16px\">Claude Code installed and authenticated<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--lav)\">claude --version<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;color:var(--mu)\">Agent teams need <strong style=\"color:var(--tx);font-weight:600\">v2.1.178 or later<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1.3fr .9fr 1.1fr;border-bottom:1px solid var(--bd);font-size:14.5px\"><div style=\"padding:12px 16px\">Git on your PATH<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--lav)\">git --version<\u002Fdiv><div style=\"padding:12px 16px;color:var(--mu2)\">—<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1.3fr .9fr 1.1fr;font-size:14.5px\"><div style=\"padding:12px 16px\">The Konductor CLI<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--lav)\">konductor --version<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;color:var(--mu)\">See <a href=\"#/quick\">Quick Start step 1<\u002Fa><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"ic-install\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 22px;font-size:30px;letter-spacing:-.025em;font-weight:600\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--vi);margin-right:12px\">01<\u002Fspan>Install<\u002Fh2>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor install<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:18px\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">OUTPUT<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:var(--mu);overflow-x:auto\">Detected runtime: Claude Code\n\nInstalling Konductor 0.1.0\n  agents          11 registered\n  skills          75 registered\n  SOPs            13 registered\n  context files    1 registered\n\nInstalled. Two more settings are required before teammates can run —\nsee 'Enable agent teams' and 'Grant tool permissions'.\n\n  claude --agent ASDLCCoreAICapabilities-asdlc-orchestrator<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\">Agent files land in <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">~/.claude/agents/<\u002Fspan>:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:18px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">ls ~/.claude/agents<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">Each agent's Claude Code configuration comes from its spec's <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">clientConfig.claudeCli<\u002Fspan> block, which declares the Claude Code tool names it may use and the skills it may load.<\u002Fp>\n            <div style=\"border:1px solid rgba(255,107,107,.4);border-radius:12px;background:rgba(255,107,107,.06);padding:18px 20px;font-size:15px;line-height:1.65;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:#FF8B8B;display:block;margin-bottom:8px\">READ THIS BEFORE STEP 2<\u002Fspan>Neither of the next two settings is on by default, and <strong style=\"color:var(--tx);font-weight:600\">each fails quietly without the other<\u002Fstrong>. Configure both.<\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"ic-teams\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--vi);margin-right:12px\">02<\u002Fspan>Enable agent-teams mode<\u002Fh2>\n            <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Without this, the orchestrator cannot spawn specialists at all.<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">claude settings set env.CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS 1<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Or edit <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">~/.claude/settings.json<\u002Fspan> by hand:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">JSON<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:#E8E4F5;overflow-x:auto\">{\n  \"env\": {\n    \"CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS\": \"1\"\n  }\n}<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">Start a <strong style=\"color:var(--tx);font-weight:600\">new<\u002Fstrong> session afterwards — it is read at startup.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"ic-perms\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--vi);margin-right:12px\">03<\u002Fspan>Grant tool permissions<\u002Fh2>\n            <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">This step is not optional. Background subagents cannot prompt you interactively, so <strong style=\"color:var(--tx);font-weight:600\">any tool not in <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px\">permissions.allow<\u002Fspan> is silently auto-denied<\u002Fstrong> — no error, no prompt, the specialist simply cannot do its job.<\u002Fp>\n            <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Add a <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">permissions.allow<\u002Fspan> block to <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">~/.claude/settings.json<\u002Fspan>:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:18px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">JSON<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:#E8E4F5;overflow-x:auto\">{\n  \"permissions\": {\n    \"allow\": [\n      \"Read\",\n      \"Edit\",\n      \"Write\",\n      \"Glob\",\n      \"Grep\",\n      \"TodoWrite\",\n      \"Bash(git status*)\",\n      \"Bash(git diff*)\",\n      \"Bash(git log*)\",\n      \"Bash(git blame*)\",\n      \"Bash(git show*)\",\n      \"Bash(git add*)\",\n      \"Bash(git commit*)\",\n      \"Bash(git branch*)\",\n      \"Bash(git checkout*)\",\n      \"Bash(git switch*)\",\n      \"Bash(git stash*)\",\n      \"Bash(git fetch*)\",\n      \"Bash(git rebase*)\",\n      \"Bash(npm *)\",\n      \"Bash(ls *)\",\n      \"Bash(find *)\",\n      \"Bash(grep *)\"\n    ]\n  }\n}<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">Permissions are <strong style=\"color:var(--tx);font-weight:600\">team-level<\u002Fstrong>: they apply to every agent in the team, not per agent.<\u002Fp>\n            <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">What is deliberately <em>absent<\u002Fem>, and why:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:20px\">\n              <div style=\"display:grid;grid-template-columns:1fr 1.7fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">NOT ALLOWED<\u002Fdiv><div style=\"padding:11px 16px\">REASON<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1.7fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#FF8B8B\">git push · git reset · git clean<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Agents commit locally. Pushing to remotes and destructive history rewrites should require a human action.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1.7fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#FF8B8B\">rm · sudo · curl · unscoped sh/bash<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Arbitrary destructive or network commands.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1.7fr\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#FF8B8B\">aws<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Cloud mutations.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:18px 20px;font-size:15px;line-height:1.65;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--sig);display:block;margin-bottom:8px\">WORTH A SECOND LOOK<\u002Fspan>Two entries in the allowlist deserve scrutiny before you accept them: <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">Bash(npm *)<\u002Fspan> runs arbitrary package lifecycle scripts, and <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">Bash(find *)<\u002Fspan> supports <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">-exec<\u002Fspan>. Neither is
