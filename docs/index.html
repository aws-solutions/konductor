, false, \"cleanup-report.md\")],\n        flow: [\n          node(\"00\", \"source_dir provided?\", \"If not, the SOP asks for it and waits.\", \"gate\"),\n          node(\"01\", \"Diff branch against main or mainline\", \"Lists only files within source_dir; skips binaries, lock files, and build artifacts.\", \"\"),\n          node(\"02\", \"Identify AI slop\", \"FLAG: comments restating code, defensive checks duplicating existing validation, \\\"as any\\\" casts, style inconsistent with surroundings, over-abstraction adding no value. DO NOT FLAG: TODO comments, error handling and catch blocks, comments explaining why.\", \"\"),\n          node(\"03\", \"Apply cleanup — MODIFIES FILES\", \"Only the step 2 findings. Preserves intentional comments, logging, and error handling; never alters control flow, return values, or function signatures.\", \"stop\"),\n          node(\"04\", \"Run review skills on the cleaned code\", \"backend-review on .ts / .js service and handler files; frontend-review on .tsx / .jsx and .ts in component / page / hook paths; file types with no matching skill are skipped.\", \"\"),\n          node(\"05\", \"Write output_file\", \"Sections: Removed Items · Preserved Items · Review Findings, with counts removed per category and any CRITICAL / IMPORTANT findings included.\", \"good\")\n        ],\n        flowCaption: \"k-code-cleanup: the only SOP here that edits your files — step 3 is marked for that reason.\",\n        extraTitle: \"REMOVED VS PRESERVED\",\n        extraRows: [\n          { k: \"Removed\", v: \"Comments that merely restate the code · defensive checks duplicating existing validation · as any casts · style inconsistent with surrounding code · over-abstraction, wrappers adding no value\" },\n          { k: \"Preserved\", v: \"TODO comments · error handling and catch blocks · comments explaining why (business rationale) · logging\" }\n        ],\n        know: [\n          { title: \"No logic or behavior changes.\", body: \"Step 2 forbids changing logic; step 3 forbids altering control flow, return values, or function signatures. Only the step 2 findings are touched.\" },\n          { title: \"It only cleans files inside source_dir\", body: \"that appear in the diff.\" },\n          { title: \"Review your diff afterwards.\", body: \"git diff before committing is the right habit — the SOP presents before/after diffs, but the changes are already applied.\" }\n        ] }\n    ]\n  },\n  \"sop-test\": {\n    eyebrow: \"TESTING, CODEBASE ANALYSIS, SPECS\", title: \"Testing, codebase analysis, and specs\",\n    intro: \"The remaining three SOPs: a QA chain that ends in a release recommendation, a standalone architecture deep-dive, and the most interactive SOP in the package — three approval gates in a row.\",\n    prev: [\"sop-code\", \"Code review and cleanup\"], next: [\"agents\", \"Agents reference\"],\n    sops: [\n      { name: \"k-test-coverage-review\", file: \"agent-sops/k-test-coverage-review.sop.md\", owner: \"asdlc-quality-assurance\",\n        what: \"Runs three QA skills in sequence — coverage gap analysis, E2E test strategy, security test plan generation — and writes four files, ending in a READY / NOT READY release recommendation.\",\n        when: \"After implementation is complete and before release.\",\n        get: \"Four files in test-coverage-review/ (or your output_dir): test-gap-analysis.md, e2e-test-strategy.md, security-test-plan.md, and test-coverage-review-report.md. The consolidated report ends with READY FOR RELEASE or NOT READY — reason, followed by a prioritized Next Steps list.\",\n        prompt: \"Run the k-test-coverage-review SOP. source_dir: src/  test_dir: test/\",\n        params: [param(\"source_dir\", true, \"— e.g. src/\"), param(\"test_dir\", true, \"— e.g. test/ or __tests__/\"), param(\"stories_file\", false, \"none — user stories or acceptance criteria, used to map tests to criteria\"), param(\"design_file\", false, \"none — system design doc, used for security threat context\"), param(\"output_dir\", false, \"test-coverage-review/\"), param(\"dry_run\", false, \"false\")],\n        flow: [\n          node(\"00\", \"source_dir AND test_dir provided?\", \"Missing required parameters are requested in a single prompt using their exact names.\", \"gate\"),\n          node(\"01\", \"Both directories exist?\", \"If not, the SOP stops rather than proceeding.\", \"stop\"),\n          node(\"02\", \"Discover files\", \"Source: .ts .tsx .js .jsx .py; tests: .test.ts .spec.ts .test.tsx .test.py. Reports counts and the test-to-source ratio, and identifies source files with no test file.\", \"\"),\n          node(\"03\", \"test-coverage-analysis\", \"Unit, integration and E2E coverage, mapped to acceptance criteria if stories_file was given. Severity: CRITICAL (core journeys untested) / IMPORTANT (error paths) / SUGGESTION (edge cases) → output_dir/test-gap-analysis.md.\", \"\"),\n          node(\"04\", \"Confirm scope\", \"Shows gap counts by severity, then asks \\\"Plan E2E tests for these gaps? [y/n]\\\" — it will not proceed without your answer.\", \"gate\"),\n          node(\"05\", \"dry_run exit\", \"With dry_run: true, it reports what would be planned and stops here, generating nothing further.\", \"skip\"),\n          node(\"06\", \"e2e-test-strategy\", \"Input is step 3's gap analysis. Priority P0 critical path · P1 core features · P2 edge cases · P3 nice-to-have, with a recommended sequential / parallel / hybrid execution strategy → output_dir/e2e-test-strategy.md.\", \"\"),\n          node(\"07\", \"security-test-generation\", \"Uses design_file for threat context if given. All 7 domains — authentication, input validation, API security, data protection, session management, error handling, infrastructure — organized by layer (frontend / backend / infra) → output_dir/security-test-plan.md.\", \"\"),\n          node(\"08\", \"Consolidated report and recommendation\", \"Writes output_dir/test-coverage-review-report.md, never printed inline, then: READY FOR RELEASE, or NOT READY with the critical gaps that must be addressed — and it may offer to spawn asdlc-developer to implement the missing tests.\", \"good\")\n        ],\n        flowCaption: \"k-test-coverage-review: three skills in sequence, with a confirmation gate between the first and second.\",\n        extraTitle: \"THE FOUR OUTPUT FILES\",\n        extraRows: [\n          { k: \"test-gap-analysis.md\", v: \"Coverage analysis and gaps prioritized by severity\" },\n          { k: \"e2e-test-strategy.md\", v: \"Prioritized P0–P3 test matrix and execution strategy\" },\n          { k: \"security-test-plan.md\", v: \"Security tests by domain and by layer\" },\n          { k: \"test-coverage-review-report.md\", v: \"The consolidated summary and recommendation\" }\n        ],\n        know: [\n          { title: \"The confirmation gate at step 4 is real\", body: \"— it will not plan E2E tests without your y. And dry_run: true stops there, reporting what it would analyze and generating no files.\" },\n          { title: \"Non-existent directories abort the SOP.\", body: \"It will not proceed if source_dir or test_dir is missing.\" },\n          { title: \"Supply design_file if you can.\", body: \"The SOP's troubleshooting notes that without it, the security test generator infers services from code rather than from the actual architecture, and may reference services that do not exist.\" },\n          { title: \"CRITICAL gaps come first.\", body: \"The troubleshooting section advises prioritizing core user journeys, then P0 E2E tests and authentication security tests; SUGGESTION-level gaps can be deferred.\" }\n        ] },\n      { name: \"asdlc-codebase-analysis\", file: \"agent-sops/asdlc-codebase-analysis.sop.md\", owner: \"asdlc-developer\",\n        what: \"A deep-dive architectural assessment written incrementally to one Markdown file: codebase map, architecture, SOLID evaluation, design patterns, dependencies, code quality, security and performance, and technical debt — each with Mermaid diagrams where structural.\",\n        when: \"Joining an unfamiliar codebase, before major refactoring, during an architecture review, or when assessing technical debt. This is not the same as asdlc-analyze: that one is pre-implementation context gathering across research agents, this one produces a comprehensive standalone reference document.\",\n        get: \"codebase-analysis.md (or your output_file) with an executive summary, the analysis sections you selected — three of them carrying Mermaid diagrams — and a P0/P1/P2 prioritized recommendations list. P0: fix immediately (security issues, critical bugs, blocking debt). P1: fix this quarter (architectural improvements, medium debt). P2: fix when convenient (cosmetic, low-severity debt).\",\n        prompt: \"Run asdlc-codebase-analysis with focus_areas=architecture,dependencies\",\n        params: [param(\"codebase_path\", false, \"current directory\"), param(\"output_file\", false, \"codebase-analysis.md\"), param(\"focus_areas\", false, \"all — comma-separated: architecture, solid, patterns, dependencies, security, performance, testing, debt\")],\n        flow: [\n          node(\"01\", \"Resolve parameters\", \"Resolves codebase_path to absolute, verifies it exists and has source files, validates each focus_areas value, and creates output_file with a header to enable incremental writes. It must not prompt for optional parameters.\", \"\"),\n          node(\"02\", \"Path exists and contains source files?\", \"If not, the SOP stops.\", \"stop\"),\n          node(\"03\", \"Build codebase map\", \"Directory tree, languages by extension count, frameworks from manifests, entry points, build system, plus a Mermaid module-structure diagram. Never traverses node_modules, .git, build, dist, target.\", \"\"),\n          node(\"04\", \"Select sections\", \"focus_areas = all runs steps 3–9; otherwise only the mapped steps run and the rest are skipped.\", \"decision\"),\n          node(\"05\", \"Steps 3–9, each appended to output_file\", \"Architecture (style, layer boundaries, dependency direction + a component dependency diagram) · SOLID (all five, rated with a real code example each — never fabricated) · design patterns (creational, structural, behavioral, architectural — never force-fit) · dependencies and integrations (outdated deps, circular deps, undocumented API contracts + an integration diagram) · code quality (error handling, logging, testing strategy — static analysis only) · security and performance (input validation, auth, hardcoded secrets, N+1 queries, unbounded loops, pagination, caching) · technical debt (TODO/FIXME/HACK/XXX, dead code, duplication, missing abstractions, config drift, outdated patterns, rated CRITICAL / IMPORTANT / SUGGESTION).\", \"\"),\n          node(\"06\", \"Generate report\", \"Executive summary in 3–5 sentences, recommendations prioritized P0 / P1 / P2, only the selected sections included. Reports the path plus the top three recommendations, and never prints the full report inline.\", \"good\")\n        ],\n        flowCaption: \"asdlc-codebase-analysis: ten steps, each appending to one file — the seven analysis sections are grouped here for readability.\",\n        extraTitle: \"FOCUS_AREAS TO STEP MAPPING — FROM THE SOP'S OWN TABLE\",\n        extraRows: [\n          { k: \"architecture\", v: \"3 — Architecture Analysis\" },\n          { k: \"solid\", v: \"4 — SOLID Principles Evaluation\" },\n          { k: \"patterns\", v: \"5 — Design Patterns Analysis\" },\n          { k: \"dependencies\", v: \"6 — Dependencies & Integrations\" },\n          { k: \"testing\", v: \"7 — Code Quality Assessment (not a step of its own)\" },\n          { k: \"security · performance\", v: \"8 — Security & Performance (both map to the same step)\" },\n          { k: \"debt\", v: \"9 — Technical Debt Assessment\" },\n          { k: \"all\", v: \"steps 2–9\" }\n        ],\n        know: [\n          { title: \"Writes are incremental.\", body: \"The output file is created with a header at step 1 and appended to as each section completes, so a run interrupted by context limits still leaves usable output. That is also the SOP's recommended remedy for a large codebase: run one focus area at a time and let findings accumulate across runs.\" },\n          { title: \"No code is executed, no examples fabricated, no patterns force-fit.\", body: \"Code quality and security are static analysis only; SOLID examples must reference code actually found; patterns are reported only where clearly present.\" },\n          { title: \"SOLID adapts to non-OOP codebases.\", body: \"Per its troubleshooting section: Single Responsibility applies to modules and functions, Open/Closed to extension points, Dependency Inversion to module boundaries — and the analysis notes when a principle is less applicable.\" },\n          { title: \"Pattern detection is heuristic.\", body: \"The SOP says so and asks you to verify against the file path reference when a pattern looks wrong.\" }\n        ] },\n      { name: \"kiro-spec-workflow\", file: \"agent-sops/kiro-spec-workflow.sop.md\", owner: \"all three orchestrators\",\n        what: \"Chains three skills in sequence — kiro-requirements-generation → kiro-design-generation → kiro-task-generation — to turn PM and design artifacts into a complete Kiro IDE spec directory, then validates traceability across the three documents.\",\n        when: \"When you want a .kiro/specs/<feature-name>/ directory containing requirements.md, design.md, and tasks.md ready for execution.\",\n        get: \".kiro/specs/<feature-name>/ containing requirements.md (EARS-format acceptance criteria), design.md (six-section per-feature low-level design), and tasks.md (Kiro IDE numbered task list with requirement references) — plus a traceability summary mapping each requirement to its design section and its task(s).\",\n        prompt: \"Run the kiro-spec-workflow SOP for feature_name=user-authentication\",\n        params: [param(\"feature_name\", true, \"— kebab-case, e.g. user-authentication\"), param(\"feature_scope_path\", true, \"— the feature-split file with this feature's scoped stories, components, and dependencies\"), param(\"user_stories_path\", true, \"— the full user stories file from the user-story-writing skill\"), param(\"design_artifacts_path\", true, \"— the design artifacts directory from the architect phase\"), param(\"output_dir\", false, \".kiro/specs/{feature_name}/\")],\n        flow: [\n          node(\"01\", \"kiro-requirements-generation\", \"Reads the feature scope to identify in-scope stories, reads the user stories and filters them to this feature, creates output_dir, and produces requirements.md with EARS acceptance criteria (WHEN / IF / WHILE … SHALL).\", \"\"),\n          node(\"02\", \"Approval gate — requirements.md\", \"Presented for your approval. Changes requested → revise and re-present, capped at 2 cycles.\", \"gate\"),\n          node(\"03\", \"kiro-design-generation\", \"Reads requirements.md plus the design artifacts and produces design.md with all six sections: Overview · Architecture · Components and Interfaces · Data Models · Error Handling · Testing Strategy. Every requirement must be addressed.\", \"\"),\n          node(\"04\", \"Optional UI mock\", \"If the feature is UI-facing and a UI-prototyping agent is available, it is spawned with the HLD or PRD URL to generate a Cloudscape mock UI, presented alongside design.md.\", \"skip\"),\n          node(\"05\", \"Approval gate — design.md\", \"Same 2-cycle revision cap.\", \"gate\"),\n          node(\"06\", \"kiro-task-generation\", \"Reads requirements.md and design.md and produces tasks.md in Kiro IDE format: numbered checkboxes, a maximum two-level hierarchy, requirement references, and at least one task per requirement.\", \"\"),\n          node(\"07\", \"Approval gate — tasks.md\", \"Same 2-cycle revision cap.\", \"gate\"),\n          node(\"08\", \"Validate spec completeness\", \"All three files exist in output_dir, every requirement is addressed in design.md, every requirement has at least one task — then presents the traceability summary: requirement → design section → task(s).\", \"good\")\n        ],\n        flowCaption: \"kiro-spec-workflow: three generation steps, each with its own approval gate and a 2-cycle revision cap, then a traceability check.\",\n        extraTitle: \"WHAT LANDS ON DISK\",\n        extraRows: [\n          { k: \".kiro/specs/<feature-name>/requirements.md\", v: \"EARS-format acceptance criteria\" },\n          { k: \".kiro/specs/<feature-name>/design.md\", v: \"Six-section per-feature low-level design\" },\n          { k: \".kiro/specs/<feature-name>/tasks.md\", v: \"Kiro IDE numbered task list with requirement references\" }\n        ],\n        know: [\n          { title: \"Three approval gates, not one.\", body: \"Each document is presented for your approval before the next one is generated. This is the most interactive SOP in the package, and revisions are capped at 2 cycles per document.\" },\n          { title: \"EARS format\", body: \"means the acceptance criteria use the WHEN / IF / WHILE … SHALL construction — a convention that keeps criteria testable.\" },\n          { title: \"Requirements are filtered by feature scope.\", body: \"Step 1 reads feature_scope_path first, then includes only the user stories mapped to that feature.\" },\n          { title: \"The SOP notes it writes files,\", body: \"so an agent without write tools delegates that to a specialist per its routing rules.\" }\n        ] }\n    ]\n  }\n};\nfunction sec(id, short, title, o) {\n  o = o || {};\n  return { id, short, title,\n    paras: (o.paras || []).map((t) => ({ text: t })),\n    quote: o.quote || \"\", code: o.code || \"\", codeLang: o.codeLang || \"BASH\",\n    rows: o.rows || [], hasRows: !!(o.rows && o.rows.length), h1: o.h1 || \"ITEM\", h2: o.h2 || \"DETAIL\",\n    bullets: (o.bullets || []).map((t) => ({ text: t })), hasBullets: !!(o.bullets && o.bullets.length),\n    note: o.note || \"\", warn: o.warn || \"\" };\n}\nconst REF_PAGES = {\n  faq: {\n    eyebrow: \"GUIDE / FAQ\", title: \"FAQ\",\n    intro: \"The questions people actually ask, answered against what the repository does today.\",\n    prev: [\"troubleshooting\", \"Troubleshooting\"], next: [\"glossary\", \"Glossary\"],\n    sections: [\n      sec(\"faq-get\", \"What you get on install\", \"What do I actually get when I install Konductor?\", {\n        paras: [\"Configuration, registered with your runtime. No servers, no database, no cloud resources — the agents are files your existing Kiro CLI or Claude Code installation reads and executes.\"],\n        rows: [\n          { k: \"Agents — 11\", v: \"Three orchestrators plus eight specialists\" },\n          { k: \"Skills — 75\", v: \"On-demand knowledge modules\" },\n          { k: \"SOPs — 13\", v: \"Written multi-step procedures\" },\n          { k: \"Context files — 1\", v: \"The orchestrator routing rules, always active\" }\n        ], h1: \"WHAT\", h2: \"WHAT IT IS\",\n        code: \"konductor doctor\", note: \"Confirm what is registered at any time with konductor doctor.\" }),\n      sec(\"faq-cli\", \"Do I need the CLI?\", \"Do I need the CLI to use the agents?\", {\n        paras: [\"No. They are independent. The agents are configuration your runtime reads; the CLI is a setup and build utility. Once an install path exists you will be able to run the agents without ever building the CLI, and you can build the CLI today without touching a runtime.\"],\n        rows: [\n          { k: \"Talk to the orchestrator and get work done\", v: \"No CLI needed\" },\n          { k: \"Run a SOP\", v: \"No CLI needed\" },\n          { k: \"Read what a SOP or skill does\", v: \"No CLI needed\" },\n          { k: \"Scaffold .konductor/config.yml\", v: \"Yes\" },\n          { k: \"Generate dist/kiro/agents/*.json from the specs\", v: \"Yes\" },\n          { k: \"Validate that every spec, skill, and SOP parses\", v: \"Yes — konductor synth\" }\n        ], h1: \"GOAL\", h2: \"NEED THE CLI?\" }),\n      sec(\"faq-start\", \"Which agent to start with\", \"Which agent should I start with?\", {\n        paras: [\"asdlc-orchestrator, essentially always. It reads the routing rules, knows which specialist owns what, writes a proper 7-section delegation, and verifies the result. Starting with a specialist directly skips all of that.\", \"Go direct only when you know exactly which SOP you need and which agent declares it — for example asdlc-architect for k-design-doc-creation. Use asdlc-mux-orchestrator or asdlc-cmux-orchestrator instead if you want specialists in visible parallel panes rather than as background subagents.\"],\n        code: \"kiro-cli chat --agent asdlc-orchestrator\" }),\n      sec(\"faq-readonly\", \"Why the orchestrator won't edit\", \"Why does the orchestrator refuse to edit files itself?\", {\n        paras: [\"By design. context/asdlc-orchestrator-routing-rules.md makes it read-only:\"],\n        quote: \"You are a read-only orchestrator. You NEVER directly execute mutating operations or shell commands.\",\n        bullets: [\"This is not even relaxed for apparently harmless commands — the file says there is \\\"no read-only carve-out for shell\\\", so ls and grep are delegated too.\", \"The reason is separation of concerns: the orchestrator is a dispatcher, and its own file says \\\"Having a tool available does NOT mean you should use it.\\\" File writes, git operations, shell commands, and infrastructure changes all route to asdlc-developer.\", \"If the orchestrator is editing files directly, the context file did not load — see Troubleshooting.\"] }),\n      sec(\"faq-64\", \"Why exit 64\", \"Why does the CLI exit 64 instead of 1 or 2?\", {\n        paras: [\"Because 2 is taken by something more important. 64 is EX_USAGE from BSD sysexits.h, and it means you typed something wrong. The exit-code contract reserves 2 for \\\"unresolved CRITICAL gate\\\" — the signal that a quality gate failed and CI should fail with it. Both argument parsers in use default usage errors to 2, so both implementations explicitly intercept and remap them to 64.\", \"The consequence matters if you script against the CLI: 2 will never mean \\\"bad command line\\\", so a typo can never be mistaken for a real gate failure.\"] }),\n      sec(\"faq-skill-sop\", \"Skill vs SOP\", \"What is the difference between a skill and a SOP?\", {\n        paras: [\"A skill is knowledge; a SOP is procedure. A SOP usually invokes skills — k-test-coverage-review is a good example: the SOP is the sequence and the gates, while test-coverage-analysis, e2e-test-strategy, and security-test-generation supply the expertise at each step.\"],\n        rows: [\n          { k: \"Answers\", v: \"Skill: \\\"How should I think about this?\\\" · SOP: \\\"What do I do, in what order?\\\"\" },\n          { k: \"Lives at\", v: \"skills/<name>/SKILL.md · agent-sops/<name>.sop.md\" },\n          { k: \"Structure\", v: \"Skill: YAML frontmatter plus guidance · SOP: Overview, Parameters, numbered Steps with MUST/MUST NOT constraints\" },\n          { k: \"Loaded\", v: \"Skill: on demand — name and description at session start, full content when relevant · SOP: on demand, and only for agents whose spec declares it\" },\n          { k: \"Count\", v: \"75 skills · 13 SOPs\" }\n        ], h1: \"ASPECT\", h2: \"SKILL VS SOP\" }),\n      sec(\"faq-edit\", \"Can I edit the agents?\", \"Can I edit the agents, skills, and SOPs?\", {\n        paras: [\"Yes — that is much of the point. They are JSON and Markdown in this repository, so you can read exactly what each agent will do and change it. Common edits, in ascending order of blast radius:\"],\n        rows: [\n          { k: \"context/asdlc-orchestrator-routing-rules.md\", v: \"Change routing — which specialist gets which kind of request\" },\n          { k: \"agent-sops/<name>.sop.md\", v: \"Change a procedure — the steps, constraints, and gates of one workflow\" },\n          { k: \"skills/<name>/SKILL.md\", v: \"Change knowledge — how an agent reasons about one topic\" },\n          { k: \"agents/<name>.agent-spec.json\", v: \"Change an agent — its prompt, model, tools, or declared SOPs and skills\" }\n        ], h1: \"FILE\", h2: \"EFFECT\",\n        bullets: [\"Routing lives in two places. The routing rules file says so itself: delegation-protocol is the authoritative source, and the context file's table is a quick-reference summary. When they conflict, the skill wins — so update both.\", \"Validate your edits with synth. It parses every spec, skill, and SOP and reports the first failure with a file and reason. Silence plus 11 files in dist/kiro/agents/ means everything parsed.\", \"konductor update preserves local modifications and names the files it skipped, so your edits survive an update — but commit them anyway so you can tell what you changed.\"] }),\n      sec(\"faq-global\", \"Settings for every project\", \"How do I make a setting apply to every project?\", {\n        paras: [\"Create a user-level config. Precedence is preset → user → project, merged per field, project winning. Put only the fields you want to override into ~/.konductor/config.yml — any project's own .konductor/config.yml still overrides this for the fields it sets.\", \"This is also the answer to \\\"why is my config not what I expect?\\\" — a forgotten user-level file is the usual culprit, since it applies everywhere and nothing surfaces it.\"],\n        code: \"mkdir -p ~/.konductor\" }),\n      sec(\"faq-data\", \"Is my data sent anywhere?\", \"Is any of my data sent anywhere?\", {\n        paras: [\"The CLI touches the network only to fetch or compare releases — install, update, and doctor. init, config, and synth are entirely local. It writes to .konductor/, dist/, your runtime's configuration directory, and ~/.konductor/ — nowhere else.\"],\n        bullets: [\"Your runtime sends your prompts to a model provider. That is Kiro CLI's or Claude Code's behavior, not Konductor's, and it applies whether or not Konductor is installed.\", \"The AWS MCP integration reaches an AWS endpoint — https://aws-mcp.us-east-1.api.aws/mcp, declared in the asdlc-architect and asdlc-developer specs — when those agents look up AWS documentation. It needs uvx and credentials present.\", \"The project's README.md includes a data-collection notice stating that the solution sends operational metrics to AWS about its use, subject to the AWS Privacy Notice.\"],\n        note: \"The invocation log at ~/.konductor/logs/konductor.log is local, mode 0600, and never transmitted. Delete it whenever you like.\" }),\n      sec(\"faq-security-pass\", \"Why review skipped security\", \"Why did my code review skip the security pass?\", {\n        paras: [\"Because it always does. k-code-review-workflow step 6 tries to spawn asdlc-architect for an adversarial pass, and neither agent that owns the SOP can spawn the architect — in Kiro CLI their availableAgents lists do not include it, and in Claude Code neither has an Agent(...) tool. The SOP is written to skip the step quietly when the capability is missing, so you get standard review with no error.\", \"Routing through asdlc-orchestrator does not fix it either: the orchestrator does not declare k-code-review-workflow, so it hands the SOP to the developer or QA agent, which hits the same wall. Run the adversarial pass yourself against the agent that owns it.\"],\n        code: \"Run k-adversarial-pull-request-review against my current diff.\", codeLang: \"PROMPT\" }),\n      sec(\"faq-outputs\", \"Where SOP output goes\", \"Where do the SOP output files go?\", {\n        paras: [\"Each SOP has its own default output location. Most accept an override.\"],\n        rows: [\n          { k: \"k-code-review-workflow\", v: \"code-review-report.md\" },\n          { k: \"k-code-cleanup\", v: \"cleanup-report.md\" },\n          { k: \"asdlc-code-critic\", v: \".agents/scratchpad/critique-NNN.md\" },\n          { k: \"k-adversarial-pull-request-review\", v: \"adversarial-review-report.md\" },\n          { k: \"k-existing-design-review\", v: \"design-review-report.md\" },\n          { k: \"k-design-doc-creation\", v: \"docs/design/<slugified-topic>.md, plus -aws-validation.md and -tradeoffs.md\" },\n          { k: \"k-test-coverage-review\", v: \"test-coverage-review/ — four files\" },\n          { k: \"asdlc-codebase-analysis\", v: \"codebase-analysis.md\" },\n          { k: \"kiro-spec-workflow\", v: \".kiro/specs/<feature-name>/ — three files\" },\n          { k: \"asdlc-analyze\", v: \".konductor/handoff/<name>.md, only when findings exceed ~100 lines\" }\n        ], h1: \"SOP\", h2: \"DEFAULT OUTPUT\",\n        paras2: [],\n        warn: \"Nearly all of these SOPs are required to reference the file path rather than print the report inline, so a one-paragraph summary and a path is correct behavior — the file is the deliverable. Note none of these paths are gitignored by default.\" })\n    ]\n  },\n  reference: {\n    eyebrow: \"GUIDE / CLI REFERENCE\", title: \"CLI reference\",\n    intro: \"Complete tables for the command surface, configuration schema, exit-code contract, and repository layout. For the agents and skills themselves, see the Agents reference and Skills catalog.\",\n    prev: [\"skills\", \"Skills catalog\"], next: [\"troubleshooting\", \"Troubleshooting\"],\n    sections: [\n      sec(\"rf-commands\", \"Command table\", \"Command table\", {\"paras\":[\"Seven commands. config is a group with three subcommands. konductor help [COMMAND] prints help for a command, and --help works at every level.\"],\"h1\":\"COMMAND\",\"h2\":\"PURPOSE\",\"rows\":[{\"k\":\"konductor install\",\"v\":\"Detect the runtime and register agents, skills, SOPs, and context files with it\"},{\"k\":\"konductor update\",\"v\":\"Fetch the latest release and re-register it, preserving local modifications\"},{\"k\":\"konductor uninstall\",\"v\":\"Deregister Konductor from the runtime\"},{\"k\":\"konductor doctor\",\"v\":\"Check the runtime, the installed content, the project config, and available updates\"},{\"k\":\"konductor init\",\"v\":\"Create .konductor/ and write a starter config.yml\"},{\"k\":\"konductor config get <KEY>\",\"v\":\"Print one value from the effective merged configuration\"},{\"k\":\"konductor config set <KEY> <VALUE>\",\"v\":\"Validate and atomically write one value into the project config\"},{\"k\":\"konductor config list\",\"v\":\"Print every field of the effective merged configuration\"},{\"k\":\"konductor synth\",\"v\":\"Parse agents/, skills/, and agent-sops/ and write per-runtime output to <source>/dist/\"}],\"warn\":\"The CLI does not run SDLC workflows. There is no konductor review or konductor design — the workflows are driven by the agents inside your runtime session. The CLI handles setup, content build, lifecycle, and diagnostics.\"}),\n      sec(\"rf-global\", \"Global flags\", \"Global flags\", {\"paras\":[\"Accepted before or after a subcommand.\"],\"h1\":\"FLAG\",\"h2\":\"TYPE · DEFAULT · EFFECT\",\"rows\":[{\"k\":\"--config <PATH>\",\"v\":\"path · .konductor/config.yml · use this file as the project config layer instead of the default location\"},{\"k\":\"-v, --verbose\",\"v\":\"flag · off · print additional detail about what the command is doing\"},{\"k\":\"--json\",\"v\":\"flag · off · emit machine-readable JSON instead of human text\"},{\"k\":\"--version\",\"v\":\"flag · — · print the CLI version and exit 0. Top-level only\"},{\"k\":\"--no-color\",\"v\":\"flag · off · disable ANSI colour in output\"},{\"k\":\"-h, --help\",\"v\":\"flag · — · print help and exit 0\"}]}),\n      sec(\"rf-percmd\", \"Per-command flags\", \"Per-command flags and arguments\", {\"h1\":\"COMMAND · FLAG\",\"h2\":\"TYPE · REQUIRED · VALUES\",\"rows\":[{\"k\":\"install --local <PATH>\",\"v\":\"path · no · install into this repository root instead of the current directory\"},{\"k\":\"update\",\"v\":\"— · takes no command-specific flags\"},{\"k\":\"uninstall --yes\",\"v\":\"flag · no · skip the confirmation prompt\"},{\"k\":\"doctor\",\"v\":\"— · takes no command-specific flags; honours --json\"},{\"k\":\"init --preset <PRESET>\",\"v\":\"enum · no · solo, team, org\"},{\"k\":\"init --force\",\"v\":\"flag · no · overwrite an existing .konductor/ instead of failing\"},{\"k\":\"synth --local <PATH>\",\"v\":\"path · no · synthesize this source tree instead of the current directory. Output goes to <PATH>/dist/\"},{\"k\":\"config get <KEY>\",\"v\":\"string · YES · one of the config keys\"},{\"k\":\"config set <KEY> <VALUE>\",\"v\":\"string, string · YES · a key plus a value valid for it\"},{\"k\":\"config list\",\"v\":\"— · takes no arguments\"}]}),\n      sec(\"rf-config\", \"Configuration file\", \"Configuration file\", {\"paras\":[\"Path: .konductor/config.yml, relative to the current working directory, or whatever --config points at. Format: a YAML mapping at the top level, with flat scalar keys. Nested dotted keys are not supported, and unrecognized extra keys are ignored.\",\"The minimal valid file is just version: 1 — every other field falls through to the user layer and then the CLI defaults. Precedence is three layers, merged shallow and per-field: CLI defaults (compiled into the binary, never missing), then ~/.konductor/config.yml, then <cwd>/.konductor/config.yml or --config <PATH>. A missing file at either optional layer is not an error.\"],\"h1\":\"KEY\",\"h2\":\"TYPE · VALID VALUES · DEFAULT\",\"rows\":[{\"k\":\"version\",\"v\":\"integer · 1 — any other value is rejected · default 1\"},{\"k\":\"severities_source\",\"v\":\"string · a path, relative to the CLI's policy directory, to the file defining finding severities · default severity-schema.yml\"},{\"k\":\"tiers_source\",\"v\":\"string · a path, relative to the CLI's policy directory, to the file defining change tiers · default scope-table.yml\"}],\"code\":\"version: 1\",\"codeLang\":\"MINIMAL CONFIG.YML\",\"note\":\"An empty config.yml is not an error — every field falls through and config list exits 0.\"}),\n      sec(\"rf-configerr\", \"Config error messages\", \"Config error messages\", {\"paras\":[\"All exit 64.\"],\"h1\":\"MESSAGE\",\"h2\":\"CAUSE\",\"rows\":[{\"k\":\"config version <n> is not supported by this CLI (expected 1)\",\"v\":\"version is not 1\"},{\"k\":\"config file <path> is not valid YAML: …\",\"v\":\"Syntax error, or a value of the wrong type for its field\"},{\"k\":\"invalid type: sequence, expected struct RawConfig\",\"v\":\"The top level is a list rather than key-value pairs\"},{\"k\":\"unknown config key '<key>'\",\"v\":\"config get or config set with an unrecognized key\"},{\"k\":\"<path> already exists. Re-run with --force to overwrite it.\",\"v\":\"init on an existing .konductor/\"}]}),\n      sec(\"rf-exit\", \"Exit-code contract\", \"Exit-code contract\", {\"paras\":[\"Most command-line tools use 2 for a usage error. Konductor uses 64 — the BSD sysexits.h EX_USAGE value — and reserves the low codes so a malformed invocation can never be confused with a substantive failure signal. If you script against the CLI, treat 64 as you typed something wrong rather than lumping every non-zero code together. --help and --version are not usage errors and exit 0.\"],\"h1\":\"SITUATION\",\"h2\":\"EXAMPLE\",\"rows\":[{\"k\":\"0\",\"v\":\"Success\"},{\"k\":\"64\",\"v\":\"Usage error (EX_USAGE) — a bad flag, unknown command, missing argument, invalid value, or an invalid config\"},{\"k\":\"No command given\",\"v\":\"konductor\"},{\"k\":\"Unknown subcommand\",\"v\":\"konductor instal — the error suggests close matches: tip: some similar subcommands exist: 'init', 'uninstall', 'install'\"},{\"k\":\"Unknown flag\",\"v\":\"konductor --bogus\"},{\"k\":\"Missing required argument\",\"v\":\"konductor config get\"},{\"k\":\"Invalid enum value\",\"v\":\"konductor init --preset enterprise\"},{\"k\":\"Unknown config key\",\"v\":\"konductor config get colour_scheme\"},{\"k\":\"Invalid config value\",\"v\":\"konductor config set version 9\"},{\"k\":\"Malformed config on load\",\"v\":\"konductor config list against a broken config.yml\"},{\"k\":\"init without --force on an existing .konductor/\",\"v\":\"konductor init\"},{\"k\":\"synth parse failure\",\"v\":\"A malformed agents/*.agent-spec.json\"},{\"k\":\"doctor reporting one or more failed checks\",\"v\":\"konductor doctor\"},{\"k\":\"Current directory cannot be resolved\",\"v\":\"—\"}]}),\n      sec(\"rf-log\", \"Invocation log\", \"Invocation log\", {\"h1\":\"PROPERTY\",\"h2\":\"VALUE\",\"rows\":[{\"k\":\"Path\",\"v\":\"~/.konductor/logs/konductor.log\"},{\"k\":\"Directory mode\",\"v\":\"0700 — owner only\"},{\"k\":\"File mode\",\"v\":\"0600 — owner read/write only\"},{\"k\":\"One line per\",\"v\":\"CLI invocation, including failures\"},{\"k\":\"Line format\",\"v\":\"<ISO-8601 UTC timestamp> argv=[...] exit_code=<n>\"},{\"k\":\"Rotation\",\"v\":\"None. Grows without bound.\"},{\"k\":\"On write failure\",\"v\":\"Fail-open. The command's own exit code is never affected.\"}],\"code\":\"2026-08-13T20:13:52Z argv=[\\\"konductor\\\", \\\"install\\\"] exit_code=0\\n2026-08-13T20:14:11Z argv=[\\\"konductor\\\", \\\"doctor\\\"] exit_code=0\\n2026-08-13T20:15:02Z argv=[\\\"konductor\\\", \\\"config\\\", \\\"get\\\", \\\"version\\\"] exit_code=0\",\"codeLang\":\"EXAMPLE LINES\",\"note\":\"The restrictive permissions are deliberate: argument vectors can contain paths and config keys you may consider sensitive. Modes are re-pinned on every call, so a pre-existing world-readable file is tightened on first use.\"}),\n      sec(\"rf-synth\", \"synth output\", \"synth output\", {\"paras\":[\"konductor synth parses the source tree and runs every registered transformer. Each collection is sorted alphabetically by name so output is reproducible.\",\"What it writes: <source>/dist/kiro/agents/<agent-name>.json — one file per agent spec, in Kiro's own agent-config format, with the shape name, description, prompt, model, tools, allowedTools, toolsSettings, mcpServers, hooks, resources. Field names follow Kiro's format rather than the source spec's naming. Skills and SOPs are parsed and validated, but only agent files are written.\"],\"h1\":\"DIRECTORY\",\"h2\":\"FILES AND RULES\",\"rows\":[{\"k\":\"agents/\",\"v\":\"*.agent-spec.json — aborts on the first parse failure; duplicate names rejected\"},{\"k\":\"skills/\",\"v\":\"<name>/SKILL.md — names validated against ^[a-z0-9]+(-[a-z0-9]+)*$; auxiliary files over 1 MiB are rejected before being read\"},{\"k\":\"agent-sops/\",\"v\":\"*.sop.md — duplicate names rejected\"}],\"bullets\":[\"Output always goes to <source>/dist/, never the process working directory — so --local <dir> writes to <dir>/dist/.\",\"dist/ is gitignored — it is generated output.\",\"Success prints nothing and exits 0.\",\"A source tree with no agents/ directory exits 0 and writes nothing. Silence alone does not prove your specs were validated — check that files appeared.\",\"A parse failure names the file and reason, and exits 64.\"]}),\n      sec(\"rf-layout\", \"Repository layout\", \"Repository layout\", {\"paras\":[\"The four content directories are the ones to know: agents/, agent-sops/, skills/, and context/. Everything Konductor does behaviourally is defined there, and all four are plain JSON or Markdown you can read and change.\"],\"code\":\"konductor/\\n├── agents/                       11 agent specs (*.agent-spec.json)\\n├── agent-sops/                   13 SOPs (*.sop.md)\\n├── skills/                       75 skills (<name>/SKILL.md, plus optional helper files)\\n├── context/                      Loaded at agent startup\\n│   └── asdlc-orchestrator-routing-rules.md\\n├── cli/                          The Konductor CLI\\n│   ├── README.md                 CLI-specific docs\\n│   └── gate-config/              Declarative policy shipped with the CLI\\n│       ├── config.yml            Default configuration\\n│       ├── severity-schema.yml   Finding severities\\n│       └── scope-table.yml       Change tiers\\n├── docs/\\n│   ├── guides/                   Integration guides\\n│   └── user-guide/               This guide\\n├── .github/                      Issue and PR templates\\n├── AGENTS.md                     Agent-facing project instructions\\n├── CLAUDE.md                     Claude Code entry point (includes AGENTS.md)\\n├── CHANGELOG.md\\n├── CONTRIBUTING.md\\n├── CODE_OF_CONDUCT.md\\n├── SECURITY.md\\n├── LICENSE.txt                   Apache-2.0\\n├── NOTICE.txt\\n├── THIRD_PARTY_LICENSES.txt\\n└── README.md\",\"codeLang\":\"TREE\",\"h1\":\"PATH CREATED AT RUN TIME\",\"h2\":\"CREATED BY · GITIGNORED?\",\"rows\":[{\"k\":\".konductor/config.yml\",\"v\":\"konductor init, konductor config set · no\"},{\"k\":\"dist/\",\"v\":\"konductor synth · YES\"},{\"k\":\"~/.konductor/logs/konductor.log\",\"v\":\"every CLI invocation · outside the repo\"},{\"k\":\"~/.konductor/config.yml\",\"v\":\"you, by hand · outside the repo\"},{\"k\":\".konductor/handoff/<name>.md\",\"v\":\"the asdlc-analyze SOP, for large findings · no\"},{\"k\":\".agents/scratchpad/critique-NNN.md\",\"v\":\"the asdlc-code-critic SOP · no\"},{\"k\":\".kiro/specs/<feature>/\",\"v\":\"the kiro-spec-workflow SOP · no\"}]}),\n      sec(\"rf-agents\", \"Agent roster\", \"Agent roster\", {\"paras\":[\"All 11, with the model each declares and the SOPs it makes available. For write and shell access per runtime, delegation targets, and the full per-agent breakdown, see the Agents reference. asdlc-architect is the only agent on a different model. Skill counts are from each spec's clientConfig.claudeCli.skills array. Only the three orchestrators declare a context file.\"],\"h1\":\"AGENT\",\"h2\":\"MODEL · SOPS DECLARED · SKILLS · MCP\",\"rows\":[{\"k\":\"asdlc-orchestrator\",\"v\":\"claude-sonnet-5 · kiro-spec-workflow, asdlc-delegate, asdlc-plan, asdlc-analyze, asdlc-verify · 9 · —\"},{\"k\":\"asdlc-mux-orchestrator\",\"v\":\"claude-sonnet-5 · kiro-spec-workflow, asdlc-plan, asdlc-analyze, asdlc-verify · 8 · —\"},{\"k\":\"asdlc-cmux-orchestrator\",\"v\":\"claude-sonnet-5 · kiro-spec-workflow, asdlc-plan, asdlc-analyze, asdlc-verify · 8 · —\"},{\"k\":\"asdlc-architect\",\"v\":\"claude-opus-4.6 · k-design-doc-creation, k-existing-design-review, k-adversarial-pull-request-review · 32 · aws-mcp\"},{\"k\":\"asdlc-developer\",\"v\":\"claude-sonnet-5 · k-code-cleanup, asdlc-code-critic, asdlc-codebase-analysis, k-code-review-workflow · 19 · aws-mcp\"},{\"k\":\"asdlc-quality-assurance\",\"v\":\"claude-sonnet-5 · k-test-coverage-review, k-code-review-workflow · 10 · —\"},{\"k\":\"asdlc-product-manager\",\"v\":\"claude-sonnet-5 · none · 14 · —\"},{\"k\":\"asdlc-tpm\",\"v\":\"claude-sonnet-5 · none · 14 · —\"},{\"k\":\"asdlc-researcher\",\"v\":\"claude-sonnet-5 · none · 7 · —\"},{\"k\":\"asdlc-browser\",\"v\":\"claude-sonnet-5 · none · 4 · playwright-mcp\"},{\"k\":\"asdlc-media-analyzer\",\"v\":\"claude-sonnet-5 · none · 1 · —\"}],\"note\":\"MCP registry entries — aws-mcp (asdlc-architect, asdlc-developer): command uvx, args mcp-proxy-for-aws@latest, https://aws-mcp.us-east-1.api.aws/mcp, --metadata, AWS_REGION=us-east-1. playwright-mcp (asdlc-browser): args -y, @playwright/mcp@latest. In Claude Code these agents request the corresponding tools via globs — mcp__aws-mcp__* and mcp__playwright-mcp__* — rather than launching the servers themselves.\"}),\n      sec(\"rf-sops\", \"SOP roster\", \"SOP roster\", {\"paras\":[\"All 13, with owning agent and required parameters. Detail and flowcharts are on the SOP workflow pages; end-to-end walkthroughs are in Use cases.\"],\"h1\":\"SOP\",\"h2\":\"OWNER(S) · REQUIRED PARAMETERS\",\"rows\":[{\"k\":\"asdlc-plan\",\"v\":\"orchestrators · objective\"},{\"k\":\"asdlc-analyze\",\"v\":\"orchestrators · target\"},{\"k\":\"asdlc-verify\",\"v\":\"orchestrators · source_dir\"},{\"k\":\"asdlc-delegate\",\"v\":\"asdlc-orchestrator · task_description, target_agent\"},{\"k\":\"kiro-spec-workflow\",\"v\":\"orchestrators · feature_name, feature_scope_path, user_stories_path, design_artifacts_path\"},{\"k\":\"k-design-doc-creation\",\"v\":\"asdlc-architect · topic\"},{\"k\":\"k-existing-design-review\",\"v\":\"asdlc-architect · design_dir\"},{\"k\":\"k-adversarial-pull-request-review\",\"v\":\"asdlc-architect · diff_input or pr_url\"},{\"k\":\"k-code-review-workflow\",\"v\":\"asdlc-developer, asdlc-quality-assurance · source_dir\"},{\"k\":\"k-code-cleanup\",\"v\":\"asdlc-developer · source_dir\"},{\"k\":\"asdlc-code-critic\",\"v\":\"asdlc-developer · none — all parameters have defaults\"},{\"k\":\"asdlc-codebase-analysis\",\"v\":\"asdlc-developer · none — all parameters have defaults\"},{\"k\":\"k-test-coverage-review\",\"v\":\"asdlc-quality-assurance · source_dir, test_dir\"}]})\n    ]\n  },\n  skills: {\n    eyebrow: \"GUIDE / SKILLS CATALOG\", title: \"Skills catalog\",\n    intro: \"All 75 skills the package ships, grouped by what they are for. Each entry gives what the skill does, when it makes sense to reach for it, and which agents declare it. You do not usually invoke one by name: you describe what you want and the agent loads what it needs. A skill is only available in a session with an agent that declares it — so the declared-by note is the practical one.\",\n    prev: [\"agents\", \"Agents reference\"], next: [\"reference\", \"CLI reference\"],\n    sections: [\n      sec(\"sk-behaviour\", \"Behaviour, routing, memory — 11\", \"Behaviour, routing, and memory — 11\", {\"paras\":[\"Loaded to shape how an agent works rather than what it produces. Several are on every agent.\"],\"h1\":\"SKILL\",\"h2\":\"WHAT IT DOES · WHEN · WHO DECLARES IT\",\"rows\":[{\"k\":\"constraints\",\"v\":\"Hard behavioural rules for every agent — what they must never and always do, across code quality, security, and verification. — REACH FOR IT: Always on. You never invoke it; it is the floor every agent stands on. · DECLARED BY: all 11\"},{\"k\":\"delegation-protocol\",\"v\":\"The authoritative delegation format: the 8-field prompt (target agent + 7 sections), the agent registry, parallel-execution rules, and handoff patterns. — REACH FOR IT: Read it to understand what the orchestrator sends a specialist. Edit it to change routing — it outranks the routing-rules context file. · DECLARED BY: all 3 orchestrators\"},{\"k\":\"sdlc-navigator\",\"v\":\"Guidance on which agent to use next and how artifacts connect across SDLC phases. — REACH FOR IT: You are unsure what comes next, or which agent owns the thing you want. · DECLARED BY: architect, browser, both mux orchestrators, product-manager, QA, researcher, tpm\"},{\"k\":\"pre-planning-analysis\",\"v\":\"Classifies an ambiguous request into 6 intent types, names the ambiguities, bounds scope, and recommends an agent chain. — REACH FOR IT: Your request is vague and you would rather be asked good questions than get a confident wrong answer. · DECLARED BY: all 3 orchestrators\"},{\"k\":\"socratic-elicitation\",\"v\":\"Interactive Socratic questioning in two modes — Mode A intake (before work) and Mode B challenge (stress-testing a plan you already hold). — REACH FOR IT: You want assumptions surfaced before anything gets built, or your own plan attacked. · DECLARED BY: architect, developer, all 3 orchestrators\"},{\"k\":\"verification\",\"v\":\"TDD workflow and evidence-collection protocol; nothing is declared complete without proof. — REACH FOR IT: Always on for orchestrators. It is what makes done mean something. · DECLARED BY: all 3 orchestrators\"},{\"k\":\"claude-teams-behavior\",\"v\":\"Claude Code Agent Teams patterns — hub-and-spoke contract, when to use SendMessage, background spawning, agent-name resolution. — REACH FOR IT: Claude Code only. Loaded automatically; relevant if you are debugging why teammates behave a certain way. · DECLARED BY: asdlc-orchestrator\"},{\"k\":\"mux-dispatch\",\"v\":\"Dispatches specialists into parallel tmux or zellij panes. Auto-detects the active multiplexer. Ships four shell scripts. — REACH FOR IT: You want to watch each specialist work in its own pane. · DECLARED BY: asdlc-mux-orchestrator\"},{\"k\":\"cmux-dispatch\",\"v\":\"Same as mux-dispatch but for cmux surfaces. Ships two shell scripts. — REACH FOR IT: You use cmux and want parallel surfaces. · DECLARED BY: asdlc-cmux-orchestrator\"},{\"k\":\"persistent-memory\",\"v\":\"Reads and writes bounded memory files that persist facts across sessions. Ships a config template and scripts. — REACH FOR IT: You are tired of re-explaining project conventions every session. · DECLARED BY: architect, developer, orchestrator, product-manager, researcher, tpm\"},{\"k\":\"workspace-skills\",\"v\":\"Teaches agents when and how to create project-specific skills, with dedup and provenance protection. — REACH FOR IT: A workflow you just did by hand is one you will repeat — capture it. · DECLARED BY: architect, developer, orchestrator, product-manager, QA, researcher, tpm\"}],\"note\":\"Three of these ship helper files alongside SKILL.md: mux-dispatch (mux-close-pane.sh, mux-completion-hook.sh, tmux-dispatch.sh, zellij-dispatch.sh), cmux-dispatch (cmux-completion-hook.sh, cmux-dispatch.sh), and persistent-memory (memory-config.json.template, scripts).\"}),\n      sec(\"sk-requirements\", \"Requirements and product — 7\", \"Requirements and product — 7\", {\"paras\":[\"Turning a business ask into something an engineer can build.\"],\"h1\":\"SKILL\",\"h2\":\"WHAT IT DOES · WHEN · WHO DECLARES IT\",\"rows\":[{\"k\":\"requirements-extraction\",\"v\":\"Extracts design inputs from requirements outputs into three focused files: business-context.md, requirements-summary.md, user-stories-extract.md. — REACH FOR IT: You are moving from requirements into design and want the architect to start from something structured. · DECLARED BY: architect, product-manager\"},{\"k\":\"user-story-writing\",\"v\":\"Creates user stories with INVEST principles, epics, and acceptance criteria. Scales to MVP (10–15), Production (20–30), or full scope (30–40 stories). — REACH FOR IT: Validated requirements exist and you need development-ready stories. · DECLARED BY: product-manager\"},{\"k\":\"task-decomposition\",\"v\":\"Splits stories and a system design into independent features that individual engineers can build with minimal overlap. — REACH FOR IT: The HLD is done and you need to parallelise the work across people. · DECLARED BY: developer, product-manager, tpm\"},{\"k\":\"sprint-planning\",\"v\":\"Task hierarchy, story-point sizing, capacity tracking, sprint workflow. — REACH FOR IT: You are planning a sprint or sizing work, with no external tracker involved. · DECLARED BY: product-manager, tpm\"},{\"k\":\"asana-sprint-planning\",\"v\":\"The same sprint workflow, driven through Asana. — REACH FOR IT: You track sprints in Asana. Needs an Asana MCP server — opt-in. · DECLARED BY: product-manager\"},{\"k\":\"decision-research\",\"v\":\"Research patterns for gathering context before deciding and verifying artifact claims: prior art, alternatives, trade-offs, evidence base, assumption challenges. — REACH FOR IT: A decision needs evidence rather than opinion. · DECLARED BY: architect, product-manager\"},{\"k\":\"document-formats\",\"v\":\"Reads and writes .docx via pandoc. — REACH FOR IT: Your requirements arrived as a Word document. · DECLARED BY: product-manager, QA, researcher, tpm\"}]}),\n      sec(\"sk-program\", \"Program and delivery — 7\", \"Program and delivery management — 7\", {\"paras\":[\"Coordination across people and time rather than within one codebase.\"],\"h1\":\"SKILL\",\"h2\":\"WHAT IT DOES · WHEN · WHO DECLARES IT\",\"rows\":[{\"k\":\"program-planning\",\"v\":\"Program plans with timelines, milestones, dependencies, and critical-path analysis. — REACH FOR IT: Starting or replanning a program spanning multiple workstreams. · DECLARED BY: tpm\"},{\"k\":\"program-decision-docs\",\"v\":\"Program-level decision documents with options analysis, trade-offs, and a recommendation. — REACH FOR IT: A cross-team decision needs to be written down formally. · DECLARED BY: tpm\"},{\"k\":\"status-reporting\",\"v\":\"Program status reports for stakeholders. — REACH FOR IT: Weekly updates, executive summaries, milestone reviews. · DECLARED BY: tpm\"},{\"k\":\"risk-management\",\"v\":\"Identifies, assesses, and tracks program risks with mitigation plans and RAID logs. — REACH FOR IT: Starting a risk assessment, or a risk register has gone stale. · DECLARED BY: tpm\"},{\"k\":\"plan-review\",\"v\":\"Critically reviews a work plan against clarity, verifiability, context completeness, and big picture. Gives a 1–5 rating and a BLOCKED / OKAY / SHIP IT verdict. — REACH FOR IT: You have a plan and want it torn apart before anyone executes it. · DECLARED BY: tpm\"},{\"k\":\"legacy-to-agentic-estimate\",\"v\":\"Converts all-human effort estimates into agentic-SDLC estimates accounting for AI toolchains. Ships convert_estimates.py plus evals. — REACH FOR IT: Re-baselining a legacy estimate for AI-assisted delivery. Note the tier presets are uncalibrated defaults. · DECLARED BY: product-manager, tpm\"},{\"k\":\"progress-tracking\",\"v\":\"Validates feature plans and tracks implementation against requirements traceability, in three modes: initial, progress, final. — REACH FOR IT: Mid-implementation, and you want to know what is genuinely done. · DECLARED BY: developer\"}]}),\n      sec(\"sk-architecture\", \"Architecture and design — 12\", \"Architecture and design — 12\", {\"paras\":[\"Producing the design itself.\"],\"h1\":\"SKILL\",\"h2\":\"WHAT IT DOES · WHEN · WHO DECLARES IT\",\"rows\":[{\"k\":\"system-design-patterns\",\"v\":\"Guides system architecture design through a structured interview. Produces the system design, NFRs, threat-model inputs, and an architecture-diagram description. — REACH FOR IT: Starting a new service or feature that needs a design document. · DECLARED BY: architect\"},{\"k\":\"architecture-advisor\",\"v\":\"Quick recommendation mode — concise opinions with trade-off analysis instead of a full artifact. — REACH FOR IT: You want a sanity check or an opinion, not a document. · DECLARED BY: architect\"},{\"k\":\"design-doc-guidelines\",\"v\":\"Rules for writing and reviewing design docs: outside-in structure, plain writing, AI-slop detection, diagram accuracy, technical accuracy. — REACH FOR IT: Writing or reviewing any design doc. It is also the maker-checker rubric k-design-doc-creation runs against. · DECLARED BY: architect\"},{\"k\":\"non-functional-requirements\",\"v\":\"Extracts measurable NFRs across performance, availability, security, scalability, and observability. — REACH FOR IT: The design exists and it should be fast needs to become a number. · DECLARED BY: architect\"},{\"k\":\"architecture-diagram-generation\",\"v\":\"Generates AWS architecture diagrams as draw.io XML with official service icons and directional data flows; single or multi-account. — REACH FOR IT: You need a real diagram from a written design. · DECLARED BY: architect\"},{\"k\":\"cost-estimation\",\"v\":\"AWS cost estimates in baseline, optimized, and high-availability scenarios. — REACH FOR IT: Someone asked what this will cost to run. Needs service configs and expected load. · DECLARED BY: architect\"},{\"k\":\"adr-generator\",\"v\":\"Produces inline Architecture Decision Records — Context, Decision, Status, Alternatives Considered, Consequences. — REACH FOR IT: A significant design choice needs a written record. · DECLARED BY: architect\"},{\"k\":\"decision-writing\",\"v\":\"How to write decision records well: structure, tone, alternatives framing, consequence articulation. — REACH FOR IT: Your ADRs are technically complete but nobody can follow them. · DECLARED BY: architect\"},{\"k\":\"trade-off-evaluator\",\"v\":\"Scores options across cost, latency, complexity, scalability, and operability into a comparison matrix plus a recommendation. — REACH FOR IT: A decision has more than one credible option. · DECLARED BY: architect\"},{\"k\":\"deliberation-panel\",\"v\":\"Multi-perspective deliberation: derives decision-specific axes, argues each independently, cross-examines anonymously, synthesizes a scored recommendation. Requires explicit consent. — REACH FOR IT: A high-stakes decision where you want genuine disagreement, not a single voice. · DECLARED BY: architect, developer, product-manager, researcher\"},{\"k\":\"argumentation-reference\",\"v\":\"Primer on argumentation theory — Toulmin model, fallacy taxonomy, argument scoring. — REACH FOR IT: Used during adversarial review to name why an argument is weak. · DECLARED BY: architect\"},{\"k\":\"design-impact-review\",\"v\":\"Traces the downstream, cross-artifact impact of a change before it cascades — DB column to API to frontend. Classifies each artifact BREAKING / STALE / UNAFFECTED. — REACH FOR IT: You are about to change a data model, API schema, or interface and want to know what breaks. · DECLARED BY: developer\"}]}),\n      sec(\"sk-gates\", \"Design quality gates — 6\", \"Design quality gates — 6\", {\"paras\":[\"Checking a design before anyone builds it.\"],\"h1\":\"SKILL\",\"h2\":\"WHAT IT DOES · WHEN · WHO DECLARES IT\",\"rows\":[{\"k\":\"design-evaluation\",\"v\":\"Evaluates a complete design package for production readiness across 10 dimensions. — REACH FOR IT: The final gate before implementation. Wants all artifacts present — design, threat model, API specs, data models, diagrams, IAM. · DECLARED BY: architect\"},{\"k\":\"design-quality-check\",\"v\":\"Scores a design doc for writing quality, structural completeness, and KISS/YAGNI compliance. Detects filler, hedging, unsupported claims, passive voice, circular reasoning. — REACH FOR IT: The doc is complete but reads badly, or you suspect padding. · DECLARED BY: architect\"},{\"k\":\"doc-accuracy-analyzer\",\"v\":\"Six-step verification of a technical document against primary sources: extracts claims, investigates each, classifies, reports. — REACH FOR IT: You need to know which claims in a document are actually true. · DECLARED BY: architect\"},{\"k\":\"aws-service-validator\",\"v\":\"Validates AWS service and feature claims against live AWS documentation. Catches hallucinated AWS assertions. — REACH FOR IT: Any design that names AWS services. This is the anti-hallucination gate. · DECLARED BY: architect\"},{\"k\":\"adversarial-design-review\",\"v\":\"Reviews design sections from an adversarial stance, classifying CRITICAL / IMPORTANT / MINOR. Path B fallback when no devils-advocate subagent is installed. — REACH FOR IT: You want the design attacked and have no separate adversarial agent available. · DECLARED BY: architect\"},{\"k\":\"humanize-writing\",\"v\":\"Rewrites text to remove AI-writing tells across 34 categories while preserving meaning and voice. — REACH FOR IT: A draft is accurate but obviously machine-written. · DECLARED BY: architect, product-manager, tpm\"}]}),\n      sec(\"sk-api\", \"API and data modelling — 6\", \"API and data modelling — 6\", {\"paras\":[\"Interface and storage design, each paired with its own validator.\"],\"h1\":\"SKILL\",\"h2\":\"WHAT IT DOES · WHEN · WHO DECLARES IT\",\"rows\":[{\"k\":\"smithy-modeling\",\"v\":\"Generates Smithy API models — service definitions, operations, structures, validation, errors. Supports TypeScript, OpenAPI, and AWS SDK codegen. — REACH FOR IT: Designing a new service API. · DECLARED BY: architect\"},{\"k\":\"smithy-validation\",\"v\":\"Validates Smithy models for structure, naming, security, and codegen readiness. — REACH FOR IT: Before implementing against a Smithy model. · DECLARED BY: architect\"},{\"k\":\"dynamodb-design\",\"v\":\"DynamoDB table designs optimized for access patterns: partition keys, GSI strategy, capacity planning, plus CDK/CloudFormation code. — REACH FOR IT: Designing a data model on DynamoDB. · DECLARED BY: architect\"},{\"k\":\"dynamodb-validation\",\"v\":\"Validates a DynamoDB design against best practice across 13 categories — hot partitions, missing indexes, cost, security. — REACH FOR IT: Before implementing a DynamoDB design. · DECLARED BY: architect\"},{\"k\":\"iam-policy-design\",\"v\":\"Generates least-privilege IAM role policies, resource policies, and compliance configuration. — REACH FOR IT: Designing access control for a new service. · DECLARED BY: architect\"},{\"k\":\"policy-validation\",\"v\":\"Validates IAM policies for over-permissive grants, missing conditions, and compliance gaps. — REACH FOR IT: Before deploying any IAM change. · DECLARED BY: architect\"}]}),\n      sec(\"sk-security\", \"Security — 3\", \"Security — 3\", {\"paras\":[\"Security-specific analysis, spanning design through remediation.\"],\"h1\":\"SKILL\",\"h2\":\"WHAT IT DOES · WHEN · WHO DECLARES IT\",\"rows\":[{\"k\":\"threat-modeling\",\"v\":\"AWS threat models via STRIDE — architecture analysis, threat identification, security controls. — REACH FOR IT: After system design, on anything touching auth, PII, or an external boundary. · DECLARED BY: architect\"},{\"k\":\"security-test-generation\",\"v\":\"Security test plans by domain and layer, covering all 7 domains: authentication, input validation, API security, data protection, session management, error handling, infrastructure. — REACH FOR IT: You need security test coverage, not just functional coverage. · DECLARED BY: QA\"},{\"k\":\"security-remediation\",\"v\":\"Analyzes security findings and produces prioritized remediation plans with effort estimates and risk context. — REACH FOR IT: You have a vulnerability report or appsec findings to work through. · DECLARED BY: developer\"}]}),\n      sec(\"sk-impl\", \"Implementation and review — 13\", \"Implementation and code review — 13\", {\"paras\":[\"Writing and reviewing code.\"],\"h1\":\"SKILL\",\"h2\":\"WHAT IT DOES · WHEN · WHO DECLARES IT\",\"rows\":[{\"k\":\"backend-development\",\"v\":\"Implements backend changes — Lambda handlers, service layers, DynamoDB operations. KISS/YAGNI/DRY, minimal surgical changes. — REACH FOR IT: Implementing or fixing backend logic. · DECLARED BY: developer\"},{\"k\":\"backend-review\",\"v\":\"Reviews backend changes for pattern compliance, type safety, DynamoDB correctness, and test quality. Produces CRITICAL / IMPORTANT / SUGGESTION findings. — REACH FOR IT: After backend changes, before opening a review. · DECLARED BY: developer\"},{\"k\":\"frontend-development\",\"v\":\"Implements React/TypeScript frontend using AWS Cloudscape. Cloudscape-only components, no native HTML. — REACH FOR IT: Implementing UI in a Cloudscape app. · DECLARED BY: developer\"},{\"k\":\"frontend-review\",\"v\":\"Reviews frontend changes for Cloudscape compliance, React Hook Form patterns, type safety, and test quality. — REACH FOR IT: After frontend changes, before opening a review. · DECLARED BY: developer\"},{\"k\":\"infra-validation\",\"v\":\"Validates CDK and CloudFormation against AWS best practice, security standards, and Well-Architected principles. — REACH FOR IT: Before deploying any infrastructure change. · DECLARED BY: developer\"},{\"k\":\"code-review\",\"v\":\"Standard pull-request review workflow — creating PRs, reviewing diffs, addressing feedback, post-implementation cycles. — REACH FOR IT: Ordinary code review, using git and the GitHub CLI. · DECLARED BY: developer\"},{\"k\":\"adversarial-code-review\",\"v\":\"Reviews a diff from an adversarial security-focused stance, arguing against approval. Targets information disclosure, data-integrity failures, and schema/validation gaps. — REACH FOR IT: After standard review, on anything security-sensitive. This is what k-adversarial-pull-request-review runs on. · DECLARED BY: architect\"},{\"k\":\"asdlc-code-simplifier\",\"v\":\"Simplifies code for clarity and consistency without changing behaviour. — REACH FOR IT: Recently modified code is correct but hard to read. · DECLARED BY: developer\"},{\"k\":\"asdlc-aspect-review\",\"v\":\"Parallel n-aspect review of an artifact using subagents. — REACH FOR IT: You want several independent review lenses on the same thing at once. · DECLARED BY: developer\"},{\"k\":\"git-workflow\",\"v\":\"Atomic commits, branch management, history operations. — REACH FOR IT: Committing, branching, or searching history. · DECLARED BY: developer\"},{\"k\":\"git-merge\",\"v\":\"Branch merges — feature into mainline, dev into mainline, release merges. — REACH FOR IT: Merging anything. Declared only by the two multiplexer orchestrators. · DECLARED BY: mux and cmux orchestrators\"},{\"k\":\"find-aws-skills\",\"v\":\"Discovers additional AWS skills from the AWS MCP server for tasks the bundled skills do not cover. — REACH FOR IT: Your task involves an AWS service and nothing bundled matches. · DECLARED BY: developer\"},{\"k\":\"agents-md-authoring\",\"v\":\"Creates and maintains AGENTS.md files that bootstrap agent context. Covers the agents.md standard, the context-loading block, and the CLAUDE.md bridge. — REACH FOR IT: Onboarding a repo for agents, or your conventions have drifted from what agents are told. · DECLARED BY: developer, orchestrator\"}]}),\n      sec(\"sk-testing\", \"Testing and browser — 6\", \"Testing and browser automation — 6\", {\"paras\":[\"Verifying behaviour, including through a real browser.\"],\"h1\":\"SKILL\",\"h2\":\"WHAT IT DOES · WHEN · WHO DECLARES IT\",\"rows\":[{\"k\":\"test-coverage-analysis\",\"v\":\"Analyzes coverage across unit, integration, and E2E to find gaps. Two modes: coverage analysis and release readiness. — REACH FOR IT: After implementation, before release. · DECLARED BY: QA\"},{\"k\":\"e2e-test-strategy\",\"v\":\"Turns gap analysis and user stories into a prioritized E2E test matrix (P0–P3) with execution approach and framework recommendations. — REACH FOR IT: You know the gaps and need a plan to close them. · DECLARED BY: QA\"},{\"k\":\"cypress-test-implementation\",\"v\":\"Turns an E2E strategy into Cypress implementation tasks. Three modes: initial, progress, final. — REACH FOR IT: You have chosen Cypress and need the work planned and tracked. · DECLARED BY: QA\"},{\"k\":\"app-discovery\",\"v\":\"Navigates a deployed web app, discovers pages and interactive elements, and produces a structured discovery report. — REACH FOR IT: You need to test an app nobody has mapped yet. · DECLARED BY: browser\"},{\"k\":\"dom-inspection\",\"v\":\"Extracts field-level metadata from web forms via the DOM and HTML5 Constraint Validation API — validation rules, error selectors, conditional visibility. — REACH FOR IT: Generating tests for a form and you need its real validation rules. · DECLARED BY: browser, QA\"},{\"k\":\"ui-text-validation\",\"v\":\"Validates UI text against public AWS style guidance, Cloudscape standards, and content-quality principles, with before/after examples. — REACH FOR IT: Reviewing user-facing copy in a console-style app. · DECLARED BY: QA\"}]}),\n      sec(\"sk-kiro\", \"Kiro spec generation — 3\", \"Kiro spec generation — 3\", {\"paras\":[\"Three chained skills that produce a Kiro IDE spec, run in order by the kiro-spec-workflow SOP.\"],\"h1\":\"SKILL\",\"h2\":\"WHAT IT DOES · WHEN · WHO DECLARES IT\",\"rows\":[{\"k\":\"kiro-requirements-generation\",\"v\":\"Turns user stories into a Kiro IDE requirements.md with EARS-format acceptance criteria. — REACH FOR IT: Step 1 of the kiro-spec-workflow SOP. · DECLARED BY: all 3 orchestrators\"},{\"k\":\"kiro-design-generation\",\"v\":\"Turns design artifacts into a per-feature Kiro IDE design.md with all 6 required sections. — REACH FOR IT: Step 2 of the SOP, after requirements are approved. · DECLARED BY: all 3 orchestrators\"},{\"k\":\"kiro-task-generation\",\"v\":\"Generates a Kiro IDE tasks.md — numbered checkboxes with requirement references. — REACH FOR IT: Step 3 of the SOP, after design is approved. · DECLARED BY: all 3 orchestrators\"}]}),\n      sec(\"sk-research\", \"Research — 1\", \"Research — 1\", {\"h1\":\"SKILL\",\"h2\":\"WHAT IT DOES · WHEN · WHO DECLARES IT\",\"rows\":[{\"k\":\"external-research\",\"v\":\"Searches external documentation, web resources, and best practices. — REACH FOR IT: Gathering information on open-source libraries, AWS services, industry patterns, or external tools. · DECLARED BY: researcher\"}]}),\n      sec(\"sk-coverage\", \"Coverage\", \"Coverage\", {\"paras\":[\"All 75 skills are declared by at least one agent. Check it yourself with ls skills | wc -l, then compare that against the union of every spec's declared skills — if the two ever diverge, a skill exists that no agent can load, which matters most when a SOP instructs an agent to use it.\"],\"code\":\"ls skills | wc -l\",\"note\":\"Recently fixed: four skills used to be declared by no agent — the three kiro-*-generation skills, which kiro-spec-workflow explicitly instructs the agent to run, and security-remediation. The three Kiro skills are now declared by all three orchestrators, and security-remediation by asdlc-developer. Both runtimes were wired: the skill name in clientConfig.claudeCli.skills and a matching skill:// resource entry in clientConfig.kiroCli.resources.\"}),\n      sec(\"sk-most\", \"Which agent has the most\", \"Which agent has the most skills?\", {\"paras\":[\"Useful when deciding which agent to talk to directly. asdlc-architect carries by far the most, which is why design work routed anywhere else tends to come back thinner. asdlc-media-analyzer carries only constraints — its capability is the model's ability to interpret PDFs and images, not a skill library.\"],\"h1\":\"AGENT\",\"h2\":\"SKILLS DECLARED\",\"rows\":[{\"k\":\"asdlc-architect\",\"v\":\"32\"},{\"k\":\"asdlc-developer\",\"v\":\"20\"},{\"k\":\"asdlc-product-manager\",\"v\":\"14\"},{\"k\":\"asdlc-tpm\",\"v\":\"14\"},{\"k\":\"asdlc-orchestrator\",\"v\":\"12\"},{\"k\":\"asdlc-cmux-orchestrator\",\"v\":\"11\"},{\"k\":\"asdlc-mux-orchestrator\",\"v\":\"11\"},{\"k\":\"asdlc-quality-assurance\",\"v\":\"10\"},{\"k\":\"asdlc-researcher\",\"v\":\"7\"},{\"k\":\"asdlc-browser\",\"v\":\"4\"},{\"k\":\"asdlc-media-analyzer\",\"v\":\"1\"}]})\n    ]\n  },\n  agents: {\n    eyebrow: \"GUIDE / AGENTS REFERENCE\", title: \"Agents reference\",\n    intro: \"All 11 agents the package ships: what each one does, what it can access, which SOPs it can run, and who it is allowed to delegate to. Everything here was read out of agents/*.agent-spec.json — the tool lists, the allowedTools arrays, the subagent target lists, the declared skills and SOPs, and the MCP registry entries.\",\n    prev: [\"sop-test\", \"Testing, codebase analysis, specs\"], next: [\"skills\", \"Skills catalog\"],\n    sections: [\n      sec(\"ag-glance\", \"At a glance\", \"At a glance\", {\n        h1: \"AGENT\", h2: \"ROLE · MODEL · SKILLS · SOPS · MCP\", rows: [\n          { k: \"asdlc-orchestrator\", v: \"Coordinator. Delegates everything, implements nothing. claude-sonnet-5 · 9 skills · 5 SOPs\" },\n          { k: \"asdlc-mux-orchestrator\", v: \"Same, dispatching into tmux/zellij panes. claude-sonnet-5 · 8 skills · 4 SOPs\" },\n          { k: \"asdlc-cmux-orchestrator\", v: \"Same, dispatching into cmux surfaces. claude-sonnet-5 · 8 skills · 4 SOPs\" },\n          { k: \"asdlc-product-manager\", v: \"Requirements, user stories, decision research. claude-sonnet-5 · 14 skills · 0 SOPs\" },\n          { k: \"asdlc-architect\", v: \"System designs, APIs, data models, threat models. claude-opus-4.6 · 32 skills · 3 SOPs · aws-mcp\" },\n          { k: \"asdlc-developer\", v: \"Implementation, code review, git, builds. claude-sonnet-5 · 19 skills · 4 SOPs · aws-mcp\" },\n          { k: \"asdlc-quality-assurance\", v: \"Test coverage, E2E strategy, security tests. claude-sonnet-5 · 10 skills · 2 SOPs\" },\n          { k: \"asdlc-tpm\", v: \"Program plans, status, risk, estimation. claude-sonnet-5 · 14 skills · 0 SOPs\" },\n          { k: \"asdlc-researcher\", v: \"External documentation and web research. claude-sonnet-5 · 7 skills · 0 SOPs\" },\n          { k: \"asdlc-browser\", v: \"Browser automation via Playwright. claude-sonnet-5 · 4 skills · 0 SOPs · playwright-mcp\" },\n          { k: \"asdlc-media-analyzer\", v: \"Interprets PDFs, images, diagrams. claude-sonnet-5 · 1 skill · 0 SOPs\" }\n        ],\n        bullets: [\"asdlc-architect is the only agent on a different model (claude-opus-4.6) and carries 32 skills — nearly a third of the library. Design work routed anywhere else comes back thinner.\", \"Five agents declare zero SOPs: product-manager, tpm, researcher, browser, and media-analyzer. They are skill-driven — you ask for an outcome and they apply the relevant skills, rather than following a scripted procedure.\", \"Only the three orchestrators declare a context file (context/asdlc-orchestrator-routing-rules.md), which is what makes them behave as dispatchers.\"] }),\n      sec(\"ag-access\", \"What each agent can do\", \"What each agent can do to your machine\", {\n        paras: [\"This is the table to check before you let an agent loose on a repository. \\\"Write\\\" means the agent can create or modify files; \\\"shell\\\" means it can run commands. Kiro CLI values come from clientConfig.kiroCli.allowedTools (fs_write, shell); Claude Code values from clientConfig.claudeCli.tools (Write/Edit, Bash).\"],\n        h1: \"AGENT\", h2: \"KIRO CLI WRITE / SHELL · CLAUDE CODE WRITE / SHELL\", rows: [\n          { k: \"asdlc-orchestrator\", v: \"no / no · no / no\" },\n          { k: \"asdlc-mux-orchestrator\", v: \"no / YES · no / YES\" },\n          { k: \"asdlc-cmux-orchestrator\", v: \"no / YES · no / YES\" },\n          { k: \"asdlc-product-manager\", v: \"YES / no · YES / YES\" },\n          { k: \"asdlc-architect\", v: \"YES / YES · YES / YES\" },\n          { k: \"asdlc-developer\", v: \"YES / YES · YES / YES\" },\n          { k: \"asdlc-quality-assurance\", v: \"YES / YES · YES / YES\" },\n          { k: \"asdlc-tpm\", v: \"YES / no · YES / YES\" },\n          { k: \"asdlc-researcher\", v: \"no / no · no / no\" },\n          { k: \"asdlc-browser\", v: \"no / no · YES / YES\" },\n          { k: \"asdlc-media-analyzer\", v: \"no / no · YES / YES\" }\n        ],\n        bullets: [\"asdlc-orchestrator is the only agent that cannot touch anything in either runtime. No write, no shell — deliberate, and reinforced by its routing rules, which forbid shell even for read-only commands like ls.\", \"asdlc-browser and asdlc-media-analyzer are read-only in Kiro CLI but can write files and run shell commands in Claude Code. The two runtime configurations disagree.\", \"asdlc-product-manager and asdlc-tpm gain shell access in Claude Code that they do not have in Kiro CLI.\"],\n        note: \"asdlc-researcher is the only specialist that is read-only in both runtimes, which makes it the safe default for exploratory work.\" }),\n      sec(\"ag-delegate\", \"Who can delegate to whom\", \"Who can delegate to whom\", {\n        paras: [\"Delegation is not open. In Kiro CLI it is governed by each agent's toolsSettings.subagent.availableAgents; in Claude Code by whether the agent has an Agent(...) tool at all.\"],\n        h1: \"AGENT\", h2: \"KIRO CLI CAN SPAWN · CLAUDE CODE CAN SPAWN\", rows: [\n          { k: \"asdlc-orchestrator\", v: \"any agent (unrestricted) · the 8 specialists via Agent(...), plus SendMessage\" },\n          { k: \"asdlc-architect\", v: \"asdlc-developer, asdlc-quality-assurance · nothing\" },\n          { k: \"asdlc-developer\", v: \"asdlc-quality-assurance · nothing\" },\n          { k: \"asdlc-quality-assurance\", v: \"asdlc-developer · nothing\" },\n          { k: \"asdlc-tpm\", v: \"asdlc-developer, asdlc-researcher · nothing\" },\n          { k: \"asdlc-product-manager\", v: \"has the tool, zero targets · nothing\" },\n          { k: \"asdlc-researcher\", v: \"has the tool, zero targets · nothing\" },\n          { k: \"asdlc-mux-orchestrator · asdlc-cmux-orchestrator\", v: \"no subagent tool — dispatches via shell scripts · dispatches via shell\" },\n          { k: \"asdlc-browser · asdlc-media-analyzer\", v: \"no delegation · nothing\" }\n        ],\n        warn: \"Why this matters: k-code-review-workflow step 6 says to spawn asdlc-architect in adversarial mode. That SOP is declared only by asdlc-developer and asdlc-quality-assurance — and neither can spawn the architect in either runtime. The SOP anticipates this (\\\"You MUST skip this step if no adversarial CR-review capability is available\\\"), so it degrades quietly. In practice step 6 always no-ops and you get standard review only. Routing through the orchestrator does not fix it — it does not declare that SOP. Run k-adversarial-pull-request-review yourself against asdlc-architect.\" }),\n      sec(\"ag-mux\", \"The multiplexer orchestrators\", \"The two multiplexer orchestrators do not use subagents at all\", {\n        paras: [\"asdlc-mux-orchestrator and asdlc-cmux-orchestrator have no subagent tool and no Agent(...) tool. Their Kiro CLI tools are [\\\"@builtin\\\", \\\"read\\\", \\\"shell\\\", \\\"todo\\\"], and shell is how they work: their mux-dispatch / cmux-dispatch skills ship shell scripts that open a pane or surface per specialist, run the runtime's CLI inside it, and poll for a .done marker file under /tmp/konductor-mux/ or /tmp/konductor-cmux/.\", \"That is why they need shell access while the plain orchestrator does not, and why they are the only orchestrators that can run commands.\"] }),\n      sec(\"ag-orch\", \"The three orchestrators\", \"The three orchestrators\", {\n        paras: [\"All three load context/asdlc-orchestrator-routing-rules.md at session start, which is what makes them read-only dispatchers. asdlc-orchestrator is the default entry point, and the one to use unless you have a specific reason not to — it is the only agent with unrestricted delegation, and the only one that declares asdlc-delegate.\", \"Pick a multiplexer variant when you want to watch each specialist work in its own pane rather than as a background subagent. asdlc-mux-orchestrator auto-detects tmux versus zellij from environment variables. They are also the only two agents that declare git-merge.\"],\n        h1: \"ASPECT\", h2: \"DETAIL\", rows: [\n          { k: \"asdlc-orchestrator SOPs\", v: \"kiro-spec-workflow, asdlc-delegate, asdlc-plan, asdlc-analyze, asdlc-verify\" },\n          { k: \"asdlc-orchestrator skills (9)\", v: \"constraints, delegation-protocol, agents-md-authoring, claude-teams-behavior, pre-planning-analysis, socratic-elicitation, verification, persistent-memory, workspace-skills\" },\n          { k: \"asdlc-orchestrator tools\", v: \"Kiro CLI: @builtin, subagent; allowedTools is fs_read only. Claude Code: Workflow, WebFetch, WebSearch, TodoWrite, Agent(...) over the 8 specialists, SendMessage, Read, Glob, Grep\" },\n          { k: \"mux / cmux SOPs\", v: \"kiro-spec-workflow, asdlc-plan, asdlc-analyze, asdlc-verify — the same four, minus asdlc-delegate\" },\n          { k: \"mux / cmux skills (8)\", v: \"constraints, delegation-protocol, sdlc-navigator, git-merge, pre-planning-analysis, socratic-elicitation, verification, plus mux-dispatch or cmux-dispatch\" },\n          { k: \"mux / cmux tools\", v: \"Kiro CLI: @builtin, read, shell, todo; allowedTools is fs_read, shell. Claude Code: Workflow, TodoWrite, Read, Bash, Grep, Glob. No write, but yes shell — needed for pane dispatch\" }\n        ] }),\n      sec(\"ag-specialists\", \"The eight specialists\", \"The eight specialists\", {\n        h1: \"SPECIALIST\", h2: \"SOPS · SKILLS · MUTATION · DELEGATION\", rows: [\n          { k: \"asdlc-architect\", v: \"claude-opus-4.6, the only agent not on Sonnet. SOPs: k-design-doc-creation, k-existing-design-review, k-adversarial-pull-request-review. 32 skills. MCP: aws-mcp, launched via uvx mcp-proxy-for-aws@latest — allowedTools grants documentation search/read, region list, and regional availability. Write and shell i
