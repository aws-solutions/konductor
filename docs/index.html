 read-only. Trim them if that is not a trade you want to make.<\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"ic-session\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--vi);margin-right:12px\">04<\u002Fspan>Start a session<\u002Fh2>\n            <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Claude Code prefixes agent names with the package name:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">claude --agent ASDLCCoreAICapabilities-asdlc-orchestrator<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Or for a single non-interactive request:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;color:#E8E4F5;overflow-x:auto\">claude --agent ASDLCCoreAICapabilities-asdlc-orchestrator \\\n  -p \"Create a threat model for a public REST API backed by DynamoDB.\"<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">That request routes to <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-architect<\u002Fspan>, which owns threat modeling via its <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">threat-modeling<\u002Fspan> skill. The unprefixed form is the Kiro CLI convention — see <a href=\"#/install-kiro\">Install for Kiro CLI<\u002Fa>.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"ic-state\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Behaviour differs by state<\u002Fh2>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:20px\">\n              <div style=\"display:grid;grid-template-columns:1fr 1.7fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">STATE<\u002Fdiv><div style=\"padding:11px 16px\">WHAT HAPPENS<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1.7fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-size:14.5px;font-weight:600;color:var(--sig)\">Both settings configured<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">The orchestrator spawns specialists, and they have the allowlisted tools.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1.7fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-size:14.5px;font-weight:600\">Env var set, no permissions.allow<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Team mode silently degrades. Specialists spawn and then auto-deny every tool. Nothing errors — work just does not happen.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1.7fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-size:14.5px;font-weight:600\">permissions.allow set, no env var<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Specialists never spawn. The orchestrator has no one to delegate to.<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1.7fr\"><div style=\"padding:12px 16px;font-size:14.5px;font-weight:600\">Claude Code older than v2.1.178<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Team mode is unavailable regardless of settings.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px solid rgba(167,139,250,.35);border-radius:12px;background:rgba(124,92,255,.07);padding:18px 20px;font-size:15px;line-height:1.7;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--lav);display:block;margin-bottom:8px\">DIAGNOSIS SHORTCUT<\u002Fspan>Specialists spawning but idle → permissions. Specialists never spawning → environment variable. Neither produces an error message, so this is how you tell them apart.<\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"ic-success\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600\">What success looks like<\u002Fh2>\n            <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Verify with the CLI first:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:20px\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">konductor doctor<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.75;color:var(--mu);overflow-x:auto\">Runtime\n  Claude Code                  detected (2.1.180)            ok\n  agent teams enabled          CLAUDE_CODE_EXPERIMENTAL_...  ok\n  tool permissions             22 entries allowlisted        ok\nContent\n  agents                       11 registered                 ok\n  skills                       75 registered                 ok\n  SOPs                         13 registered                 ok\n  context files                 1 registered                 ok\nUpdates\n  installed 0.1.0, latest 0.1.0                              ok\n\nAll checks passed.<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:11px;margin-bottom:18px\">\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\">The session starts without an \"agent not found\" error.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\">A task needing implementation causes a <strong style=\"color:var(--tx);font-weight:600\">specialist to spawn<\u002Fstrong>, visible in your session.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\">The specialist can actually read and edit files, rather than silently doing nothing.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">If the first works but the second does not, revisit setting 1. If the second works but the third does not, revisit setting 2. See <a href=\"#/troubleshooting\">Troubleshooting<\u002Fa>.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"ic-optional\" style=\"border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Optional<\u002Fh2>\n            <h3 style=\"margin:0 0 12px;font-size:20px;font-weight:600;letter-spacing:-.02em\">Split-pane display<\u002Fh3>\n            <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">By default teammates render in your main terminal (<span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">in-process<\u002Fspan>). For one pane per teammate, set this in <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">~/.claude/settings.json<\u002Fspan>:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">JSON<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:#E8E4F5;overflow-x:auto\">{\n  \"teammateMode\": \"auto\"\n}<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 28px;font-size:16px;line-height:1.75;color:var(--mu)\">This is no longer the default as of Claude Code v2.1.179 and requires tmux or iTerm2 (with the <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">it2<\u002Fspan> CLI). It is display polish only — team mode itself needs just the environment variable above.<\u002Fp>\n            <h3 style=\"margin:0 0 12px;font-size:20px;font-weight:600;letter-spacing:-.02em\">Integrations<\u002Fh3>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">AWS documentation lookups<\u002Fstrong> — <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-architect<\u002Fspan> and <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-developer<\u002Fspan> request AWS MCP tools via the glob <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">mcp__aws-mcp__*<\u002Fspan>. Unlike their Kiro CLI configuration, the Claude Code configuration does <strong style=\"color:var(--tx);font-weight:600\">not<\u002Fstrong> launch the server itself, so you must configure an <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">aws-mcp<\u002Fspan> MCP server in Claude Code yourself for those tools to resolve.<\u002Fp>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">Browser automation<\u002Fstrong> — <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-browser<\u002Fspan> requests <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">mcp__playwright-mcp__*<\u002Fspan>, with the same caveat. Install the browser binary:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">npx playwright install chromium<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">Slack search<\u002Fstrong> for <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-researcher<\u002Fspan> is one command in Claude Code:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code)\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">claude plugin install slack<\u002Fpre>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n            <button sc-camel-on-click=\"{{ goInstallKiro }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Install for Kiro CLI<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goInit }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: Initialize a project →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <div style=\"width:196px;flex:0 0 196px;padding-top:72px\">\n          <div style=\"position:sticky;top:24px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--bd);padding-left:18px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;color:var(--mu2)\">ON THIS PAGE<\u002Fdiv>\n            <a href=\"#ic-prereq\" style=\"font-size:13px;color:var(--mu)\">Prerequisites<\u002Fa>\n            <a href=\"#ic-install\" style=\"font-size:13px;color:var(--mu)\">1 — Install<\u002Fa>\n            <a href=\"#ic-teams\" style=\"font-size:13px;color:var(--mu)\">2 — Enable agent teams<\u002Fa>\n            <a href=\"#ic-perms\" style=\"font-size:13px;color:var(--mu)\">3 — Tool permissions<\u002Fa>\n            <a href=\"#ic-session\" style=\"font-size:13px;color:var(--mu)\">4 — Start a session<\u002Fa>\n            <a href=\"#ic-state\" style=\"font-size:13px;color:var(--mu)\">Behaviour by state<\u002Fa>\n            <a href=\"#ic-success\" style=\"font-size:13px;color:var(--mu)\">What success looks like<\u002Fa>\n            <a href=\"#ic-optional\" style=\"font-size:13px;color:var(--mu)\">Optional<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.init }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:0 56px 96px;gap:48px\">\n        <article style=\"flex:1 1 520px;min-width:0;padding-top:64px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">TASK GUIDES / INITIALIZE A PROJECT<\u002Fdiv>\n          <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Initialize a project<\u002Fh1>\n          <p style=\"margin:0 0 36px;font-size:19px;line-height:1.5;color:var(--mu)\">Creates a <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--tx)\">.konductor/<\u002Fspan> directory in your project with a starter <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--tx)\">config.yml<\u002Fspan>. This is what <span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--tx)\">konductor init<\u002Fspan> does — the whole of it.<\u002Fp>\n\n          <section id=\"in-creates\" style=\"padding-bottom:44px\">\n            <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\">What <span style=\"font-family:'JetBrains Mono',monospace;font-size:24px;color:var(--lav)\">init<\u002Fspan> actually creates<\u002Fh2>\n            <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">One directory containing one file:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:18px\">\n              <pre style=\"margin:0;padding:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;color:var(--mu);overflow-x:auto\">your-project/\n└── .konductor/\n    └── config.yml<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">That is the complete output. <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">init<\u002Fspan> does not touch git, does not install anything, and does not contact the network.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"in-steps\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 24px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Steps<\u002Fh2>\n            <h3 style=\"margin:0 0 14px;font-size:21px;font-weight:600\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--vi);margin-right:10px\">01<\u002Fspan>Go to your project<\u002Fh3>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:28px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">cd &lt;your-project-path&gt;<\u002Fpre>\n            <\u002Fdiv>\n            <h3 style=\"margin:0 0 14px;font-size:21px;font-weight:600\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--vi);margin-right:10px\">02<\u002Fspan>Initialize<\u002Fh3>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor init<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:14px\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">OUTPUT<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:var(--mu);overflow-x:auto\">Initialized Konductor project at /Users/you/your-project/.konductor\nWrote starter config: /Users/you/your-project/.konductor/config.yml<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 28px;font-size:16px;line-height:1.75;color:var(--mu)\">The paths are absolute and will reflect your own directory.<\u002Fp>\n            <h3 style=\"margin:0 0 14px;font-size:21px;font-weight:600\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--vi);margin-right:10px\">03<\u002Fspan>Confirm<\u002Fh3>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">ls .konductor<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:28px\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">OUTPUT<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--mu)\">config.yml<\u002Fpre>\n            <\u002Fdiv>\n            <h3 style=\"margin:0 0 14px;font-size:21px;font-weight:600\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--vi);margin-right:10px\">04<\u002Fspan>Look at what was written<\u002Fh3>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">cat .konductor/config.yml<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\">The starter file is a <strong style=\"color:var(--tx);font-weight:600\">verbatim copy<\u002Fstrong> of the CLI's defaults, comments included — so it documents its own fields. The values are:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:14px\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">CONFIG.YML<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;color:var(--mu)\">version: 1\n\nseverities_source: severity-schema.yml\ntiers_source: scope-table.yml<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">Field meanings are in <a href=\"#/reference\">CLI reference → configuration file<\u002Fa>.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"in-success\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600\">What success looks like<\u002Fh2>\n            <div style=\"display:flex;flex-direction:column;gap:11px;margin-bottom:20px\">\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">konductor init<\u002Fspan> printed two <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">Initialized…<\u002Fspan> / <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">Wrote starter config:<\u002Fspan> lines and exited <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">0<\u002Fspan>.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">.konductor/config.yml<\u002Fspan> exists and is non-empty.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">konductor config list<\u002Fspan> prints the config keys.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:18px 20px\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--sig);margin-bottom:10px\">VERIFY THAT LAST ONE<\u002Fdiv>\n              <pre style=\"margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\">konductor config list<\u002Fpre>\n              <pre style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:var(--mu)\">version = 1\nseverities_source = severity-schema.yml\ntiers_source = scope-table.yml<\u002Fpre>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"in-state\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 12px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Behavior differs by state<\u002Fh2>\n            <p style=\"margin:0 0 26px;font-size:16px;line-height:1.75;color:var(--mu)\">This is the one place where <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">init<\u002Fspan> will surprise you, so it is worth reading before you hit it. It refuses to clobber an existing <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">.konductor/<\u002Fspan> unless you pass <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">--force<\u002Fspan>.<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:18px;background:radial-gradient(120% 140% at 15% 0%,rgba(124,92,255,.1),transparent 60%),var(--bg2);padding:30px 28px;margin-bottom:28px;display:flex;flex-direction:column;gap:18px\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px\">\n                <span style=\"border:1px solid var(--bd2);border-radius:10px;background:var(--code);padding:11px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#E8E4F5\">konductor init<\u002Fspan>\n                <span style=\"color:var(--mu2)\">→<\u002Fspan>\n                <span style=\"border:1px solid var(--lav);border-radius:999px;padding:11px 18px;font-size:14px;font-weight:600\">Does <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px\">.konductor/<\u002Fspan> already exist?<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px\">\n                <div style=\"border:1px solid rgba(61,220,151,.4);border-radius:14px;background:rgba(61,220,151,.05);padding:18px 20px\">\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--sig);margin-bottom:10px\">NO<\u002Fdiv>\n                  <div style=\"font-size:14.5px;line-height:1.6;color:var(--mu)\">Create <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">.konductor/<\u002Fspan>, write the starter <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">config.yml<\u002Fspan>, print both paths.<\u002Fdiv>\n                  <div style=\"margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--sig)\">exit 0<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"border:1px solid rgba(255,107,107,.4);border-radius:14px;background:rgba(255,107,107,.05);padding:18px 20px\">\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:#FF8B8B;margin-bottom:10px\">YES, NO --FORCE<\u002Fdiv>\n                  <div style=\"font-size:14.5px;line-height:1.6;color:var(--mu)\">Error: … already exists. Re-run with <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">--force<\u002Fspan> to overwrite it. Nothing modified.<\u002Fdiv>\n                  <div style=\"margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#FF8B8B\">exit 64<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"border:1px solid var(--bd2);border-radius:14px;background:var(--surf);padding:18px 20px\">\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--lav);margin-bottom:10px\">YES, WITH --FORCE<\u002Fdiv>\n                  <div style=\"font-size:14.5px;line-height:1.6;color:var(--mu)\">Overwrites <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">config.yml<\u002Fspan> with the preset defaults. Any values you had set are lost.<\u002Fdiv>\n                  <div style=\"margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--sig)\">exit 0<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\">If you have customized the file, back it up first:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code)\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">cp .konductor/config.yml .konductor/config.yml.bak<\u002Fpre>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"in-preset\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\">The <span style=\"font-family:'JetBrains Mono',monospace;font-size:24px;color:var(--lav)\">--preset<\u002Fspan> flag<\u002Fh2>\n            <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">init<\u002Fspan> accepts <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">--preset<\u002Fspan> with three allowed values: <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">solo<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">team<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">org<\u002Fspan>.<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor init --preset solo --force<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:20px\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">OUTPUT<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:var(--mu);overflow-x:auto\">Initialized Konductor project at /Users/you/your-project/.konductor\nWrote starter config: /Users/you/your-project/.konductor/config.yml\nApplied preset: solo<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px\">\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--lav);margin-bottom:8px\">solo<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;color:var(--mu)\">One person on the project<\u002Fdiv><\u002Fdiv>\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--lav);margin-bottom:8px\">team<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;color:var(--mu)\">A single team sharing the repository<\u002Fdiv><\u002Fdiv>\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\"><div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--lav);margin-bottom:8px\">org<\u002Fdiv><div style=\"font-size:14px;line-height:1.6;color:var(--mu)\">Multiple teams, where config should be consistent across them<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\">An invalid preset is rejected as a usage error:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2)\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">konductor init --preset enterprise<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:var(--mu);overflow-x:auto\">error: invalid value 'enterprise' for '--preset &lt;PRESET&gt;'\n  [possible values: solo, team, org]\n\nFor more information, try '--help'.<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:14px 0 0;font-size:16px;line-height:1.75;color:var(--mu)\">Exit code <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">64<\u002Fspan>.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"in-git\" style=\"border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Should I commit <span style=\"font-family:'JetBrains Mono',monospace;font-size:24px;color:var(--lav)\">.konductor/<\u002Fspan> to git?<\u002Fh2>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">Both choices are defensible; the repository does not force either.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:20px\">\n              <div style=\"border:1px solid var(--bd);border-radius:14px;background:var(--surf);padding:20px 22px\"><div style=\"font-size:16px;font-weight:600;margin-bottom:9px\">Commit it<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.65;color:var(--mu)\">If you want your whole team on the same tier and severity policy. The file is small, plain YAML, and reviewable.<\u002Fdiv><\u002Fdiv>\n              <div style=\"border:1px solid var(--bd);border-radius:14px;background:var(--surf);padding:20px 22px\"><div style=\"font-size:16px;font-weight:600;margin-bottom:9px\">Leave it out<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.65;color:var(--mu)\">If config should be per-developer. A <em>user-level<\u002Fem> config at <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">~/.konductor/config.yml<\u002Fspan> already exists for that purpose and takes lower precedence than the project file.<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">Do note this repository's own <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">.gitignore<\u002Fspan> excludes <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">dist/<\u002Fspan> (the <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">synth<\u002Fspan> output) but says nothing about <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">.konductor/<\u002Fspan>, so it is your call.<\u002Fp>\n          <\u002Fsection>\n\n          <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n            <button sc-camel-on-click=\"{{ goInstallClaude }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Install for Claude Code<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goConfig }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: Read and change configuration →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <div style=\"width:196px;flex:0 0 196px;padding-top:72px\">\n          <div style=\"position:sticky;top:24px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--bd);padding-left:18px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;color:var(--mu2)\">ON THIS PAGE<\u002Fdiv>\n            <a href=\"#in-creates\" style=\"font-size:13px;color:var(--mu)\">What init creates<\u002Fa>\n            <a href=\"#in-steps\" style=\"font-size:13px;color:var(--mu)\">Steps<\u002Fa>\n            <a href=\"#in-success\" style=\"font-size:13px;color:var(--mu)\">What success looks like<\u002Fa>\n            <a href=\"#in-state\" style=\"font-size:13px;color:var(--mu)\">Behavior by state<\u002Fa>\n            <a href=\"#in-preset\" style=\"font-size:13px;color:var(--mu)\">The --preset flag<\u002Fa>\n            <a href=\"#in-git\" style=\"font-size:13px;color:var(--mu)\">Commit to git?<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.config }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:0 56px 96px;gap:48px\">\n        <article style=\"flex:1 1 520px;min-width:0;padding-top:64px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">TASK GUIDES / CONFIGURATION<\u002Fdiv>\n          <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Read and change configuration<\u002Fh1>\n          <p style=\"margin:0 0 20px;font-size:19px;line-height:1.5;color:var(--mu)\">How to read the effective configuration, change a value, and understand where the value came from.<\u002Fp>\n          <div style=\"border:1px solid rgba(167,139,250,.35);border-radius:12px;background:rgba(124,92,255,.07);padding:16px 18px;margin-bottom:40px;font-size:15px;line-height:1.65;color:var(--mu)\">You do <strong style=\"color:var(--tx);font-weight:600\">not<\u002Fstrong> need to have run <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">konductor init<\u002Fspan> first — <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">config get<\u002Fspan> and <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">config list<\u002Fspan> fall back to the defaults built into the CLI when no project config exists.<\u002Fdiv>\n\n          <section id=\"cf-keys\" style=\"padding-bottom:44px\">\n            <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600\">The config keys<\u002Fh2>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:16px\">\n              <div style=\"display:grid;grid-template-columns:.9fr .5fr 2fr .9fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">KEY<\u002Fdiv><div style=\"padding:11px 16px\">TYPE<\u002Fdiv><div style=\"padding:11px 16px\">VALID VALUES<\u002Fdiv><div style=\"padding:11px 16px\">DEFAULT<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:.9fr .5fr 2fr .9fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">version<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;color:var(--mu)\">integer<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;line-height:1.55;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">1<\u002Fspan> — the loader rejects any other value<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mu)\">1<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:.9fr .5fr 2fr .9fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">severities_source<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;color:var(--mu)\">string<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;line-height:1.55;color:var(--mu)\">A path, relative to the CLI's own policy directory, to the file defining the finding severities<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mu)\">severity-schema.yml<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:.9fr .5fr 2fr .9fr\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">tiers_source<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;color:var(--mu)\">string<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;line-height:1.55;color:var(--mu)\">A path, relative to the CLI's own policy directory, to the file defining the change tiers<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mu)\">scope-table.yml<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">Keys are flat. Nested dotted keys are not supported.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"cf-read\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 20px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Read configuration<\u002Fh2>\n            <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">Every value<\u002Fh3>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor config list<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:28px\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">OUTPUT<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:var(--mu)\">version = 1\nseverities_source = severity-schema.yml\ntiers_source = scope-table.yml<\u002Fpre>\n            <\u002Fdiv>\n            <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">One value<\u002Fh3>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor config get version<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:22px\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">OUTPUT<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--mu)\">1<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"border:1px solid rgba(255,107,107,.4);border-radius:12px;background:rgba(255,107,107,.05);padding:18px 20px\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:#FF8B8B;margin-bottom:10px\">USAGE ERRORS — EXIT 64<\u002Fdiv>\n              <pre style=\"margin:0 0 8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\">konductor config get colour_scheme<\u002Fpre>\n              <pre style=\"margin:0 0 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--mu)\">Error: unknown config key 'colour_scheme'<\u002Fpre>\n              <pre style=\"margin:0 0 8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\">konductor config get<\u002Fpre>\n              <pre style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:var(--mu)\">error: the following required arguments were not provided:\n  &lt;KEY&gt;\n\nUsage: konductor config get &lt;KEY&gt;<\u002Fpre>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"cf-change\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 20px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Change configuration<\u002Fh2>\n            <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">Using <span style=\"font-family:'JetBrains Mono',monospace;font-size:17px;color:var(--lav)\">config set<\u002Fspan><\u002Fh3>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor config set severities_source custom-severities.yml<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:20px\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">OUTPUT<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--mu)\">Set severities_source = custom-severities.yml<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">config set<\u002Fspan> writes to <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">&lt;cwd&gt;/.konductor/config.yml<\u002Fspan>, creating the directory and file from the defaults if they do not exist. The write is atomic — a temporary file is written and then renamed, so a crash mid-write cannot leave a half-written config behind.<\u002Fp>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\">Values are validated <strong style=\"color:var(--tx);font-weight:600\">before<\u002Fstrong> anything is written:<\u002Fp>\n            <div style=\"border:1px solid rgba(255,107,107,.4);border-radius:12px;background:rgba(255,107,107,.05);padding:18px 20px;margin-bottom:28px\">\n              <pre style=\"margin:0 0 8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\">konductor config set version 9<\u002Fpre>\n              <pre style=\"margin:0 0 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--mu)\">Error: config version 9 is not supported by this CLI (expected 1)<\u002Fpre>\n              <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:var(--mu)\">Exit code <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">64<\u002Fspan>, and <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">config.yml<\u002Fspan> is byte-identical to before. An unknown key behaves the same way — no write.<\u002Fp>\n            <\u002Fdiv>\n            <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">Editing the file directly<\u002Fh3>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\">Perfectly valid, and necessary if you want to keep the explanatory comments:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">$EDITOR .konductor/config.yml<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\">One thing to know: after a <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">config set<\u002Fspan>, the file is re-serialized from parsed YAML, which <strong style=\"color:var(--tx);font-weight:600\">drops the comments<\u002Fstrong> the starter file shipped with. If those matter to you, edit by hand instead. A post-<span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">set<\u002Fspan> file looks like this:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2)\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">CONFIG.YML<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:var(--mu)\">version: 1\nseverities_source: custom-severities.yml\ntiers_source: scope-table.yml<\u002Fpre>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"cf-precedence\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Configuration precedence<\u002Fh2>\n            <p style=\"margin:0 0 26px;font-size:16px;line-height:1.75;color:var(--mu)\">Three layers merge, field by field. Later layers win per field; a field absent from a layer falls through to the one below. Missing files are not errors.<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:18px;background:radial-gradient(120% 140% at 15% 0%,rgba(124,92,255,.1),transparent 60%),var(--bg2);padding:30px 28px;margin-bottom:26px;display:flex;flex-direction:column;gap:0\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:stretch;gap:0\">\n                <div style=\"flex:1;min-width:190px;border:1px solid var(--bd2);border-radius:12px;background:var(--surf);padding:16px 18px\">\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--mu2);margin-bottom:8px\">01<\u002Fdiv>\n                  <div style=\"font-size:15px;font-weight:600;margin-bottom:5px\">CLI defaults<\u002Fdiv>\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mu)\">built into the binary<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:0 0 44px;display:flex;align-items:center;justify-content:center;color:var(--mu2)\">→<\u002Fdiv>\n                <div style=\"flex:1;min-width:190px;border:1px solid var(--bd2);border-radius:12px;background:var(--surf);padding:16px 18px\">\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--mu2);margin-bottom:8px\">02<\u002Fdiv>\n                  <div style=\"font-size:15px;font-weight:600;margin-bottom:5px\">User config<\u002Fdiv>\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mu)\">~/.konductor/config.yml<br>(optional)<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:0 0 44px;display:flex;align-items:center;justify-content:center;color:var(--mu2)\">→<\u002Fdiv>\n                <div style=\"flex:1;min-width:190px;border:1px solid var(--bd2);border-radius:12px;background:var(--surf);padding:16px 18px\">\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--mu2);margin-bottom:8px\">03<\u002Fdiv>\n                  <div style=\"font-size:15px;font-weight:600;margin-bottom:5px\">Project config<\u002Fdiv>\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mu)\">&lt;cwd&gt;/.konductor/config.yml<br>(optional)<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:0 0 44px;display:flex;align-items:center;justify-content:center;color:var(--mu2)\">→<\u002Fdiv>\n                <div style=\"flex:1;min-width:190px;border:1px solid var(--vi);border-radius:12px;background:rgba(124,92,255,.12);box-shadow:inset 0 0 50px -20px var(--vi);padding:16px 18px;display:flex;align-items:center\">\n                  <div style=\"font-size:16px;font-weight:700;letter-spacing:-.02em\">Effective configuration<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">The merge is <strong style=\"color:var(--tx);font-weight:600\">shallow and per-field<\u002Fstrong>: setting only <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">version<\u002Fspan> in your project config leaves the other keys at their user-level or default values. Unrecognized extra keys in a config file are ignored.<\u002Fp>\n            <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">Applying a setting to every project<\u002Fh3>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\">Create the user-level file, then put only the fields you want to override in it:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">mkdir -p ~/.konductor<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">~/.KONDUCTOR/CONFIG.YML<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:#E8E4F5;overflow-x:auto\">version: 1\nseverities_source: my-severities.yml<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">Any project's own <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">.konductor/config.yml<\u002Fspan> still wins over this. This is also the answer to \"why is my config not what I expect?\" — a forgotten user-level file applies everywhere and nothing surfaces it. See <a href=\"#/diagnose\">Diagnose problems<\u002Fa>.<\u002Fp>\n            <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">Pointing at a different config file<\u002Fh3>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor --config /path/to/other-config.yml config list<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">The named file replaces the project layer. The user layer and the CLI defaults still apply beneath it.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"cf-recover\" style=\"border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Recovering from a broken config<\u002Fh2>\n            <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">If you hand-edit <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">config.yml<\u002Fspan> into an invalid state, <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">config get<\u002Fspan> and <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">config list<\u002Fspan> refuse to run — but <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">config set<\u002Fspan> still works, specifically so you can fix the broken field:<\u002Fp>\n            <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:18px 20px;margin-bottom:20px\">\n              <pre style=\"margin:0 0 8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\">konductor config set version 1<\u002Fpre>\n              <pre style=\"margin:0 0 12px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--mu)\">Set version = 1<\u002Fpre>\n              <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:var(--mu)\">This is deliberate: <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">config set<\u002Fspan> is handled before the load-and-validate step, so a config that already fails validation can be repaired with the tool rather than by hand.<\u002Fp>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\">If it is beyond repair, start over — <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">--force<\u002Fspan> overwrites <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">config.yml<\u002Fspan> with the defaults, so back it up first if you want to diff against it:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code)\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor init --force<\u002Fpre>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n            <button sc-camel-on-click=\"{{ goInit }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Initialize a project<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goDiagnose }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: Diagnose problems →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <div style=\"width:196px;flex:0 0 196px;padding-top:72px\">\n          <div style=\"position:sticky;top:24px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--bd);padding-left:18px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;color:var(--mu2)\">ON THIS PAGE<\u002Fdiv>\n            <a href=\"#cf-keys\" style=\"font-size:13px;color:var(--mu)\">The config keys<\u002Fa>\n            <a href=\"#cf-read\" style=\"font-size:13px;color:var(--mu)\">Read configuration<\u002Fa>\n            <a href=\"#cf-change\" style=\"font-size:13px;color:var(--mu)\">Change configuration<\u002Fa>\n            <a href=\"#cf-precedence\" style=\"font-size:13px;color:var(--mu)\">Precedence<\u002Fa>\n            <a href=\"#cf-recover\" style=\"font-size:13px;color:var(--mu)\">Recovering<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.diagnose }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:0 56px 96px;gap:48px\">\n        <article style=\"flex:1 1 520px;min-width:0;padding-top:64px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">TASK GUIDES / DIAGNOSE PROBLEMS<\u002Fdiv>\n          <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Diagnose problems<\u002Fh1>\n          <p style=\"margin:0 0 36px;font-size:19px;line-height:1.5;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--tx)\">konductor doctor<\u002Fspan> checks your installation and tells you what is wrong. Start there, then use the manual checks below for anything it cannot see.<\u002Fp>\n\n          <section id=\"dg-doctor\" style=\"padding-bottom:44px\">\n            <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Run <span style=\"font-family:'JetBrains Mono',monospace;font-size:24px;color:var(--lav)\">doctor<\u002Fspan> first<\u002Fh2>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor doctor<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:22px\">\n              <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;overflow:hidden;background:rgba(61,220,151,.04)\">\n                <div style=\"padding:9px 14px;border-bottom:1px solid rgba(61,220,151,.25);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--sig)\">HEALTHY · EXIT 0<\u002Fdiv>\n                <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:var(--mu);overflow-x:auto\">Runtime\n  Kiro CLI            detected (0.4.2)     ok\nContent\n  agents              11 registered        ok\n  skills              75 registered        ok\n  SOPs                13 registered        ok\n  context files        1 registered        ok\nProject\n  .konductor/config.yml valid (version 1)  ok\nUpdates\n  installed 0.1.0, latest 0.1.0            ok\n\nAll checks passed.<\u002Fpre>\n              <\u002Fdiv>\n              <div style=\"border:1px solid rgba(255,107,107,.4);border-radius:12px;overflow:hidden;background:rgba(255,107,107,.04)\">\n                <div style=\"padding:9px 14px;border-bottom:1px solid rgba(255,107,107,.25);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:#FF8B8B\">BROKEN · EXIT 64<\u002Fdiv>\n                <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:var(--mu);overflow-x:auto\">Runtime\n  Claude Code       detected (2.1.174)  stale\n    Agent teams needs 2.1.178 or later.\n  agent teams enabled  not set        failed\n    Run: claude settings set env.CLAUD…\n  tool permissions  no allowlist      failed\n    Add a permissions.allow block\nProject\n  .konductor/config.yml not found      info\n    Optional. Run `konductor init`.\nUpdates\n  installed 0.1.0, latest 0.1.2       stale\n    Run: konductor update\n\n3 checks failed.<\u002Fpre>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Statuses mean:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:24px\">\n              <div style=\"display:grid;grid-template-columns:.5fr 2fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">STATUS<\u002Fdiv><div style=\"padding:11px 16px\">MEANING<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:.5fr 2fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--sig)\">ok<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;color:var(--mu)\">Nothing to do<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:.5fr 2fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">info<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Not a problem, but worth knowing — usually an optional thing you have not set up<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:.5fr 2fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mu)\">stale<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;color:var(--mu)\">Works, but a newer version exists<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:.5fr 2fr\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#FF8B8B\">failed<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;color:var(--mu)\">Will not work until you fix it<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">For a machine-readable report<\u002Fh3>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor doctor --json<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:16px\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">OUTPUT<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.8;color:var(--mu);overflow-x:auto\">{\n  \"runtime\": { \"name\": \"kiro-cli\", \"version\": \"0.4.2\", \"status\": \"ok\" },\n  \"content\": { \"agents\": 11, \"skills\": 75, \"sops\": 13, \"context\": 1, \"status\": \"ok\" },\n  \"project\": { \"config\": \".konductor/config.yml\", \"status\": \"ok\" },\n  \"updates\": { \"installed\": \"0.1.0\", \"latest\": \"0.1.0\", \"status\": \"ok\" },\n  \"failed\": 0\n}<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">Use <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">failed<\u002Fspan> rather than the exit code if you want to distinguish a real problem from a usage error — both exit non-zero.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"dg-manual\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 14px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Manual checks<\u002Fh2>\n            <p style=\"margin:0 0 26px;font-size:16px;line-height:1.75;color:var(--mu)\">For things <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">doctor<\u002Fspan> cannot see — mostly questions about <em>why<\u002Fem> a value is what it is. <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">doctor<\u002Fspan> covers installation; the manual checks cover behaviour.<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:18px;background:radial-gradient(120% 140% at 15% 0%,rgba(124,92,255,.1),transparent 60%),var(--bg2);padding:28px 26px;margin-bottom:30px;display:flex;flex-direction:column;gap:16px\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:center\">\n                <span style=\"border:1px solid var(--bd2);border-radius:10px;background:var(--code);padding:11px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#E8E4F5\">konductor doctor<\u002Fspan>\n                <span style=\"color:var(--mu2)\">→<\u002Fspan>\n                <span style=\"border:1px solid rgba(255,107,107,.4);border-radius:10px;background:rgba(255,107,107,.05);padding:11px 16px;font-size:14px;color:var(--mu)\">a check failed → follow the fix it printed<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:center\">\n                <span style=\"border:1px solid var(--lav);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600\">all ok, but behaviour is wrong — what kind of wrong?<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px\">\n                <div style=\"border:1px solid var(--bd2);border-radius:12px;background:var(--surf);padding:15px 17px\"><div style=\"font-size:14px;color:var(--mu);margin-bottom:7px\">a config value surprises me<\u002Fdiv><div style=\"font-size:14.5px;font-weight:600\">Compare the config layers<\u002Fdiv><\u002Fdiv>\n                <div style=\"border:1px solid var(--bd2);border-radius:12px;background:var(--surf);padding:15px 17px\"><div style=\"font-size:14px;color:var(--mu);margin-bottom:7px\">a command did something unexpected<\u002Fdiv><div style=\"font-size:14.5px;font-weight:600\">Read the invocation log<\u002Fdiv><\u002Fdiv>\n                <div style=\"border:1px solid var(--bd2);border-radius:12px;background:var(--surf);padding:15px 17px\"><div style=\"font-size:14px;color:var(--mu);margin-bottom:7px\">an agent misbehaves<\u002Fdiv><div style=\"font-size:14.5px;font-weight:600\">Check the agent's own capabilities<\u002Fdiv><\u002Fdiv>\n                <div style=\"border:1px solid rgba(167,139,250,.5);border-radius:12px;background:rgba(124,92,255,.09);padding:15px 17px\"><div style=\"font-size:14px;color:var(--mu);margin-bottom:7px\">my edits had no effect<\u002Fdiv><div style=\"font-size:14.5px;font-weight:600\">Start a new session<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--lav);margin-top:8px\">YOU
