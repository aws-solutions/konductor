color:var(--mu2)\">{{ sec.codeLang }}<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n                  <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;color:#E8E4F5;overflow-x:auto\">{{ sec.code }}<\u002Fpre>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ sec.hasRows }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:18px\">\n                  <div style=\"display:grid;grid-template-columns:1fr 1.7fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">{{ sec.h1 }}<\u002Fdiv><div style=\"padding:11px 16px\">{{ sec.h2 }}<\u002Fdiv><\u002Fdiv>\n                  <sc-for list=\"{{ sec.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                    <div style=\"display:grid;grid-template-columns:1fr 1.7fr;border-bottom:1px solid var(--bd)\">\n                      <div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.6;color:var(--lav)\">{{ r.k }}<\u002Fdiv>\n                      <div style=\"padding:12px 16px;font-size:14.5px;line-height:1.6;color:var(--mu)\">{{ r.v }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ sec.hasBullets }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:18px\">\n                  <sc-for list=\"{{ sec.bullets }}\" as=\"b\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;gap:14px;align-items:baseline\">\n                      <span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:8px\"><\u002Fspan>\n                      <span style=\"font-size:15.5px;line-height:1.7;color:var(--mu)\">{{ b.text }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ sec.note }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:18px 20px;font-size:15px;line-height:1.7;color:var(--mu)\">{{ sec.note }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ sec.warn }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border:1px solid rgba(255,107,107,.4);border-radius:12px;background:rgba(255,107,107,.05);padding:18px 20px;font-size:15px;line-height:1.7;color:var(--mu)\">{{ sec.warn }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsection>\n          <\u002Fsc-for>\n\n          <div style=\"border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n            <button sc-camel-on-click=\"{{ refPage.goPrev }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← {{ refPage.prevLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ refPage.goNext }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: {{ refPage.nextLabel }} →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <div style=\"width:196px;flex:0 0 196px;padding-top:72px\">\n          <div style=\"position:sticky;top:24px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--bd);padding-left:18px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;color:var(--mu2)\">ON THIS PAGE<\u002Fdiv>\n            <sc-for list=\"{{ refPage.sections }}\" as=\"sec\" hint-placeholder-count=\"6\">\n              <a href=\"#{{ sec.id }}\" style=\"font-size:13px;line-height:1.45;color:var(--mu)\">{{ sec.short }}<\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isStub }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:760px;margin:0 auto;padding:96px 56px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">GUIDE<\u002Fdiv>\n        <h1 style=\"margin:0 0 18px;font-size:44px;line-height:1.04;letter-spacing:-.03em;font-weight:700\">{{ stubTitle }}<\u002Fh1>\n        <p style=\"margin:0 0 28px;font-size:18px;line-height:1.55;color:var(--mu)\">{{ stubSummary }}<\u002Fp>\n        <div style=\"border:1px solid rgba(167,139,250,.35);border-radius:12px;background:rgba(124,92,255,.07);padding:18px 20px;font-size:14.5px;line-height:1.6;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--lav);display:block;margin-bottom:8px\">FULL CONTENT COMING<\u002Fspan>This page is scaffolded in the chosen direction. Its body comes straight from the repository once the direction is locked.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst NAV = [\n  [\"Start here\", \"start\", [[\"home\",\"Overview\"],[\"concepts\",\"Core concepts\"],[\"prerequisites\",\"Prerequisites\"],[\"quick\",\"Quick Start\"]]],\n  [\"Task guides\", \"tasks\", [[\"tasks\",\"Task guides index\"],[\"install-kiro\",\"Install for Kiro CLI\"],[\"install-claude\",\"Install for Claude Code\"],[\"init\",\"Initialize a project\"],[\"config\",\"Read and change configuration\"],[\"diagnose\",\"Diagnose problems\"],[\"update\",\"Update an installation\"],[\"uninstall\",\"Uninstall\"]]],\n  [\"Use cases\", \"usecases\", [[\"usecases\",\"Use cases index\"],[\"uc-codebase\",\"Understand a codebase\"],[\"uc-design\",\"Design a system\"],[\"uc-plan\",\"Plan and verify work\"],[\"uc-review\",\"Review code and tests\"]]],\n  [\"SOP workflows\", \"sops\", [[\"sops\",\"SOP workflows index\"],[\"sop-plan\",\"Planning, analysis, verification\"],[\"sop-design\",\"Design\"],[\"sop-code\",\"Code review and cleanup\"],[\"sop-test\",\"Testing, analysis, specs\"]]],\n  [\"Reference\", \"ref\", [[\"agents\",\"Agents reference\"],[\"skills\",\"Skills catalog\"],[\"reference\",\"CLI reference\"],[\"troubleshooting\",\"Troubleshooting\"],[\"faq\",\"FAQ\"],[\"glossary\",\"Glossary\"],[\"help\",\"Getting help\"],[\"contributing\",\"Contributing and customizing\"]]]\n];\nconst SUMMARY = {\n  concepts: \"Every term Konductor uses — runtime, agent, agent spec, skill, SOP, context file, delegation, maker-checker — defined once, in order.\",\n  prerequisites: \"The software, accounts, and platforms you need before installing: a supported runtime, git, and optional integrations.\",\n  agents: \"All 11 agents, with each one's model, tools, write and shell access, declared skills and SOPs, and delegation targets.\",\n  skills: \"All 75 skills grouped across 8 capability areas, with when to reach for each one.\",\n  reference: \"Command table, flags, config schema, exit codes, and repository layout for the konductor CLI.\",\n  troubleshooting: \"Symptom → cause → fix for the failures people actually hit.\"\n};\nconst AGENTS = [\n  [\"asdlc-orchestrator\", \"The main entry point. Coordinates everything, delegates all work, never implements directly.\"],\n  [\"asdlc-mux-orchestrator\", \"Same coordination, but dispatches specialists into parallel tmux or zellij terminal panes.\"],\n  [\"asdlc-cmux-orchestrator\", \"Same coordination, but dispatches specialists into parallel cmux surfaces.\"],\n  [\"asdlc-product-manager\", \"User stories, requirements, decision research, sprint planning.\"],\n  [\"asdlc-architect\", \"System designs, API models, data models, threat models, design review.\"],\n  [\"asdlc-developer\", \"Task breakdown, backend/frontend implementation, code review, git operations, builds.\"],\n  [\"asdlc-quality-assurance\", \"Test-coverage analysis, E2E test strategy, security test generation, UI text validation.\"],\n  [\"asdlc-researcher\", \"External documentation and web research.\"],\n  [\"asdlc-tpm\", \"Program plans, status reports, risk tracking, effort estimation.\"],\n  [\"asdlc-browser\", \"Browser automation via Playwright — navigation, forms, screenshots, E2E runs.\"],\n  [\"asdlc-media-analyzer\", \"Interprets PDFs, images, and diagrams.\"]\n].map(([name, what]) => ({ name, what }));\nconst DELEGATION = [\n  [\"1\", \"TASK\", \"Exactly one atomic action.\"],\n  [\"2\", \"EXPECTED OUTCOME\", \"Concrete, verifiable deliverables.\"],\n  [\"3\", \"REQUIRED SKILLS\", \"The knowledge modules the specialist should load.\"],\n  [\"4\", \"REQUIRED TOOLS\", \"An explicit allowlist, to prevent tool sprawl.\"],\n  [\"5\", \"MUST DO\", \"Exhaustive requirements, nothing implicit.\"],\n  [\"6\", \"MUST NOT DO\", \"Prohibitions, including a response size limit.\"],\n  [\"7\", \"CONTEXT\", \"Paths, patterns, directories to ignore.\"]\n].map(([n, label, note]) => ({ n, label, note }));\nconst FITS = [\n  [\"1\", \"You describe what you want to the orchestrator.\"],\n  [\"2\", \"The always-active routing rules tell it which specialist owns that kind of work.\"],\n  [\"3\", \"It writes a 7-section delegation and hands the work over.\"],\n  [\"4\", \"The specialist loads whichever skills and SOPs the task needs, does the work, and applies its own maker-checker pass.\"],\n  [\"5\", \"The orchestrator verifies the result against the delegation's expected outcome — and re-delegates if it falls short, up to twice.\"]\n].map(([n, text]) => ({ n, text }));\nconst TASKS = [\n  { id: \"install-kiro\", title: \"Install for Kiro CLI\", what: \"The agent team registered with kiro-cli.\" },\n  { id: \"install-claude\", title: \"Install for Claude Code\", what: \"The agent team registered with claude, including the two settings agent teams require.\" },\n  { id: \"init\", title: \"Initialize a project\", what: \"A .konductor/ directory with a starter config.\" },\n  { id: \"config\", title: \"Read and change configuration\", what: \"Understanding and editing the effective config.\" },\n  { id: \"diagnose\", title: \"Diagnose problems\", what: \"konductor doctor, plus manual checks for behaviour it cannot see.\" },\n  { id: \"update\", title: \"Update an installation\", what: \"The latest release, with your local modifications kept.\" },\n  { id: \"uninstall\", title: \"Uninstall\", what: \"Konductor removed from your machine.\" }\n];\nconst REMOVAL = [\n  { title: \"Project configuration\", note: \"From inside a project you initialized. Back it up first if you might want it.\", cmd: \"cp .konductor/config.yml ~/konductor-config-backup.yml\\nrm -rf .konductor\" },\n  { title: \"Generated runtime files\", note: \"Always safe — dist/ is regenerable with konductor synth and is gitignored.\", cmd: \"rm -rf dist\" },\n  { title: \"User-level configuration and logs\", note: \"Removes the optional user-level config and the invocation log. To keep the config and drop only the log, remove the log file alone.\", cmd: \"rm -rf ~/.konductor\\nrm -f ~/.konductor/logs/konductor.log\" },\n  { title: \"The CLI binary\", note: \"The first form if you downloaded it, the second if you installed from source with cargo install.\", cmd: \"rm ~/.local/bin/konductor\\ncargo uninstall konductor\" }\n];\nconst ARTIFACTS = [\n  { where: \"Runtime agent directories\", by: \"konductor install\", gone: \"konductor uninstall\" },\n  { where: \"<project>/.konductor/config.yml\", by: \"konductor init, config set\", gone: \"you, manually\" },\n  { where: \"<project>/dist/\", by: \"konductor synth\", gone: \"you, manually — gitignored\" },\n  { where: \"~/.konductor/logs/konductor.log\", by: \"every CLI invocation\", gone: \"you, manually\" },\n  { where: \"~/.konductor/config.yml\", by: \"you, by hand\", gone: \"you, manually\" },\n  { where: \"The konductor binary\", by: \"you, downloading or building it\", gone: \"you, manually\" }\n];\nconst USE_CASES = [\n  { id: \"uc-codebase\", title: \"Understand a codebase\", out: \"A read-only critique at .agents/scratchpad/critique-NNN.md, or a full architecture report with three diagrams at codebase-analysis.md\", setup: \"none\", interactive: \"runs start to finish; one optional interactive mode\" },\n  { id: \"uc-design\", title: \"Design a system\", out: \"A PE-ready design doc at docs/design/<slug>.md plus AWS-validation and trade-off side reports, or a review report on an existing design package\", setup: \"a problem statement, or a design_dir\", interactive: \"heaviest — a Socratic interview of 5–15 questions\" },\n  { id: \"uc-plan\", title: \"Plan and verify work\", out: \"An analysis summary, a phased plan with success criteria and a timeline, and a verification evidence report\", setup: \"a stated goal; a working build and test setup\", interactive: \"low — unless an architecture escalation\" },\n  { id: \"uc-review\", title: \"Review code and tests\", out: \"A code review report, four test-coverage files, source files edited in place by one SOP, and an adversarial security review\", setup: \"changes in source_dir; a test_dir; a diff or PR URL\", interactive: \"one hard [y/n] pause\" }\n];\nconst CRITIC_STEPS = [\n  { n: \"01\", title: \"Resolve parameters\", body: \"Defaults critique_scope to uncommitted changes, output_dir to .agents/scratchpad, mode to auto. It will not prompt you, because every parameter has a default.\" },\n  { n: \"02\", title: \"Gather changes\", body: \"Runs git diff and git diff --cached, excluding lock files and build artifacts. If the diff is empty it says so and stops.\" },\n  { n: \"03\", title: \"Critique\", body: \"Analyses across six dimensions: correctness, performance, security, maintainability, architecture, testing. Every finding gets a severity (Critical / Important / Minor) and a dimension tag.\" },\n  { n: \"04\", title: \"Resolve issues\", body: \"In auto mode it picks fix / won't fix / defer per finding with a one-line rationale. Ask for interactive mode to be walked through each finding yourself — that is the only point where this SOP pauses.\" },\n  { n: \"05\", title: \"Finalise\", body: \"Writes the full write-up to .agents/scratchpad/critique-NNN.md, auto-numbered so repeat runs do not overwrite each other.\" },\n  { n: \"06\", title: \"Present\", body: \"A summary only: the file path, counts by severity, one line per Critical finding. It will not paste the document into the conversation.\" }\n];\nconst ANALYSIS_STEPS = [\n  { n: \"01\", title: \"Resolve paths\", body: \"codebase_path (default: current directory) and output_file (default: codebase-analysis.md), then creates the file with a header immediately so writes accumulate.\" },\n  { n: \"02\", title: \"Codebase map\", body: \"Languages, frameworks, entry points, build system, plus a Mermaid graph TD of the directory structure. First diagram.\" },\n  { n: \"03\", title: \"Architecture\", body: \"Style, layer boundaries, dependency direction, plus a Mermaid graph LR dependency graph. Second diagram.\" },\n  { n: \"04\", title: \"SOLID\", body: \"All five principles rated ✅ / ⚠️ / ❌ with a concrete code example each. It will not fabricate examples.\" },\n  { n: \"05\", title: \"Design patterns\", body: \"Gang-of-Four and architectural patterns with file paths, reported only where clearly present. No force-fitting.\" },\n  { n: \"06\", title: \"Dependencies and integrations\", body: \"External and internal catalogue, flagged circular dependencies and outdated packages, plus a Mermaid integration diagram. Third diagram.\" },\n  { n: \"07\", title: \"Code quality\", body: \"Error handling, logging, test-to-source ratio.\" },\n  { n: \"08\", title: \"Security and performance\", body: \"Input validation, auth, hardcoded secrets, N+1 queries, missing pagination.\" },\n  { n: \"09\", title: \"Technical debt\", body: \"TODO/FIXME/HACK/XXX scan, dead code, duplication, each rated CRITICAL / IMPORTANT / SUGGESTION.\" },\n  { n: \"10\", title: \"Final report\", body: \"A 3–5 sentence executive summary plus a P0/P1/P2 prioritised recommendations list.\" }\n];\nconst DESIGN_ARTIFACTS = [\n  { name: \"Threat model\", pattern: \"threat-model.md\" },\n  { name: \"API specification\", pattern: \"smithy-model/ or api-specs/\" },\n  { name: \"Data model\", pattern: \"dynamodb-*.md or data-model.md\" },\n  { name: \"Security policy\", pattern: \"security-policy*.md or iam-policies.md\" },\n  { name: \"Architecture diagram\", pattern: \"*.drawio.xml or architecture-diagram*\" }\n];\nconst DESIGN_PHASES = [\n  { phase: \"PHASE 1\", title: \"Requirements elicitation\", pause: \"PAUSES REPEATEDLY\", body: \"The architect loads socratic-elicitation and asks questions one at a time, waiting for your answer before the next — up to elicitation_depth questions. Default is standard (10); ask for quick (5) or deep (15), or say \\\"skip elicitation\\\" to bypass the phase entirely. Questions are drawn from five dimensions — business value, technical feasibility and dependencies, timeline and coordination, auth and data protection, observability and failure modes — and the agent follows your answers rather than a script. The phase ends with a Requirements Summary (Functional Requirements, Constraints, Non-Functional Requirements, Open Items) that you confirm before Phase 2 begins.\" },\n  { phase: \"PHASE 2\", title: \"Draft generation\", pause: \"NO PAUSE\", body: \"The architect drafts using the outside-in structure: Problem → Requirements → Solution Overview → How It Works → Implementation Details → Implementation Plan. Mermaid diagrams are generated before the prose for each major section. Every significant decision gets an inline ADR via adr-generator: Context, Decision, Alternatives Considered table, Consequences. The draft then goes through a design-doc-guidelines maker-checker pass; any CRITICAL finding is fixed and the pass re-run before Phase 3.\" },\n  { phase: \"PHASE 3\", title: \"Quality gates\", pause: \"NO PAUSE, BY DESIGN\", body: \"Three automated passes, with no user interaction permitted. doc-accuracy-analyzer checks every technical claim against the codebase — INCORRECT and UNVERIFIED findings get inline callouts but do not block. aws-service-validator checks every AWS service and feature claim against live AWS documentation, classifying each CONFIRMED / UNVERIFIED / INCORRECT. trade-off-evaluator scores every multi-option decision 1–5 across cost, latency, complexity, scalability, and operability, and embeds the table in the relevant ADR.\" },\n  { phase: \"PHASE 4\", title: \"Adversarial review loop\", pause: \"CAN PAUSE ONCE\", body: \"The architect challenges its own design across up to 5 rounds, classifying findings CRITICAL (architectural or factual) / IMPORTANT / MINOR. If a CRITICAL architectural finding survives past round 2, the loop stops immediately and you are asked whether to redesign or override — the one hard pause in Phases 2–4. Otherwise it exits early once a round produces 0 CRITICAL, 0 IMPORTANT, and fewer than 3 MINOR findings. No finding is silently dropped: each is either fixed or recorded as an engineer override. If an adversarial-review subagent is available the architect delegates to it; otherwise it self-reviews using the adversarial-design-review skill.\" },\n  { phase: \"PHASE 5\", title: \"Final output\", pause: \"NO PAUSE\", body: \"The architect applies every correction from Phases 3 and 4, runs design-evaluation for a confidence score (the average of 10 dimension scores, 1–5 each; anything below 3 is flagged), writes the final file, and reports the path, the score, and any open issues — without pasting the document into the chat.\" }\n];\nconst DESIGN_REVIEW_STEPS = [\n  { n: \"01\", title: \"Discover artifacts\", body: \"Scans design_dir for the six patterns above, reports found and missing, and warns if system-design.md or threat-model.md is absent. It refuses to evaluate if system-design.md is missing.\" },\n  { n: \"02\", title: \"Confirm scope\", body: \"Shows the list and asks Proceed with review of these artifacts? [y/n]. A hard pause; it will not continue without an answer.\" },\n  { n: \"03\", title: \"Read all artifacts\", body: \"In order: system design → threat model → API specs → data models → security policies → diagrams.\" },\n  { n: \"04\", title: \"Run design-evaluation\", body: \"Scores all 10 dimensions 1–5: template adherence, scalability, security and threat coverage, maintainability, resilience, testability, operational readiness, cost, API quality, data model quality. Below 3 is flagged for revision.\" },\n  { n: \"05\", title: \"Generate report\", body: \"Writes design-review-report.md (or your output_file) with dimension scores and Critical / Important / Suggestion findings.\" },\n  { n: \"06\", title: \"Present recommendation\", body: \"READY FOR IMPLEMENTATION or NOT READY, plus the blockers if not ready.\" }\n];\nconst ANALYZE_STEPS = [\n  { n: \"01\", title: \"Gather context\", body: \"The orchestrator spawns one or two asdlc-researcher instances in parallel to search for existing notification and scheduling patterns, plus another for external library docs if the mail path uses a third-party mailer. Direct grep / rg / ast-grep searches run alongside, scoped to whatever scope you gave (src/notifications/, say).\" },\n  { n: \"02\", title: \"Define analysis questions\", body: \"Answers at minimum the five standard ones: how the system works, patterns in use, dependencies, integration points, existing tests. Plus any you add.\" },\n  { n: \"03\", title: \"Assess complexity\", body: \"Checks a fixed table of escalation triggers: architecture decision required, 3+ component coordination, 2+ failed debugging attempts, security implications. A shift-reminder touching the mailer, the scheduler, and the shift-status model would likely trip \\\"multi-system coordination (3+ components)\\\" and get flagged for architect consultation.\" },\n  { n: \"04\", title: \"Synthesise findings\", body: \"Current State / Patterns Identified / Dependencies / Constraints / Recommended Approach. If this exceeds roughly 100 lines it is written to .konductor/handoff/<analysis-name>.md and the path returned instead of the full text.\" },\n  { n: \"05\", title: \"Proceed to implementation\", body: \"The SOP is explicit about the handoff: \\\"You MUST create an implementation plan (using the plan SOP) based on the analysis summary.\\\" If step 3 flagged an escalation that has not happened, the SOP will not let you past this point.\" }\n];\nconst PLAN_STEPS = [\n  { n: \"01\", title: \"Success criteria\", body: \"Functional / Observable / Pass-Fail. For example: \\\"manager receives exactly one email per unfilled shift, sent 22–26 hours before shift start.\\\"\" },\n  { n: \"02\", title: \"Task breakdown\", body: \"Specific, estimated, prioritised High / Medium / Low. Never vague tasks.\" },\n  { n: \"03\", title: \"Dependency map\", body: \"\\\"Write the reminder-scheduling job\\\" depends on \\\"add a remindAt field to the shift model\\\". No circular dependencies.\" },\n  { n: \"04\", title: \"Agent assignment\", body: \"From the SOP's own table: codebase and doc search → asdlc-researcher; implementation, tests, docs → asdlc-developer; architecture review → asdlc-architect; plan review and estimation → asdlc-tpm.\" },\n  { n: \"05\", title: \"Timeline estimate\", body: \"A buffered baseline (20% floor for well-understood work, 40% for novel or uncertain) is the authoritative number. The orchestrator then delegates an Agentic Projection to asdlc-tpm, which owns legacy-to-agentic-estimate and its convert_estimates.py script, as an informational low/mid/high band alongside the baseline.\" },\n  { n: \"06\", title: \"Execution plan\", body: \"Phases in dependency order, parallel tasks marked, and — load-bearing — \\\"You MUST include a Verification phase using the verify SOP.\\\"\" }\n];\nconst VERIFY_STEPS = [\n  { n: \"01\", title: \"Pre-check\", body: \"Confirms success criteria exist (from step 2) and all TODOs are complete. Will not proceed to build otherwise.\" },\n  { n: \"02\", title: \"Run build\", body: \"Auto-detects the build system, captures the exit code. Stops on failure.\" },\n  { n: \"03\", title: \"Run tests\", body: \"Runs the detected test command plus any separate integration suite or CI job, captures pass/fail counts. Stops on failure.\" },\n  { n: \"04\", title: \"Run lint\", body: \"Captures error and warning counts. Warnings are acceptable; errors block.\" },\n  { n: \"05\", title: \"CDK verification\", body: \"Skipped unless the project has CDK infrastructure code.\" },\n  { n: \"06\", title: \"Manual verification\", body: \"The SOP is explicit: \\\"You MUST NOT skip this step — automated tests alone are insufficient.\\\" Someone actually triggers an unfilled shift 24 hours out and confirms the email arrives.\" },\n  { n: \"07\", title: \"Collect evidence\", body: \"One report combining Build / Tests / Lint / Manual Verification plus a final seven-item checklist.\" }\n];\nconst REVIEW_SOPS = [\n  { n: \"01\", sop: \"k-code-review-workflow\", tag: \"multi-skill review\", prompt: \"Run the k-code-review-workflow SOP against my current branch.\", warn: \"\", out: \"code-review-report.md with a binary verdict and file:line for every surviving finding.\", steps: [\n    { n: \"01\", title: \"Discover changed files\", body: \"Tries git diff main...HEAD (or mainline) for full diff content; falls back to scanning source_dir if not in a git repo. Excludes node_modules/, build/, dist/, cdk.out/, lock files, .js.map.\" },\n    { n: \"02\", title: \"Categorise files\", body: \"Backend (.ts/.js under **/handler*, **/service*, **/repository*, **/lambda*, **/util*, **/middleware*), frontend (.tsx/.jsx, and .ts under **/component*, **/page*, **/hook*), infra (.ts under **/cdk*, **/stack*, **/construct*, **/infra*). Multi-match priority is infra > frontend > backend.\" },\n    { n: \"03\", title: \"Run review skills\", body: \"backend-review, frontend-review, infra-validation on their respective buckets; skips a skill entirely if no matching files.\" },\n    { n: \"04\", title: \"Consolidate\", body: \"Sorts and dedupes into CRITICAL → IMPORTANT → SUGGESTION with file:line references.\" },\n    { n: \"05\", title: \"Critique findings\", body: \"Actively rejects false positives: praise, speculation about unseen code, style-only nits, linter duplicates, vague suggestions with no concrete fix. \\\"When in doubt, reject — false positives erode trust.\\\"\" },\n    { n: \"06\", title: \"Adversarial review\", body: \"Attempts the architect spawn. Always no-ops today (see above), and is skipped by design when review_type is frontend only.\" },\n    { n: \"07\", title: \"Generate report\", body: \"Writes code-review-report.md with a verdict: READY FOR CR or NEEDS FIXES.\" }\n  ] },\n  { n: \"02\", sop: \"k-test-coverage-review\", tag: \"the one with a hard pause\", prompt: \"Run the k-test-coverage-review SOP on src/ against test/.\", warn: \"Supply design_file if you have one. Without it, the security test generator infers services from code rather than the real architecture and may reference services that do not exist — the SOP's own troubleshooting says so.\", out: \"four files under test-coverage-review/.\", steps: [\n    { n: \"01\", title: \"Discover files\", body: \"Reports source count, test count, test-to-source ratio; flags source files with no matching test.\" },\n    { n: \"02\", title: \"Coverage analysis\", body: \"test-coverage-analysis writes test-coverage-review/test-gap-analysis.md, gaps categorised CRITICAL (untested core journeys) / IMPORTANT (untested error paths) / SUGGESTION (edge cases).\" },\n    { n: \"03\", title: \"Confirm scope\", body: \"Plan E2E tests for these gaps? [y/n]. The one hard pause in this chain; it will not proceed without an answer. Pass dry_run: true up front to stop here deliberately and just see the summary.\" },\n    { n: \"04\", title: \"E2E strategy\", body: \"e2e-test-strategy writes test-coverage-review/e2e-test-strategy.md, tests prioritised P0–P3 with a recommended execution strategy.\" },\n    { n: \"05\", title: \"Security test plan\", body: \"security-test-generation writes test-coverage-review/security-test-plan.md, covering all 7 domains (authentication, input validation, API security, data protection, session management, error handling, infrastructure) by layer.\" },\n    { n: \"06\", title: \"Consolidated report\", body: \"Writes test-coverage-review/test-coverage-review-report.md with a READY FOR RELEASE / NOT READY verdict.\" }\n  ] },\n  { n: \"03\", sop: \"k-code-cleanup\", tag: \"the one that touches your source\", prompt: \"Run k-code-cleanup on my branch before I submit.\", warn: \"Commit or stash first. This SOP edits files in place. That is not a bug — it is the one SOP designed to.\", out: \"your source files edited in place, plus cleanup-report.md. Run git diff afterwards — this is the one SOP here where \\\"review\\\" means \\\"changed your code\\\".\", steps: [\n    { n: \"01\", title: \"Get changed files\", body: \"Diffs branch against main / mainline, limited to source_dir, skipping binaries, lock files, and build artifacts.\" },\n    { n: \"02\", title: \"Identify AI slop\", body: \"Flags comments that restate code, defensive checks duplicating existing validation, as any casts, style inconsistent with surroundings, and no-value wrapper abstractions. Explicitly does not flag TODOs, error handling and catch blocks, or comments explaining why.\" },\n    { n: \"03\", title: \"Apply cleanup\", body: \"The modification step. Removes only what step 2 flagged; never touches control flow, return values, or function signatures.\" },\n    { n: \"04\", title: \"Run review skills\", body: \"Re-runs backend-review / frontend-review on the cleaned files.\" },\n    { n: \"05\", title: \"Present summary\", body: \"Writes cleanup-report.md (Removed Items / Preserved Items / Review Findings) with counts removed per category.\" }\n  ] },\n  { n: \"04\", sop: \"k-adversarial-pull-request-review\", tag: \"the security second opinion\", prompt: \"Run k-adversarial-pull-request-review against my current diff.\", warn: \"Across all three technical passes the instruction is the same: check whether the utility already exists before flagging its absence — and flag bypassing it instead. This is not a replacement for k-code-review-workflow; it runs after standard review to catch what style and quality reviewers miss.\", out: \"adversarial-review-report.md with the verdict and per-severity counts.\", steps: [\n    { n: \"00\", title: \"Context ramp-up\", body: \"Reads linked issues and design docs referenced in the diff or commit message (max 3 each) and searches the codebase for existing error-mapping layers, transaction helpers, validation middleware, and pagination utilities relevant to the changed files. One pass per source, no recursive link-following, never blocks on missing context.\" },\n    { n: \"01\", title: \"Ingest diff\", body: \"Accepts git diff output, file paths, or raw diff content; excludes binaries, lock files, build artifacts. Stops if the diff is empty.\" },\n    { n: \"02\", title: \"Security pass\", body: \"Information disclosure, API input leaks, pagination token injection, abstraction boundary violations. CRITICAL if the diff surfaces stack traces, internal IDs, or raw exception messages to a caller, or uses unvalidated input in a query.\" },\n    { n: \"03\", title: \"Data integrity pass\", body: \"Partial writes, unconditional overwrites, missing conditional writes, untested write paths. CRITICAL for any multi-item mutation without a transaction, or an unconditional overwrite on a contested resource. Single-item writes are not flagged.\" },\n    { n: \"04\", title: \"Schema / validation pass\", body: \"Missing map guards, missing standalone fields, validate-then-act ordering, integration wiring gaps. IMPORTANT for ordering violations and wiring gaps. Test files are not flagged.\" },\n    { n: \"05\", title: \"Codebase-awareness pass\", body: \"Flags inline reimplementation of an existing shared utility as IMPORTANT.\" },\n    { n: \"06\", title: \"Verdict\", body: \"Dedupes by file:line and root cause keeping the highest severity, then: any CRITICAL → REQUEST CHANGES; no CRITICAL but ≥1 IMPORTANT → APPROVE WITH COMMENTS; neither → APPROVE.\" }\n  ] }\n];\nconst SOP_CONVENTIONS = [\n  { n: \"01\", title: \"Required parameters are asked for; optional ones are not.\", body: \"A SOP with a default will use it silently rather than interrupting you. asdlc-code-critic states this outright: \\\"You MUST NOT ask for parameters that have defaults.\\\"\" },\n  { n: \"02\", title: \"Findings use one severity vocabulary.\", body: \"CRITICAL, IMPORTANT, SUGGESTION — sorted in that order. (Some SOPs use Critical / Important / Minor for the same three levels.)\" },\n  { n: \"03\", title: \"The report is a file, not a wall of text.\", body: \"Almost every report-producing SOP says \\\"You MUST NOT print the full report in your response — reference the file.\\\"\" },\n  { n: \"04\", title: \"Fix cycles are capped at 2.\", body: \"asdlc-delegate caps re-delegation at 2 cycles; kiro-spec-workflow caps revise-and-re-present at 2 cycles per document.\" },\n  { n: \"05\", title: \"Explicit confirmation gates are real stops.\", body: \"Where a SOP asks [y/n], it will not proceed without your answer.\" }\n];\nconst SOP_ROWS = [\n  { sop: \"asdlc-plan\", what: \"Work breakdown with success criteria, dependencies, agent assignments, and a timeline\", when: \"Before starting any non-trivial multi-step work\", page: \"sop-plan\" },\n  { sop: \"asdlc-analyze\", what: \"Pre-implementation context gathering across parallel research agents\", when: \"Unfamiliar code, 3+ components, or after 2 failed debugging attempts\", page: \"sop-plan\" },\n  { sop: \"asdlc-verify\", what: \"Build, test, lint, CDK checks, manual verification, and an evidence report\", when: \"Before declaring anything done\", page: \"sop-plan\" },\n  { sop: \"asdlc-delegate\", what: \"Assembles the 7-section delegation prompt and verifies the result\", when: \"Internal — the orchestrator uses this itself\", page: \"sop-plan\" },\n  { sop: \"k-design-doc-creation\", what: \"Five-phase authoring of a PE-ready design doc, with an adversarial review loop\", when: \"You need to write a design document\", page: \"sop-design\" },\n  { sop: \"k-existing-design-review\", what: \"10-dimension evaluation of existing design artifacts\", when: \"You need to review design artifacts before implementation\", page: \"sop-design\" },\n  { sop: \"k-code-review-workflow\", what: \"Multi-skill review across backend, frontend, and infra, with a consolidated report. Its step-6 adversarial pass never fires\", when: \"Before opening a code review on a branch\", page: \"sop-code\" },\n  { sop: \"asdlc-code-critic\", what: \"Fast, strictly read-only critique across 6 dimensions\", when: \"Quick sanity check on uncommitted work\", page: \"sop-code\" },\n  { sop: \"k-adversarial-pull-request-review\", what: \"Security-focused review arguing against approval\", when: \"After standard review, on anything security-sensitive\", page: \"sop-code\" },\n  { sop: \"k-code-cleanup\", what: \"Removes AI-generated slop from a diff, then re-reviews\", when: \"Before submitting AI-assisted changes\", page: \"sop-code\" },\n  { sop: \"k-test-coverage-review\", what: \"Gap analysis, E2E strategy, and a security test plan in sequence\", when: \"After implementation, before release\", page: \"sop-test\" },\n  { sop: \"asdlc-codebase-analysis\", what: \"Deep architecture, SOLID, patterns, and technical-debt assessment\", when: \"Onboarding to unfamiliar code, or planning a refactor\", page: \"sop-test\" },\n  { sop: \"kiro-spec-workflow\", what: \"Chains three skills into a complete Kiro IDE spec\", when: \"You want requirements.md + design.md + tasks.md\", page: \"sop-test\" }\n];\nconst SOP_OWNERS = [\n  { agent: \"asdlc-orchestrator\", sops: \"kiro-spec-workflow, asdlc-delegate, asdlc-plan, asdlc-analyze, asdlc-verify\" },\n  { agent: \"asdlc-mux-orchestrator\", sops: \"kiro-spec-workflow, asdlc-plan, asdlc-analyze, asdlc-verify\" },\n  { agent: \"asdlc-cmux-orchestrator\", sops: \"kiro-spec-workflow, asdlc-plan, asdlc-analyze, asdlc-verify\" },\n  { agent: \"asdlc-architect\", sops: \"k-design-doc-creation, k-existing-design-review, k-adversarial-pull-request-review\" },\n  { agent: \"asdlc-developer\", sops: \"k-code-cleanup, asdlc-code-critic, asdlc-codebase-analysis, k-code-review-workflow\" },\n  { agent: \"asdlc-quality-assurance\", sops: \"k-test-coverage-review, k-code-review-workflow\" },\n  { agent: \"product-manager · researcher · tpm · browser · media-analyzer\", sops: \"none\" }\n];\nconst SOP_PAIRS = [\n  { pair: \"asdlc-code-critic vs k-code-review-workflow\", diff: \"The critic is faster, scoped to local changes, and strictly read-only — it never modifies files, commits, or runs builds. k-code-review-workflow runs the full multi-skill review across categorized files and produces a verdict.\" },\n  { pair: \"k-code-review-workflow vs k-adversarial-pull-request-review\", diff: \"The adversarial SOP is explicitly not a replacement for standard review — it runs after, targeting what style and quality reviewers miss: information disclosure, data integrity, and schema gaps.\" },\n  { pair: \"k-design-doc-creation vs k-existing-design-review\", diff: \"Creation is for authoring new documents. Review is for evaluating existing artifacts, and its own header marks it deprecated for design doc review in favor of k-design-doc-creation for new docs.\" },\n  { pair: \"asdlc-analyze vs asdlc-codebase-analysis\", diff: \"asdlc-analyze is a pre-task research step feeding straight into implementation. asdlc-codebase-analysis produces a standalone deep-dive reference document with SOLID evaluation, pattern identification, and debt scoring.\" }\n];\nfunction node(n, label, note, role) {\n  return { n, label, note,\n    isGate: role === \"gate\", isStop: role === \"stop\", isGood: role === \"good\",\n    isSkip: role === \"skip\", isDecision: role === \"decision\" };\n}\nfunction param(name, req, def) {\n  return { name, req: req ? \"YES\" : \"no\", reqColor: req ? \"var(--sig)\" : \"var(--mu2)\", def };\n}\nconst SOP_PAGES = {\n  \"sop-plan\": {\n    eyebrow: \"PLANNING, ANALYSIS, VERIFICATION\", title: \"Planning, analysis, and verification\",\n    intro: \"The four SOPs declared by the orchestrators. Together they cover the front and back ends of a piece of work: plan it, gather context for it, delegate it, and verify it is actually done.\",\n    prev: [\"sops\", \"SOP workflows\"], next: [\"sop-design\", \"Design\"],\n    sops: [\n      { name: \"asdlc-plan\", file: \"agent-sops/asdlc-plan.sop.md\", owner: \"all three orchestrators\",\n        what: \"Turns an objective into a work breakdown: measurable success criteria, prioritized tasks with effort estimates, a dependency map, per-task agent assignments, a buffered timeline, and a phased execution plan.\",\n        when: \"Multi-step tasks needing coordination, complex features needing structure, before starting any non-trivial implementation, or when the scope itself needs clarification.\",\n        get: \"A success-criteria block, a prioritized task list, a dependency map, an agent assignment table, a timeline table with a Total Estimated Effort (baseline), and a phased execution plan.\",\n        prompt: \"Run the asdlc-plan SOP. objective: add rate limiting to the public API\",\n        params: [param(\"objective\", true, \"—\"), param(\"scope\", false, \"none — boundaries such as specific directories, services, or components\"), param(\"constraints\", false, \"none — deadlines, technology restrictions, team availability\")],\n        flow: [\n          node(\"00\", \"objective provided?\", \"If not, the SOP asks for it and waits.\", \"gate\"),\n          node(\"01\", \"Define success criteria\", \"Functional / Observable / Pass-Fail. Loops until criteria are actually defined.\", \"\"),\n          node(\"02\", \"Break down tasks\", \"Each with an effort estimate and High / Medium / Low priority. Never vague tasks.\", \"\"),\n          node(\"03\", \"Map dependencies\", \"Blocking, parallel, external. No circular dependencies.\", \"\"),\n          node(\"04\", \"Assign to agents\", \"Via the SOP's own assignment table.\", \"\"),\n          node(\"05\", \"Estimate timeline\", \"Group into phases, sum serial effort, apply the buffer floor: 20% known / 40% novel = Total Estimated Effort (baseline).\", \"\"),\n          node(\"06\", \"Agentic Projection — three-way fallback\", \"Preferred: delegate to asdlc-tpm, which runs legacy-to-agentic-estimate and its script, passing each task individually. If unreachable but the method applies: self-compute from the documented formula and state it was not script-verified. If no defensible tier can be inferred: skip the projection, say why in one line, report the baseline alone.\", \"decision\"),\n          node(\"07\", \"Create execution plan\", \"Phases ordered by dependencies, parallel tasks marked, a Verification phase included, and a Documentation phase if the change is user-facing.\", \"good\")\n        ],\n        flowCaption: \"asdlc-plan: six steps, with a three-way fallback on the agentic estimate.\",\n        extraTitle: \"AGENT ASSIGNMENT — FROM THE SOP'S OWN TABLE\",\n        extraRows: [\n          { k: \"asdlc-researcher\", v: \"Codebase search and external research\" },\n          { k: \"asdlc-developer\", v: \"Implementation and tests\" },\n          { k: \"asdlc-architect\", v: \"Architecture review\" },\n          { k: \"asdlc-media-analyzer\", v: \"Media analysis\" },\n          { k: \"asdlc-tpm\", v: \"Plan review and effort estimation\" }\n        ],\n        know: [\n          { title: \"The baseline is the commitment; the projection is not.\", body: \"The SOP requires the buffered baseline to be presented as authoritative, and forbids presenting the Agentic Projection as the committed estimate.\" },\n          { title: \"The buffer has a floor.\", body: \"20% for well-understood work, 40% for novel or uncertain work. There is no zero-buffer tier.\" },\n          { title: \"The projection's precision is not real.\", body: \"The SOP requires carrying the caveat that tier presets are uncalibrated defaults pending team telemetry, and instructs treating differences finer than about 15 minutes as noise. It also forbids narrowing or collapsing the low–high band to just the mid point.\" },\n          { title: \"A skipped projection is not a failure.\", body: \"The SOP says so explicitly: the baseline is authoritative and complete without it.\" }\n        ] },\n      { name: \"asdlc-analyze\", file: \"agent-sops/asdlc-analyze.sop.md\", owner: \"all three orchestrators\",\n        what: \"Gathers comprehensive context before implementation begins — parallel research agents plus direct tool searches — then answers a fixed set of questions, checks whether the work needs architect escalation, and synthesizes findings into a structured summary.\",\n        when: \"Before implementing in unfamiliar code, for complex multi-system changes, when debugging after 2+ failed attempts, for architecture decisions, or to understand existing patterns.\",\n        get: \"An Analysis Summary — Current State, Patterns Identified, Dependencies, Constraints, Recommended Approach — in the conversation, or at .konductor/handoff/<analysis-name>.md if it runs long. Then a mandatory handoff into asdlc-plan.\",\n        prompt: \"Run the asdlc-analyze SOP. target: the authentication middleware\",\n        params: [param(\"target\", true, \"—\"), param(\"analysis_questions\", false, \"none — added to the five standard questions\"), param(\"scope\", false, \"none — directories, services, or components to focus on\")],\n        flow: [\n          node(\"00\", \"target provided?\", \"If not, the SOP asks for it and waits.\", \"gate\"),\n          node(\"01\", \"Gather context — in parallel\", \"One or two asdlc-researcher instances on codebase patterns and structure; one or two more on external library docs if external dependencies are involved; direct grep / rg and ast-grep structural search alongside.\", \"\"),\n          node(\"02\", \"Answer the five standard questions\", \"Plus any supplied analysis_questions. Loops back to gathering if any remain unanswered.\", \"\"),\n          node(\"03\", \"Assess complexity\", \"Checks every escalation indicator. Any one true → recommend escalation to asdlc-architect, with the reason.\", \"decision\"),\n          node(\"04\", \"Synthesize findings\", \"Current State · Patterns · Dependencies · Constraints · Recommended Approach. Over roughly 100 lines, written to .konductor/handoff/<name>.md and only the path returned.\", \"\"),\n          node(\"05\", \"Gate: questions answered AND escalation resolved?\", \"If not: do not proceed to implementation.\", \"stop\"),\n          node(\"06\", \"Hand off to asdlc-plan\", \"Define success criteria before any code.\", \"good\")\n        ],\n        flowCaption: \"asdlc-analyze: parallel gathering, then two hard gates before implementation may begin.\",\n        extraTitle: \"THE FIVE STANDARD QUESTIONS · AND THE ESCALATION INDICATORS\",\n        extraRows: [\n          { k: \"Always answered\", v: \"How does the existing system work? What patterns are currently used? What dependencies are involved? What are the integration points? What tests exist?\" },\n          { k: \"Architecture decision required\", v: \"Escalate\" },\n          { k: \"Multi-system coordination (3+ components)\", v: \"Escalate\" },\n          { k: \"Debugging after 2+ failed fix attempts\", v: \"Escalate\" },\n          { k: \"Security implications\", v: \"Escalate\" },\n          { k: \"Simple implementation with clear patterns\", v: \"Proceed\" }\n        ],\n        know: [\n          { title: \"Test files are never skipped\", body: \"during context gathering — the SOP forbids it.\" },\n          { title: \"Large findings go to a file.\", body: \"Over roughly 100 lines, the synthesis is written to .konductor/handoff/<analysis-name>.md and only the path is returned. Note this is a different .konductor/ subdirectory from anything the CLI creates.\" },\n          { title: \"This SOP does not write code.\", body: \"It ends by handing off to asdlc-plan, or by recommending escalation with specific questions.\" },\n          { title: \"Execution context matters.\", body: \"The SOP notes its steps run shell commands and may write files; an agent without those tools delegates them to specialists per its routing rules. This is why the read-only orchestrator can still run it.\" }\n        ] },\n      { name: \"asdlc-verify\", file: \"agent-sops/asdlc-verify.sop.md\", owner: \"all three orchestrators\",\n        what: \"Runs the full verification battery — build, tests, lint, CDK checks where applicable, and manual verification — then collects everything into one evidence report with a final checklist.\",\n        when: \"After completing implementation, before declaring any task done, when you ask for verification, or after a bug fix to confirm the fix.\",\n        get: \"A Verification Evidence report: every step's command, exit code, output, and status, plus the seven-item final checklist.\",\n        prompt: \"Run the asdlc-verify SOP. source_dir: src/\",\n        params: [param(\"source_dir\", true, \"—\"), param(\"success_criteria\", false, \"none — typically carried over from asdlc-plan\"), param(\"build_system\", false, \"auto-detect. One of npm, cargo, go, python, gradle, maven\")],\n        flow: [\n          node(\"01\", \"Pre-check\", \"Success criteria defined? All TODOs complete? If not, asks you to define criteria or extracts them from task context.\", \"gate\"),\n          node(\"02\", \"Run build\", \"Auto-detected from project files. Stops on failure — fix build errors first.\", \"stop\"),\n          node(\"03\", \"Run tests\", \"Captures pass / fail counts, plus any integration suite or CI job. Stops on failure.\", \"stop\"),\n          node(\"04\", \"Run lint\", \"Captures errors and warnings. Errors stop the chain; warnings are acceptable.\", \"stop\"),\n          node(\"05\", \"CDK verification\", \"Only if CDK code is present: cdk ls → cdk diff → cdk synth, flagging unexpected stack changes.\", \"skip\"),\n          node(\"06\", \"Manual verification\", \"What was tested, the steps, what was observed — cannot be skipped. If observed does not match expected, do not declare success.\", \"gate\"),\n          node(\"07\", \"Collect evidence\", \"One report. Every checklist item must pass, or the task is not complete.\", \"good\")\n        ],\n        flowCaption: \"asdlc-verify: a strict gate chain. Any failing step halts the sequence.\",\n        extraTitle: \"BUILD-SYSTEM AUTO-DETECTION — BUILD / TEST / LINT\",\n        extraRows: [\n          { k: \"package.json\", v: \"npm run build · npm test · npm run lint\" },\n          { k: \"Cargo.toml\", v: \"cargo build · cargo test · cargo clippy\" },\n          { k: \"go.mod\", v: \"go build ./... · go test ./... · golangci-lint run\" },\n          { k: \"pyproject.toml or setup.py\", v: \"python -m build · pytest · ruff check .\" },\n          { k: \"build.gradle(.kts)\", v: \"gradle build · gradle test · gradle checkstyleMain, or the project's configured plugin\" },\n          { k: \"pom.xml\", v: \"mvn compile · mvn test · mvn checkstyle:check, or the project's configured plugin\" },\n          { k: \"Wrapper preference\", v: \"./gradlew over gradle when gradlew exists; pnpm or yarn over npm when pnpm-lock.yaml or yarn.lock exists. For Gradle and Maven, inspect the build configuration for a configured lint plugin first — Java and Kotlin linting is project-specific.\" }\n        ],\n        know: [\n          { title: \"Lint warnings are acceptable; lint errors are not.\", body: \"That distinction is explicit.\" },\n          { title: \"Manual verification cannot be skipped.\", body: \"The SOP states automated tests alone are insufficient.\" },\n          { title: \"The final checklist is all-or-nothing.\", body: \"Seven items: success criteria met, build passes, tests pass, lint passes, manual verification complete, no regressions, documentation updated if applicable. Any failure means the task is not complete.\" }\n        ] },\n      { name: \"asdlc-delegate\", file: \"agent-sops/asdlc-delegate.sop.md\", owner: \"asdlc-orchestrator only\",\n        what: \"Builds the 7-section delegation prompt the orchestrator sends to a specialist, then verifies what comes back.\",\n        when: \"Normally you would not invoke it. This is internal machinery — the orchestrator uses it on every delegation. Reading it is still worthwhile: it tells you exactly what the orchestrator is sending on your behalf, and its 8-step structure explains the \\\"up to 2 fix cycles\\\" behaviour you will see in practice.\",\n        get: \"A complete 7-section delegation prompt, sent to the target agent, then verified against a six-item checklist — with re-delegation up to twice.\",\n        prompt: \"\",\n        params: [param(\"task_description\", true, \"—\"), param(\"target_agent\", true, \"— e.g. asdlc-researcher, asdlc-developer, asdlc-media-analyzer, asdlc-browser\"), param(\"context_paths\", false, \"none — relevant paths, directories, or URLs\"), param(\"language\", false, \"auto-detect from project\")],\n        flow: [\n          node(\"00\", \"task_description AND target_agent present?\", \"If either is missing, the SOP asks and waits.\", \"gate\"),\n          node(\"01\", \"Build sections 1–6\", \"TASK (exactly one atomic action) · EXPECTED OUTCOME (measurable deliverables) · REQUIRED SKILLS + TOOLS (explicit allowlist) · MUST DO (exhaustive, nothing implicit) · MUST NOT DO (includes a response size limit) · CONTEXT (root path, source dirs, ignore list, patterns).\", \"\"),\n          node(\"02\", \"Assemble the 7-section prompt\", \"Substitute the real target agent. Omit no section.\", \"\"),\n          node(\"03\", \"Send to the target agent\", \"\", \"\"),\n          node(\"04\", \"Verify results against the six-item checklist\", \"All pass → results usable, continue.\", \"decision\"),\n          node(\"05\", \"Re-delegate if checks fail\", \"Fewer than 2 fix cycles used → re-delegate. Otherwise stop: the 2-cycle cap is reached.\", \"stop\")\n        ],\n        flowCaption: \"asdlc-delegate: build all seven sections, send, verify, re-delegate up to twice.\",\n        extraTitle: \"THE VERIFICATION CHECKLIST — ALL SIX, EVERY TIME\",\n        extraRows: [\n          { k: \"01\", v: \"Did the agent complete the TASK?\" },\n          { k: \"02\", v: \"Did it provide the EXPECTED OUTCOME?\" },\n          { k: \"03\", v: \"Did it use only the REQUIRED TOOLS?\" },\n          { k: \"04\", v: \"Did it follow the MUST DO requirements?\" },\n          { k: \"05\", v: \"Did it avoid the MUST NOT DO prohibitions?\" },\n          { k: \"06\", v: \"Are the results usable for next steps?\" }\n        ],\n        know: [\n          { title: \"Every section is mandatory.\", body: \"The SOP forbids omitting any of the seven.\" },\n          { title: \"The tool allowlist exists to prevent tool sprawl\", body: \"— giving an agent only what the task needs.\" },\n          { title: \"A response size limit belongs in MUST NOT DO.\", body: \"The SOP's example is \\\"Do not return responses exceeding ~100 lines\\\", alongside \\\"do not return raw file contents or complete source code — summarize with file paths and key snippets\\\".\" },\n          { title: \"It carries a language reference table\", body: \"mapping concepts (source files, test files, HTTP client, package manager, build command, test command) across Go, Java, Kotlin, Python, Swift, and TypeScript, so examples written in TypeScript can be adapted to whatever the project uses.\" }\n        ] }\n    ]\n  },\n  \"sop-design\": {\n    eyebrow: \"DESIGN\", title: \"Design\",\n    intro: \"Two SOPs, both declared by asdlc-architect. One authors a design document; the other evaluates design artifacts that already exist. k-existing-design-review's own header marks it deprecated for design doc review — use k-design-doc-creation when authoring, and the review workflow for a directory of already-produced artifacts before implementation.\",\n    prev: [\"sop-plan\", \"Planning, analysis, verification\"], next: [\"sop-code\", \"Code review and cleanup\"],\n    sops: [\n      { name: \"k-design-doc-creation\", file: \"agent-sops/k-design-doc-creation.sop.md\", owner: \"asdlc-architect\",\n        what: \"Five phases producing a design document ready for principal engineer review: Socratic requirements elicitation, outside-in drafting with Mermaid diagrams and inline ADRs, automated quality gates, an adversarial review loop, and a final confidence-scored artifact.\",\n        when: \"When you need to create or write a design document. The SOP names the triggering phrasings: \\\"Design a system for X\\\", \\\"I need a design doc for Y\\\".\",\n        get: \"The design document at output_path, plus docs/design/<name>-aws-validation.md and docs/design/<name>-tradeoffs.md — and a spoken summary: the output path, the confidence score with any section scoring below 3, and a one-line note on remaining open issues.\",\n        prompt: \"Design a system for ingesting IoT sensor events and alerting on anomalies.\",\n        params: [param(\"topic\", true, \"— free-form description, user stories, or a problem statement\"), param(\"output_path\", false, \"docs/design/<slugified-topic>.md\"), param(\"elicitation_depth\", false, \"standard — quick (5 questions), standard (10), deep (15)\")],\n        flow: [\n          node(\"00\", \"topic provided?\", \"The SOP asks once and waits. It will not ask for output_path or elicitation_depth — it uses the defaults and proceeds.\", \"gate\"),\n          node(\"01\", \"Phase 1 — Requirements elicitation\", \"socratic-elicitation, Mode A: questions one at a time, answer-driven, across five dimensions — PM · SDE · TPM · Security · Ops — capped at elicitation_depth. Skippable by saying \\\"skip elicitation\\\" or \\\"I have clear requirements\\\". Loops until a Requirements Summary is produced and confirmed, or an early-exit signal is given.\", \"gate\"),\n          node(\"02\", \"Phase 2 — Draft generation\", \"design-doc-guidelines structure: Problem → Requirements → Solution Overview → How It Works → Implementation Details → Implementation Plan. Mermaid diagrams before prose; an inline ADR per significant decision. Maker-checker loops until zero CRITICAL findings.\", \"\"),\n          node(\"03\", \"Phase 3 — Quality gates\", \"No user interaction. doc-accuracy-analyzer verifies claims against the codebase, flagging INCORRECT / UNVERIFIED inline. aws-service-validator checks every AWS claim via aws-mcp (CONFIRMED / UNVERIFIED / INCORRECT) and writes the validation report. trade-off-evaluator scores 1–5 on cost, latency, complexity, scalability, operability and writes the trade-off report. adr-generator verifies the Phase 2 ADRs are embedded — enrich only, never regenerate.\", \"\"),\n          node(\"04\", \"Phase 4 — Adversarial review\", \"Path A: delegate the full doc to an adversarial-review subagent if one is available — challenge every decision, trade-off, and AWS service choice. Path B: adversarial self-review, classifying CRITICAL (architectural) · CRITICAL (factual) · IMPORTANT · MINOR. Up to 5 rounds, applying corrections and re-running the guidelines maker-checker between rounds.\", \"decision\"),\n          node(\"05\", \"Circuit-breaker after round 2\", \"If any CRITICAL (architectural) finding survives, the loop stops immediately and you are asked: redesign or override? Otherwise it exits early on 0 CRITICAL, 0 IMPORTANT, fewer than 3 MINOR — or presents remaining issues for manual resolution once 5 rounds are used.\", \"stop\"),\n          node(\"06\", \"Phase 5 — Final output\", \"Apply all Phase 3 and 4 corrections, run design-evaluation for a confidence score (the average of 10 dimensions, 1–5 each), write to output_path, and reference the path — never inline the doc.\", \"good\")\n        ],\n        flowCaption: \"k-design-doc-creation: five phases, with Path A / Path B on adversarial review and a hard circuit-breaker after round 2.\",\n        extraTitle: \"THE QUALITY GATE — ALL FOUR MUST HOLD\",\n        extraRows: [\n          { k: \"design-doc-guidelines maker-checker\", v: \"0 CRITICAL findings\" },\n          { k: \"doc-accuracy-analyzer\", v: \"0 INCORRECT findings — UNVERIFIED is acceptable with callouts\" },\n          { k: \"Adversarial review\", v: \"0 CRITICAL, 0 IMPORTANT, fewer than 3 MINOR\" },\n          { k: \"design-evaluation confidence score\", v: \"≥ 3.0 average across all sections\" },\n          { k: \"If any condition fails\", v: \"It presents the remaining issues and asks: Fix these before submission? [y/n]\" }\n        ],\n        know: [\n          { title: \"Phase 3 never asks you anything.\", body: \"It is fully automated by design.\" },\n          { title: \"Unverified claims do not block.\", body: \"Both doc-accuracy-analyzer and aws-service-validator mark UNVERIFIED claims with a callout and proceed. Only INCORRECT findings are treated as blocking.\" },\n          { title: \"Findings are never silently dropped.\", body: \"Every Phase 4 finding must either be fixed or explicitly recorded as \\\"engineer override\\\".\" },\n          { title: \"Diagrams come before prose.\", body: \"Phase 2 requires generating the Mermaid diagram for each major section before writing that section's text.\" },\n          { title: \"The document is never printed inline.\", body: \"Phase 5 requires referencing the file path.\" }\n        ] },\n      { name: \"k-existing-design-review\", file: \"agent-sops/k-existing-design-review.sop.md\", owner: \"asdlc-architect\",\n        what: \"Collects the design artifacts in a directory — system design, threat model, API specs, data models, security policies, architecture diagrams — and evaluates them across 10 dimensions with a numeric score each.\",\n        when: \"After all design artifacts are complete and before implementation starts. For authoring a new document, use k-design-doc-creation instead.\",\n        get: \"design-review-report.md (or your output_file) containing an executive summary, a dimension score table, CRITICAL / IMPORTANT / SUGGESTION sections, and a recommendation of READY FOR IMPLEMENTATION or NOT READY. The SOP reports the file location and the recommendation but does not print the report body.\",\n        prompt: \"Run the k-existing-design-review SOP. design_dir: design-architecture/outputs/\",\n        params: [param(\"design_dir\", true, \"—\"), param(\"output_file\", false, \"design-review-report.md\"), param(\"dry_run\", false, \"false\")],\n        flow: [\n          node(\"00\", \"design_dir provided?\", \"If a required parameter is missing, the SOP asks for all parameters in a single prompt, using their exact names.\", \"gate\"),\n          node(\"01\", \"Discover artifacts in design_dir\", \"Reports found and missing.\", \"\"),\n          node(\"02\", \"Gate: is system-design.md present?\", \"Without it the SOP stops rather than producing a partial evaluation.\", \"stop\"),\n          node(\"03\", \"Confirm scope\", \"\\\"Proceed with review of these artifacts? [y/n]\\\" — a real stop; it will not continue without an answer.\", \"gate\"),\n          node(\"04\", \"dry_run exit\", \"With dry_run: true, it reports what would be reviewed, generates no report, and stops here.\", \"skip\"),\n          node(\"05\", \"Read all artifacts\", \"In order: system design → threat model → API specs → data models → security policies → diagrams. Missing optional ones are noted as \\\"not provided\\\".\", \"\"),\n          node(\"06\", \"Run design-evaluation\", \"Scores all 10 dimensions 1–5, flags any dimension below 3, classifies findings CRITICAL / IMPORTANT / SUGGESTION.\", \"\"),\n          node(\"07\", \"Write report and present recommendation\", \"Writes to output_file, never printing its contents inline, then: READY FOR IMPLEMENTATION (important issues reported as non-blocking) or NOT READY (the critical issues that must be resolved, with an offer to fix them using architect skills).\", \"good\")\n        ],\n        flowCaption: \"k-existing-design-review: a required artifact, a confirmation gate, and a dry-run exit.\",\n        extraTitle: \"ARTIFACTS IT LOOKS FOR · AND THE 10 DIMENSIONS\",\n        extraRows: [\n          { k: \"system-design.md\", v: \"System architecture — REQUIRED; evaluation cannot proceed without it\" },\n          { k: \"threat-model.md\", v: \"Threat model — critical; warned if missing, but degrades rather than blocks (the security and threat coverage dimension is limited)\" },\n          { k: \"smithy-model/ or api-specs/\", v: \"API specifications — optional\" },\n          { k: \"dynamodb-*.md or data-model.md\", v: \"Data models — optional\" },\n          { k: \"security-policy*.md or iam-policies.md\", v: \"Security policies — optional\" },\n          { k: \"*.drawio.xml or architecture-diagram*\", v: \"Architecture diagrams — optional\" },\n          { k: \"The 10 dimensions\", v: \"Template adherence and completeness · scalability and performance · security and threat coverage · maintainability and code quality · resilience and fault tolerance · testability · operational readiness · cost optimization · API design quality · data model quality\" }\n        ],\n        know: [\n          { title: \"system-design.md is a hard requirement.\", body: \"Without it the SOP stops. If you do not have one, its own troubleshooting suggests generating it first with asdlc-architect and the system-design-patterns skill.\" },\n          { title: \"The confirmation gate is real.\", body: \"It will not proceed without an explicit answer.\" },\n          { title: \"dry_run: true stops at step 2\", body: \"and reports what would be reviewed.\" },\n          { title: \"Only IMPORTANT issues is still READY.\", body: \"The SOP's troubleshooting states a design with only IMPORTANT issues remains ready for implementation.\" }\n        ] }\n    ]\n  },\n  \"sop-code\": {\n    eyebrow: \"CODE REVIEW AND CLEANUP\", title: \"Code review and cleanup\",\n    intro: \"Four SOPs that examine code changes. They are not interchangeable — see \\\"choosing between overlapping SOPs\\\" on the index page if you are unsure which one you want. Only one of them, k-code-cleanup, modifies your files.\",\n    prev: [\"sop-design\", \"Design\"], next: [\"sop-test\", \"Testing, codebase analysis, specs\"],\n    sops: [\n      { name: \"k-code-review-workflow\", file: \"agent-sops/k-code-review-workflow.sop.md\", owner: \"asdlc-developer, asdlc-quality-assurance — no file changes\",\n        what: \"Discovers changed files, sorts them into backend / frontend / infra, runs the matching review skill on each category, consolidates and deduplicates the findings, filters false positives, optionally adds an adversarial pass, and writes one prioritized report.\",\n        when: \"Before opening a code review on a branch — this is the standard full review.\",\n        get: \"code-review-report.md (or your output_file) with a date, file counts by category, a summary line of CRITICAL: N | IMPORTANT: N | SUGGESTION: N, numbered issue sections with file:line references, and a verdict of READY FOR CR or NEEDS FIXES.\",\n        prompt: \"Run the k-code-review-workflow SOP against my current branch.\",\n        params: [param(\"source_dir\", true, \"—\"), param(\"review_type\", false, \"all — or backend, frontend, infra\"), param(\"output_file\", false, \"code-review-report.md\"), param(\"cr_url\", false, \"none — passed to the adversarial step when present\")],\n        flow: [\n          node(\"00\", \"source_dir provided?\", \"If not, the SOP asks for it and waits.\", \"gate\"),\n          node(\"01\", \"Discover changed files\", \"In a git repo: git diff main...HEAD (or mainline), capturing full hunks. Otherwise: recursively scan source_dir. Either way it excludes node_modules/, build/, dist/, cdk.out/, lock files, .js.map.\", \"\"),\n          node(\"02\", \"Categorize files\", \"Priority when several match: infra > frontend > backend. Filtered to review_type if it is not all.\", \"\"),\n          node(\"03\", \"Run review skills per non-empty category\", \"backend-review · frontend-review · infra-validation.\", \"\"),\n          node(\"04\", \"Consolidate\", \"Sort CRITICAL → IMPORTANT → SUGGESTION, deduplicate across skills, attach file:line to each finding.\", \"\"),\n          node(\"05\", \"Critique findings\", \"When in doubt, reject. A surviving finding must state the problem, why it matters, and a concrete fix.\", \"gate\"),\n          node(\"06\", \"Adversarial pass — never actually fires\", \"Would spawn asdlc-architect in adversarial mode with the same diff as diff_input (plus cr_url if supplied), applying step 5's filters and merging new CRITICAL / IMPORTANT only. Skipped by design for frontend-only reviews — and skipped in practice always, because neither owning agent can spawn the architect.\", \"skip\"),\n          node(\"07\", \"Write report to output_file\", \"State the verdict — READY FOR CR or NEEDS FIXES — and never print the full report inline.\", \"good\")\n        ],\n        flowCaption: \"k-code-review-workflow: categorize, review per category, then filter hard before reporting.\",\n        extraTitle: \"FILE CATEGORIZATION · AND THE FALSE-POSITIVE FILTER\",\n        extraRows: [\n          { k: \"Backend\", v: \".ts / .js in paths matching **/handler*, **/service*, **/repository*, **/lambda*, **/util*, **/middleware*\" },\n          { k: \"Frontend\", v: \".tsx / .jsx files, and .ts files in **/component*, **/page*, **/hook*\" },\n          { k: \"Infra\", v: \".ts files in **/cdk*, **/stack*, **/construct*, **/infra* — and a file matching several categories is assigned infra > frontend > backend\" },\n          { k: \"Rejected findings\", v: \"Praise for correct code · speculation about code it has not seen · style-only issues · anything a linter already reported in this workflow · vague suggestions with no concrete fix · references to code that does not match the actual diff\" }\n        ],\n        know: [\n          { title: \"The diff, not just the file list, is the input.\", body: \"Step 1 captures full hunks; the changed-file list is derived from them.\" },\n          { title: \"The adversarial step never actually fires.\", body: \"Step 6 tells the agent to spawn asdlc-architect, but neither owning agent can: in Kiro CLI their subagent.availableAgents lists do not include the architect, and in Claude Code neither has an Agent(...) tool at all. The SOP degrades quietly by design, so you get standard review only. Routing through the orchestrator does not help — it does not declare this SOP. Run k-adversarial-pull-request-review against asdlc-architect separately instead.\" },\n          { title: \"The adversarial step is also skipped for frontend-only reviews\", body: \"by design, because it targets backend and infra gaps — and it never re-reports anything already in the consolidated list.\" },\n          { title: \"This SOP does not fix anything.\", body: \"It produces a report.\" }\n        ] },\n      { name: \"asdlc-code-critic\", file: \"agent-sops/asdlc-code-critic.sop.md\", owner: \"asdlc-developer — strictly read-only\",\n        what: \"A fast, focused critique of local changes across six dimensions, producing a numbered critique document with a resolution recorded per issue.\",\n        when: \"Before creating a CR, after finishing a feature, or for a quick sanity check on uncommitted work.\",\n        get: \".agents/scratchpad/critique-NNN.md (or your output_dir), numbered so successive runs do not overwrite each other: an executive summary, a severity count table, and per-issue sections with file path, code snippet, problem, suggested resolution, and a Decision of fix / won't fix / defer with rationale.\",\n        prompt: \"Run the asdlc-code-critic SOP on my uncommitted changes.\",\n        params: [param(\"critique_scope\", false, \"uncommitted changes — also accepts last N, branch1...branch2, or specific file/directory paths\"), param(\"output_dir\", false, \".agents/scratchpad\"), param(\"mode\", false, \"auto — or interactive\"), param(\"focus_areas\", false, \"none — comma-separated, e.g. \\\"error handling, security, concurrency\\\"\")],\n        flow: [\n          node(\"01\", \"Resolve parameters\", \"Defaults applied without asking — the SOP explicitly must not ask for parameters that have defaults. Verifies a git repo (unless file paths were given), detects the project language from manifests, creates output_dir, determines the next critique-NNN number.\", \"\"),\n          node(\"02\", \"Gather changes per critique_scope\", \"uncommitted → git diff + git diff --cached · last N → git diff HEAD~N · branch1...branch2 → git diff branch1...branch2 · file paths → read the files directly. Excludes binaries, lock files, dist/ build/ cdk.out/, .js.map, then reports file count and lines changed.\", \"\"),\n          node(\"03\", \"Empty diff?\", \"Inform the user and stop — nothing to critique.\", \"stop\"),\n          node(\"04\", \"Critique across 6 dimensions\", \"Severity Critical / Important / Minor, with a dimension tag per finding. No praise, no linter-only style nits. Over 500 lines of diff, findings are saved incrementally to critique-NNN-findings.tmp.md after each file or logical group.\", \"\"),\n          node(\"05\", \"Resolve issues — which mode?\", \"auto: the agent picks fix / won't fix / defer with a one-sentence rationale each, Critical defaulting to fix. interactive: presents a summary table, then walks Critical → Important → Minor, you choose per issue, and it accepts your decision without argument.\", \"gate\"),\n          node(\"06\", \"Finalize and present\", \"Writes output_dir/critique-NNN.md — empty severity sections say \\\"No issues found.\\\" — deletes the .tmp.md file, never prints the document inline, then reports the file path, counts by severity, and one line per Critical finding.\", \"good\")\n        ],\n        flowCaption: \"asdlc-code-critic: four scope options, two resolution modes, one numbered output file.\",\n        extraTitle: \"THE SIX DIMENSIONS — EVERY FINDING IS TAGGED WITH ONE\",\n        extraRows: [\n          { k: \"Correctness\", v: \"Logic accuracy, edge cases, bugs, null handling, race conditions, integration correctness\" },\n          { k: \"Performance\", v: \"Algorithmic complexity, memory usage, N+1 queries, scalability\" },\n          { k: \"Security\", v: \"Vulnerabilities, input validation, injection risks, secrets exposure, auth gaps\" },\n          { k: \"Maintainability\", v: \"Clarity, naming, documentation, duplication, complexity\" },\n          { k: \"Architecture\", v: \"Design patterns, separation of concerns, coupling, backwards compatibility\" },\n          { k: \"Testing\", v: \"Whether tests exist and adequately cover the changed code — static analysis only\" }\n        ],\n        know: [\n          { title: \"It is strictly read-only.\", body: \"The SOP states this three times: it never modifies source files, creates commits, or runs builds or tests. If issues are marked fix, the SOP reminds you that you must apply them yourself — and step 6 forbids offering to.\" },\n          { title: \"No praise.\", body: \"The SOP forbids positive observations and \\\"looks good\\\" comments — only actionable problems.\" },\n          { title: \"focus_areas reorders, it does not filter.\", body: \"All six dimensions are still analyzed; focus areas surface first.\" },\n          { title: \"It has its own troubleshooting section\", body: \"covering an empty diff despite changed files (check git stash list or untracked files), a diff too large for context (narrow the scope), findings referencing code outside the diff (tighten the scope), and minor findings drowning out real problems (use focus_areas).\" }\n        ] },\n      { name: \"k-adversarial-pull-request-review\", file: \"agent-sops/k-adversarial-pull-request-review.sop.md\", owner: \"asdlc-architect — no file changes\",\n        what: \"Reviews a diff from the stance of a security-focused architect arguing against approval, across four passes, then issues a verdict.\",\n        when: \"After standard review, on anything security-sensitive. The SOP is explicit that it is not a replacement for standard review — it catches what style and quality reviewers miss: information disclosure, data integrity failures, and schema/validation gaps. Typically the orchestrator invokes it by spawning asdlc-architect in adversarial mode as the checker in a maker-checker cycle.\",\n        get: \"adversarial-review-report.md (or your output_file) with the verdict, per-severity counts, and one line per CRITICAL finding — the report body is never inlined.\",\n        prompt: \"Run the k-adversarial-pull-request-review SOP on the diff for my current branch.\",\n        params: [param(\"diff_input\", true, \"— unless pr_url is given. Accepts git diff output, file paths, or raw PR diff content\"), param(\"pr_url\", false, \"none — when given, step 0 fetches the diff and linked docs\"), param(\"output_file\", false, \"adversarial-review-report.md\")],\n        flow: [\n          node(\"00\", \"diff_input OR pr_url given?\", \"If neither, the SOP asks for one and waits. It will not ask for output_file.\", \"gate\"),\n          node(\"01\", \"Context ramp-up\", \"Fetches the PR diff if only pr_url was given, reads linked issues (max 3) and referenced design docs (max 3), and searches the codebase for existing patterns — error mapping, transactions, validation, pagination. One pass per source, no recursive following, never blocks on missing context.\", \"\"),\n          node(\"02\", \"Ingest diff\", \"Excludes binaries, lock files, build artifacts, .js.map; reports file count and lines changed. Stops if the diff is empty.\", \"stop\"),\n          node(\"03\", \"Pass 2 — Security\", \"Error and log information disclosure, API input leaks, pagination token injection, abstraction violations. CRITICAL when stack traces, internal IDs, or raw exceptions reach a caller, or unvalidated input lands in a query.\", \"\"),\n          node(\"04\", \"Pass 3 — Data integrity\", \"Partial writes, unconditional overwrites, missing conditional writes, untested write paths. CRITICAL for a multi-item mutation with no transaction, or an unconditional overwrite on a contested resource.\", \"\"),\n          node(\"05\", \"Pass 4 — Schema / validation\", \"Missing map guards, missing standalone fields, validate-then-act ordering, integration wiring. IMPORTANT for ordering violations and wiring gaps. Never flags test files.\", \"\"),\n          node(\"06\", \"Pass 5 — Codebase awareness\", \"Flags inline reimplementation of an existing shared utility as IMPORTANT.\", \"\"),\n          node(\"07\", \"Deduplicate and verdict\", \"Dedupes by file:line and root cause keeping the highest severity, counts by severity, then: any CRITICAL → REQUEST CHANGES (blocks approval); no CRITICAL but ≥1 IMPORTANT → APPROVE WITH COMMENTS; neither → APPROVE.\", \"good\")\n        ],\n        flowCaption: \"k-adversarial-pull-request-review: ramp up on context, four gap passes, then a severity-driven verdict.\",\n        extraTitle: \"THE QUALITY GATE\",\n        extraRows: [\n          { k: \"Any CRITICAL finding\", v: \"Forces REQUEST CHANGES, regardless of the IMPORTANT or SUGGESTION counts\" },\n          { k: \"Out of scope\", v: \"Formatting, naming, and import order — it will not duplicate standard review\" },\n          { k: \"Not flagged\", v: \"Single-item writes as requiring transactions; validation issues in test files\" }\n        ],\n        know: [\n          { title: \"It checks for existing utilities before flagging a missing one.\", body: \"Across all three technical passes the instruction is the same: if an error-mapping layer, transaction helper, or shared validator already exists, flag bypassing it rather than its absence.\" },\n          { title: \"Context ramp-up is bounded.\", body: \"Max 3 linked issues, max 3 referenced design docs, one pass per source, no recursive link following — and missing context never blocks the review.\" }\n        ] },\n      { name: \"k-code-cleanup\", file: \"agent-sops/k-code-cleanup.sop.md\", owner: \"asdlc-developer — EDITS YOUR CODE\",\n        what: \"Diffs your branch against main, identifies AI-generated slop, removes it, then runs the appropriate review skills on the cleaned result.\",\n        when: \"Before submitting AI-assisted changes for review. This SOP modifies your code — the only one on this page that does. Commit or stash your work first so you can inspect exactly what it changed.\",\n        get: \"Modified files, shown as before/after diffs, plus cleanup-report.md with Removed Items, Preserved Items, and Review Findings sections.\",\n        prompt: \"Run the k-code-cleanup SOP. source_dir: src/\",\n        params: [param(\"source_dir\", true, \"—\"), param(\"branch\", false, \"current branch\"), param(\"output_file\"
