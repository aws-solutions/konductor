ARE INVOLVED<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">Which binary am I running?<\u002Fh3>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">which konductor<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:14px\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">OUTPUT<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--mu)\">/Users/you/.local/bin/konductor<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 28px;font-size:16px;line-height:1.75;color:var(--mu)\">Nothing printed means the binary is not on your <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">PATH<\u002Fspan>. If you both downloaded a release and built from source, two programs named <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">konductor<\u002Fspan> may be installed and whichever comes first in <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">PATH<\u002Fspan> wins.<\u002Fp>\n\n            <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">Why is a config value what it is?<\u002Fh3>\n            <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Three layers merge, and a forgotten user-level file is the usual surprise. Precedence is preset → user → project, project winning.<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH · PROJECT, THEN USER, THEN MERGED<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.9;color:#E8E4F5;overflow-x:auto\">cat .konductor/config.yml\ncat ~/.konductor/config.yml\nkonductor config list<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 28px;font-size:16px;line-height:1.75;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">No such file or directory<\u002Fspan> for the user layer means you have no user-level config, which is normal. If a value is not in your project file, the user-level file is almost always the source.<\u002Fp>\n\n            <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">What did my recent commands actually do?<\u002Fh3>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\">Every invocation appends one line to a log, including its real exit code.<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:16px\">\n              <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">tail -5 ~/.konductor/logs/konductor.log<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.8;color:var(--mu);overflow-x:auto\">2026-08-13T20:13:52Z argv=['konductor', 'install'] exit_code=0\n2026-08-13T20:14:11Z argv=['konductor', 'doctor'] exit_code=0\n2026-08-13T20:15:02Z argv=['konductor', 'config', 'get', 'version'] exit_code=0<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\">To find every failure, and to truncate a log that has grown too far:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.9;color:#E8E4F5;overflow-x:auto\">grep -v \"exit_code=0\" ~/.konductor/logs/konductor.log\n: &gt; ~/.konductor/logs/konductor.log<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:11px;margin-bottom:28px\">\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:8px\"><\u002Fspan><span style=\"font-size:15.5px;line-height:1.7;color:var(--mu)\">The directory is mode <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">0700<\u002Fspan> and the file <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">0600<\u002Fspan> — owner-only, because argument vectors can contain paths you would rather not share.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:8px\"><\u002Fspan><span style=\"font-size:15.5px;line-height:1.7;color:var(--mu)\">Logging is best-effort. If the log cannot be written the command still runs and its exit code is unaffected, so an empty log does not mean the CLI did not run.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n\n            <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">Why is an agent refusing, or doing the wrong thing?<\u002Fh3>\n            <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Check what that agent can actually do. Capability differs by agent <strong style=\"color:var(--tx);font-weight:600\">and<\u002Fstrong> by runtime — for example <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-orchestrator<\u002Fspan> cannot write files or run shell commands in either runtime, and <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-researcher<\u002Fspan> is read-only everywhere. The full matrix is in <a href=\"#/agents\">Agents reference<\u002Fa>.<\u002Fp>\n            <div style=\"border:1px solid rgba(167,139,250,.35);border-radius:12px;background:rgba(124,92,255,.07);padding:18px 20px;margin-bottom:28px\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--lav);margin-bottom:10px\">TWO BEHAVIOURS THAT LOOK LIKE BUGS AND ARE NOT<\u002Fdiv>\n              <div style=\"font-size:15px;line-height:1.7;color:var(--mu)\">The orchestrator delegating instead of acting — that is its design. And a specialist declining a workflow: a SOP is only available to an agent that declares it.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">My edits to an agent, skill, or SOP had no effect<\u002Fh3>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\">All three are read at <strong style=\"color:var(--tx);font-weight:600\">session start<\u002Fstrong>. Start a new session. If you changed the source tree, also regenerate the runtime files:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code)\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor synth<\u002Fpre>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"dg-success\" style=\"border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600\">What success looks like<\u002Fh2>\n            <div style=\"display:flex;flex-direction:column;gap:11px\">\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">konductor doctor<\u002Fspan> reports all checks ok and exits <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">0<\u002Fspan>.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">which konductor<\u002Fspan> points at the binary you intend to use.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\">The log shows no unexplained failures.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n            <button sc-camel-on-click=\"{{ goConfig }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Configuration<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goUpdate }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: Update →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <div style=\"width:196px;flex:0 0 196px;padding-top:72px\">\n          <div style=\"position:sticky;top:24px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--bd);padding-left:18px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;color:var(--mu2)\">ON THIS PAGE<\u002Fdiv>\n            <a href=\"#dg-doctor\" style=\"font-size:13px;color:var(--mu)\">Run doctor first<\u002Fa>\n            <a href=\"#dg-manual\" style=\"font-size:13px;color:var(--mu)\">Manual checks<\u002Fa>\n            <a href=\"#dg-success\" style=\"font-size:13px;color:var(--mu)\">What success looks like<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.update }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:900px;margin:0 auto;padding:64px 56px 96px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">TASK GUIDES / UPDATE<\u002Fdiv>\n        <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Update an installation<\u002Fh1>\n        <p style=\"margin:0 0 40px;font-size:19px;line-height:1.5;color:var(--mu)\">Moves your installed agents, skills, and SOPs to the latest release, keeping any local modifications you have made.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Check whether an update is available<\u002Fh2>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:40px\">\n          <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">konductor doctor<\u002Fdiv>\n          <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;color:var(--mu);overflow-x:auto\">Updates\n  installed 0.1.0, latest 0.1.2                             stale\n    Run: konductor update<\u002Fpre>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Update<\u002Fh2>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n          <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor update<\u002Fpre>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:20px\">\n          <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">OUTPUT<\u002Fdiv>\n          <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;color:var(--mu);overflow-x:auto\">Installed 0.1.0, latest 0.1.2\n\nUpdating Konductor\n  agents          11 updated\n  skills          75 updated (2 new)\n  SOPs            13 updated\n  context files    1 updated\n\nPreserved 1 locally modified file:\n  skills/backend-review/SKILL.md\n\nUpdated to 0.1.2. Start a new session to pick up the changes.<\u002Fpre>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:20px\">\n          <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:18px 20px\"><div style=\"font-size:15.5px;font-weight:600;margin-bottom:8px\">Local modifications are preserved<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.65;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">update<\u002Fspan> names every file it skipped so you know what is now diverged from the release. If you want the release version of one of those files, delete your copy and re-run.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid rgba(167,139,250,.35);border-radius:12px;background:rgba(124,92,255,.07);padding:18px 20px\"><div style=\"font-size:15.5px;font-weight:600;margin-bottom:8px\">A running session keeps the old content<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.65;color:var(--mu)\">Agents, skills, and context files are read at session start, so you need a new session.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\">If you are already current: <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">Installed 0.1.2, latest 0.1.2 — already up to date.<\u002Fspan> Exit code <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">0<\u002Fspan> either way.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Update the CLI itself<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">update<\u002Fspan> refreshes the content it installed. The CLI binary is separate — download the current build the same way you did originally:<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:20px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n          <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.9;color:#E8E4F5;overflow-x:auto\">curl -fsSLo konductor https://konductor.sh/downloads/cli\nchmod +x konductor &amp;&amp; mv konductor ~/.local/bin/\nkonductor --version<\u002Fpre>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">What success looks like<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:11px;margin-bottom:20px\">\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">konductor doctor<\u002Fspan> reports the Updates check as <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">ok<\u002Fspan>.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\">A new runtime session lists the agents you expect.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">konductor config list<\u002Fspan> still exits <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">0<\u002Fspan>, confirming your config is still valid against the new release.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,107,107,.4);border-radius:12px;background:rgba(255,107,107,.05);padding:18px 20px;margin-bottom:40px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:#FF8B8B;margin-bottom:10px\">CHECK THAT LAST ONE<\u002Fdiv>\n          <p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;color:var(--mu)\">A config schema change is the most likely thing to bite you. If <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">config list<\u002Fspan> reports <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">config version &lt;n&gt; is not supported by this CLI<\u002Fspan>, back up your config, re-scaffold, and re-apply your settings:<\u002Fp>\n          <pre style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.9;color:var(--tx)\">cp .konductor/config.yml .konductor/config.yml.bak\nkonductor init --force<\u002Fpre>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Behaviour differs by state<\u002Fh2>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:30px\">\n          <div style=\"display:grid;grid-template-columns:1fr 1.8fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">STATE<\u002Fdiv><div style=\"padding:11px 16px\">WHAT HAPPENS<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1.8fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-size:14.5px;font-weight:600\">Already current<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;color:var(--mu)\">Reports the versions and makes no changes.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1.8fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-size:14.5px;font-weight:600\">Newer release available<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Updates content, preserves local modifications, names what it skipped.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1.8fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-size:14.5px;font-weight:600\">Not installed yet<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;color:var(--mu)\">Tells you to run <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">konductor install<\u002Fspan> instead.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1.8fr\"><div style=\"padding:12px 16px;font-size:14.5px;font-weight:600\">Content locally modified<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;color:var(--mu)\">Your files are kept. The release version is not applied to them.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">Seeing what changed:<\u002Fstrong> <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">CHANGELOG.md<\u002Fspan> in the repository follows Keep a Changelog and Semantic Versioning, with entries consolidated per release.<\u002Fp>\n\n        <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n          <button sc-camel-on-click=\"{{ goDiagnose }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Diagnose problems<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goUninstall }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: Uninstall →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.uninstall }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:900px;margin:0 auto;padding:64px 56px 96px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">TASK GUIDES / UNINSTALL<\u002Fdiv>\n        <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Uninstall<\u002Fh1>\n        <p style=\"margin:0 0 40px;font-size:19px;line-height:1.5;color:var(--mu)\">Removes Konductor from your runtime. Everything lives in your home directory and your project — there are no system files, services, or daemons.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Remove the agents from your runtime<\u002Fh2>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n          <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor uninstall<\u002Fpre>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:18px\">\n          <div style=\"padding:9px 14px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">OUTPUT<\u002Fdiv>\n          <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;color:var(--mu);overflow-x:auto\">This will remove Konductor 0.1.0 from Kiro CLI:\n  agents          11\n  skills          75\n  SOPs            13\n  context files    1\n\nProject files under .konductor/ will be left in place.\n\nContinue? [y/N]<\u002Fpre>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Answer <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">y<\u002Fspan> and it reports <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">Removed. Project files under .konductor/ were left in place.<\u002Fspan> Exit code <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">0<\u002Fspan>. Answering anything else cancels and changes nothing. To skip the prompt in a script:<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:16px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n          <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor uninstall --yes<\u002Fpre>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">uninstall<\u002Fspan> deliberately leaves your project configuration alone, so reinstalling later picks up where you left off.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Remove everything else<\u002Fh2>\n        <p style=\"margin:0 0 22px;font-size:16px;line-height:1.75;color:var(--mu)\">Do only the parts that apply. Read each command before running it; several delete directories.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:20px\">\n          <sc-for list=\"{{ removalSteps }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div style=\"border:1px solid var(--bd);border-radius:14px;background:var(--surf);padding:20px 22px\">\n              <div style=\"font-size:16px;font-weight:600;margin-bottom:8px\">{{ r.title }}<\u002Fdiv>\n              <div style=\"font-size:14.5px;line-height:1.65;color:var(--mu);margin-bottom:12px\">{{ r.note }}<\u002Fdiv>\n              <pre style=\"margin:0;border-radius:10px;background:var(--code);padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;color:#E8E4F5;overflow-x:auto\">{{ r.cmd }}<\u002Fpre>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,107,107,.4);border-radius:12px;background:rgba(255,107,107,.05);padding:18px 20px;margin-bottom:40px;font-size:15px;line-height:1.7;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:#FF8B8B;display:block;margin-bottom:8px\">CLAUDE CODE SETTINGS<\u002Fspan>Only if you set these for Konductor and want them gone. Edit <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">~/.claude/settings.json<\u002Fspan> and remove <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">env.CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS<\u002Fspan>, the <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">permissions.allow<\u002Fspan> entries you added, and <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">teammateMode<\u002Fspan> if you set it. Edit rather than delete the file — it very likely holds settings unrelated to Konductor.<\u002Fdiv>\n\n        <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Everything Konductor creates<\u002Fh2>\n        <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">For reference, so you can confirm nothing is left behind.<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:30px\">\n          <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">LOCATION<\u002Fdiv><div style=\"padding:11px 16px\">CREATED BY<\u002Fdiv><div style=\"padding:11px 16px\">REMOVED BY<\u002Fdiv><\u002Fdiv>\n          <sc-for list=\"{{ artifactRows }}\" as=\"a\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr;border-bottom:1px solid var(--bd)\">\n              <div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx)\">{{ a.where }}<\u002Fdiv>\n              <div style=\"padding:12px 16px;font-size:14px;color:var(--mu)\">{{ a.by }}<\u002Fdiv>\n              <div style=\"padding:12px 16px;font-size:14px;color:var(--mu)\">{{ a.gone }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Uninstalling only part of it<\u002Fh2>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden\">\n          <div style=\"display:grid;grid-template-columns:1.3fr 1fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">YOU WANT TO…<\u002Fdiv><div style=\"padding:11px 16px\">DO ONLY THIS<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.3fr 1fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-size:14.5px;color:var(--mu)\">Stop using Konductor in one project, keep it elsewhere<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx)\">rm -rf .konductor dist<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.3fr 1fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-size:14.5px;color:var(--mu)\">Keep the CLI, drop the agents<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx)\">konductor uninstall<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.3fr 1fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-size:14.5px;color:var(--mu)\">Keep the agents, drop the CLI<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;color:var(--mu)\">remove the binary<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.3fr 1fr\"><div style=\"padding:12px 16px;font-size:14.5px;color:var(--mu)\">Reclaim disk space<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx)\">rm -rf dist<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n          <button sc-camel-on-click=\"{{ goUpdate }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Update<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goTasksIndex }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Task guides →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.usecases }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:1040px;margin:0 auto;padding:64px 56px 96px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">GUIDE / USE CASES<\u002Fdiv>\n        <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Use cases<\u002Fh1>\n        <p style=\"margin:0 0 16px;font-size:19px;line-height:1.5;color:var(--mu);max-width:66ch\">Four end-to-end walkthroughs, one per theme the package supports today. Each names the exact SOPs, the owning agent, the prerequisites, a worked example in a domain that needs no organisation-specific context, and where the workflow pauses for you.<\u002Fp>\n        <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu);max-width:70ch\">Where <a href=\"#/sops\">SOP workflows<\u002Fa> documents each SOP mechanically — parameters, steps, flowchart — these pages show the <strong style=\"color:var(--tx);font-weight:600\">journey<\u002Fstrong>: which SOPs to chain, in what order, and what you hold at the end.<\u002Fp>\n        <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:16px 18px;margin-bottom:40px;font-size:15px;line-height:1.65;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--sig);display:block;margin-bottom:8px\">NEW HERE?<\u002Fspan>Start with <button sc-camel-on-click=\"{{ goUcCodebase }}\" style=\"all:unset;cursor:pointer;color:var(--vi);font-weight:600\" style-hover=\"color:var(--lav)\">Understand a codebase<\u002Fbutton>. It has zero setup cost and gives the fastest read on what the package actually does.<\u002Fdiv>\n\n        <h2 style=\"margin:0 0 20px;font-size:30px;letter-spacing:-.025em;font-weight:600\">The four use cases<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:16px;margin-bottom:44px\">\n          <sc-for list=\"{{ useCaseCards }}\" as=\"u\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ u.go }}\" style=\"all:unset;cursor:pointer;border:1px solid var(--bd);border-radius:16px;background:var(--surf);padding:22px 24px;display:flex;flex-direction:column;gap:12px\" style-hover=\"border-color:var(--vi);background:rgba(124,92,255,.08)\">\n              <span style=\"font-size:20px;font-weight:600;letter-spacing:-.02em\">{{ u.title }}<\u002Fspan>\n              <span style=\"font-size:15px;line-height:1.65;color:var(--mu)\">{{ u.out }}<\u002Fspan>\n              <span style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                <span style=\"border:1px solid var(--bd2);border-radius:999px;padding:5px 12px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--mu)\">SETUP · {{ u.setup }}<\u002Fspan>\n                <span style=\"border:1px solid rgba(167,139,250,.4);border-radius:999px;padding:5px 12px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--lav)\">INTERACTIVE · {{ u.interactive }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Before you start<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">You need Konductor installed and a session open with the relevant agent. If you have not done that yet, start with the <button sc-camel-on-click=\"{{ goQuick }}\" style=\"all:unset;cursor:pointer;color:var(--vi);font-weight:600\" style-hover=\"color:var(--lav)\">Quick Start<\u002Fbutton>. Once you are in a session, every page below shows two ways in:<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:20px\">\n          <div style=\"border:1px solid var(--bd);border-radius:14px;background:var(--surf);padding:20px 22px\"><div style=\"font-size:16px;font-weight:600;margin-bottom:8px\">Through the orchestrator<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.65;color:var(--mu)\">Describe what you want in plain language and let it route.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--bd);border-radius:14px;background:var(--surf);padding:20px 22px\"><div style=\"font-size:16px;font-weight:600;margin-bottom:8px\">Direct to the owning agent<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.65;color:var(--mu)\">Faster when you already know which SOP you want.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 44px;font-size:16px;line-height:1.75;color:var(--mu)\">Agent names differ by runtime: <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-developer<\u002Fcode> in Kiro CLI, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">ASDLCCoreAICapabilities-asdlc-developer<\u002Fcode> in Claude Code.<\u002Fp>\n\n        <h2 style=\"margin:0 0 12px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">How the four fit together<\u002Fh2>\n        <p style=\"margin:0 0 26px;font-size:16px;line-height:1.75;color:var(--mu)\">Typical routes between the four use cases. Start anywhere; the loops are the normal case.<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:18px;background:radial-gradient(120% 140% at 20% 0%,rgba(124,92,255,.1),transparent 60%),var(--bg2);padding:32px 30px;margin-bottom:44px\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;align-items:stretch\">\n            <div style=\"border:1px solid var(--vi);border-radius:14px;background:rgba(124,92,255,.12);box-shadow:inset 0 0 50px -22px var(--vi);padding:18px 20px;display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-size:16px;font-weight:700;letter-spacing:-.02em\">Understand a codebase<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.7;color:var(--lav)\">found design debt ↓<br>ready to change ↘<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:center;padding:12px;color:var(--mu2)\">→<\u002Fdiv>\n            <div style=\"border:1px solid var(--bd2);border-radius:14px;background:var(--surf);padding:18px 20px;display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-size:16px;font-weight:600;letter-spacing:-.02em\">Design a system<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.7;color:var(--mu2)\">design validated ↓<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:center;padding:12px;color:var(--mu2)\">→<\u002Fdiv>\n            <div style=\"border:1px solid var(--bd2);border-radius:14px;background:var(--surf);padding:18px 20px;display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-size:16px;font-weight:600;letter-spacing:-.02em\">Plan and verify work<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.7;color:var(--mu2)\">implemented ↓<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:center;padding:12px;color:var(--mu2)\">→<\u002Fdiv>\n            <div style=\"border:1px solid var(--bd2);border-radius:14px;background:var(--surf);padding:18px 20px;display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-size:16px;font-weight:600;letter-spacing:-.02em\">Review code and tests<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.7;color:var(--mu2)\">findings are a design flaw ↰<br>NEEDS FIXES ↰<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:22px;border-top:1px solid var(--bd);padding-top:16px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;color:var(--mu2)\">REVIEW LOOPS BACK INTO DESIGN AND PLANNING — THAT IS THE NORMAL CASE, NOT AN EXCEPTION<\u002Fdiv>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">What is not covered<\u002Fh2>\n        <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">Two themes the agents touch but no SOP supports, so there is no walkthrough for them:<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:20px\">\n          <div style=\"border:1px solid var(--bd);border-radius:14px;background:var(--surf);padding:20px 22px\"><div style=\"font-size:16px;font-weight:600;margin-bottom:8px\">Product ideation<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.7;color:var(--mu)\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">asdlc-product-manager<\u002Fcode> has real skills — <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">user-story-writing<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">requirements-extraction<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">decision-research<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">sprint-planning<\u002Fcode> and more — but declares <strong style=\"color:var(--tx);font-weight:600\">zero SOPs<\u002Fstrong>. You can ask it directly for user stories or a requirements summary; there is just no scripted multi-step workflow to point a page at.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--bd);border-radius:14px;background:var(--surf);padding:20px 22px\"><div style=\"font-size:16px;font-weight:600;margin-bottom:8px\">Issue triage<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.7;color:var(--mu)\">No SOP in the package covers triaging incoming bugs or issues.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">The same is true of <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-tpm<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-researcher<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-browser<\u002Fcode>, and <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-media-analyzer<\u002Fcode> — all skill-driven, no SOPs. See the <a href=\"#/agents\">Agents reference<\u002Fa> for what each can do.<\u002Fp>\n        <div style=\"border:1px solid rgba(167,139,250,.35);border-radius:12px;background:rgba(124,92,255,.07);padding:18px 20px;font-size:15px;line-height:1.7;color:var(--mu)\">One SOP has no walkthrough here yet: <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">kiro-spec-workflow<\u002Fcode>. It is a narrower path — it produces a Kiro IDE spec directory rather than a general SDLC outcome — and it is the most interactive SOP in the package, with an approval gate on each of its three documents. It is documented step by step, with a flowchart, in <a href=\"#/sop-test\">SOP workflows → testing and specs<\u002Fa>.<\u002Fdiv>\n\n        <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n          <button sc-camel-on-click=\"{{ goUninstall }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Uninstall<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goUcCodebase }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: Understand a codebase →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.ucCodebase }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:920px;margin:0 auto;padding:64px 56px 96px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">USE CASES / UNDERSTAND A CODEBASE<\u002Fdiv>\n        <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Understand a codebase<\u002Fh1>\n        <p style=\"margin:0 0 26px;font-size:19px;line-height:1.5;color:var(--mu)\">Two SOPs cover this at very different depths. Both are owned by <code style=\"font-family:'JetBrains Mono',monospace;font-size:.85em;color:var(--tx)\">asdlc-developer<\u002Fcode>.<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:20px\">\n          <div style=\"display:grid;grid-template-columns:1fr 1.4fr .5fr .8fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">SOP<\u002Fdiv><div style=\"padding:11px 16px\">DEPTH<\u002Fdiv><div style=\"padding:11px 16px\">SETUP<\u002Fdiv><div style=\"padding:11px 16px\">MODIFIES?<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1.4fr .5fr .8fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">asdlc-code-critic<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;color:var(--mu)\">A local diff, across six review dimensions<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;color:var(--mu)\">None<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;color:var(--sig)\">No — strictly read-only<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1.4fr .5fr .8fr\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">asdlc-codebase-analysis<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;color:var(--mu)\">The whole repository, a ten-step architecture report<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;color:var(--mu)\">None<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;color:var(--sig)\">No — static analysis only<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\">Just cloned something and want a fast read before touching it? Start with <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-code-critic<\u002Fcode> on a small change. Want the full picture before changing anything? Go straight to <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-codebase-analysis<\u002Fcode>.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Prerequisites<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:40px\">\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:8px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.7;color:var(--mu)\">The target repository checked out locally, with git history if you want <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-code-critic<\u002Fcode> to diff against commits or branches.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:8px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.7;color:var(--mu)\">Nothing else. Both SOPs default every parameter and need no config files, environment variables, or network access.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">How to invoke<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Through the orchestrator, in plain language:<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--bg2);padding:15px 17px;margin-bottom:10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> Critique my uncommitted changes.<\u002Fdiv>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--bg2);padding:15px 17px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> Run a codebase analysis on this repo.<\u002Fdiv>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\">The orchestrator routes both to <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-developer<\u002Fcode>, which owns both SOPs. To skip the routing hop, start a session with the developer agent directly — <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-developer<\u002Fcode> in Kiro CLI, or <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">ASDLCCoreAICapabilities-asdlc-developer<\u002Fcode> in Claude Code.<\u002Fp>\n\n        <h2 style=\"margin:0 0 12px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Worked example: onboarding onto <code style=\"font-family:'JetBrains Mono',monospace;font-size:.75em;color:var(--lav)\">csvtrim<\u002Fcode><\u002Fh2>\n        <p style=\"margin:0 0 30px;font-size:16px;line-height:1.75;color:var(--mu)\">You have just been handed a small open-source CLI tool, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">csvtrim<\u002Fcode> — it trims whitespace, dedupes rows, and validates headers in CSV files. You have never seen the code.<\u002Fp>\n\n        <h3 style=\"margin:0 0 12px;font-size:22px;font-weight:600;letter-spacing:-.02em\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--vi);margin-right:10px\">STEP 1<\u002Fspan>Fast read with <code style=\"font-family:'JetBrains Mono',monospace;font-size:.8em;color:var(--lav)\">asdlc-code-critic<\u002Fcode><\u002Fh3>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">You made a one-line fix to try things out and want a sanity check before anyone reviews it. What happens:<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:20px\">\n          <sc-for list=\"{{ criticSteps }}\" as=\"s\" hint-placeholder-count=\"6\">\n            <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:16px 18px;display:flex;gap:14px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--vi);flex:0 0 20px;padding-top:2px\">{{ s.n }}<\u002Fspan>\n              <span style=\"flex:1\"><strong style=\"color:var(--tx);font-weight:600;font-size:15px\">{{ s.title }}<\u002Fstrong><span style=\"display:block;margin-top:6px;font-size:14.5px;line-height:1.7;color:var(--mu)\">{{ s.body }}<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">What you get:<\u002Fstrong> <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">.agents/scratchpad/critique-001.md<\u002Fcode>, or the next free number.<\u002Fp>\n        <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:18px 20px;margin-bottom:40px;font-size:15px;line-height:1.7;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">This SOP is strictly read-only.<\u002Fstrong> It never modifies files, runs your build, or creates commits. Treat a <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">fix<\u002Fcode> resolution as a suggestion you still have to apply yourself — and the SOP will remind you of exactly that.<\u002Fdiv>\n\n        <h3 style=\"margin:0 0 12px;font-size:22px;font-weight:600;letter-spacing:-.02em\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--vi);margin-right:10px\">STEP 2<\u002Fspan>Deep read with <code style=\"font-family:'JetBrains Mono',monospace;font-size:.8em;color:var(--lav)\">asdlc-codebase-analysis<\u002Fcode><\u002Fh3>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Now the real picture: architecture, SOLID adherence, design patterns, dependencies, technical debt.<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--bg2);padding:15px 17px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> Run a codebase analysis on csvtrim, focus on architecture, dependencies, and debt.<\u002Fdiv>\n        <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">Or say nothing after \"analysis\" and it defaults to <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">all<\u002Fcode> — every section. Ten steps, all static analysis, no code execution:<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:20px\">\n          <sc-for list=\"{{ analysisSteps }}\" as=\"s\" hint-placeholder-count=\"10\">\n            <div style=\"display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--bd);padding-bottom:10px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--vi);flex:0 0 24px\">{{ s.n }}<\u002Fspan>\n              <span style=\"font-size:15.5px;line-height:1.7;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">{{ s.title }}<\u002Fstrong> — {{ s.body }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\">There is no pause anywhere in this SOP. It runs end to end and reports the file path plus the top three recommendations. <strong style=\"color:var(--tx);font-weight:600\">What you get:<\u002Fstrong> <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">codebase-analysis.md<\u002Fcode> with three Mermaid diagrams and the SOLID, patterns, quality, security, and debt sections.<\u002Fp>\n\n        <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Checkpoint<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:11px;margin-bottom:18px\">\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">.agents/scratchpad/critique-001.md<\u002Fcode> exists and lists findings with severities.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">codebase-analysis.md<\u002Fcode> exists and contains three Mermaid diagrams.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\">Neither run modified a single source file.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\">That last point is the one to verify — <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">git status<\u002Fcode> should show no changes beyond whatever you had before. Both SOPs on this page are read-only; if either edited your code, something is wrong.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">If the codebase is too large<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-codebase-analysis<\u002Fcode> writes incrementally, which is the basis of its own remedy: re-run with a narrower <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">focus_areas<\u002Fcode> and let the file accumulate across runs.<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--bg2);padding:15px 17px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> Run asdlc-codebase-analysis with focus_areas=architecture,dependencies<\u002Fdiv>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Valid values are <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">architecture<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">solid<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">patterns<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">dependencies<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">security<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">performance<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">testing<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">debt<\u002Fcode>, and <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">all<\u002Fcode>. Note <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">security<\u002Fcode> and <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">performance<\u002Fcode> map to the same step, and <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">testing<\u002Fcode> maps to the Code Quality step.<\u002Fp>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\">For <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-code-critic<\u002Fcode>, narrow with <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">focus_areas<\u002Fcode> (which reorders rather than filters — all six dimensions are still analysed) or set <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">critique_scope<\u002Fcode> to specific files.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Runtime differences<\u002Fh2>\n        <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">None. Both SOPs behave identically once the developer agent is in context. The only difference is how you reach <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-developer<\u002Fcode> — through the orchestrator's routing, which works in both runtimes, or by targeting the agent directly with <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">--agent<\u002Fcode>.<\u002Fp>\n\n        <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n          <button sc-camel-on-click=\"{{ goUseCases }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Use cases<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goUcDesign }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: Design a system →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.ucDesign }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:920px;margin:0 auto;padding:64px 56px 96px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">USE CASES / DESIGN A SYSTEM<\u002Fdiv>\n        <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Design a system<\u002Fh1>\n        <p style=\"margin:0 0 20px;font-size:19px;line-height:1.5;color:var(--mu)\">The package's deepest single workflow: <code style=\"font-family:'JetBrains Mono',monospace;font-size:.85em;color:var(--tx)\">k-design-doc-creation<\u002Fcode> — five phases turning a problem statement into a document meant to survive principal-engineer review. A second SOP, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.85em;color:var(--tx)\">k-existing-design-review<\u002Fcode>, evaluates design artifacts that already exist.<\u002Fp>\n        <p style=\"margin:0 0 22px;font-size:16px;line-height:1.75;color:var(--mu)\">Both are owned by <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-architect<\u002Fcode>, the only agent on <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">claude-opus-4.6<\u002Fcode> and the one carrying 32 of the package's 75 skills.<\u002Fp>\n        <div style=\"border:1px solid rgba(255,107,107,.4);border-radius:12px;background:rgba(255,107,107,.05);padding:18px 20px;margin-bottom:20px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:#FF8B8B;margin-bottom:10px\">READ THIS BEFORE YOU PICK ONE<\u002Fdiv>\n          <p style=\"margin:0 0 12px;font-size:15px;line-height:1.7;color:var(--mu)\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">k-existing-design-review<\u002Fcode> is explicitly deprecated for authoring; its own header says so:<\u002Fp>\n          <blockquote style=\"margin:0;border-left:2px solid rgba(255,107,107,.5);padding-left:14px;font-size:15px;line-height:1.7;color:var(--tx)\"><strong style=\"font-weight:700\">Deprecated for design doc review.<\u002Fstrong> Use <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em\">k-design-doc-creation.sop.md<\u002Fcode> for authoring new design documents. This SOP reviews existing artifacts before implementation.<\u002Fblockquote>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">So: <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">k-design-doc-creation<\u002Fcode> to write a new design. <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">k-existing-design-review<\u002Fcode> only to sanity-check a package someone already wrote.<\u002Fp>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\">There is no SOP that chains the architect's individual design skills together. A <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">system-design.md<\u002Fcode> + <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">threat-model.md<\u002Fcode> package comes either from <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">k-design-doc-creation<\u002Fcode> producing the equivalent directly, or from running skills one at a time — <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">system-design-patterns<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">threat-modeling<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">smithy-modeling<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">dynamodb-design<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">iam-policy-design<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">architecture-diagram-generation<\u002Fcode>.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Prerequisites<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">For <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em\">k-design-doc-creation<\u002Fcode>:<\u002Fstrong> a problem statement or a set of user stories. <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">topic<\u002Fcode> is required — the agent asks once and waits. It will <strong style=\"color:var(--tx);font-weight:600\">not<\u002Fstrong> ask for <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">output_path<\u002Fcode> or <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">elicitation_depth<\u002Fcode>; it uses the defaults.<\u002Fp>\n        <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">For <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em\">k-existing-design-review<\u002Fcode>:<\u002Fstrong> an existing <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">design_dir<\u002Fcode> containing at least <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">system-design.md<\u002Fcode> — the SOP refuses to evaluate without it. It also looks for these, all optional, but each missing one narrows what can be scored:<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:18px\">\n          <div style=\"display:grid;grid-template-columns:1fr 1.4fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">ARTIFACT<\u002Fdiv><div style=\"padding:11px 16px\">FILENAME PATTERNS MATCHED<\u002Fdiv><\u002Fdiv>\n          <sc-for list=\"{{ designArtifacts }}\" as=\"a\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid;grid-template-columns:1fr 1.4fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-size:14.5px\">{{ a.name }}<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">{{ a.pattern }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(167,139,250,.35);border-radius:12px;background:rgba(124,92,255,.07);padding:18px 20px;margin-bottom:40px;font-size:15px;line-height:1.7;color:var(--mu)\">These patterns are matched <strong style=\"color:var(--tx);font-weight:600\">literally<\u002Fstrong>. A file named <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">design.md<\u002Fcode> will not fill <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">system-design.md<\u002Fcode>'s slot — rename or symlink first.<\u002Fdiv>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">How to invoke<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Through the orchestrator, which routes design requests to <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-architect<\u002Fcode>:<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--bg2);padding:15px 17px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> Design a system for X<\u002Fdiv>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\">Or start with the architect directly — <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-architect<\u002Fcode> in Kiro CLI, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">ASDLCCoreAICapabilities-asdlc-architect<\u002Fcode> in Claude Code. The SOP's own overview names the triggering phrasings: \"Design a system for X\", \"I need a design doc for Y\".<\u002Fp>\n\n        <h2 style=\"margin:0 0 12px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Worked example: \"Pennywise\", a personal expense tracker<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">You want a design doc for a small web app where a user logs expenses, tags them by category, and sees a monthly summary.<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--bg2);padding:15px 17px;margin-bottom:30px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> I need a design doc for a personal expense tracker — users log expenses, tag categories, and see monthly summaries.<\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:18px;margin-bottom:36px\">\n          <sc-for list=\"{{ designPhases }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div style=\"border:1px solid var(--bd);border-radius:16px;background:var(--surf);padding:22px 24px\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:12px\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--vi)\">{{ p.phase }}<\u002Fspan>\n                <span style=\"font-size:20px;font-weight:600;letter-spacing:-.02em\">{{ p.title }}<\u002Fspan>\n                <span style=\"margin-left:auto;border:1px solid var(--bd2);border-radius:999px;padding:5px 12px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--mu2)\">{{ p.pause }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:15px;line-height:1.75;color:var(--mu)\">{{ p.body }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:40px\">\n          <div style=\"display:grid;grid-template-columns:1.1fr 1fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">FILE<\u002Fdiv><div style=\"padding:11px 16px\">CONTENTS<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.1fr 1fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">docs/design/pennywise.md<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;color:var(--mu)\">The design document<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.1fr 1fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">docs/design/pennywise-aws-validation.md<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;color:var(--mu)\">AWS claim validation report<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.1fr 1fr\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">docs/design/pennywise-tradeoffs.md<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;color:var(--mu)\">Trade-off scoring report<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Checkpoint: is it actually ready?<\u002Fh2>\n        <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">The SOP will not claim the doc is ready for principal-engineer review unless <strong style=\"color:var(--tx);font-weight:600\">all four<\u002Fstrong> hold:<\u002Fp>\n        <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:20px 22px;margin-bottom:18px;display:flex;flex-direction:column;gap:11px\">\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15px;line-height:1.65;color:var(--mu)\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">design-doc-guidelines<\u002Fcode> maker-checker: <strong style=\"color:var(--tx);font-weight:600\">0 CRITICAL<\u002Fstrong><\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15px;line-height:1.65;color:var(--mu)\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">doc-accuracy-analyzer<\u002Fcode>: <strong style=\"color:var(--tx);font-weight:600\">0 INCORRECT<\u002Fstrong> (UNVERIFIED is acceptable with callouts)<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15px;line-height:1.65;color:var(--mu)\">Adversarial review: <strong style=\"color:var(--tx);font-weight:600\">0 CRITICAL, 0 IMPORTANT, fewer than 3 MINOR<\u002Fstrong><\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15px;line-height:1.65;color:var(--mu)\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">design-evaluation<\u002Fcode> confidence score: <strong style=\"color:var(--tx);font-weight:600\">≥ 3.0 average<\u002Fstrong><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\">If any fails, it presents what is left and asks: <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">Fix these before submission? [y/n]<\u002Fcode>.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Worked example: reviewing an existing design package<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">A teammate already wrote <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">system-design.md<\u002Fcode> and <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">threat-model.md<\u002Fcode> for Pennywise under <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">design/pennywise/<\u002Fcode> and you want a second opinion before implementation.<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--bg2);padding:15px 17px;margin-bottom:
