n both runtimes. Can delegate to developer and QA in Kiro CLI. Its system prompt applies a maker-checker pass to every artifact and presents findings CRITICAL → IMPORTANT → SUGGESTION followed by Fix these issues? [y/n].\" },\n          { k: \"asdlc-developer\", v: \"SOPs: k-code-cleanup, asdlc-code-critic, asdlc-codebase-analysis, k-code-review-workflow. 19 skills — backend and frontend development and review, infra-validation, code-review, git-workflow, asdlc-code-simplifier, design-impact-review, find-aws-skills and others. MCP: aws-mcp. Write and shell in both. Can delegate to QA in Kiro CLI. The workhorse: everything the orchestrator cannot do itself lands here, and it owns the only source-modifying SOP.\" },\n          { k: \"asdlc-quality-assurance\", v: \"SOPs: k-test-coverage-review, k-code-review-workflow (shared with the developer). 10 skills — test-coverage-analysis, e2e-test-strategy, cypress-test-implementation, security-test-generation, dom-inspection, ui-text-validation and others. Write and shell in both. Can delegate to the developer in Kiro CLI.\" },\n          { k: \"asdlc-product-manager\", v: \"No SOPs — skill-driven. 14 skills: user-story-writing, requirements-extraction, decision-research, sprint-planning, asana-sprint-planning, task-decomposition, legacy-to-agentic-estimate, humanize-writing, deliberation-panel and others. Write in both; shell in Claude Code only. Delegates to nothing — has the subagent tool with an empty target list. Ask for the outcome rather than a procedure.\" },\n          { k: \"asdlc-tpm\", v: \"No SOPs — skill-driven. 14 skills: program-planning, status-reporting, risk-management, program-decision-docs, plan-review, legacy-to-agentic-estimate, sprint-planning and others. Write in both; shell in Claude Code only. Can delegate to developer and researcher in Kiro CLI. Owns legacy-to-agentic-estimate and its convert_estimates.py script, which is why asdlc-plan step 5 delegates the Agentic Projection here.\" },\n          { k: \"asdlc-researcher\", v: \"No SOPs — skill-driven. 7 skills: external-research, sdlc-navigator, document-formats, deliberation-panel, persistent-memory, workspace-skills, constraints. Kiro CLI: @builtin, subagent, allowedTools fs_read only. Claude Code: WebFetch, WebSearch, TodoWrite — the narrowest tool list of any agent. Read-only in both runtimes, which makes it the safest agent to point at unfamiliar code. asdlc-analyze step 1 spawns one or two of these in parallel. Optional Slack search is opt-in.\" },\n          { k: \"asdlc-browser\", v: \"No SOPs. 4 skills: constraints, sdlc-navigator, app-discovery, dom-inspection. MCP: playwright-mcp (@playwright/mcp@latest) — the Kiro CLI allowedTools enumerates 12 specific browser tools: snapshot, screenshot, console messages, network requests, tabs, navigate, navigate back, wait for, click, type, select option, press key. No mutation in Kiro CLI; write and shell in Claude Code. Needs the browser binary: npx playwright install chromium.\" },\n          { k: \"asdlc-media-analyzer\", v: \"No SOPs. 1 skill — constraints only. Kiro CLI: @builtin, allowedTools fs_read and web_fetch. No mutation in Kiro CLI; write and shell in Claude Code. The leanest agent in the package: its capability is the model's ability to interpret PDFs, images, and diagrams, not a skill library. Point it at a file and ask a question about it.\" }\n        ] }),\n      sec(\"ag-runtime\", \"Runtime differences\", \"Runtime differences that matter\", {\n        h1: \"DIFFERENCE\", h2: \"KIRO CLI · CLAUDE CODE\", rows: [\n          { k: \"Agent name\", v: \"asdlc-orchestrator · ASDLCCoreAICapabilities-asdlc-orchestrator\" },\n          { k: \"Cross-agent delegation\", v: \"7 agents have subagent, 5 with real targets · only asdlc-orchestrator\" },\n          { k: \"MCP servers\", v: \"declared and launched from dependencies.mcpRegistry · requested via tool globs (mcp__aws-mcp__*); you configure the server yourself\" },\n          { k: \"Tool naming\", v: \"fs_read, fs_write, shell · Read, Write, Edit, Bash\" },\n          { k: \"browser / media-analyzer\", v: \"read-only · can write files and run shell\" },\n          { k: \"product-manager / tpm\", v: \"no shell · shell available\" },\n          { k: \"Skills resolution\", v: \"skill://~/.kiro/skills/<name>/SKILL.md resource URIs · clientConfig.claudeCli.skills names\" },\n          { k: \"Extra setup\", v: \"none · agent-teams env var AND a permissions allowlist\" }\n        ],\n        warn: \"The delegation row is the one that changes behaviour most: a workflow that relies on one specialist handing off to another works in Kiro CLI and silently does not in Claude Code.\" })\n    ]\n  },\n  contributing: {\n    eyebrow: \"APPENDIX / CONTRIBUTING AND CUSTOMIZING\", title: \"Contributing and customizing\",\n    intro: \"This appendix is for working on Konductor rather than with it: building the CLI from source, changing how the agents behave, and contributing those changes back. Nothing here is needed to use Konductor.\",\n    prev: [\"help\", \"Getting help\"], next: [\"home\", \"Guide index\"],\n    sections: [\n      sec(\"cb-custom\", \"Customizing behaviour\", \"Customizing agent behaviour\", {\n        paras: [\"Everything Konductor does is plain JSON and Markdown in the repository. There is no compiled behaviour, no database, no hidden state — so you can read exactly what an agent will do, and change it. Four files control four different things. Pick the smallest one that achieves what you want.\"],\n        h1: \"EDIT\", h2: \"EFFECT\", rows: [\n          { k: \"context/asdlc-orchestrator-routing-rules.md\", v: \"Which specialist handles which kind of request — routing, loaded at session start for all three orchestrators\" },\n          { k: \"agent-sops/<name>.sop.md\", v: \"The steps of one workflow — its steps, constraints, and quality gates\" },\n          { k: \"skills/<name>/SKILL.md\", v: \"How an agent reasons about one topic — guidance that agent loads on demand\" },\n          { k: \"agents/<name>.agent-spec.json\", v: \"An agent's prompt, model, tools, or dependencies — in both runtimes\" }\n        ],\n        warn: \"Routing lives in two places. The routing rules file says so itself: skills/delegation-protocol/SKILL.md is the authoritative source, and the context file's table is a quick-reference summary. When they conflict, the skill wins — so update both. Changing only the context file leaves the authoritative source contradicting it.\" }),\n      sec(\"cb-skill\", \"Adding and writing skills\", \"Adding a skill, and writing a new one\", {\n        paras: [\"A skill has to be declared in both runtime configurations or it will only load in one. Append to the existing arrays rather than replacing them. A skill directory that exists under skills/ but is declared by no agent cannot be loaded by anything.\"],\n        codeLang: \"JSON\", code: \"{\\n  \\\"clientConfig\\\": {\\n    \\\"kiroCli\\\": {\\n      \\\"resources\\\": [\\\"skill://~/.kiro/skills/my-new-skill/SKILL.md\\\"]\\n    },\\n    \\\"claudeCli\\\": {\\n      \\\"skills\\\": [\\\"my-new-skill\\\"]\\n    }\\n  }\\n}\",\n        paras2: [],\n        bullets: [\"Create skills/<kebab-case-name>/SKILL.md with YAML frontmatter: name, description, version, tags.\", \"The description is load-bearing: only the name and description are in the agent's memory at session start, so a vague description means the skill never gets loaded. Name it for the trigger, not the implementation.\", \"Skills may ship helper files alongside SKILL.md — scripts, evaluation fixtures, templates.\"] }),\n      sec(\"cb-sop\", \"Writing a new SOP\", \"Writing a new SOP\", {\n        paras: [\"Create agent-sops/<name>.sop.md following the shape every existing SOP uses. Use RFC 2119 wording deliberately — MUST, MUST NOT, SHOULD, MAY. It is how an agent tells a hard rule from a preference, and it is why the existing SOPs behave consistently.\"],\n        codeLang: \"SHAPE\", code: \"# Title\\n\\n## Overview          what it does, when to use it\\n## Parameters        required and optional, with defaults\\n## Steps\\n### 1. Step name\\n     description\\n     **Constraints:**      MUST / MUST NOT / SHOULD rules\\n     **Expected Output:**  what this step produces\\n## Quality Gate      (optional) the conditions for done\\n## Troubleshooting   (optional)\",\n        note: \"Then declare the SOP on whichever agents should be able to run it, in dependencies.agentSops.agentSopNames. A SOP is only available in a session with an agent that declares it — the single most common reason a new SOP appears to do nothing. Check the delegation constraint too: if your SOP tells an agent to hand work to another agent, make sure the owning agent is actually allowed to reach it.\" }),\n      sec(\"cb-build\", \"Building from source\", \"Building the CLI from source\", {\n        paras: [\"You only need this to change the CLI itself. To use it, download a build. Prerequisites: the Rust toolchain (cargo --version) and git (git --version). Install Rust from rust-lang.org/tools/install if cargo is missing, then reopen your terminal.\", \"Anything ending in \\\"Finished\\\" succeeded. To put your build on the PATH for the current terminal session, export it; or install it permanently to ~/.cargo/bin with cargo install --path .\"],\n        code: \"git clone https://github.com/aws-solutions/konductor.git\\ncd konductor\\ncargo build --release\\n./target/release/konductor --version\",\n        warn: \"If you also have a downloaded release build on your PATH, the two now collide under the same name and whichever comes first wins. Keep one, and use which konductor when behaviour surprises you.\" }),\n      sec(\"cb-tests\", \"Tests and pre-PR checks\", \"Run the tests, and the checks before a pull request\", {\n        paras: [\"Clippy is configured to treat every warning as an error, so a clean run is required rather than advisory.\"],\n        code: \"cargo test\\ncargo fmt --check\\ncargo clippy -- -D warnings\" }),\n      sec(\"cb-synth\", \"Regenerating with synth\", \"Regenerating runtime files with synth\", {\n        paras: [\"konductor synth parses the source tree and writes runtime configuration from it. It is the command you run after editing agents, skills, or SOPs. Success prints nothing and exits 0, and dist/kiro/agents/ ends up with one file per agent spec. dist/ is gitignored — it is generated output, never committed.\", \"To synthesize a tree other than the current directory, pass --local. Output goes to that path's dist/, never your working directory.\"],\n        code: \"konductor synth\\nls dist/kiro/agents\\nkonductor synth --local /path/to/konductor\",\n        h1: \"DIRECTORY\", h2: \"FILES AND RULES\", rows: [\n          { k: \"agents/\", v: \"*.agent-spec.json — aborts on the first parse failure; duplicate names rejected\" },\n          { k: \"skills/\", v: \"<name>/SKILL.md — names must match ^[a-z0-9]+(-[a-z0-9]+)*$; files over 1 MiB rejected\" },\n          { k: \"agent-sops/\", v: \"*.sop.md — duplicate names rejected\" }\n        ],\n        note: \"Each collection is sorted by name, so output is reproducible.\" }),\n      sec(\"cb-validate\", \"Validating your changes\", \"Validating your changes\", {\n        paras: [\"synth is your fastest validator: it parses every agent spec, skill, and SOP and reports the first problem with a file and a reason, exiting 64. Fix the named file and re-run.\", \"Every skill directory should be declared by at least one agent, or nothing can load it. Compare ls skills | wc -l against the union of every spec's declared skills — a mismatch means a skill exists that no agent can reach, which matters most when a SOP instructs an agent to use it.\", \"Editing an agent, skill, or SOP has no effect on a running session — all three are read at session start. Start a new session, then exercise the path you changed. For a SOP, ask the owning agent for it by name and check the steps match what you wrote.\"],\n        code: \"konductor synth\\nls dist/kiro/agents | wc -l\\nls skills | wc -l\",\n        warn: \"Silence alone does not prove your specs were checked — a tree with no agents/ directory exits 0 and writes nothing. Confirm files appeared.\" }),\n      sec(\"cb-back\", \"Contributing changes back\", \"Contributing changes back\", {\n        paras: [\"See CONTRIBUTING.md for the full process. In short: work against the latest source on the main branch; check existing and recently merged pull requests first; open an issue to discuss anything significant before writing it; fork, make a focused change, ensure local tests pass, commit with clear messages, and send a pull request; then watch for automated CI failures and stay in the conversation.\"],\n        h1: \"CONVENTION\", h2: \"DETAIL\", rows: [\n          { k: \"Agent specs\", v: \"JSON, 2-space indent. Append to arrays rather than reformatting the file.\" },\n          { k: \"Skills\", v: \"Markdown with YAML frontmatter (name, description at minimum)\" },\n          { k: \"Agent names\", v: \"asdlc- prefix\" },\n          { k: \"Skill names\", v: \"Unprefixed unless avoiding a known collision\" },\n          { k: \"License headers\", v: \"SPDX identifier as the first line — or line 2 for scripts needing a shebang\" },\n          { k: \"Portability\", v: \"No organisation-specific references, internal tooling, or private domains\" },\n          { k: \"Usage errors\", v: \"Exit 64. Never exit 2 for a bad invocation.\" },\n          { k: \"Command surface changes\", v: \"Keep cli/README.md's command list in sync\" }\n        ],\n        note: \"CODE_OF_CONDUCT.md covers community standards. SECURITY.md covers reporting a vulnerability — do not open a public issue for a security problem.\" })\n    ]\n  },\n  troubleshooting: {\n    eyebrow: \"GUIDE / TROUBLESHOOTING\", title: \"Troubleshooting\",\n    intro: \"Specific symptoms, in symptom → cause → fix form. Before working through these, run konductor doctor — it catches most installation problems and tells you the fix. For a systematic walk-through rather than a specific symptom, see Diagnose problems.\",\n    prev: [\"reference\", \"CLI reference\"], next: [\"faq\", \"FAQ\"],\n    sections: [\n      sec(\"t-1\", \"1 — command not found\", \"1. konductor: command not found\", {\n        paras: [\"SYMPTOM — konductor --version reports \\\"command not found\\\".\", \"CAUSE — The binary is not on your PATH. Usually one of three things: it was downloaded but never moved anywhere on the PATH; it was moved to ~/.local/bin, but that directory is not on your PATH; or you added a directory to PATH with export in a different terminal session — export does not persist across sessions.\", \"FIX — Check whether the binary exists where you put it with ls ~/.local/bin/konductor. If it is missing, download it again. If it exists but is still not found, add the directory to your shell profile, then open a new terminal or source it. Use ~/.bashrc if you use bash. Confirm with which konductor.\"],\n        code: \"curl -fsSLo konductor https://konductor.sh/downloads/cli\\nchmod +x konductor && mkdir -p ~/.local/bin && mv konductor ~/.local/bin/\\necho 'export PATH=\\\"$HOME/.local/bin:$PATH\\\"' >> ~/.zshrc\" }),\n      sec(\"t-2\", \"2 — a command exits 64\", \"2. A command exits 64\", {\n        paras: [\"SYMPTOM — A command prints an error and your shell reports exit status 64 — an unfamiliar number if you are used to 1 or 2. For example konductor instal returns \\\"error: unrecognized subcommand 'instal'\\\" with a tip naming the closest real commands.\", \"CAUSE — 64 is EX_USAGE from BSD sysexits.h: the CLI's code for you typed something wrong. It is deliberately not 2, so that a malformed invocation can never be confused with a substantive failure.\", \"FIX — Read the message and correct the invocation. When the subcommand is unrecognized, the tip: line names the closest real commands.\"],\n        code: \"konductor --help\",\n        note: \"konductor doctor also exits 64 when a check fails — if you are scripting, use --json and read the failed count to tell a real problem from a typo.\" }),\n      sec(\"t-3\", \"3 — orchestrator does the work\", \"3. The orchestrator does the work itself instead of delegating\", {\n        paras: [\"SYMPTOM — You asked asdlc-orchestrator to implement something and it started editing files and running shell commands directly, rather than handing off to asdlc-developer.\", \"CAUSE — The orchestrator is supposed to be read-only. That rule lives in context/asdlc-orchestrator-routing-rules.md, loaded at session start. If the context file did not load, the behaviour is gone — the system prompt alone does not carry it.\"],\n        quote: \"NEVER MUTATE DIRECTLY — DELEGATE INSTEAD. You are a read-only orchestrator. You NEVER directly execute mutating operations or shell commands. […] Note: shell must always be delegated even for apparently read-only commands (e.g., ls, grep) — there is no read-only carve-out for shell.\",\n        bullets: [\"Run konductor doctor and look at the context files line — it should report 1 registered.\", \"If it reports 0, run konductor install and start a new session. Context files are read at session start, so an in-flight session keeps the old state.\", \"Confirm you actually started an orchestrator. Only the three orchestrators load this file; asdlc-developer is supposed to write files, so if you invoked it directly this is correct behaviour rather than a bug.\"],\n        note: \"A related symptom with the same cause: the orchestrator saying \\\"I can't access X\\\" or \\\"I don't have the ability to…\\\". The routing rules explicitly forbid that response — the correct behaviour is to check the routing table and delegate. Hearing \\\"I can't\\\" is a strong signal the routing rules did not load.\" }),\n      sec(\"t-4\", \"4 — specialists spawn but idle\", \"4. Claude Code specialists spawn but do nothing\", {\n        paras: [\"SYMPTOM — The orchestrator spawns a specialist. It appears, then accomplishes nothing — no error, no permission prompt, no output.\", \"CAUSE — Missing tool permissions. Background subagents cannot prompt you interactively, so any tool not in permissions.allow in ~/.claude/settings.json is silently auto-denied. The specialist has no tools and no way to tell you. The mirror-image failure has the same silence: with permissions.allow configured but CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS unset, specialists never spawn at all. Both settings are required.\", \"FIX — konductor doctor checks both explicitly. Apply what it tells you, then start a new session — both settings are read at startup. The full allowlist to paste is in Install for Claude Code.\"],\n        warn: \"Diagnosis shortcut: specialists spawning but idle → permissions. Specialists never spawning → environment variable.\" }),\n      sec(\"t-5\", \"5 — agent cannot run a workflow\", \"5. An agent says it cannot run a workflow\", {\n        paras: [\"SYMPTOM — You asked an agent for a workflow by name and it says it does not have it, or it improvises something different.\", \"CAUSE — A SOP is only available in a session with an agent that declares it. For example k-test-coverage-review is declared only by asdlc-quality-assurance — ask asdlc-product-manager for it and there is nothing to run.\", \"FIX — Either start with asdlc-orchestrator and let it route, or go directly to the owning agent. The ownership table is on the SOP workflows index.\"],\n        note: \"A related case: a workflow that tells one agent to hand off to another may find it is not allowed to. Delegation is scoped per agent — asdlc-developer can reach asdlc-quality-assurance but not asdlc-architect, for instance.\" }),\n      sec(\"t-6\", \"6 — edits had no effect\", \"6. My edits to an agent, skill, or SOP had no effect\", {\n        paras: [\"SYMPTOM — You changed a skill or a SOP, asked the agent to do the thing, and got the old behaviour.\", \"CAUSE — Two possibilities, both easy to hit. Agents, skills, and context files are read at session start, so a running session keeps what it loaded. And you may have edited the source tree while the runtime reads the installed copy — editing skills/foo/SKILL.md in a clone does not change what your runtime loaded.\", \"FIX — Regenerate, reinstall, then start a new session.\"],\n        code: \"konductor synth\\nkonductor install\",\n        note: \"If you want your edits to survive future updates, note that konductor update preserves locally modified files and names the ones it skipped.\" }),\n      sec(\"t-7\", \"7 — synth produces nothing\", \"7. konductor synth succeeds but produces nothing\", {\n        paras: [\"SYMPTOM — synth exits 0 and prints nothing, but there is no dist/ directory.\", \"CAUSE — Most likely you ran it somewhere without an agents/ directory. synth reads agents/, skills/, and agent-sops/ relative to the source tree. A tree with none of them parses to an empty model, writes zero files, and exits 0 — silently. Silence is also what success looks like, which is what makes this confusing: synth printing nothing tells you nothing. Check for files instead.\", \"FIX — Confirm you are in a tree with the content, then re-run and verify output appeared. Or point at the tree explicitly — remembering output lands in <that path>/dist/, not your current directory.\"],\n        code: \"ls agents\\nls dist/kiro/agents | wc -l\\nkonductor synth --local /path/to/konductor\",\n        note: \"If a spec is malformed instead, you get a specific error and exit 64, not silence — for example \\\"agents/broken.agent-spec.json: invalid JSON: key must be a string at line 1 column 3\\\". Fix the named file and re-run.\" }),\n      sec(\"t-8\", \"8 — config value is wrong\", \"8. A config value is not what I set\", {\n        paras: [\"SYMPTOM — konductor config list shows a value you did not put in your project config.\", \"CAUSE — Three layers merge — CLI defaults, then ~/.konductor/config.yml, then the project file — and a forgotten user-level config applies to every project while nothing surfaces it.\", \"FIX — Check the user layer. \\\"No such file or directory\\\" means you have no user-level config, and the value is coming from the CLI defaults. Otherwise, that file is your answer — edit or remove it. To override just for this project, set it: project config always wins over the user layer.\"],\n        code: \"cat ~/.konductor/config.yml\\nkonductor config set severities_source my-severities.yml\" })\n    ]\n  },\n  help: {\n    eyebrow: \"GUIDE / GETTING HELP\", title: \"Getting help\",\n    intro: \"Only channels that actually exist in this repository are listed here. Nothing on this page is invented.\",\n    prev: [\"glossary\", \"Glossary\"], next: [\"contributing\", \"Contributing and customizing\"],\n    sections: [\n      sec(\"h-first\", \"First, check these\", \"First, check these\", {\n        paras: [\"Most problems are already answered.\"],\n        h1: \"PROBLEM\", h2: \"WHERE\", rows: [\n          { k: \"A specific error message or symptom\", v: \"Troubleshooting\" },\n          { k: \"\\\"Does this work yet?\\\"\", v: \"FAQ → what you get when you install\" },\n          { k: \"Unfamiliar terminology\", v: \"Glossary\" },\n          { k: \"The exact command, flag, or config contract\", v: \"CLI reference\" },\n          { k: \"Systematic diagnosis\", v: \"Diagnose problems\" }\n        ],\n        code: \"tail -20 ~/.konductor/logs/konductor.log\\nkonductor doctor\",\n        note: \"Two self-service checks worth running before you ask anyone. The log gives you the exact commands you ran and the exit code each produced — much more useful in a bug report than a recollection. doctor checks your runtime, the installed content, your project config, and whether an update is available, and prints the fix for anything it finds.\" }),\n      sec(\"h-bug\", \"Report a bug\", \"Report a bug or request a feature\", {\n        paras: [\"Use the GitHub issue tracker, per CONTRIBUTING.md — open issues at github.com/aws-solutions/konductor/issues, and check recently closed ones too before filing. Someone may have reported it already.\"],\n        bullets: [\"A reproducible test case, or a series of steps\", \"The version of the code being used\", \"Any modifications you have made that are relevant\", \"Anything unusual about your environment or deployment\"],\n        code: \"konductor --version\\nwhich konductor\\nkonductor config list\",\n        note: \"Useful additions for Konductor specifically: the output of those three commands, the relevant lines from ~/.konductor/logs/konductor.log, and — if the problem is with an agent rather than the CLI — which agent and which runtime you were using. The repository also ships issue and PR templates in .github/, which your issue form picks up automatically.\" }),\n      sec(\"h-security\", \"Report a vulnerability\", \"Report a security vulnerability\", {\n        paras: [\"Per SECURITY.md, notify AWS/Amazon Security instead of the issue tracker: the vulnerability reporting page at aws.amazon.com/security/vulnerability-reporting/, or aws-security@amazon.com.\"],\n        warn: \"Do not open a public GitHub issue for a security problem.\" }),\n      sec(\"h-contribute\", \"Contribute a fix\", \"Contribute a fix\", {\n        paras: [\"CONTRIBUTING.md has the full process. In short:\"],\n        bullets: [\"Work against the latest source on the main branch.\", \"Check existing and recently merged pull requests first.\", \"Open an issue to discuss anything significant before writing it — so your time is not wasted.\", \"Fork, make a focused change, ensure local tests pass, commit with clear messages, and send a pull request.\", \"Watch for automated CI failures and stay in the conversation.\"],\n        code: \"cargo test\",\n        note: \"CODE_OF_CONDUCT.md covers community standards.\" }),\n      sec(\"h-docs\", \"Documentation in the repo\", \"Documentation in this repository\", {\n        h1: \"DOCUMENT\", h2: \"COVERS\", rows: [\n          { k: \"README.md\", v: \"Project overview, agent and skill summaries, roadmap\" },\n          { k: \"AGENTS.md\", v: \"Instructions loaded into agent context at session start\" },\n          { k: \"cli/README.md\", v: \"CLI commands and conventions\" },\n          { k: \"CHANGELOG.md\", v: \"Release notes\" },\n          { k: \"docs/guides/getting-started-claude.md\", v: \"Claude Code setup, including agent-teams configuration\" },\n          { k: \"docs/guides/slack-integration.md\", v: \"Optional Slack MCP setup for asdlc-researcher\" },\n          { k: \"docs/guides/asana-integration.md\", v: \"Optional Asana MCP setup for asdlc-product-manager\" }\n        ] }),\n      sec(\"h-external\", \"External documentation\", \"External documentation\", {\n        paras: [\"For the runtimes themselves, rather than Konductor.\"],\n        h1: \"TOOL\", h2: \"WHERE\", rows: [\n          { k: \"Claude Code\", v: \"claude.ai/download\" },\n          { k: \"Kiro\", v: \"kiro.dev\" },\n          { k: \"Rust toolchain (only if building from source)\", v: \"rust-lang.org/tools/install\" },\n          { k: \"Playwright MCP\", v: \"github.com/microsoft/playwright-mcp\" },\n          { k: \"cmux\", v: \"github.com/manaflow-ai/cmux\" }\n        ] }),\n      sec(\"h-license\", \"License\", \"License\", {\n        paras: [\"Konductor is licensed under the Apache License, Version 2.0. See LICENSE.txt, NOTICE.txt, and THIRD_PARTY_LICENSES.txt in the repository.\"] })\n    ]\n  },\n  glossary: {\n    eyebrow: \"GUIDE / GLOSSARY\", title: \"Glossary\",\n    intro: \"Every term this guide uses, alphabetized.\",\n    prev: [\"faq\", \"FAQ\"], next: [\"help\", \"Getting help\"],\n    sections: [\n      sec(\"g-ac\", \"A – C\", \"A – C\", { h1: \"TERM\", h2: \"DEFINITION\", rows: [\n        { k: \"ADR (Architecture Decision Record)\", v: \"A short document recording one significant design decision: its context, the decision, the alternatives considered, and the consequences. Generated by the adr-generator skill and embedded inline in design documents by the k-design-doc-creation SOP.\" },\n        { k: \"Agent\", v: \"A configured AI assistant with a defined role, an explicit list of permitted tools, and a body of reference knowledge. Konductor ships 11.\" },\n        { k: \"Agent spec\", v: \"The JSON file defining one agent, at agents/<name>.agent-spec.json. Contains schemaVersion, name, config (description, model, system prompt), dependencies (SOPs, context files, MCP registry), and clientConfig (per-runtime tools and skills).\" },\n        { k: \"Agent script\", v: \"Another name for a SOP.\" },\n        { k: \"availableAgents\", v: \"The list in a Kiro CLI agent spec (clientConfig.kiroCli.toolsSettings.subagent.availableAgents) naming exactly which agents that agent may spawn. An empty list means the agent holds the subagent tool but can spawn nothing. Only asdlc-orchestrator is unrestricted.\" },\n        { k: \"Canonical model\", v: \"The intermediate representation konductor synth builds by parsing agents/, skills/, and agent-sops/, and then writes per-runtime output from.\" },\n        { k: \"Claude Code\", v: \"Anthropic's command-line AI assistant, invoked as claude. One of the two supported runtimes. Prefixes Konductor agent names with the package name — for example ASDLCCoreAICapabilities-asdlc-orchestrator.\" },\n        { k: \"cmux\", v: \"A terminal multiplexer supported by asdlc-cmux-orchestrator for running specialists in parallel surfaces.\" },\n        { k: \"Context file\", v: \"Markdown loaded into an agent's memory at session start and kept active for the whole session, unlike a skill, which loads on demand. One exists: context/asdlc-orchestrator-routing-rules.md, loaded by all three orchestrators.\" },\n        { k: \"CRITICAL / IMPORTANT / SUGGESTION\", v: \"The three-level severity vocabulary most SOPs use for findings, always sorted in that order. Some SOPs use Critical / Important / Minor for the same three levels. Distinct from the five-level severity enum in the CLI's configuration.\" }\n      ] }),\n      sec(\"g-dg\", \"D – G\", \"D – G\", { h1: \"TERM\", h2: \"DEFINITION\", rows: [\n        { k: \"Delegation\", v: \"The act of an orchestrator handing work to a specialist, using the fixed 7-section format defined by the asdlc-delegate SOP and the delegation-protocol skill: TASK, EXPECTED OUTCOME, REQUIRED SKILLS, REQUIRED TOOLS, MUST DO, MUST NOT DO, CONTEXT.\" },\n        { k: \"dist/\", v: \"The directory konductor synth writes its output to, relative to the source tree being synthesized — never the process working directory. Listed in .gitignore.\" },\n        { k: \"EARS\", v: \"Easy Approach to Requirements Syntax — the WHEN / IF / WHILE … SHALL construction used for acceptance criteria in the requirements.md produced by the kiro-spec-workflow SOP. Keeps criteria testable.\" },\n        { k: \"EX_USAGE\", v: \"The BSD sysexits.h name for exit code 64, meaning a command-line usage error. Konductor uses it rather than the more common 2, so a malformed invocation is never confused with a substantive failure.\" },\n        { k: \"Fail-open\", v: \"A design choice where a subsystem's failure never changes the outcome of the operation around it. The CLI's invocation log is fail-open: if the log cannot be written, the command still runs and its exit code is unaffected.\" },\n        { k: \"Gate\", v: \"A checkpoint a workflow must satisfy before continuing. In SOPs, gates are conditions such as \\\"zero CRITICAL findings\\\" or an explicit [y/n] confirmation that stops the workflow until you answer.\" }\n      ] }),\n      sec(\"g-hm\", \"H – M\", \"H – M\", { h1: \"TERM\", h2: \"DEFINITION\", rows: [\n        { k: \"Hub-and-spoke\", v: \"Konductor's coordination model. The orchestrator is the hub; specialists are spokes and never message each other. All routing flows through the hub.\" },\n        { k: \"Invocation log\", v: \"~/.konductor/logs/konductor.log. One line per CLI invocation, recording an ISO-8601 UTC timestamp, the argument vector, and the exit code. Directory mode 0700, file mode 0600. No rotation. Fail-open.\" },\n        { k: \"Kiro CLI\", v: \"Amazon's command-line AI assistant, invoked as kiro-cli. One of the two supported runtimes. Uses unprefixed agent names — for example asdlc-orchestrator.\" },\n        { k: \"Konductor\", v: \"The name of this project. The distributable package is currently named ASDLCCoreAICapabilities and every agent is named asdlc-*; a rename to konductor and k-* is planned but has not shipped.\" },\n        { k: \"Konductor CLI\", v: \"The konductor command-line program. Handles setup, content build, lifecycle, and diagnostics: install, update, uninstall, doctor, init, config, and synth. It does not run SDLC workflows — that is the agents' job.\" },\n        { k: \"Maker-checker\", v: \"A pattern where the agent that produces an artifact then evaluates it against explicit criteria before presenting it. Findings are ordered CRITICAL / IMPORTANT / SUGGESTION, followed by Fix these issues? [y/n].\" },\n        { k: \"MCP (Model Context Protocol)\", v: \"A standard for exposing external tools to an AI agent. Konductor declares MCP servers in an agent spec's dependencies.mcpRegistry. Two are pre-declared: aws-mcp (on asdlc-architect and asdlc-developer) and playwright-mcp (on asdlc-browser).\" },\n        { k: \"Mermaid\", v: \"The text-based diagram syntax used throughout the source guide and generated by several SOPs. Renders as a diagram in GitHub, most Markdown viewers, and many IDEs.\" }\n      ] }),\n      sec(\"g-nr\", \"N – R\", \"N – R\", { h1: \"TERM\", h2: \"DEFINITION\", rows: [\n        { k: \"Orchestrator\", v: \"An agent that coordinates other agents and never implements directly. Three exist: asdlc-orchestrator (background subagents), asdlc-mux-orchestrator (tmux/zellij panes), and asdlc-cmux-orchestrator (cmux surfaces). All are read-only by rule — they delegate every file write and shell command.\" },\n        { k: \"Orphan skill\", v: \"A skill present in skills/ that no agent declares, and therefore cannot be loaded by any agent — which matters most when a SOP instructs an agent to use it. Something to check after adding a skill.\" },\n        { k: \"Preset\", v: \"konductor init --preset solo|team|org — selects the starter configuration that matches how the project is worked on.\" },\n        { k: \"Read-only\", v: \"Applied to an agent, it means the agent never mutates state — no file writes, no shell commands, no git operations. The orchestrators are read-only by rule. Applied to a SOP (as with asdlc-code-critic), it means the SOP never modifies source files, creates commits, or runs builds or tests.\" },\n        { k: \"RFC 2119\", v: \"The internet standards convention giving MUST, MUST NOT, SHOULD, and MAY precise requirement levels. SOPs use this wording deliberately, so an agent can distinguish a hard rule from a preference.\" },\n        { k: \"Runtime\", v: \"The program that executes an agent on your machine. Konductor supports Kiro CLI and Claude Code, and includes no runtime of its own.\" }\n      ] }),\n      sec(\"g-sz\", \"S – Z\", \"S – Z\", { h1: \"TERM\", h2: \"DEFINITION\", rows: [\n        { k: \"SDLC\", v: \"Software development lifecycle — the full arc from requirements through design, implementation, testing, and operations. Konductor ships specialists for each phase.\" },\n        { k: \"Severity\", v: \"How serious a finding is. Most SOPs use a three-level vocabulary — CRITICAL / IMPORTANT / SUGGESTION — sorted in that order. The severity vocabulary the CLI ships is declared in the file named by the severities_source config key.\" },\n        { k: \"Skill\", v: \"A self-contained module of knowledge an agent loads on demand, at skills/<name>/SKILL.md with YAML frontmatter (name, description, often version and tags). Only names and descriptions load at session start. 75 ship.\" },\n        { k: \"SOP (standard operating procedure)\", v: \"A written, numbered procedure an agent follows to complete a complex task consistently, at agent-sops/<name>.sop.md. Structure: Overview, Parameters, numbered Steps each with RFC 2119 Constraints and an Expected Output, and sometimes a Quality Gate and Troubleshooting section. 13 ship; 12 are user-facing.\" },\n        { k: \"STRIDE\", v: \"The threat-modeling taxonomy — Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege — used by the threat-modeling skill on asdlc-architect.\" },\n        { k: \"Synth\", v: \"konductor synth. Parses the source tree into the canonical model and writes per-runtime output to <source>/dist/. Also useful as a validator: it reports the first malformed spec, skill, or SOP with a file and a reason.\" },\n        { k: \"Tier\", v: \"A classification of how large a change is. The tier vocabulary the CLI ships is declared in the file named by the tiers_source config key.\" },\n        { k: \"tmux / zellij\", v: \"Terminal multiplexers supported by asdlc-mux-orchestrator, which auto-detects whichever is active and dispatches specialists into separate panes.\" }\n      ] })\n    ]\n  }\n};\n\nclass Component extends DCLogic {\n  state = { page: \"home\", theme: \"dark\", runtime: \"kiro\", q: \"\", closed: {} };\n  componentDidMount() {\n    let t = null;\n    try { t = localStorage.getItem(\"konductor-guide-theme\"); } catch (e) {}\n    if (t && t !== this.state.theme) this.setState({ theme: t });\n    document.documentElement.setAttribute(\"data-k-theme\", t || this.state.theme);\n    this._click = (e) => {\n      const b = e.target && e.target.closest ? e.target.closest(\"[data-copy]\") : null;\n      if (!b) return;\n      const box = b.closest(\"div\").parentElement;\n      const pre = box ? box.querySelector(\"pre\") : null;\n      if (pre && navigator.clipboard) navigator.clipboard.writeText(pre.innerText.trim());\n      const prev = b.textContent; b.textContent = \"copied\";\n      setTimeout(() => { b.textContent = prev; }, 1200);\n    };\n    document.addEventListener(\"click\", this._click);\n    const route = (location.hash.match(/^#\\/?([\\w-]+)/) || [])[1];\n    if (route && this.isPage(route)) this.setState({ page: route });\n    this._hash = () => {\n      const p = (location.hash.match(/^#\\/?([\\w-]+)/) || [])[1];\n      if (p && p !== this.state.page && this.isPage(p)) this.go(p);\n    };\n    window.addEventListener(\"hashchange\", this._hash);\n  }\n  componentWillUnmount() {\n    document.removeEventListener(\"click\", this._click);\n    window.removeEventListener(\"hashchange\", this._hash);\n  }\n  isPage(id) {\n    if (id === \"home\" || REF_PAGES[id] || SOP_PAGES[id]) return true;\n    for (var i = 0; i < NAV.length; i++) {\n      var items = NAV[i][2];\n      for (var j = 0; j < items.length; j++) if (items[j][0] === id) return true;\n    }\n    return false;\n  }\n  go(page) {\n    this.setState({ page });\n    try { history.replaceState(null, \"\", \"#/\" + page); } catch (e) {}\n    if (this._main) this._main.scrollTop = 0;\n  }\n  setTheme(t) {\n    document.documentElement.setAttribute(\"data-k-theme\", t);\n    try { localStorage.setItem(\"konductor-guide-theme\", t); } catch (e) {}\n    this.setState({ theme: t });\n  }\n  renderVals() {\n    const st = this.state, q = st.q.trim().toLowerCase();\n    const sections = NAV.map(([label, key, items]) => {\n      const list = items\n        .filter(([id, title]) => !q || title.toLowerCase().includes(q))\n        .map(([id, title]) => ({ id, title, active: st.page === id, go: () => this.go(id) }));\n      const open = q ? list.length > 0 : !st.closed[key];\n      return { label, key, open, chev: open ? \"\\u2212\" : \"+\", items: list,\n        toggle: () => this.setState((s) => ({ closed: Object.assign({}, s.closed, { [key]: !s.closed[key] }) })) };\n    }).filter((s) => !q || s.items.length);\n    const kiro = st.runtime === \"kiro\";\n    const known = { home: 1, quick: 1, concepts: 1, prerequisites: 1, tasks: 1, \"install-kiro\": 1, \"install-claude\": 1, init: 1, config: 1, diagnose: 1, update: 1, uninstall: 1, usecases: 1, \"uc-codebase\": 1, \"uc-design\": 1, \"uc-plan\": 1, \"uc-review\": 1, sops: 1, \"sop-plan\": 1, \"sop-design\": 1, \"sop-code\": 1, \"sop-test\": 1, faq: 1, glossary: 1, help: 1, troubleshooting: 1, contributing: 1, agents: 1, skills: 1, reference: 1 };\n    let title = \"\", summary = \"\";\n    if (!known[st.page]) {\n      for (const [, , items] of NAV) for (const [id, t] of items) if (id === st.page) title = t;\n      summary = SUMMARY[st.page] || \"A page of the Konductor user guide, built from the repository content.\";\n    }\n    return {\n      sections, q: st.q,\n      onSearch: (e) => this.setState({ q: e.target.value }),\n      scrollRef: (el) => { this._main = el; },\n      is: { home: st.page === \"home\", quick: st.page === \"quick\", concepts: st.page === \"concepts\", prerequisites: st.page === \"prerequisites\", tasks: st.page === \"tasks\", installKiro: st.page === \"install-kiro\", installClaude: st.page === \"install-claude\", init: st.page === \"init\", config: st.page === \"config\", diagnose: st.page === \"diagnose\", update: st.page === \"update\", uninstall: st.page === \"uninstall\", usecases: st.page === \"usecases\", ucCodebase: st.page === \"uc-codebase\", ucDesign: st.page === \"uc-design\", ucPlan: st.page === \"uc-plan\", ucReview: st.page === \"uc-review\", sops: st.page === \"sops\" },\n      isHome: st.page === \"home\", isQuick: st.page === \"quick\", isStub: !known[st.page],\n      stubTitle: title, stubSummary: summary,\n      agentRows: AGENTS, delegationRows: DELEGATION, fitsSteps: FITS,\n      removalSteps: REMOVAL, artifactRows: ARTIFACTS,\n      criticSteps: CRITIC_STEPS, analysisSteps: ANALYSIS_STEPS,\n      designArtifacts: DESIGN_ARTIFACTS, designPhases: DESIGN_PHASES, reviewSteps: DESIGN_REVIEW_STEPS,\n      analyzeSteps: ANALYZE_STEPS, planSteps: PLAN_STEPS, verifySteps: VERIFY_STEPS,\n      reviewSops: REVIEW_SOPS, goSops: () => this.go(\"sops\"),\n      isRefPage: !!REF_PAGES[st.page],\n      refPage: (() => {\n        const p = REF_PAGES[st.page];\n        if (!p) return {};\n        return Object.assign({}, p, { prevLabel: p.prev[1], nextLabel: p.next[1],\n          goPrev: () => this.go(p.prev[0]), goNext: () => this.go(p.next[0]) });\n      })(),\n      isSopPage: !!SOP_PAGES[st.page],\n      sopPage: (() => {\n        const p = SOP_PAGES[st.page];\n        if (!p) return {};\n        return Object.assign({}, p, {\n          prevLabel: p.prev[1], nextLabel: p.next[1],\n          goPrev: () => this.go(p.prev[0]), goNext: () => this.go(p.next[0])\n        });\n      })(),\n      sopConventions: SOP_CONVENTIONS, sopOwners: SOP_OWNERS, sopPairs: SOP_PAIRS,\n      sopRows: SOP_ROWS.map((s) => Object.assign({}, s, { go: () => this.go(s.page) })),\n      goSopPlan: () => this.go(\"sop-plan\"),\n      orchestratorName: kiro ? \"asdlc-orchestrator\" : \"ASDLCCoreAICapabilities-asdlc-orchestrator\",\n      useCaseCards: USE_CASES.map((u) => Object.assign({}, u, { go: () => this.go(u.id) })),\n      goUseCases: () => this.go(\"usecases\"), goUcCodebase: () => this.go(\"uc-codebase\"),\n      goUcDesign: () => this.go(\"uc-design\"), goUcPlan: () => this.go(\"uc-plan\"), goUcReview: () => this.go(\"uc-review\"),\n      goHome: () => this.go(\"home\"), goQuick: () => this.go(\"quick\"),\n      goPrereq: () => this.go(\"prerequisites\"), goTasksIndex: () => this.go(\"tasks\"),\n      taskCards: TASKS.map((t, i) => Object.assign({ n: \"0\" + (i + 1) }, t, { go: () => this.go(t.id) })),\n      goInstallKiro: () => this.go(\"install-kiro\"), goInstallClaude: () => this.go(\"install-claude\"),\n      goInit: () => this.go(\"init\"), goConfig: () => this.go(\"config\"),\n      goDiagnose: () => this.go(\"diagnose\"), goTrouble: () => this.go(\"troubleshooting\"),\n      goUpdate: () => this.go(\"update\"), goUninstall: () => this.go(\"uninstall\"),\n      goConcepts: () => this.go(\"concepts\"), goTasks: () => this.go(\"install-kiro\"),\n      setKiro: () => this.setState({ runtime: \"kiro\" }), setClaude: () => this.setState({ runtime: \"claude\" }),\n      runtimeLabel: kiro ? \"KIRO CLI\" : \"CLAUDE CODE\",\n      startCmd: kiro ? \"kiro-cli chat --agent asdlc-orchestrator\" : \"claude --agent ASDLCCoreAICapabilities-asdlc-orchestrator\",\n      kiroC: kiro ? \"#fff\" : \"var(--mu2)\", kiroBg: kiro ? \"var(--vi)\" : \"transparent\",\n      claudeC: kiro ? \"var(--mu2)\" : \"#fff\", claudeBg: kiro ? \"transparent\" : \"var(--vi)\",\n      toggleTheme: () => this.setTheme(st.theme === \"dark\" ? \"light\" : \"dark\"),\n      themeLabel: st.theme === \"dark\" ? \"LIGHT\" : \"DARK\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
