document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

or:var(--vi)\">ships the whole lifecycle.<\u002Fspan><\u002Fh1>\n            <p style=\"margin:0;font-size:18px;line-height:1.55;color:var(--mu);max-width:52ch\">Konductor is a coordinated team of AI agents that automates software development work — plus a command-line utility for installing, configuring, and diagnosing that team. No servers. No model of its own. Your existing Kiro CLI or Claude Code runtime executes it.<\u002Fp>\n            <div style=\"display:flex;gap:12px;padding-top:4px\">\n              <button sc-camel-on-click=\"{{ goQuick }}\" style=\"all:unset;cursor:pointer;background:var(--vi);color:#fff;font-size:14px;font-weight:600;padding:13px 22px;border-radius:10px;box-shadow:0 10px 30px -12px var(--vi)\" style-hover=\"background:var(--lav)\">Quick start — 5 minutes<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ goConcepts }}\" style=\"all:unset;cursor:pointer;border:1px solid var(--bd2);border-radius:10px;color:var(--tx);font-size:14px;font-weight:500;padding:13px 22px\" style-hover=\"border-color:var(--vi);color:var(--vi)\">Core concepts<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--code);box-shadow:0 24px 60px -30px rgba(124,92,255,.7);display:flex;flex-direction:column\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--bd)\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\">INSTALL · {{ runtimeLabel }}<\u002Fspan>\n              <button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton>\n            <\u002Fdiv>\n            <pre style=\"margin:0;padding:18px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.95;color:#E8E4F5;overflow-x:auto\">curl -fsSLo konductor https://konductor.sh/downloads/cli\nchmod +x konductor\nkonductor install\n{{ startCmd }}<\u002Fpre>\n            <div style=\"border-top:1px solid var(--bd);padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.7;color:var(--mu2)\">detected runtime: {{ runtimeLabel }}<br>agents 11 · skills 75 · SOPs 13 · context 1<span style=\"display:inline-block;width:7px;height:13px;background:var(--sig);margin-left:6px;vertical-align:-2px;animation:kblink 1.1s steps(1) infinite\"><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--bd);border-radius:16px;overflow:hidden;background:var(--surf);margin-top:56px\">\n          <div style=\"padding:20px 22px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:34px;font-weight:700;letter-spacing:-.03em;color:var(--vi)\">11<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--mu2)\">AGENTS<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:20px 22px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:34px;font-weight:700;letter-spacing:-.03em;color:var(--vi)\">75<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--mu2)\">SKILLS<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:20px 22px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:34px;font-weight:700;letter-spacing:-.03em;color:var(--vi)\">13<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--mu2)\">SOPS<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:20px 22px;display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:34px;font-weight:700;letter-spacing:-.03em;color:var(--sig)\">0<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--mu2)\">SERVERS TO RUN<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:64px;border-top:1px solid var(--bd);padding-top:26px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:26px\">01 — HOW THE PIECES RELATE<\u002Fdiv>\n          <div style=\"border:1px solid var(--bd);border-radius:18px;background:radial-gradient(120% 140% at 20% 0%,rgba(124,92,255,.12),transparent 60%),var(--bg2);padding:36px 34px;display:flex;flex-direction:column;gap:0\">\n            <div style=\"display:flex;align-items:center;gap:0\">\n              <div style=\"border:1px solid var(--bd2);border-radius:10px;padding:13px 19px;font-size:14px;font-weight:600\">You<\u002Fdiv>\n              <div style=\"flex:0 0 74px;height:1px;background:var(--bd2);position:relative\">\n                <span style=\"position:absolute;right:0;top:-3px;width:0;height:0;border-left:6px solid var(--bd2);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent\"><\u002Fspan>\n                <span style=\"position:absolute;left:6px;top:-22px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:var(--mu2);white-space:nowrap\">a request<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex:1;border:1px solid var(--vi);border-radius:14px;background:rgba(124,92,255,.1);box-shadow:inset 0 0 60px -20px var(--vi);padding:18px 22px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--lav);margin-bottom:14px\">YOUR AI RUNTIME — KIRO CLI OR CLAUDE CODE<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:14px\">\n                  <div style=\"background:var(--vi);border-radius:10px;color:#fff;padding:12px 17px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;box-shadow:0 8px 24px -10px var(--vi)\">asdlc-orchestrator<\u002Fdiv>\n                  <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:3px\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--mu2)\">delegate<\u002Fspan>\n                    <span style=\"width:100%;height:1px;background:var(--bd2)\"><\u002Fspan>\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--sig)\">verify<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"border:1px solid var(--bd2);border-radius:10px;padding:12px 17px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx)\">9 specialist agents<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height:34px;width:1px;background:var(--bd2);margin-left:calc(50% - 1px)\"><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--bd)\">\n              <div style=\"padding:14px 16px;border-right:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu)\">agents/<br><span style=\"color:var(--mu2)\">11 specs<\u002Fspan><\u002Fdiv>\n              <div style=\"padding:14px 16px;border-right:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu)\">skills/<br><span style=\"color:var(--mu2)\">75 modules<\u002Fspan><\u002Fdiv>\n              <div style=\"padding:14px 16px;border-right:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu)\">agent-sops/<br><span style=\"color:var(--mu2)\">13 workflows<\u002Fspan><\u002Fdiv>\n              <div style=\"padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu)\">context/<br><span style=\"color:var(--mu2)\">routing rules<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--mu2)\">the CLI installs the content · the content configures your runtime · you talk to the orchestrator<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:64px;border-top:1px solid var(--bd);padding-top:26px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:26px\">02 — WHERE THE TIME ACTUALLY GOES<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;border-radius:0\">\n            <div style=\"background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:26px 26px;display:flex;flex-direction:column;gap:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--mu)\">MANUAL RELAY<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\">you are the integration layer<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu2);width:22px\">01<\u002Fspan><span style=\"font-size:14px\">Carry requirements to the design chat<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu2);width:22px\">02<\u002Fspan><span style=\"font-size:14px\">Carry the design to the implementation chat<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu2);width:22px\">03<\u002Fspan><span style=\"font-size:14px\">Remember to ask for tests<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu2);width:22px\">04<\u002Fspan><span style=\"font-size:14px;color:var(--mu)\">Check the work yourself — nobody else does<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:auto;padding-top:18px;border-top:1px solid var(--bd);display:flex;align-items:baseline;gap:8px\">\n                <span style=\"font-size:40px;font-weight:700;letter-spacing:-.03em;color:var(--mu)\">5<\u002Fspan>\n                <span style=\"font-size:16px;color:var(--mu)\">days<\u002Fspan>\n                <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--mu2);text-align:right\">start to merge<br>most of it spent waiting<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:radial-gradient(120% 130% at 100% 0%,rgba(124,92,255,.16),transparent 60%),var(--surf);border:1px solid var(--bd2);border-radius:16px;padding:26px 26px;display:flex;flex-direction:column;gap:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--lav)\">WITH KONDUCTOR<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\">one conversation<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--vi);width:22px\">01<\u002Fspan><span style=\"font-size:14px\">Describe the work in plain language<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--vi);width:22px\">02<\u002Fspan><span style=\"font-size:14px\">The orchestrator routes it to the owner<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--vi);width:22px\">03<\u002Fspan><span style=\"font-size:14px\">Maker-checker runs before every handoff<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sig);width:22px\">04<\u002Fspan><span style=\"font-size:14px\">Failed checks re-delegate, up to 2 cycles<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:auto;padding-top:18px;border-top:1px solid var(--bd);display:flex;align-items:baseline;gap:8px\">\n                <span style=\"font-size:40px;font-weight:700;letter-spacing:-.03em;color:var(--vi)\">45<\u002Fspan>\n                <span style=\"font-size:16px;color:var(--tx)\">min<\u002Fspan>\n                <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--mu2);text-align:right\">background time<br>you review design &amp; intent only<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:64px;border-top:1px solid var(--bd);padding-top:26px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:26px\">03 — BOUNDARIES<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px\">\n            <div style=\"border:1px solid rgba(61,220,151,.3);border-radius:16px;background:rgba(61,220,151,.04);padding:26px 28px;display:flex;flex-direction:column;gap:14px\">\n              <h3 style=\"margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em\">What Konductor is<\u002Fh3>\n              <div style=\"display:flex;flex-direction:column;gap:11px;font-size:14.5px;line-height:1.5;color:var(--mu)\">\n                <div>Configuration — JSON specs and Markdown. No server, database, or cloud resource to run.<\u002Fdiv>\n                <div>11 agents with scoped tools and 75 on-demand knowledge modules.<\u002Fdiv>\n                <div>13 SOPs that encode multi-step procedures as numbered steps with <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">MUST<\u002Fspan> / <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">MUST NOT<\u002Fspan> constraints.<\u002Fdiv>\n                <div>Editable — routing rules and quality gates are files you can read and change.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:16px;background:var(--surf);padding:26px 28px;display:flex;flex-direction:column;gap:14px\">\n              <h3 style=\"margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em\">What it is not<\u002Fh3>\n              <div style=\"display:flex;flex-direction:column;gap:11px;font-size:14.5px;line-height:1.5;color:var(--mu)\">\n                <div>Not a workflow runner. The CLI installs, configures, and diagnoses — there is no <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">konductor review<\u002Fspan>.<\u002Fdiv>\n                <div>Not an AI model or a chat interface. It configures a runtime you already have.<\u002Fdiv>\n                <div>Not autonomous. Several SOPs stop and wait for your explicit confirmation; one is strictly read-only.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:64px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--bd);padding-top:22px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--mu2)\">APACHE 2.0 · AMAZON.COM, INC. OR ITS AFFILIATES<\u002Fspan>\n          <button sc-camel-on-click=\"{{ goQuick }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: Quick Start →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isQuick }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:0 56px 96px;gap:48px\">\n        <article style=\"flex:1 1 520px;min-width:0;padding-top:64px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">GUIDE / QUICK START<\u002Fdiv>\n          <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Quick Start<\u002Fh1>\n          <p style=\"margin:0 0 24px;font-size:19px;line-height:1.5;color:var(--mu)\">From nothing to a working agent team, in five steps.<\u002Fp>\n          <div style=\"display:flex;gap:0;border:1px solid var(--bd);margin-bottom:44px\">\n            <div style=\"padding:12px 18px;border-right:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu)\">TIME · <span style=\"color:var(--tx)\">~5 min<\u002Fspan><\u002Fdiv>\n            <div style=\"padding:12px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mu)\">NEEDS · <span style=\"color:var(--tx)\">Kiro CLI or Claude Code, git on PATH<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n\n          <section id=\"step-1\" style=\"padding-bottom:44px\">\n            <h2 style=\"margin:0 0 6px;font-size:15px;font-family:'JetBrains Mono',monospace;letter-spacing:.16em;color:var(--vi);font-weight:500\">STEP 1<\u002Fh2>\n            <h3 style=\"margin:0 0 16px;font-size:28px;letter-spacing:-.02em;font-weight:600\">Download the CLI<\u002Fh3>\n            <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">Get the build for your platform:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">curl -fsSLo konductor https://konductor.sh/downloads/cli<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\">Make it executable:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">chmod +x konductor<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 14px;font-size:16px;line-height:1.75;color:var(--mu)\">Move it somewhere on your <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);background:rgba(124,92,255,.16);border-radius:5px;padding:1.5px 6px\">PATH<\u002Fspan>:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:18px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">mkdir -p ~/.local/bin &amp;&amp; mv konductor ~/.local/bin/<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 22px;font-size:16px;line-height:1.75;color:var(--mu)\">If <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);background:rgba(124,92,255,.16);border-radius:5px;padding:1.5px 6px\">~/.local/bin<\u002Fspan> is not on your <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);background:rgba(124,92,255,.16);border-radius:5px;padding:1.5px 6px\">PATH<\u002Fspan>, add it — or pick any directory that already is. No administrator privileges are needed for any of this.<\u002Fp>\n            <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:18px 20px\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--sig);margin-bottom:12px\">CHECKPOINT<\u002Fdiv>\n              <pre style=\"margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\">konductor --version<\u002Fpre>\n              <pre style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--mu)\">konductor 0.1.0<\u002Fpre>\n              <p style=\"margin:12px 0 0;font-size:14px;line-height:1.6;color:var(--mu)\">If you get <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">command not found<\u002Fspan>, the binary is not on your <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">PATH<\u002Fspan> — see <a href=\"#/troubleshooting\">Troubleshooting<\u002Fa>.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"step-2\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 6px;font-size:15px;font-family:'JetBrains Mono',monospace;letter-spacing:.16em;color:var(--vi);font-weight:500\">STEP 2<\u002Fh2>\n            <h3 style=\"margin:0 0 16px;font-size:28px;letter-spacing:-.02em;font-weight:600\">Install the agents<\u002Fh3>\n            <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);background:rgba(124,92,255,.16);border-radius:5px;padding:1.5px 6px\">install<\u002Fspan> detects which runtime you have and registers the agents, skills, SOPs, and context files with it.<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor install<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:18px\">\n              <div style=\"padding:8px 12px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">OUTPUT<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:var(--mu);overflow-x:auto\">Detected runtime: Kiro CLI\n\nInstalling Konductor 0.1.0\n  agents          11 registered\n  skills          75 registered\n  SOPs            13 registered\n  context files    1 registered\n\nInstalled. Start a session with:\n  kiro-cli chat --agent asdlc-orchestrator<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 22px;font-size:16px;line-height:1.75;color:var(--mu)\">If you have Claude Code instead, the detected runtime and the final command differ — Claude Code prefixes agent names, and needs two settings before a team of agents can run. See <a href=\"#/install-claude\">Install for Claude Code<\u002Fa>.<\u002Fp>\n            <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:18px 20px\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--sig);margin-bottom:12px\">CHECKPOINT<\u002Fdiv>\n              <pre style=\"margin:0 0 10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\">konductor doctor<\u002Fpre>\n              <pre style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.75;color:var(--mu);overflow-x:auto\">Runtime\n  Kiro CLI                     detected (0.4.2)              ok\nContent\n  agents                       11 registered                 ok\n  skills                       75 registered                 ok\n  SOPs                         13 registered                 ok\n  context files                 1 registered                 ok\nUpdates\n  installed 0.1.0, latest 0.1.0                              ok\n\nAll checks passed.<\u002Fpre>\n              <p style=\"margin:12px 0 0;font-size:14px;line-height:1.6;color:var(--mu)\">Exit code <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">0<\u002Fspan>. Anything reported as not ok is explained in <a href=\"#/diagnose\">Diagnose problems<\u002Fa>.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"step-3\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 6px;font-size:15px;font-family:'JetBrains Mono',monospace;letter-spacing:.16em;color:var(--vi);font-weight:500\">STEP 3<\u002Fh2>\n            <h3 style=\"margin:0 0 16px;font-size:28px;letter-spacing:-.02em;font-weight:600\">Start a session with the orchestrator<\u002Fh3>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:18px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH · {{ runtimeLabel }}<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">{{ startCmd }}<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 22px;font-size:16px;line-height:1.75;color:var(--mu)\">You are now talking to the coordinator. It never implements anything itself — it routes each piece of work to the specialist that owns it, checks what comes back, and re-delegates if a check fails.<\u002Fp>\n            <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:18px 20px\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--sig);margin-bottom:12px\">CHECKPOINT<\u002Fdiv>\n              <p style=\"margin:0 0 12px;font-size:14px;line-height:1.6;color:var(--mu)\">Ask it a question about itself. Questions about orchestration are answered directly rather than delegated:<\u002Fp>\n              <pre style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\">What agents do you have available?<\u002Fpre>\n              <p style=\"margin:12px 0 0;font-size:14px;line-height:1.6;color:var(--mu)\">You should get a list of <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">asdlc-*<\u002Fspan> specialists — developer, architect, quality-assurance, researcher, product-manager, tpm, browser, media-analyzer.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"step-4\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 6px;font-size:15px;font-family:'JetBrains Mono',monospace;letter-spacing:.16em;color:var(--vi);font-weight:500\">STEP 4<\u002Fh2>\n            <h3 style=\"margin:0 0 16px;font-size:28px;letter-spacing:-.02em;font-weight:600\">Give it real work<\u002Fh3>\n            <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">Describe what you want in plain language. You do not need to name an agent or a workflow.<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:18px;border-radius:12px;padding:15px 17px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> Run a codebase analysis on this repo.<\u002Fdiv>\n            <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">The orchestrator routes this to <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);background:rgba(124,92,255,.16);border-radius:5px;padding:1.5px 6px\">asdlc-developer<\u002Fspan>, which owns the <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);background:rgba(124,92,255,.16);border-radius:5px;padding:1.5px 6px\">asdlc-codebase-analysis<\u002Fspan> workflow. It produces <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);background:rgba(124,92,255,.16);border-radius:5px;padding:1.5px 6px\">codebase-analysis.md<\u002Fspan> — architecture, SOLID evaluation, design patterns, dependencies, and technical debt, with three diagrams — then reports the file path and its top three recommendations.<\u002Fp>\n            <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">Something larger, spanning several specialists:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:18px;border-radius:12px;padding:15px 17px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> Design and implement a service that ingests IoT sensor events and alerts on anomalies.<\u002Fdiv>\n            <p style=\"margin:0 0 22px;font-size:16px;line-height:1.75;color:var(--mu)\">Here the orchestrator routes the design to <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);background:rgba(124,92,255,.16);border-radius:5px;padding:1.5px 6px\">asdlc-architect<\u002Fspan>, implementation to <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);background:rgba(124,92,255,.16);border-radius:5px;padding:1.5px 6px\">asdlc-developer<\u002Fspan>, and test coverage to <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);background:rgba(124,92,255,.16);border-radius:5px;padding:1.5px 6px\">asdlc-quality-assurance<\u002Fspan>, verifying each handoff before moving on.<\u002Fp>\n            <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:18px 20px\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--sig);margin-bottom:12px\">CHECKPOINT<\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.6;color:var(--mu)\">Watch what happens after you ask for implementation work. You should see the orchestrator <strong style=\"color:var(--tx);font-weight:600\">delegate<\u002Fstrong> to a specialist rather than start editing files itself. That is the whole design: the orchestrator is read-only and cannot write files or run shell commands. If it starts editing directly, see <a href=\"#/troubleshooting\">Troubleshooting<\u002Fa>.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"step-5\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 6px;font-size:15px;font-family:'JetBrains Mono',monospace;letter-spacing:.16em;color:var(--vi);font-weight:500\">STEP 5 · OPTIONAL<\u002Fh2>\n            <h3 style=\"margin:0 0 16px;font-size:28px;letter-spacing:-.02em;font-weight:600\">Configure the project<\u002Fh3>\n            <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">Most work needs no configuration. If you want project-local settings, scaffold them:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:14px 14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">konductor init<\u002Fpre>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg2);margin-bottom:18px\">\n              <div style=\"padding:8px 12px;border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">OUTPUT<\u002Fdiv>\n              <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.75;color:var(--mu);overflow-x:auto\">Initialized Konductor project at /Users/you/your-project/.konductor\nWrote starter config: /Users/you/your-project/.konductor/config.yml<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">Full detail in <a href=\"#/config\">Read and change configuration<\u002Fa>.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"next\" style=\"border-top:1px solid var(--bd);padding-top:40px\">\n            <h3 style=\"margin:0 0 10px;font-size:28px;letter-spacing:-.02em;font-weight:600\">You are set up<\u002Fh3>\n            <p style=\"margin:0 0 24px;font-size:16px;line-height:1.75;color:var(--mu)\">You have the CLI installed, the agent team registered, and a verified session with the orchestrator. Where to go next:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))\">\n              <div style=\"padding:16px 18px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);font-size:14.5px;color:var(--mu)\">Follow a complete worked example<br><a href=\"#/usecases\" style=\"font-weight:600\">Use cases →<\u002Fa><\u002Fdiv>\n              <div style=\"padding:16px 18px;border-bottom:1px solid var(--bd);font-size:14.5px;color:var(--mu)\">Understand the vocabulary<br><a href=\"#/concepts\" style=\"font-weight:600\">Core concepts →<\u002Fa><\u002Fdiv>\n              <div style=\"padding:16px 18px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);font-size:14.5px;color:var(--mu)\">See what each agent can access<br><a href=\"#/agents\" style=\"font-weight:600\">Agents reference →<\u002Fa><\u002Fdiv>\n              <div style=\"padding:16px 18px;border-bottom:1px solid var(--bd);font-size:14.5px;color:var(--mu)\">Browse all 75 skills<br><a href=\"#/skills\" style=\"font-weight:600\">Skills catalog →<\u002Fa><\u002Fdiv>\n              <div style=\"padding:16px 18px;border-right:1px solid var(--bd);font-size:14.5px;color:var(--mu)\">Look up a command or config key<br><a href=\"#/reference\" style=\"font-weight:600\">CLI reference →<\u002Fa><\u002Fdiv>\n              <div style=\"padding:16px 18px;font-size:14.5px;color:var(--mu)\">Fix something that went wrong<br><a href=\"#/troubleshooting\" style=\"font-weight:600\">Troubleshooting →<\u002Fa><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n            <button sc-camel-on-click=\"{{ goHome }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Prerequisites<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goTasks }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: Task guides →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <div style=\"width:196px;flex:0 0 196px;padding-top:72px\">\n          <div style=\"position:sticky;top:24px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--bd);padding-left:18px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;color:var(--mu2)\">ON THIS PAGE<\u002Fdiv>\n            <a href=\"#step-1\" style=\"font-size:13px;color:var(--mu)\">1 — Download the CLI<\u002Fa>\n            <a href=\"#step-2\" style=\"font-size:13px;color:var(--mu)\">2 — Install the agents<\u002Fa>\n            <a href=\"#step-3\" style=\"font-size:13px;color:var(--mu)\">3 — Start a session<\u002Fa>\n            <a href=\"#step-4\" style=\"font-size:13px;color:var(--mu)\">4 — Give it real work<\u002Fa>\n            <a href=\"#step-5\" style=\"font-size:13px;color:var(--mu)\">5 — Configure the project<\u002Fa>\n            <a href=\"#next\" style=\"font-size:13px;color:var(--mu)\">You are set up<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.concepts }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:0 56px 96px;gap:48px\">\n        <article style=\"flex:1 1 520px;min-width:0;padding-top:64px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">GUIDE / CORE CONCEPTS<\u002Fdiv>\n          <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Core concepts<\u002Fh1>\n          <p style=\"margin:0 0 40px;font-size:19px;line-height:1.5;color:var(--mu)\">Every term Konductor uses, defined once. It assumes only that you can open a terminal and type a command.<\u002Fp>\n\n          <section id=\"c-runtime\" style=\"padding-bottom:44px\">\n            <h2 style=\"margin:0 0 14px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Runtime<\u002Fh2>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">A <strong style=\"color:var(--tx);font-weight:600\">runtime<\u002Fstrong> is the program that actually runs an AI agent on your machine. Konductor does not include one — it configures one you already have. Two are supported:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:20px\">\n              <div style=\"display:grid;grid-template-columns:1.1fr 2fr 1.2fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\">\n                <div style=\"padding:11px 16px\">RUNTIME<\u002Fdiv><div style=\"padding:11px 16px\">WHAT IT IS<\u002Fdiv><div style=\"padding:11px 16px\">COMMAND<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1.1fr 2fr 1.2fr;border-bottom:1px solid var(--bd);font-size:14.5px\">\n                <div style=\"padding:13px 16px;font-weight:600\">Kiro CLI<\u002Fdiv><div style=\"padding:13px 16px;color:var(--mu)\">Amazon's command-line AI assistant<\u002Fdiv><div style=\"padding:13px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--lav)\">kiro-cli<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1.1fr 2fr 1.2fr;font-size:14.5px\">\n                <div style=\"padding:13px 16px;font-weight:600\">Claude Code<\u002Fdiv><div style=\"padding:13px 16px;color:var(--mu)\">Anthropic's command-line AI assistant<\u002Fdiv><div style=\"padding:13px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--lav)\">claude<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">Konductor ships each agent with per-runtime settings, so the same agent behaves correctly in either one. In <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);background:rgba(124,92,255,.16);border-radius:5px;padding:1.5px 6px\">agents/*.agent-spec.json<\u002Fspan> these live under <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);background:rgba(124,92,255,.16);border-radius:5px;padding:1.5px 6px\">clientConfig.kiroCli<\u002Fspan> and <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx);background:rgba(124,92,255,.16);border-radius:5px;padding:1.5px 6px\">clientConfig.claudeCli<\u002Fspan>. The two differ in real ways — the Kiro CLI configuration for <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-architect<\u002Fspan> lists tools as <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">[\"@builtin\", \"subagent\", \"@aws-mcp\"]<\u002Fspan>, while the Claude Code configuration lists <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">[\"Read\", \"Write\", \"Edit\", \"Bash\", \"Glob\", \"Grep\", \"WebFetch\", \"WebSearch\", \"TodoWrite\", \"mcp__aws-mcp__*\"]<\u002Fspan>.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"c-agent\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 14px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Agent<\u002Fh2>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">An <strong style=\"color:var(--tx);font-weight:600\">agent<\u002Fstrong> is a configured AI assistant with a job. Concretely, it is three things bundled together:<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px\">\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--vi);margin-bottom:8px\">01 · SYSTEM PROMPT<\u002Fdiv>\n                <div style=\"font-size:14.5px;line-height:1.6;color:var(--mu)\">Instructions establishing its role, workflow, and guardrails.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--vi);margin-bottom:8px\">02 · TOOL ALLOWLIST<\u002Fdiv>\n                <div style=\"font-size:14.5px;line-height:1.6;color:var(--mu)\">Exactly which actions it may take — read files, write files, run shell commands, search the web.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--vi);margin-bottom:8px\">03 · DEPENDENCIES<\u002Fdiv>\n                <div style=\"font-size:14.5px;line-height:1.6;color:var(--mu)\">The skills, SOPs, and context files it can draw on.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">Konductor ships 11. Three are orchestrators (coordinators); eight are specialists.<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:20px\">\n              <div style=\"display:grid;grid-template-columns:1fr 1.8fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\">\n                <div style=\"padding:11px 16px\">AGENT<\u002Fdiv><div style=\"padding:11px 16px\">WHAT IT DOES<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ agentRows }}\" as=\"row\" hint-placeholder-count=\"11\">\n                <div style=\"display:grid;grid-template-columns:1fr 1.8fr;border-bottom:1px solid var(--bd)\">\n                  <div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--lav)\">{{ row.name }}<\u002Fdiv>\n                  <div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">{{ row.what }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">Verified by counting <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">agents/*.agent-spec.json<\u002Fspan> — 11 files. For each agent's model, tools, write and shell access, declared skills and SOPs, and delegation targets, see the <a href=\"#/agents\">Agents reference<\u002Fa>.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"c-spec\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 14px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Agent spec<\u002Fh2>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">An <strong style=\"color:var(--tx);font-weight:600\">agent spec<\u002Fstrong> is the JSON file that defines one agent, named <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">agents/&lt;agent-name&gt;.agent-spec.json<\u002Fspan>. Its top-level shape:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:20px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">SHAPE<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:15px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;color:#E8E4F5;overflow-x:auto\">schemaVersion   \"1\"\nname            e.g. \"asdlc-orchestrator\"\nconfig          description, model, systemPrompt\ndependencies    agentSops, context, mcpRegistry, skills\nclientConfig    kiroCli { tools, allowedTools, toolsSettings, hooks, resources }\n                claudeCli { tools, skills }<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">You do not need to edit these to use Konductor. You do need to know they exist, because the <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">dependencies.agentSops<\u002Fspan> list is what determines <strong style=\"color:var(--tx);font-weight:600\">which agent can run which SOP<\u002Fstrong> — see <a href=\"#/sops\">SOP workflows<\u002Fa>.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"c-skill\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 14px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Skill<\u002Fh2>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">A <strong style=\"color:var(--tx);font-weight:600\">skill<\u002Fstrong> is a self-contained module of knowledge an agent loads <em>on demand<\u002Fem>. At session start only each skill's name and one-line description are in the agent's memory; the full content loads when the agent decides it is relevant. This keeps the agent's working memory free for your actual problem.<\u002Fp>\n            <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">A skill lives at <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">skills/&lt;name&gt;/SKILL.md<\u002Fspan> and starts with YAML frontmatter:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:20px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">YAML<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:15px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;color:#E8E4F5;overflow-x:auto\">---\nname: delegation-protocol\ndescription: Structured delegation format for the ASDLC orchestrator. Defines the\n  8-field prompt format (mandatory target agent + 7 sections), agent registry,\n  parallel execution rules, and handoff patterns.\nversion: 1.2.0\ntags: [skill, behavioral, orchestration, delegation, multi-agent]\n---<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">Some skills also ship helper scripts alongside <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">SKILL.md<\u002Fspan> — for example <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">skills/legacy-to-agentic-estimate/<\u002Fspan> contains <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">scripts/<\u002Fspan> and <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">evals/<\u002Fspan> directories.<\u002Fp>\n            <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:18px 20px\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--sig);margin-bottom:10px\">COUNT · VERIFY IT YOURSELF<\u002Fdiv>\n              <p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.6;color:var(--mu)\">The package ships 75 skills — 75 directories under <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">skills/<\u002Fspan>, each with a <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--tx)\">SKILL.md<\u002Fspan>.<\u002Fp>\n              <pre style=\"margin:0;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\">ls skills | wc -l<\u002Fpre>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <section id=\"c-sop\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 14px;font-size:30px;letter-spacing:-.025em;font-weight:600\">SOP — standard operating procedure<\u002Fh2>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">A <strong style=\"color:var(--tx);font-weight:600\">SOP<\u002Fstrong> — also called an agent script — is a written multi-step procedure an agent follows to complete a complex task the same way every time. Where a skill is <em>knowledge<\u002Fem> (\"here is how to think about threat models\"), a SOP is <em>procedure<\u002Fem> (\"do step 1, then step 2, do not proceed until X\").<\u002Fp>\n            <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">SOPs live at <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">agent-sops/&lt;name&gt;.sop.md<\u002Fspan> and share a consistent structure:<\u002Fp>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:20px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">STRUCTURE<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n              <pre style=\"margin:0;padding:15px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.8;color:#E8E4F5;overflow-x:auto\"># Title\n## Overview      — what it does, when to use it\n## Parameters    — required and optional inputs, with defaults\n## Steps         — numbered steps, each with:\n                   a description\n                   **Constraints:** MUST / MUST NOT / SHOULD rules\n                   **Expected Output:** what the step produces\n## Quality Gate  — (some SOPs) the conditions for \"done\"\n## Troubleshooting — (some SOPs)<\u002Fpre>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">The <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">MUST<\u002Fspan> / <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">MUST NOT<\u002Fspan> / <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">SHOULD<\u002Fspan> wording is deliberate — it follows RFC 2119, the internet standards convention for requirement levels, so an agent can tell a hard rule from a preference.<\u002Fp>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">The package ships 13 SOPs.<\u002Fstrong> Twelve are meant for you to invoke; <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-delegate<\u002Fspan> is internal machinery the orchestrator uses to format its own delegations.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"c-context\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 14px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Context file<\u002Fh2>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">A <strong style=\"color:var(--tx);font-weight:600\">context file<\u002Fstrong> is Markdown loaded into an agent's memory <em>at session start<\u002Fem> and kept active for the whole session — unlike a skill, which loads on demand. Context files are for rules that must never be missed.<\u002Fp>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">There is one today: <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">context/asdlc-orchestrator-routing-rules.md<\u002Fspan>, loaded by all three orchestrators. It contains the capability-to-agent routing table and three <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">[CODE RED]<\u002Fspan> rules, including this one:<\u002Fp>\n            <blockquote style=\"margin:0 0 20px;border:1px solid rgba(167,139,250,.35);border-radius:12px;background:rgba(124,92,255,.07);padding:20px 22px;font-size:16px;line-height:1.7;color:var(--tx)\"><strong style=\"font-weight:700\">NEVER MUTATE DIRECTLY — DELEGATE INSTEAD.<\u002Fstrong> You are a read-only orchestrator. You NEVER directly execute mutating operations or shell commands.<\u002Fblockquote>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">That is why the orchestrator hands file edits and shell commands to <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-developer<\u002Fspan> rather than doing them itself.<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"c-delegation\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 14px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Orchestrator and delegation<\u002Fh2>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">The <strong style=\"color:var(--tx);font-weight:600\">orchestrator<\u002Fstrong> is a hub. Specialists never talk to each other; every piece of work routes through the orchestrator, which decides who owns it, hands it over, and checks the result.<\u002Fp>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">A <strong style=\"color:var(--tx);font-weight:600\">delegation<\u002Fstrong> is not a casual instruction — it is a fixed 7-section format defined by the <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-delegate<\u002Fspan> SOP and the <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">delegation-protocol<\u002Fspan> skill:<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:22px\">\n              <sc-for list=\"{{ delegationRows }}\" as=\"d\" hint-placeholder-count=\"7\">\n                <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:16px 18px\">\n                  <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--vi);margin-bottom:7px\">{{ d.n }} · {{ d.label }}<\u002Fdiv>\n                  <div style=\"font-size:14px;line-height:1.55;color:var(--mu)\">{{ d.note }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">After the specialist returns, the orchestrator runs a verification checklist. If a check fails, it re-delegates — <strong style=\"color:var(--tx);font-weight:600\">up to 2 fix cycles<\u002Fstrong> (<span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-delegate<\u002Fspan> step 8).<\u002Fp>\n          <\u002Fsection>\n\n          <section id=\"c-maker\" style=\"padding-bottom:44px;border-top:1px solid var(--bd);padding-top:40px\">\n            <h2 style=\"margin:0 0 14px;font-size:30px;letter-spacing:-.025em;font-weight:600\">Maker-checker<\u002Fh2>\n            <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">Maker-checker<\u002Fstrong> means the same agent that produces an artifact then evaluates it against explicit criteria before showing it to you. It is a self-review pass with a rubric, not a vibe check.<\u002Fp>\n            <p style=\"margin:0 0 22px;font-size:16px;line-height:1.75;color:var(--mu)\">For example, <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--tx)\">asdlc-architect<\u002Fspan>'s system prompt instructs it: after generating a threat model, apply the threat-modeling criteria; after creating a design
