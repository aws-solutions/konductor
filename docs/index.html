20px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> Review the design package in design/pennywise/.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:20px\">\n          <sc-for list=\"{{ reviewSteps }}\" as=\"s\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--bd);padding-bottom:10px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--vi);flex:0 0 24px\">{{ s.n }}<\u002Fspan>\n              <span style=\"font-size:15.5px;line-height:1.7;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">{{ s.title }}<\u002Fstrong> — {{ s.body }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">What you get:<\u002Fstrong> <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">design-review-report.md<\u002Fcode>. Pass <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">dry_run: true<\u002Fcode> to see what would be reviewed without writing anything — the run stops at step 2. A design with only IMPORTANT issues is still READY; the SOP's own troubleshooting says so.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Runtime differences<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">None specific to these SOPs — both behave the same in Kiro CLI and Claude Code once you are talking to <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-architect<\u002Fcode>.<\u002Fp>\n        <div style=\"border:1px solid rgba(255,107,107,.4);border-radius:12px;background:rgba(255,107,107,.05);padding:18px 20px;font-size:15px;line-height:1.7;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:#FF8B8B;display:block;margin-bottom:8px\">ONE THING TO KNOW ABOUT PHASE 3<\u002Fspan>The AWS validation step uses the architect's <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">aws-mcp<\u002Fcode> server. In Kiro CLI that server is declared and launched from the agent spec. <strong style=\"color:var(--tx);font-weight:600\">In Claude Code the agent only requests the tools via the <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em\">mcp__aws-mcp__*<\u002Fcode> glob — you must configure an <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em\">aws-mcp<\u002Fcode> server yourself<\u002Fstrong> or those tools will not resolve. Either way, with no AWS credentials the step degrades to UNVERIFIED findings rather than failing.<\u002Fdiv>\n\n        <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n          <button sc-camel-on-click=\"{{ goUcCodebase }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Understand a codebase<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goUcPlan }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: Plan and verify work →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.ucPlan }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:920px;margin:0 auto;padding:64px 56px 96px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">USE CASES / PLAN AND VERIFY WORK<\u002Fdiv>\n        <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Plan and verify work<\u002Fh1>\n        <p style=\"margin:0 0 24px;font-size:19px;line-height:1.5;color:var(--mu)\">The most explicitly-chained sequence in the package: <code style=\"font-family:'JetBrains Mono',monospace;font-size:.85em;color:var(--tx)\">asdlc-analyze<\u002Fcode> → <code style=\"font-family:'JetBrains Mono',monospace;font-size:.85em;color:var(--tx)\">asdlc-plan<\u002Fcode> → <code style=\"font-family:'JetBrains Mono',monospace;font-size:.85em;color:var(--tx)\">asdlc-verify<\u002Fcode>. Every handoff is written into the SOP text itself rather than left implicit.<\u002Fp>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\">All three are declared by all three orchestrators. This page uses the plain <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-orchestrator<\u002Fcode>.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">What \"owned by the orchestrator\" actually means<\u002Fh2>\n        <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">The orchestrators are dispatchers by design. <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-orchestrator<\u002Fcode> <strong style=\"color:var(--tx);font-weight:600\">cannot write files or run shell commands in either runtime<\u002Fstrong> — in Kiro CLI its <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">allowedTools<\u002Fcode> is <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">fs_read<\u002Fcode> only; in Claude Code its tool list has no <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">Bash<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">Write<\u002Fcode>, or <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">Edit<\u002Fcode>. What it has is <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">Read<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">Glob<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">Grep<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">WebFetch<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">WebSearch<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">TodoWrite<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">Workflow<\u002Fcode>, an <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">Agent(...)<\u002Fcode> tool scoped to the eight specialists, and <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">SendMessage<\u002Fcode>.<\u002Fp>\n        <blockquote style=\"margin:0 0 18px;border:1px solid rgba(167,139,250,.35);border-radius:12px;background:rgba(124,92,255,.07);padding:20px 22px;font-size:16px;line-height:1.7;color:var(--tx)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--lav);display:block;margin-bottom:10px\">ASDLC-ANALYZE SAYS THIS OUT LOUD<\u002Fspan><strong style=\"font-weight:700\">Execution context:<\u002Fstrong> Steps below run shell commands and may write files. An agent without those tools delegates them to specialist agents per its routing rules.<\u002Fblockquote>\n        <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">So when you run this chain \"via the orchestrator\", the orchestrator reads, synthesises, and routes. The file writes, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">git diff<\u002Fcode> calls, and build and test commands execute through whichever specialist it delegates to — <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-developer<\u002Fcode> for implementation and shell work, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-researcher<\u002Fcode> for parallel research, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-architect<\u002Fcode> for escalations.<\u002Fp>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\">That is the point of running it through the orchestrator rather than a single specialist: it is the one agent built to coordinate across all three SOPs in one pass, and the only one with unrestricted delegation. See <a href=\"#/agents\">Who can delegate to whom<\u002Fa>.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Prerequisites<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:40px\">\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:8px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.7;color:var(--mu)\">A task or feature area. <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-analyze<\u002Fcode> requires <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">target<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-plan<\u002Fcode> requires <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">objective<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-verify<\u002Fcode> requires <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">source_dir<\u002Fcode>. In an orchestrated run you generally state the goal once and the orchestrator carries it through.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:8px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.7;color:var(--mu)\">A working build and test setup if you want <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-verify<\u002Fcode> to run anything real. It auto-detects from <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">package.json<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">Cargo.toml<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">go.mod<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">pyproject.toml<\u002Fcode> / <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">setup.py<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">build.gradle(.kts)<\u002Fcode>, or <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">pom.xml<\u002Fcode>.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">How to invoke<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Start a session with <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">{{ orchestratorName }}<\u002Fcode> and state the goal.<\u002Fp>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\">Prefer a pane-per-agent view? <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-mux-orchestrator<\u002Fcode> (tmux/zellij) and <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-cmux-orchestrator<\u002Fcode> (cmux) declare the same three SOPs and dispatch specialists into separate panes instead of using a subagent tool. They have <strong style=\"color:var(--tx);font-weight:600\">no<\u002Fstrong> <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">subagent<\u002Fcode> or <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">Agent(...)<\u002Fcode> tool at all — they shell out to their dispatch scripts and poll for a <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">.done<\u002Fcode> marker. Useful when you want to watch each specialist work.<\u002Fp>\n\n        <h2 style=\"margin:0 0 12px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Worked example: recurring reminders in \"Roster\"<\u002Fh2>\n        <p style=\"margin:0 0 30px;font-size:16px;line-height:1.75;color:var(--mu)\">Roster is a small app where managers build weekly shift schedules for retail teams. You have been asked to email a manager 24 hours before an unfilled shift starts. You have never touched Roster's notification code.<\u002Fp>\n\n        <h3 style=\"margin:0 0 14px;font-size:22px;font-weight:600;letter-spacing:-.02em\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--vi);margin-right:10px\">STEP 1<\u002Fspan><code style=\"font-family:'JetBrains Mono',monospace;font-size:.82em;color:var(--lav)\">asdlc-analyze<\u002Fcode><\u002Fh3>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--bg2);padding:15px 17px;margin-bottom:18px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> I need to understand how to add a 24-hour-before reminder for unfilled shifts in Roster — analyze before we implement.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:18px\">\n          <sc-for list=\"{{ analyzeSteps }}\" as=\"s\" hint-placeholder-count=\"5\">\n            <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:16px 18px;display:flex;gap:14px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--vi);flex:0 0 20px;padding-top:2px\">{{ s.n }}<\u002Fspan>\n              <span style=\"flex:1\"><strong style=\"color:var(--tx);font-weight:600;font-size:15px\">{{ s.title }}<\u002Fstrong><span style=\"display:block;margin-top:6px;font-size:14.5px;line-height:1.7;color:var(--mu)\">{{ s.body }}<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 34px;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">What you get:<\u002Fstrong> an Analysis Summary in the conversation, or at <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">.konductor/handoff/&lt;analysis-name&gt;.md<\u002Fcode> if long — plus a mandatory handoff into <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-plan<\u002Fcode>.<\u002Fp>\n\n        <h3 style=\"margin:0 0 14px;font-size:22px;font-weight:600;letter-spacing:-.02em\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--vi);margin-right:10px\">STEP 2<\u002Fspan><code style=\"font-family:'JetBrains Mono',monospace;font-size:.82em;color:var(--lav)\">asdlc-plan<\u002Fcode><\u002Fh3>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">The orchestrator carries the analysis forward. This SOP produces its output in the response; no file write is mandated.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:18px\">\n          <sc-for list=\"{{ planSteps }}\" as=\"s\" hint-placeholder-count=\"6\">\n            <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:16px 18px;display:flex;gap:14px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--vi);flex:0 0 20px;padding-top:2px\">{{ s.n }}<\u002Fspan>\n              <span style=\"flex:1\"><strong style=\"color:var(--tx);font-weight:600;font-size:15px\">{{ s.title }}<\u002Fstrong><span style=\"display:block;margin-top:6px;font-size:14.5px;line-height:1.7;color:var(--mu)\">{{ s.body }}<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(167,139,250,.35);border-radius:12px;background:rgba(124,92,255,.07);padding:18px 20px;margin-bottom:18px;font-size:15px;line-height:1.7;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--lav);display:block;margin-bottom:8px\">ON THE ESTIMATE<\u002Fspan>The projection is informational, never the commitment. Its tier presets are uncalibrated defaults pending team telemetry, and the SOP requires presenting the full low–high band rather than the mid point. Treat differences finer than about 15 minutes as noise. If <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">asdlc-tpm<\u002Fcode> is unreachable the SOP self-computes using the skill's documented formula and says it was not script-verified; if even that is impossible it skips the projection and says why. A skip is not a failure — the baseline stands alone.<\u002Fdiv>\n        <p style=\"margin:0 0 34px;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">What you get:<\u002Fstrong> a structured Execution Plan — Success Criteria → TODOs → Dependencies → Agent Assignments → Timeline → Phased Plan — with an explicit Verification phase pointing at step 3.<\u002Fp>\n\n        <h3 style=\"margin:0 0 14px;font-size:22px;font-weight:600;letter-spacing:-.02em\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--vi);margin-right:10px\">STEP 3<\u002Fspan><code style=\"font-family:'JetBrains Mono',monospace;font-size:.82em;color:var(--lav)\">asdlc-verify<\u002Fcode><\u002Fh3>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Once <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-developer<\u002Fcode> has implemented the reminder job:<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--bg2);padding:15px 17px;margin-bottom:18px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> Verify the shift-reminder feature is done.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:18px\">\n          <sc-for list=\"{{ verifySteps }}\" as=\"s\" hint-placeholder-count=\"7\">\n            <div style=\"display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--bd);padding-bottom:10px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--vi);flex:0 0 24px\">{{ s.n }}<\u002Fspan>\n              <span style=\"font-size:15.5px;line-height:1.7;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">{{ s.title }}<\u002Fstrong> — {{ s.body }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">What you get:<\u002Fstrong> a Verification Evidence report in the conversation with a status per checklist item. There is no default file path for this one — it is presented inline unless you ask for it to be saved.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Checkpoint<\u002Fh2>\n        <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">The final checklist is all-or-nothing. The task is not complete unless every line passes:<\u002Fp>\n        <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:20px 22px;margin-bottom:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:11px\">\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15px;color:var(--mu)\">All success criteria met<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15px;color:var(--mu)\">Build passes<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15px;color:var(--mu)\">Tests pass<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15px;color:var(--mu)\">Lint passes<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15px;color:var(--mu)\">Manual verification complete<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15px;color:var(--mu)\">No regressions<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15px;color:var(--mu)\">Documentation updated, if applicable<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\">Automated green alone does not equal done — that is the whole point of steps 6 and 7.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Runtime differences<\u002Fh2>\n        <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">The chain itself is runtime-agnostic. What differs is dispatch mechanics:<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:18px\">\n          <div style=\"display:grid;grid-template-columns:1fr 1.7fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">ORCHESTRATOR<\u002Fdiv><div style=\"padding:11px 16px\">DISPATCH MECHANISM<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1.7fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">asdlc-orchestrator<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">Kiro CLI's <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">subagent<\u002Fcode> tool or Claude Code's <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">Agent(...)<\u002Fcode> tool, spawning specialists inline<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1.7fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">asdlc-mux-orchestrator<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">skills/mux-dispatch/<\u002Fcode> shell scripts — a pane per specialist, polling <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">/tmp/konductor-mux/*.done<\u002Fcode><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1.7fr\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">asdlc-cmux-orchestrator<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">skills/cmux-dispatch/cmux-dispatch.sh<\u002Fcode> — a surface per specialist, polling <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">/tmp/konductor-cmux/*.done<\u002Fcode><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,107,107,.4);border-radius:12px;background:rgba(255,107,107,.05);padding:18px 20px;font-size:15px;line-height:1.7;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:#FF8B8B;display:block;margin-bottom:8px\">ONE CAVEAT WORTH KNOWING<\u002Fspan>In <strong style=\"color:var(--tx);font-weight:600\">Claude Code, only <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em\">asdlc-orchestrator<\u002Fcode> can delegate at all<\u002Fstrong>. The multiplexer variants shell out instead, so they still work — but a specialist cannot hand off to another specialist in Claude Code the way it can in Kiro CLI.<\u002Fdiv>\n\n        <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n          <button sc-camel-on-click=\"{{ goUcDesign }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Design a system<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goUcReview }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: Review code and tests →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.ucReview }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:920px;margin:0 auto;padding:64px 56px 96px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">USE CASES / REVIEW CODE AND TESTS<\u002Fdiv>\n        <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">Review code and tests<\u002Fh1>\n        <p style=\"margin:0 0 24px;font-size:19px;line-height:1.5;color:var(--mu)\">Four SOPs, three different owners.<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:20px\">\n          <div style=\"display:grid;grid-template-columns:1.3fr 1.2fr .6fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">SOP<\u002Fdiv><div style=\"padding:11px 16px\">OWNER(S)<\u002Fdiv><div style=\"padding:11px 16px\">MODIFIES SOURCE?<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.3fr 1.2fr .6fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">k-code-review-workflow<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mu)\">asdlc-developer <strong style=\"color:var(--tx)\">and<\u002Fstrong> asdlc-quality-assurance<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;color:var(--sig)\">No<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.3fr 1.2fr .6fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">k-test-coverage-review<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mu)\">asdlc-quality-assurance<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;color:var(--sig)\">No<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.3fr 1.2fr .6fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">k-code-cleanup<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mu)\">asdlc-developer<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;font-weight:600;color:#FF8B8B\">Yes<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.3fr 1.2fr .6fr\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">k-adversarial-pull-request-review<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mu)\">asdlc-architect<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;color:var(--sig)\">No<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">k-code-cleanup<\u002Fcode> is the only SOP in the entire package that changes your source files in place. Everything else here writes report files next to your code.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Known limitation: the adversarial handoff never fires<\u002Fh2>\n        <blockquote style=\"margin:0 0 18px;border:1px solid var(--bd2);border-radius:12px;background:var(--surf);padding:18px 20px;font-size:15px;line-height:1.7;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--mu2);display:block;margin-bottom:10px\">CODE-REVIEW-WORKFLOW STEP 6 SAYS<\u002Fspan>If an adversarial CR-review step is available, spawn <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">asdlc-architect<\u002Fcode> in adversarial mode with it, passing the same diff used in Step 1 as <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">diff_input<\u002Fcode>, to surface gaps missed by standard review.<\u002Fblockquote>\n        <div style=\"border:1px solid rgba(255,107,107,.4);border-radius:12px;background:rgba(255,107,107,.05);padding:20px 22px;margin-bottom:18px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:#FF8B8B;margin-bottom:12px\">NEITHER OWNING AGENT CAN DO THAT SPAWN — VERIFIED AGAINST THE AGENT SPECS<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.7;color:var(--mu)\">\n            <div>In <strong style=\"color:var(--tx);font-weight:600\">Claude Code<\u002Fstrong>, only <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">asdlc-orchestrator<\u002Fcode> has an <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">Agent(...)<\u002Fcode> tool at all. <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">asdlc-developer<\u002Fcode> and <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">asdlc-quality-assurance<\u002Fcode> have no cross-agent spawn capability there, period.<\u002Fdiv>\n            <div>In <strong style=\"color:var(--tx);font-weight:600\">Kiro CLI<\u002Fstrong>, delegation goes through <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">toolsSettings.subagent.availableAgents<\u002Fcode>, and neither owner lists the architect: the developer's is <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">[\"asdlc-quality-assurance\"]<\u002Fcode>, QA's is <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">[\"asdlc-developer\"]<\u002Fcode>.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">Step 6's own constraints anticipate this — <em>\"You MUST skip this step if no adversarial CR-review capability is available\"<\u002Fem> — so the workflow degrades gracefully rather than erroring. In practice <strong style=\"color:var(--tx);font-weight:600\">step 6 silently no-ops and you get standard review only.<\u002Fstrong><\u002Fp>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">Routing through <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em\">asdlc-orchestrator<\u002Fcode> does not fix it.<\u002Fstrong> The orchestrator does not declare <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">k-code-review-workflow<\u002Fcode> (its SOPs are <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">kiro-spec-workflow<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-delegate<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-plan<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-analyze<\u002Fcode>, <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-verify<\u002Fcode>), so it delegates the whole SOP to the developer or QA agent, which hits the same wall.<\u002Fp>\n        <div style=\"border:1px solid rgba(61,220,151,.35);border-radius:12px;background:rgba(61,220,151,.05);padding:18px 20px;margin-bottom:40px;font-size:15px;line-height:1.7;color:var(--mu)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--sig);display:block;margin-bottom:8px\">THE WORKAROUND THAT DOES WORK<\u002Fspan>Run <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">k-adversarial-pull-request-review<\u002Fcode> yourself against <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">asdlc-architect<\u002Fcode>, which owns it. That is step 4 below.<\u002Fdiv>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Prerequisites<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:40px\">\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:8px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.7;color:var(--mu)\">A <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">source_dir<\u002Fcode> with changes — required for <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">k-code-review-workflow<\u002Fcode> and <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">k-code-cleanup<\u002Fcode>.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:8px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.7;color:var(--mu)\">For <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">k-test-coverage-review<\u002Fcode>: <strong style=\"color:var(--tx);font-weight:600\">both<\u002Fstrong> <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">source_dir<\u002Fcode> and <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">test_dir<\u002Fcode>. It will not proceed if either is missing.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:8px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.7;color:var(--mu)\">For <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">k-adversarial-pull-request-review<\u002Fcode>: either <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">diff_input<\u002Fcode> (git diff output, file paths, or raw PR diff) <strong style=\"color:var(--tx);font-weight:600\">or<\u002Fstrong> <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">pr_url<\u002Fcode>.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:8px\"><\u002Fspan><span style=\"font-size:16px;line-height:1.7;color:var(--mu)\">Git history, if you want any of these to diff against <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">main<\u002Fcode> / <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">mainline<\u002Fcode> rather than scanning the whole directory.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">How to invoke<\u002Fh2>\n        <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">Through the orchestrator in plain language, or straight to the owning agent. In Claude Code, prefix each with <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">ASDLCCoreAICapabilities-<\u002Fcode>.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:40px\">\n          <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\"><div style=\"font-size:14.5px;color:var(--mu);margin-bottom:8px\">Code review, cleanup<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--lav)\">asdlc-developer<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\"><div style=\"font-size:14.5px;color:var(--mu);margin-bottom:8px\">Test coverage review<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--lav)\">asdlc-quality-assurance<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px\"><div style=\"font-size:14.5px;color:var(--mu);margin-bottom:8px\">Adversarial security review<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--lav)\">asdlc-architect<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:0 0 12px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Worked example: shipping a \"recipe box\" feature<\u002Fh2>\n        <p style=\"margin:0 0 30px;font-size:16px;line-height:1.75;color:var(--mu)\">You have implemented tag-based search for a small personal recipe manager. Before opening a CR you want it reviewed, its tests checked, cleaned of AI-generated cruft, and given a security-focused second look.<\u002Fp>\n\n        <div style=\"display:flex;flex-direction:column;gap:26px;margin-bottom:40px\">\n          <sc-for list=\"{{ reviewSops }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div>\n              <h3 style=\"margin:0 0 12px;font-size:22px;font-weight:600;letter-spacing:-.02em\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--vi);margin-right:10px\">{{ s.n }}<\u002Fspan><code style=\"font-family:'JetBrains Mono',monospace;font-size:.8em;color:var(--lav)\">{{ s.sop }}<\u002Fcode> <span style=\"font-size:17px;font-weight:500;color:var(--mu)\">— {{ s.tag }}<\u002Fspan><\u002Fh3>\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--bg2);padding:15px 17px;margin-bottom:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> {{ s.prompt }}<\u002Fdiv>\n              <sc-if value=\"{{ s.warn }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border:1px solid rgba(255,107,107,.4);border-radius:12px;background:rgba(255,107,107,.05);padding:16px 18px;margin-bottom:14px;font-size:15px;line-height:1.7;color:var(--mu)\">{{ s.warn }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:14px\">\n                <sc-for list=\"{{ s.steps }}\" as=\"t\" hint-placeholder-count=\"6\">\n                  <div style=\"display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--bd);padding-bottom:10px\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--vi);flex:0 0 24px\">{{ t.n }}<\u002Fspan>\n                    <span style=\"font-size:15.5px;line-height:1.7;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">{{ t.title }}<\u002Fstrong> — {{ t.body }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size:15.5px;line-height:1.7;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">What you get:<\u002Fstrong> {{ s.out }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:0 0 18px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Checkpoint<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:11px;margin-bottom:18px\">\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">code-review-report.md<\u002Fcode> exists with a READY FOR CR / NEEDS FIXES verdict.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\">Four files exist under <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">test-coverage-review/<\u002Fcode>.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">cleanup-report.md<\u002Fcode> exists, and <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">git diff<\u002Fcode> shows only slop removals — no logic changes.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sig)\">☐<\u002Fspan><span style=\"font-size:15.5px;line-height:1.65;color:var(--mu)\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">adversarial-review-report.md<\u002Fcode> exists with an APPROVE / APPROVE WITH COMMENTS / REQUEST CHANGES verdict.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\">Any CRITICAL finding in the adversarial report forces REQUEST CHANGES regardless of the other counts — that is its stated quality gate.<\u002Fp>\n\n        <h2 style=\"margin:0 0 16px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Runtime differences<\u002Fh2>\n        <p style=\"margin:0;font-size:16px;line-height:1.75;color:var(--mu)\">Mechanics are identical across runtimes for all four SOPs. The only runtime-relevant fact is the step 6 delegation gap above, and that is about which <em>agent<\u002Fem> has a spawn capability rather than about Kiro CLI versus Claude Code behaviour once you are inside the right agent.<\u002Fp>\n\n        <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n          <button sc-camel-on-click=\"{{ goUcPlan }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Plan and verify work<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goSops }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: SOP workflows →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ is.sops }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:1040px;margin:0 auto;padding:64px 56px 96px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">GUIDE / SOP WORKFLOWS<\u002Fdiv>\n        <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">SOP workflows<\u002Fh1>\n        <p style=\"margin:0 0 16px;font-size:19px;line-height:1.5;color:var(--mu);max-width:66ch\">Konductor ships <strong style=\"color:var(--tx);font-weight:600\">13 SOPs<\u002Fstrong> — written, numbered procedures an agent follows to complete a complex task the same way every time. This section covers all 13: what each does, when you would reach for it, how to invoke it, and a flowchart of its actual flow.<\u002Fp>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu);max-width:70ch\">Every diagram here was derived by reading the SOP file it describes. Where a SOP has a decision point, the diagram branches. Where it has more than about a dozen steps, minor steps are grouped rather than drawn individually.<\u002Fp>\n\n        <h2 style=\"margin:0 0 14px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">The common shape<\u002Fh2>\n        <p style=\"margin:0 0 26px;font-size:16px;line-height:1.75;color:var(--mu)\">Nine of the thirteen SOPs are variations on one pattern. Learning it once means you can predict how any of them will behave: resolve → gather → analyze → consolidate → write file → summarize.<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:18px;background:radial-gradient(120% 140% at 15% 0%,rgba(124,92,255,.1),transparent 60%),var(--bg2);padding:30px 28px;margin-bottom:26px;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n            <span style=\"border:1px solid var(--bd2);border-radius:10px;background:var(--surf);padding:12px 16px;font-size:14.5px;font-weight:600\">Resolve parameters<\u002Fspan>\n            <span style=\"color:var(--mu2)\">→<\u002Fspan>\n            <span style=\"border:1px solid var(--lav);border-radius:999px;padding:11px 17px;font-size:14px;font-weight:600\">Any required parameter missing?<\u002Fspan>\n            <span style=\"color:var(--mu2)\">→<\u002Fspan>\n            <span style=\"border:1px solid rgba(167,139,250,.5);border-radius:10px;background:rgba(124,92,255,.09);padding:12px 16px;font-size:14px;color:var(--tx)\">Yes → ask the user, and wait <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--lav);margin-left:6px\">YOU ARE INVOLVED<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:var(--mu2);padding-left:4px\">NO — OPTIONAL ONES USE DEFAULTS ↓<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px\">\n            <div style=\"border:1px solid var(--bd2);border-radius:12px;background:var(--surf);padding:15px 17px\"><div style=\"font-size:14.5px;font-weight:600;margin-bottom:6px\">Discover / gather input<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.6;color:var(--mu)\">git diff, directory scan, agent research<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid var(--bd2);border-radius:12px;background:var(--surf);padding:15px 17px\"><div style=\"font-size:14.5px;font-weight:600;margin-bottom:6px\">Analyze<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.6;color:var(--mu)\">run one or more skills, one per input category<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid var(--bd2);border-radius:12px;background:var(--surf);padding:15px 17px\"><div style=\"font-size:14.5px;font-weight:600;margin-bottom:6px\">Consolidate<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.6;color:var(--mu)\">sort CRITICAL → IMPORTANT → SUGGESTION, dedupe<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid var(--bd2);border-radius:12px;background:var(--surf);padding:15px 17px\"><div style=\"font-size:14.5px;font-weight:600;margin-bottom:6px\">Filter false positives<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.6;color:var(--mu)\">where the SOP defines this step<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid var(--bd2);border-radius:12px;background:var(--surf);padding:15px 17px\"><div style=\"font-size:14.5px;font-weight:600;margin-bottom:6px\">Write the report to a file<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.6;color:var(--mu)\">never inline<\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid var(--vi);border-radius:12px;background:rgba(124,92,255,.12);box-shadow:inset 0 0 50px -22px var(--vi);padding:15px 17px\"><div style=\"font-size:14.5px;font-weight:700;margin-bottom:6px\">Present a summary only<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.6;color:var(--mu)\">the file path, counts, top findings<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 18px;font-size:16px;line-height:1.75;color:var(--mu)\">Five conventions hold across nearly all of them:<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px;margin-bottom:20px\">\n          <sc-for list=\"{{ sopConventions }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--bd);padding-bottom:12px\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--vi);flex:0 0 22px\">{{ c.n }}<\u002Fspan>\n              <span style=\"font-size:15.5px;line-height:1.7;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">{{ c.title }}<\u002Fstrong> {{ c.body }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 40px;font-size:16px;line-height:1.75;color:var(--mu)\">The four SOPs that do <em>not<\u002Fem> fit this shape are <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-plan<\u002Fcode> (produces a plan, not findings), <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-verify<\u002Fcode> (runs build/test/lint and collects evidence), <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-delegate<\u002Fcode> (assembles a delegation prompt), and <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">kiro-spec-workflow<\u002Fcode> (chains three skills with an approval gate each).<\u002Fp>\n\n        <h2 style=\"margin:0 0 20px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">All 13 SOPs at a glance<\u002Fh2>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:44px\">\n          <div style=\"display:grid;grid-template-columns:1fr 1.5fr 1.3fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">SOP<\u002Fdiv><div style=\"padding:11px 16px\">WHAT IT DOES<\u002Fdiv><div style=\"padding:11px 16px\">REACH FOR IT WHEN<\u002Fdiv><\u002Fdiv>\n          <sc-for list=\"{{ sopRows }}\" as=\"s\" hint-placeholder-count=\"13\">\n            <button sc-camel-on-click=\"{{ s.go }}\" style=\"all:unset;cursor:pointer;display:grid;grid-template-columns:1fr 1.5fr 1.3fr;border-bottom:1px solid var(--bd)\" style-hover=\"background:rgba(124,92,255,.08)\">\n              <span style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">{{ s.sop }}<\u002Fspan>\n              <span style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">{{ s.what }}<\u002Fspan>\n              <span style=\"padding:12px 16px;font-size:14.5px;line-height:1.55;color:var(--mu)\">{{ s.when }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <h2 style=\"margin:0 0 14px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Which agent owns which SOP<\u002Fh2>\n        <p style=\"margin:0 0 20px;font-size:16px;line-height:1.75;color:var(--mu)\">This matters more than it looks. <strong style=\"color:var(--tx);font-weight:600\">A SOP is only available in a session with an agent whose spec declares it.<\u002Fstrong> Ownership comes from <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">dependencies.agentSops.agentSopNames<\u002Fcode> in each <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">agents/*.agent-spec.json<\u002Fcode> — verified by reading all 11 specs.<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:20px\">\n          <div style=\"display:grid;grid-template-columns:1fr 1.7fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">AGENT<\u002Fdiv><div style=\"padding:11px 16px\">SOPS IT DECLARES<\u002Fdiv><\u002Fdiv>\n          <sc-for list=\"{{ sopOwners }}\" as=\"o\" hint-placeholder-count=\"7\">\n            <div style=\"display:grid;grid-template-columns:1fr 1.7fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--lav)\">{{ o.agent }}<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.7;color:var(--mu)\">{{ o.sops }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:20px\">\n          <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px;font-size:14.5px;line-height:1.7;color:var(--mu)\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">k-code-review-workflow<\u002Fcode> is declared by <strong style=\"color:var(--tx);font-weight:600\">two<\u002Fstrong> agents — the developer and QA. Either can run it.<\u002Fdiv>\n          <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--surf);padding:18px 20px;font-size:14.5px;line-height:1.7;color:var(--mu)\">The two multiplexer orchestrators do <strong style=\"color:var(--tx);font-weight:600\">not<\u002Fstrong> declare <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">asdlc-delegate<\u002Fcode>. They dispatch through their <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">mux-dispatch<\u002Fcode> / <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">cmux-dispatch<\u002Fcode> skills instead.<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 44px;font-size:16px;line-height:1.75;color:var(--mu)\">Practical consequence: if you start a session directly with <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-product-manager<\u002Fcode> and ask for a code review workflow, the SOP is not loaded there. Start with the orchestrator and let it route, or start with the owning agent.<\u002Fp>\n\n        <h2 style=\"margin:0 0 20px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">How to invoke a SOP<\u002Fh2>\n        <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">The reliable way: ask the orchestrator<\u002Fh3>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:14px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--mu2)\">BASH · {{ runtimeLabel }}<\u002Fspan><button data-copy=\"1\" style=\"all:unset;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mu2)\" style-hover=\"color:var(--sig)\">copy<\u002Fbutton><\u002Fdiv>\n          <pre style=\"margin:0;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E8E4F5;overflow-x:auto\">{{ startCmd }}<\u002Fpre>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--bg2);padding:15px 17px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> Run the k-code-review-workflow SOP against my current branch.<\u002Fdiv>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">The orchestrator's routing rules send code review to <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">asdlc-developer<\u002Fcode>, which declares that SOP. This works regardless of how SOPs are registered as commands in your runtime, which is why it is the approach this guide recommends. You can also just describe the outcome and let it choose.<\u002Fp>\n        <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">Or start with the owning agent directly<\u002Fh3>\n        <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu)\">If you know exactly which SOP you want, go straight to the agent that declares it. <code style=\"font-family:'JetBrains Mono',monospace;font-size:.87em;color:var(--tx)\">k-design-doc-creation<\u002Fcode>'s own overview says it is invoked when the engineer asks to create or write a design document — phrasings like \"Design a system for X\" are enough.<\u002Fp>\n        <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">As a slash-style command<\u002Fh3>\n        <div style=\"border:1px solid rgba(167,139,250,.35);border-radius:12px;background:rgba(124,92,255,.07);padding:18px 20px;margin-bottom:24px;font-size:15px;line-height:1.7;color:var(--mu)\">The top-level <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">README.md<\u002Fcode> documents the user-facing SOPs as \"available as slash-command-style workflows (<code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">/prompts<\u002Fcode> in Kiro CLI; native commands in Claude Code)\". This guide reports that as documented rather than verified — confirming it requires an installed runtime session. If your runtime offers the SOPs as commands, use them; if not, the two approaches above always work.<\u002Fdiv>\n        <h3 style=\"margin:0 0 14px;font-size:20px;font-weight:600\">Supplying parameters<\u002Fh3>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--bg2);padding:15px 17px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> Run k-test-coverage-review with source_dir=src/ and test_dir=test/<\u002Fdiv>\n        <p style=\"margin:0 0 44px;font-size:16px;line-height:1.75;color:var(--mu)\">If you omit a required parameter, the SOP asks for it and waits. If you omit an optional one, it uses the documented default without asking. Each detail page lists the parameters and defaults.<\u002Fp>\n\n        <h2 style=\"margin:0 0 14px;font-size:30px;letter-spacing:-.025em;font-weight:600;border-top:1px solid var(--bd);padding-top:40px\">Choosing between overlapping SOPs<\u002Fh2>\n        <p style=\"margin:0 0 26px;font-size:16px;line-height:1.75;color:var(--mu)\">Four SOPs review code and two handle design documents. Picking the wrong one wastes a lot of time, so here is the decision:<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:18px;background:radial-gradient(120% 140% at 15% 0%,rgba(124,92,255,.1),transparent 60%),var(--bg2);padding:30px 28px;margin-bottom:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--lav)\">CODE — HOW THOROUGH?<\u002Fdiv>\n            <div style=\"border:1px solid var(--bd2);border-radius:10px;background:var(--surf);padding:13px 15px;font-size:14px;color:var(--mu)\">Quick read-only check on uncommitted work → <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">asdlc-code-critic<\u002Fcode><\u002Fdiv>\n            <div style=\"border:1px solid var(--bd2);border-radius:10px;background:var(--surf);padding:13px 15px;font-size:14px;color:var(--mu)\">Full multi-skill review before a CR → <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">k-code-review-workflow<\u002Fcode><\u002Fdiv>\n            <div style=\"border:1px solid var(--bd2);border-radius:10px;background:var(--surf);padding:13px 15px;font-size:14px;color:var(--mu)\">Security-focused, after standard review → <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">k-adversarial-pull-request-review<\u002Fcode><\u002Fdiv>\n            <div style=\"border:1px solid var(--bd2);border-radius:10px;background:var(--surf);padding:13px 15px;font-size:14px;color:var(--mu)\">Strip AI slop first, then review → <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">k-code-cleanup<\u002Fcode><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--lav)\">DESIGN — WRITING OR REVIEWING?<\u002Fdiv>\n            <div style=\"border:1px solid var(--bd2);border-radius:10px;background:var(--surf);padding:13px 15px;font-size:14px;color:var(--mu)\">Writing a new doc → <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">k-design-doc-creation<\u002Fcode><\u002Fdiv>\n            <div style=\"border:1px solid var(--bd2);border-radius:10px;background:var(--surf);padding:13px 15px;font-size:14px;color:var(--mu)\">Reviewing existing artifacts → <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">k-existing-design-review<\u002Fcode><\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;color:var(--sig);margin-top:8px\">TESTS<\u002Fdiv>\n            <div style=\"border:1px solid rgba(61,220,151,.4);border-radius:10px;background:rgba(61,220,151,.05);padding:13px 15px;font-size:14px;color:var(--mu)\">→ <code style=\"font-family:'JetBrains Mono',monospace;font-size:.9em;color:var(--tx)\">k-test-coverage-review<\u002Fcode><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden\">\n          <div style=\"display:grid;grid-template-columns:1fr 1.7fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">PAIR<\u002Fdiv><div style=\"padding:11px 16px\">THE DIFFERENCE<\u002Fdiv><\u002Fdiv>\n          <sc-for list=\"{{ sopPairs }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:1fr 1.7fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.6;color:var(--lav)\">{{ p.pair }}<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.6;color:var(--mu)\">{{ p.diff }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n          <button sc-camel-on-click=\"{{ goUcReview }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← Review code and tests<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goSopPlan }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: Planning, analysis, verification →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSopPage }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width:1000px;margin:0 auto;padding:64px 56px 96px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">SOP WORKFLOWS / {{ sopPage.eyebrow }}<\u002Fdiv>\n        <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">{{ sopPage.title }}<\u002Fh1>\n        <p style=\"margin:0 0 30px;font-size:19px;line-height:1.5;color:var(--mu);max-width:66ch\">{{ sopPage.intro }}<\u002Fp>\n        <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:20px\">\n          <div style=\"display:grid;grid-template-columns:1fr 1.2fr 1.1fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">SOP<\u002Fdiv><div style=\"padding:11px 16px\">SOURCE FILE<\u002Fdiv><div style=\"padding:11px 16px\">DECLARED BY<\u002Fdiv><\u002Fdiv>\n          <sc-for list=\"{{ sopPage.sops }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:1fr 1.2fr 1.1fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lav)\">{{ s.name }}<\u002Fdiv><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mu)\">{{ s.file }}<\u002Fdiv><div style=\"padding:12px 16px;font-size:14px;color:var(--mu)\">{{ s.owner }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-for list=\"{{ sopPage.sops }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <section style=\"border-top:2px solid var(--bd2);padding-top:44px;margin-top:44px\">\n            <h2 style=\"margin:0 0 8px;font-size:34px;letter-spacing:-.03em;font-weight:700\"><code style=\"font-family:'JetBrains Mono',monospace;font-size:.78em;color:var(--lav)\">{{ s.name }}<\u002Fcode><\u002Fh2>\n            <p style=\"margin:0 0 26px;font-size:17px;line-height:1.6;color:var(--mu)\">{{ s.what }}<\u002Fp>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:26px\">\n              <div style=\"border:1px solid var(--bd);border-radius:14px;background:var(--surf);padding:20px 22px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--vi);margin-bottom:10px\">WHEN TO INVOKE IT<\u002Fdiv>\n                <div style=\"font-size:14.5px;line-height:1.7;color:var(--mu)\">{{ s.when }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--bd);border-radius:14px;background:var(--surf);padding:20px 22px\">\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--vi);margin-bottom:10px\">WHAT YOU GET<\u002Fdiv>\n                <div style=\"font-size:14.5px;line-height:1.7;color:var(--mu)\">{{ s.get }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ s.prompt }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"border:1px solid var(--bd);border-radius:12px;background:var(--bg2);padding:15px 17px;margin-bottom:26px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:var(--tx)\"><span style=\"color:var(--vi)\">&gt;<\u002Fspan> {{ s.prompt }}<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:14px\">PARAMETERS<\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:34px\">\n              <div style=\"display:grid;grid-template-columns:.9fr .5fr 1.8fr;background:var(--surf2);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.18em;color:var(--mu2)\"><div style=\"padding:11px 16px\">PARAMETER<\u002Fdiv><div style=\"padding:11px 16px\">REQUIRED<\u002Fdiv><div style=\"padding:11px 16px\">DEFAULT<\u002Fdiv><\u002Fdiv>\n              <sc-for list=\"{{ s.params }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <div style=\"display:grid;grid-template-columns:.9fr .5fr 1.8fr;border-bottom:1px solid var(--bd)\">\n                  <div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--tx)\">{{ p.name }}<\u002Fdiv>\n                  <div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:{{ p.reqColor }}\">{{ p.req }}<\u002Fdiv>\n                  <div style=\"padding:12px 16px;font-size:14px;line-height:1.55;color:var(--mu)\">{{ p.def }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:14px\">FLOW<\u002Fdiv>\n            <div style=\"border:1px solid var(--bd);border-radius:18px;background:radial-gradient(120% 140% at 15% 0%,rgba(124,92,255,.1),transparent 60%),var(--bg2);padding:28px 26px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ s.flow }}\" as=\"n\" hint-placeholder-count=\"8\">\n                <div style=\"display:flex;gap:14px;align-items:stretch\">\n                  <div style=\"flex:0 0 26px;display:flex;flex-direction:column;align-items:center;padding-top:6px\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--mu2)\">{{ n.n }}<\u002Fspan>\n                    <span style=\"flex:1;width:1px;background:var(--bd2);margin-top:6px\"><\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;border:1px solid var(--bd2);border-radius:12px;background:var(--surf);padding:14px 16px\">\n                    <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:6px\">\n                      <span style=\"font-size:15px;font-weight:600\">{{ n.label }}<\u002Fspan>\n                      <sc-if value=\"{{ n.isGate }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"border:1px solid rgba(167,139,250,.5);border-radius:999px;background:rgba(124,92,255,.12);padding:3px 10px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:var(--lav)\">YOU ARE INVOLVED — WAITS<\u002Fspan><\u002Fsc-if>\n                      <sc-if value=\"{{ n.isStop }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"border:1px solid rgba(255,107,107,.5);border-radius:999px;background:rgba(255,107,107,.1);padding:3px 10px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:#FF8B8B\">STOP<\u002Fspan><\u002Fsc-if>\n                      <sc-if value=\"{{ n.isGood }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"border:1px solid rgba(61,220,151,.5);border-radius:999px;background:rgba(61,220,151,.1);padding:3px 10px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:var(--sig)\">DONE<\u002Fspan><\u002Fsc-if>\n                      <sc-if value=\"{{ n.isSkip }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"border:1px dashed var(--bd2);border-radius:999px;padding:3px 10px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:var(--mu2)\">SKIPPED / DE-EMPHASISED<\u002Fspan><\u002Fsc-if>\n                      <sc-if value=\"{{ n.isDecision }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"border:1px solid var(--bd2);border-radius:999px;padding:3px 10px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:var(--mu2)\">DECISION<\u002Fspan><\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"font-size:14px;line-height:1.65;color:var(--mu)\">{{ n.note }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin:0 0 34px;font-size:14.5px;line-height:1.6;color:var(--mu2)\">{{ s.flowCaption }}<\u002Fp>\n\n            <sc-if value=\"{{ s.extraTitle }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:14px\">{{ s.extraTitle }}<\u002Fdiv>\n              <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:34px\">\n                <sc-for list=\"{{ s.extraRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                  <div style=\"display:grid;grid-template-columns:1fr 1.5fr;border-bottom:1px solid var(--bd)\"><div style=\"padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.6;color:var(--lav)\">{{ r.k }}<\u002Fdiv><div style=\"padding:12px 16px;font-size:14.5px;line-height:1.6;color:var(--mu)\">{{ r.v }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:14px\">THINGS TO KNOW<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ s.know }}\" as=\"k\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--bd);padding-bottom:12px\">\n                  <span style=\"width:6px;height:6px;border-radius:3px;background:var(--vi);flex:0 0 6px;margin-top:8px\"><\u002Fspan>\n                  <span style=\"font-size:15.5px;line-height:1.7;color:var(--mu)\"><strong style=\"color:var(--tx);font-weight:600\">{{ k.title }}<\u002Fstrong> {{ k.body }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-for>\n\n        <div style=\"margin-top:48px;border-top:1px solid var(--bd);padding-top:22px;display:flex;justify-content:space-between\">\n          <button sc-camel-on-click=\"{{ sopPage.goPrev }}\" style=\"all:unset;cursor:pointer;font-size:14px;color:var(--mu)\" style-hover=\"color:var(--vi)\">← {{ sopPage.prevLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ sopPage.goNext }}\" style=\"all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--vi)\" style-hover=\"color:var(--lav)\">Next: {{ sopPage.nextLabel }} →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isRefPage }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:0 56px 96px;gap:48px\">\n        <article style=\"flex:1 1 560px;min-width:0;padding-top:64px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--mu2);margin-bottom:16px\">{{ refPage.eyebrow }}<\u002Fdiv>\n          <h1 style=\"margin:0 0 18px;font-size:46px;line-height:1.02;letter-spacing:-.03em;font-weight:700\">{{ refPage.title }}<\u002Fh1>\n          <p style=\"margin:0 0 44px;font-size:19px;line-height:1.5;color:var(--mu);max-width:66ch\">{{ refPage.intro }}<\u002Fp>\n\n          <sc-for list=\"{{ refPage.sections }}\" as=\"sec\" hint-placeholder-count=\"6\">\n            <section id=\"{{ sec.id }}\" style=\"border-top:1px solid var(--bd);padding-top:40px;margin-bottom:40px\">\n              <h2 style=\"margin:0 0 18px;font-size:28px;letter-spacing:-.025em;font-weight:600;text-wrap:pretty\">{{ sec.title }}<\u002Fh2>\n              <sc-for list=\"{{ sec.paras }}\" as=\"p\" hint-placeholder-count=\"2\">\n                <p style=\"margin:0 0 16px;font-size:16px;line-height:1.75;color:var(--mu);max-width:74ch\">{{ p.text }}<\u002Fp>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ sec.quote }}\" hint-placeholder-val=\"{{ false }}\">\n                <blockquote style=\"margin:0 0 18px;border:1px solid rgba(167,139,250,.35);border-radius:12px;background:rgba(124,92,255,.07);padding:18px 20px;font-size:16px;line-height:1.7;color:var(--tx)\">{{ sec.quote }}<\u002Fblockquote>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ sec.code }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code);margin-bottom:18px\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid var(--bd)\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;
